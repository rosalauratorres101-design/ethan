<style>
  /*
  VOICE: alegre, cálido, de maestra; nada infantilizado para los grandes.
  IDEA: un libro de cuentos con colinas y cielo, donde cada nivel es una isla de color.
  PICTURE: escena ilustrada en SVG con Bubo el búho, colinas, sol y nubes.
  COLOUR and TYPE: cielo azul, sol amarillo, cuatro colores fuertes por nivel; letra redondeada del sistema.
  LAYOUT: escena arriba, niveles en tarjetas grandes, lección en cuatro pasos.
  */
  :root{
    --cielo:#e8f6ff; --azul:#2b7bd8; --azul-osc:#1a4f91; --sol:#ffc93c; --rojo:#ef5b5b;
    --verde:#3bb273; --morado:#8e6bd8; --naranja:#ff8c42; --rosa:#ff7eb6; --tinta:#21324a;
    --gris:#5b6f88; --sombra:0 6px 0 rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  html{background:#fff6dc}
  body{
    font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Comic Sans MS",system-ui,sans-serif;
    color:var(--tinta);overflow-x:clip;
    background:linear-gradient(180deg,#bfe6ff 0%,var(--cielo) 40%,#fff6dc 100%) fixed;
    user-select:none;-webkit-user-select:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  button:focus-visible{outline:4px solid var(--sol);outline-offset:2px}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,.85);
    backdrop-filter:blur(6px);position:sticky;top:0;z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.06)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.45rem;color:var(--azul-osc);background:none;padding:0}
  .logo svg{width:44px;height:44px}
  .logo small{display:block;font-size:.75rem;color:var(--gris);font-weight:700}
  .espacio{flex:1}
  .inicio-sonido{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:linear-gradient(180deg,#bfe6ff,#fff6dc);padding:20px}
  .tarjeta-inicio{background:#fff;border-radius:32px;padding:26px 30px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.1);max-width:420px}
  .diag{list-style:none;padding:0;margin:10px 0;font-weight:700;line-height:1.9}
  .aviso-voz{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;max-height:60vh;overflow:auto;z-index:60;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.22);width:min(94vw,520px);font-weight:700;font-size:.95rem;line-height:1.45;text-align:left;border:4px solid var(--rojo)}
  .enlace-voz{margin-top:8px;background:#f1f5fb;border-radius:10px;padding:8px 10px;font-size:.85rem;word-break:break-all;user-select:text;-webkit-user-select:text}
  .sonido{background:#eef3f9;border-radius:50%;width:44px;height:44px;font-size:1.3rem;flex:none}
  .estrellas{font-weight:800;font-size:1.15rem;background:#fff3c4;border-radius:999px;padding:6px 14px;box-shadow:var(--sombra)}
  .idioma{display:flex;background:#eef3f9;border-radius:999px;padding:4px;gap:4px}
  .idioma button{background:transparent;border-radius:999px;padding:8px 12px;font-weight:800;font-size:.95rem;color:#4a5d77;min-height:40px}
  .idioma button.activo{background:var(--azul);color:#fff}
  .corto{display:none}
  main{max-width:1040px;margin:0 auto;padding:16px 16px 60px}
  .volver{background:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:1rem;box-shadow:var(--sombra);margin-bottom:14px;color:var(--azul-osc);min-height:44px}
  h1{font-size:clamp(1.6rem,4vw,2.2rem);margin:6px 0 4px;text-align:center;line-height:1.1}
  h1 small,.tarjeta small.en{display:block;font-size:.6em;color:var(--gris);font-weight:700;margin-top:4px}
  h2{font-size:1.4rem;margin:4px 0 12px;text-align:center}
  .sub{text-align:center;color:var(--gris);font-weight:700;margin:0 0 16px}
  .escena{border-radius:32px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.08);margin-bottom:18px;background:#9fd8ff;position:relative}
  .escena svg{display:block;width:100%;height:auto}
  .escena .globo{position:absolute;left:38%;top:12%;max-width:52%}
  .globo{background:#fff;border-radius:22px;padding:12px 16px;font-weight:800;font-size:clamp(.95rem,2.2vw,1.2rem);box-shadow:var(--sombra)}
  .globo small{display:block;color:var(--gris);font-size:.85em;margin-top:2px}
  .niveles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .nivel{border-radius:28px;padding:18px 16px 16px;color:#fff;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.15);
    display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;min-height:132px;position:relative;overflow:hidden}
  .nivel:active,.tarjeta:active{transform:translateY(4px)}
  .nivel .big{font-size:3.2rem;grid-row:span 3}
  .nivel b{font-size:1.5rem;line-height:1.15}
  .nivel b small{display:block;font-size:.65em;opacity:.9}
  .nivel span{font-weight:700;opacity:.95;font-size:.95rem}
  .nivel .prog{grid-column:2;background:rgba(255,255,255,.3);border-radius:99px;height:10px;overflow:hidden}
  .nivel .prog i{display:block;height:100%;background:#fff;border-radius:99px}
  .nivel:after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
  .lecciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .tarjeta{background:#fff;border-radius:24px;padding:16px 12px;box-shadow:var(--sombra);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px;justify-content:center;border-top:8px solid var(--c)}
  .tarjeta .ico{font-size:2.8rem;line-height:1.1}
  .tarjeta b{font-size:1.15rem}
  .tarjeta .tipo{font-size:.78rem;font-weight:800;color:var(--c);text-transform:none}
  .tarjeta .est{font-size:1rem;letter-spacing:2px}

  /* Lección en pasos */
  .pasos{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 16px}
  .pasos button{background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;box-shadow:var(--sombra);font-size:.95rem;min-height:44px}
  .pasos button.activo{background:var(--c,var(--morado));color:#fff}
  .pasos button.hecho:not(.activo){background:#d9f5e4}
  .panel{background:#fff;border-radius:28px;padding:22px;box-shadow:0 8px 0 rgba(0,0,0,.1);max-width:760px;margin:0 auto}
  .panel h2{text-align:left;display:flex;align-items:center;gap:10px}
  .texto{font-size:1.2rem;line-height:1.55;margin:0 0 10px}
  .texto.en{color:var(--gris);font-size:1.05rem}
  .oir{background:#eaf2ff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.95rem;color:var(--azul-osc);min-height:40px;flex:none}
  .tabla{width:100%;border-collapse:collapse;margin:10px 0;font-size:1.1rem}
  .tabla td,.tabla th{padding:8px 10px;border-bottom:2px solid #eef3f9;text-align:left}
  .tabla th{color:var(--gris);font-size:.9rem}
  .tabla td b{color:var(--rojo)}
  .lectura{background:#fffbea;border-radius:20px;padding:16px 18px;font-size:1.2rem;line-height:1.7;margin-bottom:10px;border-left:8px solid var(--sol)}
  .lectura.en{background:#f4f7fb;border-left-color:#b9c7d8;font-size:1.02rem;color:#40546d}
  .ejemplos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .ejemplo{background:#f6f9ff;border-radius:20px;padding:14px;text-align:center;font-size:1.15rem;font-weight:800;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .ejemplo .e{font-size:2.6rem}
  .ejemplo small{color:var(--gris);font-weight:700}
  .pregunta{font-size:1.35rem;font-weight:800;text-align:center;margin:6px 0}
  .pregunta small{display:block;color:var(--gris);font-size:.8em;margin-top:4px}
  .visual svg text{font-family:inherit}
  .col-op{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(2rem,7vw,2.8rem);line-height:1.2;font-weight:800;color:#21324a;white-space:pre;text-align:right}
  .col-op .linea{border-top:5px solid #21324a;margin-top:4px}
  .frase-c{font-size:clamp(1.2rem,4vw,1.6rem);font-weight:800;line-height:1.4;display:block}
  .correcciones{list-style:none;padding:0;margin:10px 0;text-align:left}
  .correcciones li{background:#fff7e0;border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700}
  /* Hojas de trabajo para imprimir */
  #imprimir{display:none}
  @media print{
    body>*:not(#imprimir){display:none!important}
    #imprimir{display:block!important;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#21324a;font-size:12pt;line-height:1.4}
    @page{size:letter;margin:.55in .6in}
    html,body{background:#fff!important}
  }
  #imprimir .hoja{break-after:page;page-break-after:always}
  #imprimir .cabH{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #2b7bd8;padding-bottom:5px;margin-bottom:8px}
  #imprimir .tH{font-size:17pt;font-weight:800;color:#1d4f8f}
  #imprimir .tagH{display:inline-block;background:#e3efff;color:#1d4f8f;border-radius:999px;padding:1px 9px;font-size:9pt;font-weight:700;margin-right:4px}
  #imprimir .nomH{display:flex;gap:18px;margin-bottom:8px}#imprimir .nomH span{flex:1;border-bottom:1.5px solid #21324a}
  #imprimir .apr{background:#f4f8fd;border:2px solid #c9dbf3;border-radius:12px;padding:7px 11px;margin:6px 0}
  #imprimir .lecH{background:#fffdf5;border:2px solid #f0e2b6;border-radius:12px;padding:7px 11px;margin:6px 0}
  #imprimir .ejsH{columns:2;column-gap:.35in}
  #imprimir .ejH{break-inside:avoid;display:flex;gap:8px;margin:0 0 12px}
  #imprimir .ejH b.n{min-width:20px}
  #imprimir .visH{font-size:19pt;margin:3px 0}#imprimir .visH svg{max-width:2.6in!important;max-height:1.45in;width:auto!important;height:auto;display:block}
  #imprimir .opsH{display:flex;flex-wrap:wrap;gap:4px 20px}#imprimir .opsH i{display:inline-block;width:12px;height:12px;border:1.6px solid #21324a;border-radius:50%;margin-right:5px;vertical-align:-1px}
  #imprimir .fichH{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}#imprimir .fichH span{border:1.6px dashed #5b6f88;border-radius:8px;padding:1px 8px}
  #imprimir .linH{border-bottom:1.3px solid #9aa8ba;height:26px}
  #imprimir .claveH{columns:2;font-size:10.5pt}
  #imprimir h3{font-size:12.5pt;color:#1d4f8f;margin:10px 0 4px}
  #imprimir .col-op{font-size:19pt}
  #imprimir.pkH{font-size:15pt}#imprimir.pkH .visH{font-size:28pt}
  .fila-svg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .fila-svg>div{width:min(140px,40vw)}
  .fila-svg svg{width:100% !important}
  .visual{font-size:3.4rem;text-align:center;margin:8px 0;line-height:1.2;word-break:break-word}
  .resp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
  .resp button{background:#f1f5fb;border-radius:20px;padding:16px 10px;font-size:1.25rem;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.08);min-height:64px}
  .resp button.bien{background:#c9f2d9;animation:salto .5s}
  .resp button.mal{background:#ffd6d6;animation:temblor .35s}
  .resp button.revela{outline:4px dashed var(--verde)}
  .dos-lecturas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:10px 0}
  .dos-lecturas h3{margin:0 0 6px;font-size:1.15rem;line-height:1.2}
  .dos-lecturas h3 small{display:block;color:var(--gris);font-size:.8em}
  .lectura.audio{border-left-color:var(--naranja)}
  .fichas,.armado{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px auto;max-width:680px}
  .armado{min-height:62px;background:#f6f9ff;border:3px dashed #c9d6e8;border-radius:18px;padding:8px;align-items:center}
  .armado.bien{border-color:var(--verde);background:#e3f7ea}.armado.mal{border-color:var(--rojo);animation:temblor .35s}
  .ficha{background:#fff;border-radius:14px;padding:10px 14px;font-size:1.3rem;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.1);min-height:48px;min-width:44px}
  .ficha.puesta{background:var(--sol)}.ficha.vacia{opacity:.25;box-shadow:none;border:2px dashed #c9d6e8}
  .ficha.revela{outline:4px dashed var(--verde)}
  .campo{font:inherit;font-size:1.4rem;padding:12px 16px;border-radius:16px;border:3px solid #dfe6ee;max-width:420px;width:100%;text-align:center}
  .campo.bien{border-color:var(--verde);background:#e3f7ea}.campo.mal{border-color:var(--rojo);animation:temblor .35s}
  .checks{list-style:none;padding:0;margin:12px 0;font-weight:700;line-height:1.9}.checks li.ok{color:#24804f}
  .frase-hablar{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;text-align:center;margin:6px 0;line-height:1.35}
  .chips{position:sticky;top:64px;z-index:3;padding:6px 0}
  .chips button{font-size:.92rem;padding:8px 12px}
  @media (max-width:600px){.dos-lecturas{grid-template-columns:minmax(0,1fr)}.chips{position:static}}
  .insignia{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:800;color:#21324a}
  .pista{background:#fff8d6;border-radius:16px;padding:10px 14px;margin:10px auto 0;max-width:620px;font-weight:700;line-height:1.5}
  .pista small{color:var(--gris)}
  .fila-prog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid #eef3f9;font-weight:700}
  .barra{height:12px;background:#eef3f9;border-radius:99px;overflow:hidden;margin:4px 0 12px}
  .barra i{display:block;height:100%;background:var(--verde);transition:width .3s}
  .mensaje{text-align:center;font-size:1.25rem;font-weight:800;min-height:1.8em;margin-top:12px}
  .fila{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .btn{border-radius:999px;padding:14px 22px;font-weight:800;font-size:1.1rem;color:#fff;background:var(--azul);box-shadow:0 5px 0 var(--azul-osc);min-height:48px}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--azul-osc)}
  .btn.verde{background:var(--verde);box-shadow:0 5px 0 #24804f}
  .btn.naranja{background:var(--naranja);box-shadow:0 5px 0 #c25f1d}
  .btn.gris{background:#8798ad;box-shadow:0 5px 0 #5d6c80}

  /* Actividades PreK–K */
  .rejilla-abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
  .letra{background:#fff;border-radius:18px;font-size:2.2rem;font-weight:800;aspect-ratio:1;box-shadow:var(--sombra)}
  .letra.vista{outline:4px solid var(--sol)}
  .grande{background:#fff;border-radius:32px;box-shadow:0 8px 0 rgba(0,0,0,.12);padding:22px;text-align:center;margin:0 auto;max-width:560px}
  .grande .L{font-size:clamp(4.5rem,14vw,6.5rem);font-weight:800;line-height:1}
  .grande .L span{font-size:.7em;opacity:.75;margin-left:8px}
  .grande .emoji{font-size:6rem;line-height:1.1;margin:8px 0;display:inline-block;background:none}
  .grande .pal{font-size:2rem;font-weight:800}
  .grande .pal b{color:var(--rojo)}
  .grande .tr{font-size:1.2rem;font-weight:700;color:var(--gris);margin-top:4px}
  .pestanas{display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
  .pestanas button{background:#fff;border-radius:999px;padding:10px 16px;font-weight:800;font-size:1.02rem;box-shadow:var(--sombra);min-height:44px}
  .pestanas button.activo{background:var(--morado);color:#fff}
  .consonantes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .consonantes button{width:60px;height:60px;border-radius:50%;font-size:1.8rem;font-weight:800;background:#fff;box-shadow:var(--sombra)}
  .consonantes button.activo{background:var(--sol)}
  .silabas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
  .silaba{min-width:88px;padding:14px 10px;border-radius:22px;font-size:2.2rem;font-weight:800;color:#fff !important;box-shadow:0 6px 0 rgba(0,0,0,.15)}
  .palabras{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .palabra{background:#fff;border-radius:24px;padding:14px;box-shadow:var(--sombra);text-align:center}
  .palabra .emoji{font-size:3.4rem}
  .piezas{display:flex;justify-content:center;gap:6px;margin:8px 0}
  .pieza{background:#eaf2ff;border-radius:14px;padding:8px 12px;font-size:1.6rem;font-weight:800;color:var(--azul-osc) !important;min-height:48px}
  .pieza.on{background:var(--sol);color:var(--tinta) !important}
  .palabra .tr{color:var(--gris);font-weight:700}
  .numeros{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:600px;margin:0 auto 16px}
  .num{background:#fff;border-radius:20px;font-size:2.4rem;font-weight:800;aspect-ratio:1;box-shadow:var(--sombra);color:var(--azul-osc) !important}
  .num.activo{background:var(--verde);color:#fff !important}
  .contar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
  .contar button{font-size:3rem;background:transparent;padding:4px;border-radius:16px;transition:transform .15s;position:relative}
  .contar button.contado{transform:scale(1.15)}
  .contar button.contado:after{content:attr(data-n);position:absolute;top:-6px;right:-6px;background:var(--rojo);color:#fff;font-size:1rem;font-weight:800;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
  .colores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
  .color{border-radius:26px;height:120px;font-weight:800;font-size:1.15rem;box-shadow:0 6px 0 rgba(0,0,0,.15);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
  .color span{background:rgba(255,255,255,.9);color:var(--tinta);border-radius:999px;padding:4px 12px}
  .opciones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:620px;margin:16px auto 0}
  .opcion{background:#fff;border-radius:26px;aspect-ratio:1;font-size:clamp(2.6rem,9vw,4.4rem);box-shadow:var(--sombra)}
  .opcion.bien{background:#c9f2d9;animation:salto .5s}
  .opcion.mal{background:#ffd6d6;animation:temblor .35s}
  .memoria{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:540px;margin:0 auto}
  .carta{aspect-ratio:1;border-radius:20px;font-size:clamp(1.8rem,7vw,2.6rem);font-weight:800;background:var(--azul);color:#fff !important;box-shadow:var(--sombra)}
  .carta.abierta{background:#fff;color:var(--tinta) !important}
  .carta.lista{background:#c9f2d9;color:var(--tinta) !important}

  @keyframes salto{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes temblor{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes nube{from{transform:translateX(-10px)}to{transform:translateX(10px)}}

lec({id:"huerto",nivel:"g35",area:"lectura",ico:"🍅",titulo:["Cuento: El huerto de Ana","Story: Ana's garden"],
 instr:["Lee el cuento dos veces: primero para disfrutarlo y luego buscando detalles. Toca 🔊 para escucharlo. Después contesta las preguntas.","Read the story twice: first to enjoy it, then looking for details. Tap 🔊 to listen. Then answer the questions."],
 explica:["Un buen lector se pregunta: ¿Quién? ¿Dónde? ¿Cuándo? ¿Qué pasó? ¿Por qué? Las respuestas casi siempre están en el texto. Si no estás seguro, vuelve a leer la parte que habla de eso.","A good reader asks: Who? Where? When? What happened? Why? The answers are almost always in the text. If you're not sure, reread that part."],
 lectura:["Ana vive en un pueblo pequeño de {REG}. Cada sábado ayuda a su abuelo en el huerto. Primero sacan las hierbas malas. Después riegan los tomates y los chiles porque hace mucho calor. Un día Ana encuentra un tomate rojo y enorme. Lo lleva corriendo a la cocina, y su abuelo prepara una salsa deliciosa.","Ana lives in a small town in {REG}. Every Saturday she helps her grandpa in the garden. First they pull the weeds. Then they water the tomatoes and the chiles because it is very hot. One day Ana finds a huge red tomato. She runs it to the kitchen, and her grandpa makes a delicious salsa."],
 ejemplos:[{e:"👧",es:"¿Quién? → Ana",en:"Who? → Ana"},{e:"📍",es:"¿Dónde? → en {REG}",en:"Where? → in {REG}"},{e:"🤔",es:"¿Por qué riegan? → porque hace calor",en:"Why water? → because it's hot"}],
 ejercicios:[
  {q:["¿A quién ayuda Ana?","Who does Ana help?"],o:[["a su mamá","her mom"],["a su abuelo","her grandpa"],["a su maestra","her teacher"]],a:1},
  {q:["¿Qué día van al huerto?","What day do they go to the garden?"],o:[["el lunes","Monday"],["el domingo","Sunday"],["el sábado","Saturday"]],a:2},
  {q:["¿Qué hacen primero?","What do they do first?"],o:[["riegan los chiles","water the chiles"],["sacan las hierbas malas","pull the weeds"],["hacen salsa","make salsa"]],a:1},
  {q:["¿Por qué riegan las plantas?","Why do they water the plants?"],o:[["porque hace mucho calor","because it is very hot"],["porque llueve","because it rains"],["porque es de noche","because it's night"]],a:0},
  {q:["¿Qué prepara el abuelo con el tomate?","What does grandpa make with the tomato?"],o:[["sopa","soup"],["pizza","pizza"],["salsa","salsa"]],a:2}
 ]});
lec({id:"adjetivos",nivel:"g35",area:"gramatica",ico:"🎨",titulo:["Los adjetivos","Adjectives"],
 instr:["Lee la regla y los ejemplos. Luego completa cada oración con el adjetivo que concuerda.","Read the rule and the examples. Then complete each sentence with the adjective that agrees."],
 explica:["Un adjetivo describe a un sustantivo. En español el adjetivo va casi siempre después y concuerda: si el sustantivo es femenino, el adjetivo también; si es plural, el adjetivo también.","An adjective describes a noun. In Spanish it usually goes after the noun and agrees with it: feminine noun, feminine adjective; plural noun, plural adjective."],
 tabla:[["","singular","plural"],["masculino","el gato negro","los gatos negros"],["femenino","la casa blanca","las casas blancas"]],
 ejemplos:[{e:"🐈‍⬛",es:"el gato negro",en:"the black cat"},{e:"🏠",es:"la casa blanca",en:"the white house"},{e:"🐶🐶",es:"los perros pequeños",en:"the small dogs"},{e:"🌹🌹",es:"las flores rojas",en:"the red flowers"}],
 ejercicios:[
  {q:["La niña es ___.","The girl is ___ (tall)."],o:["alto","alta","altos"],a:1},
  {q:["Los libros son ___.","The books are ___ (new)."],o:["nuevos","nueva","nuevo"],a:0},
  {q:["Tengo dos camisas ___.","I have two ___ shirts (yellow)."],o:["amarillo","amarillas","amarilla"],a:1},
  {q:["El perro es muy ___.","The dog is very ___ (funny)."],o:["chistosa","chistosos","chistoso"],a:2},
  {q:["Las ventanas están ___.","The windows are ___ (open)."],o:["abiertas","abiertos","abierta"],a:0}
 ]});
lec({id:"verbosar",nivel:"g35",area:"gramatica",ico:"🗣️",titulo:["Verbos -ar en presente","-ar verbs in the present"],
 instr:["Estudia la tabla del verbo hablar y di cada forma en voz alta. Después conjuga los verbos de los ejercicios.","Study the chart for hablar and say each form out loud. Then conjugate the verbs in the exercises."],
 explica:["Para conjugar un verbo que termina en -ar, quitas la terminación -ar y le pones la terminación de la persona: -o, -as, -a, -amos, -an.{VOS1}","To conjugate a verb ending in -ar, drop the -ar and add the ending for the person: -o, -as, -a, -amos, -an.{VOS1}"],

 ejemplos:[{e:"💃",es:"Yo bailo.",en:"I dance."},{e:"🎤",es:"Nosotros cantamos.",en:"We sing."},{e:"📚",es:"Ella estudia.",en:"She studies."}],

lec({id:"multiplicar",nivel:"g35",area:"matematicas",ico:"✖️",titulo:["Multiplicar","Multiplying"],
 instr:["Mira cómo la multiplicación es una suma repetida. Luego resuelve las multiplicaciones.","See how multiplication is repeated addition. Then solve the problems."],
 explica:["Multiplicar es sumar el mismo número varias veces. 3 × 4 quiere decir 3 grupos de 4: 4 + 4 + 4 = 12. El orden no cambia el resultado: 3 × 4 = 4 × 3.","Multiplying is adding the same number several times. 3 × 4 means 3 groups of 4: 4 + 4 + 4 = 12. Order doesn't change the answer: 3 × 4 = 4 × 3."],
 ejemplos:[{e:"🍪🍪🍪🍪 🍪🍪🍪🍪 🍪🍪🍪🍪",es:"3 × 4 = 12",en:"3 times 4 equals 12"},{e:"🖐️🖐️",es:"2 × 5 = 10",en:"2 times 5 equals 10"},{e:"🕷️",es:"8 patas × 2 arañas = 16",en:"8 legs × 2 spiders = 16"}],
 gen:"mult"});
lec({id:"fracciones",nivel:"g35",area:"matematicas",ico:"🍕",titulo:["Fracciones","Fractions"],
 instr:["Lee la explicación con la pizza. Luego contesta las preguntas de fracciones.","Read the pizza explanation. Then answer the fraction questions."],
 explica:["Una fracción es una parte de un entero. El número de abajo (denominador) dice en cuántas partes iguales se cortó. El de arriba (numerador) dice cuántas partes tomas. Si una pizza se corta en 4 y comes 1, comiste 1/4.","A fraction is part of a whole. The bottom number (denominator) tells how many equal parts. The top number (numerator) tells how many parts you take. If a pizza is cut into 4 and you eat 1, you ate 1/4."],
 ejemplos:[{e:"🍕",es:"1/2 = la mitad",en:"1/2 = one half"},{e:"🍫",es:"1/4 = un cuarto",en:"1/4 = one fourth"},{e:"🥧",es:"2/4 = 1/2",en:"2/4 equals 1/2"}],
 ejercicios:[
  {q:["Una pizza tiene 4 partes iguales. Comes 1. ¿Qué fracción comiste?","A pizza has 4 equal parts. You eat 1. What fraction did you eat?"],v:"🍕",o:["1/2","1/4","4/1"],a:1},
  {q:["¿Qué es más grande?","Which is bigger?"],o:["1/2","1/4","1/8"],a:0},
  {q:["2/4 es igual a…","2/4 is equal to…"],o:["1/2","1/4","2/2"],a:0},
  {q:["En 3/5, ¿cuál es el denominador?","In 3/5, what is the denominator?"],o:["3","5","8"],a:1},
  {q:["Tienes 8 crayones y la mitad son rojos. ¿Cuántos son rojos?","You have 8 crayons and half are red. How many are red?"],v:"🖍️",o:["2","4","6"],a:1}
 ]});
lec({id:"paises",nivel:"g35",area:"cultura",ico:"🗺️",titulo:["Países y capitales","Countries and capitals"],
 instr:["Toca cada país para oír su nombre y su capital. Luego contesta las preguntas.","Tap each country to hear its name and capital. Then answer the questions."],
 explica:["El español es idioma oficial en 20 países y en Puerto Rico: en España, en Guinea Ecuatorial y en casi toda Latinoamérica. La capital es la ciudad donde está el gobierno del país.","Spanish is an official language in 20 countries plus Puerto Rico: Spain, Equatorial Guinea and most of Latin America. The capital is the city where the country's government is."],
 ejemplos:[{e:"🇲🇽",es:"México · Ciudad de México",en:"Mexico · Mexico City"},{e:"🇪🇸",es:"España · Madrid",en:"Spain · Madrid"},{e:"🇨🇴",es:"Colombia · Bogotá",en:"Colombia · Bogotá"},{e:"🇦🇷",es:"Argentina · Buenos Aires",en:"Argentina · Buenos Aires"},{e:"🇵🇪",es:"Perú · Lima",en:"Peru · Lima"},{e:"🇨🇺",es:"Cuba · La Habana",en:"Cuba · Havana"}],

  {q:["¿Cuál es la capital de Argentina?","What is the capital of Argentina?"],v:"🇦🇷",o:["Buenos Aires","Montevideo","Córdoba"],a:0},

lec({id:"monarca",nivel:"g68",area:"lectura",ico:"🦋",titulo:["Lectura: La mariposa monarca","Reading: The monarch butterfly"],
 instr:["Lee el texto con atención. Subraya en tu mente la idea principal de cada oración. Después contesta las preguntas; algunas piden que hagas una inferencia.","Read the text carefully. Notice the main idea of each sentence. Then answer the questions; some ask you to make an inference."],
 explica:["La idea principal es de qué trata todo el texto. Un detalle es un dato que la apoya. Una inferencia es una conclusión que sacas usando lo que dice el texto y lo que ya sabes, aunque el texto no lo diga directamente.","The main idea is what the whole text is about. A detail is a fact that supports it. An inference is a conclusion you draw from the text plus what you already know, even if the text doesn't say it directly."],
 lectura:["Cada otoño, millones de mariposas monarca viajan desde Canadá y Estados Unidos hasta los bosques de oyamel en el centro de México. Muchas pasan por Texas en su camino. Ninguna mariposa hace sola el viaje de ida y vuelta: el regreso al norte toma varias generaciones. En invierno se juntan por miles en los árboles para protegerse del frío. En primavera vuelan al norte y ponen huevos en el algodoncillo, la única planta que comen sus orugas.","Every fall, millions of monarch butterflies travel from Canada and the United States to the oyamel fir forests in central Mexico. Many pass through Texas on the way. No single butterfly makes the whole round trip: the return north takes several generations. In winter they cluster by the thousands in the trees to stay protected from the cold. In spring they fly north and lay eggs on milkweed, the only plant their caterpillars eat."],
 ejemplos:[{e:"💡",es:"Idea principal: la migración de la monarca",en:"Main idea: the monarch's migration"},{e:"🔎",es:"Detalle: pasan por Texas",en:"Detail: they pass through Texas"},{e:"🧠",es:"Inferencia: sin algodoncillo no hay orugas",en:"Inference: no milkweed, no caterpillars"}],
 ejercicios:[
  {q:["¿Cuál es la idea principal del texto?","What is the main idea of the text?"],o:[["Las orugas comen hojas.","Caterpillars eat leaves."],["La monarca hace un gran viaje cada año.","The monarch makes a long journey every year."],["México tiene bosques.","Mexico has forests."]],a:1},
  {q:["¿Dónde pasan el invierno las monarcas?","Where do monarchs spend the winter?"],o:[["en Canadá","in Canada"],["en el centro de México","in central Mexico"],["en Texas","in Texas"]],a:1},
  {q:["¿Por qué se juntan en los árboles?","Why do they cluster in the trees?"],o:[["para protegerse del frío","to stay protected from the cold"],["para comer","to eat"],["para poner huevos","to lay eggs"]],a:0},
  {q:["Inferencia: ¿qué pasaría si desaparece el algodoncillo?","Inference: what would happen if milkweed disappeared?"],o:[["Habría más monarcas.","There would be more monarchs."],["Las orugas no tendrían qué comer.","The caterpillars would have nothing to eat."],["Viajarían a Canadá en invierno.","They would fly to Canada in winter."]],a:1},
  {q:["Según el texto, ¿qué es el oyamel?","According to the text, what is an oyamel?"],o:[["un tipo de árbol","a kind of tree"],["una mariposa","a butterfly"],["una ciudad","a city"]],a:0}
 ]});
lec({id:"presente",nivel:"g35",area:"gramatica",ico:"🔁",titulo:["Presente: -er e -ir","Present: -er and -ir verbs"],
 instr:["Compara las dos tablas. Fíjate en que -er e -ir solo cambian en nosotros. Luego conjuga los verbos.","Compare the two charts. Notice that -er and -ir only differ in the nosotros form. Then conjugate the verbs."],
 explica:["Los verbos que terminan en -er e -ir usan casi las mismas terminaciones: -o, -es, -e, -en. La diferencia está en nosotros: comemos (-emos) pero vivimos (-imos).{VOS2}","Verbs ending in -er and -ir use almost the same endings: -o, -es, -e, -en. The difference is nosotros: comemos (-emos) but vivimos (-imos).{VOS2}"],

 ejemplos:[{e:"🌮",es:"Nosotros comemos tacos.",en:"We eat tacos."},{e:"🏡",es:"Ustedes viven en {CIU}.",en:"You all live in {CIU}."},{e:"✍️",es:"Yo escribo un poema.",en:"I write a poem."}],

  {q:["Mi hermano ___ (leer) un libro.","My brother ___ (leer) a book."],o:["leo","lee","leemos"],a:1},
  {q:["Nosotros ___ (escribir) cartas.","We ___ (escribir) letters."],o:["escribemos","escriben","escribimos"],a:2},
  {q:["Tú ___ (beber) agua.","You ___ (beber) water."],o:["bebes","bebe","bebo"],a:0},
  {q:["Ellas ___ (abrir) la puerta.","They ___ (abrir) the door."],o:["abre","abrimos","abren"],a:2},
  {q:["Nosotros ___ (aprender) español.","We ___ (aprender) Spanish."],o:["aprendimos","aprendemos","aprenden"],a:1}
 ]});
lec({id:"preterito",nivel:"g35",area:"gramatica",ico:"⏪",titulo:["El pretérito","The preterite (past)"],
 instr:["Estudia las terminaciones del pasado y fíjate en los acentos. Después completa las oraciones sobre lo que pasó ayer.","Study the past-tense endings and notice the accents. Then complete the sentences about what happened yesterday."],
 explica:["Usamos el pretérito para acciones terminadas en el pasado: ayer, anoche, el año pasado. Las formas de yo y él/ella llevan acento: hablé, habló, comí, comió. Los verbos -er e -ir comparten las mismas terminaciones.","We use the preterite for completed actions in the past: yesterday, last night, last year. The yo and él/ella forms have accents: hablé, habló, comí, comió. -er and -ir verbs share the same endings."],
 tabla:[["persona","hablar","comer / vivir"],["yo","habl<b>é</b>","com<b>í</b> / viv<b>í</b>"],["tú","habl<b>aste</b>","com<b>iste</b>"],["él / ella / usted","habl<b>ó</b>","com<b>ió</b>"],["nosotros","habl<b>amos</b>","com<b>imos</b>"],["ellos / ustedes","habl<b>aron</b>","com<b>ieron</b>"]],
 ejemplos:[{e:"🍕",es:"Ayer comí pizza.",en:"Yesterday I ate pizza."},{e:"💃",es:"Ella bailó toda la noche.",en:"She danced all night."},{e:"✉️",es:"Ellos escribieron una carta.",en:"They wrote a letter."}],
 ejercicios:[
  {q:["Ayer yo ___ (comer) en casa de mi abuela.","Yesterday I ___ (comer) at my grandma's."],o:["como","comí","comió"],a:1},
  {q:["Anoche ella ___ (bailar) en la fiesta.","Last night she ___ (bailar) at the party."],o:["bailó","bailé","baila"],a:0},
  {q:["El año pasado nosotros ___ (vivir) en {CIU2}.","Last year we ___ (vivir) in {CIU2}."],o:["vivieron","vivimos","viví"],a:1},
  {q:["Ellos ___ (escribir) un cuento.","They ___ (escribir) a story."],o:["escribieron","escribió","escriben"],a:0},
  {q:["¿Tú ___ (estudiar) para el examen?","Did you ___ (estudiar) for the test?"],o:["estudiaste","estudió","estudias"],a:0}
 ]});
lec({id:"serestar",nivel:"g68",area:"gramatica",ico:"⚖️",titulo:["Ser y estar","Ser vs. estar"],
 instr:["Lee para qué se usa cada verbo y repasa los ejemplos. Luego decide cuál va en cada oración.","Read what each verb is used for and review the examples. Then decide which one goes in each sentence."],
 explica:["Los dos significan «to be». Ser describe lo que algo es: origen, profesión, características, la hora. Estar dice dónde está algo y cómo está en este momento: lugar, emociones, estados que cambian.","Both mean «to be». Ser tells what something is: origin, job, traits, time. Estar tells where something is and how it is right now: location, feelings, changing conditions."],
 tabla:[["","ser","estar"],["yo","soy","estoy"],["tú","eres","estás"],["él / ella","es","está"],["nosotros","somos","estamos"],["ellos","son","están"]],
 ejemplos:[{e:"👩‍🏫",es:"Mi mamá es maestra.",en:"My mom is a teacher. (ser: job)"},{e:"🏫",es:"Estamos en la escuela.",en:"We are at school. (estar: place)"},{e:"😴",es:"Estoy cansado hoy.",en:"I am tired today. (estar: feeling)"}],
 ejercicios:[
  {q:["Mi papá ___ doctor.","My dad ___ a doctor."],o:["es","está"],a:0},
  {q:["Nosotros ___ en la biblioteca.","We ___ at the library."],o:["somos","estamos"],a:1},
  {q:["Yo ___ muy feliz hoy.","I ___ very happy today."],o:["soy","estoy"],a:1},
  {q:["Ellos ___ de Guatemala.","They ___ from Guatemala."],o:["son","están"],a:0},
  {q:["La sopa ___ caliente.","The soup ___ hot."],o:["es","está"],a:1}
 ]});
lec({id:"ecuaciones",nivel:"g68",area:"algebra",ico:"🟰",titulo:["Ecuaciones de un paso","One-step equations"],
 instr:["Mira cómo se despeja la x en los ejemplos. Después resuelve cada ecuación. Comprueba tu respuesta poniéndola en lugar de la x.","See how x is solved in the examples. Then solve each equation. Check your answer by putting it in place of x."],
 explica:["Una ecuación es como una balanza: lo que haces de un lado lo haces del otro. Para dejar sola la x, usas la operación contraria: si está sumando, restas; si está multiplicando, divides.","An equation is like a balance: whatever you do to one side you do to the other. To get x alone, use the opposite operation: if a number is added, subtract it; if it multiplies, divide."],
 ejemplos:[{e:"⚖️",es:"x + 5 = 12 → x = 12 − 5 = 7",en:"x + 5 = 12 → x = 7"},{e:"⚖️",es:"3x = 18 → x = 18 ÷ 3 = 6",en:"3x = 18 → x = 6"},{e:"⚖️",es:"x − 4 = 10 → x = 10 + 4 = 14",en:"x − 4 = 10 → x = 14"}],
 gen:"ecuacion"});
lec({id:"porcentajes",nivel:"g68",area:"matematicas",ico:"💯",titulo:["Porcentajes","Percentages"],
 instr:["Aprende los atajos para 10 %, 25 % y 50 %. Después calcula cada porcentaje.","Learn the shortcuts for 10%, 25% and 50%. Then find each percentage."],
 explica:["Por ciento quiere decir «de cada 100». El 50 % es la mitad, el 25 % es la cuarta parte y el 10 % se saca dividiendo entre 10.","Percent means «out of 100». 50% is half, 25% is a quarter, and you find 10% by dividing by 10."],
 ejemplos:[{e:"🏷️",es:"50 % de 80 = 40",en:"50% of 80 = 40"},{e:"🏷️",es:"25 % de 40 = 10",en:"25% of 40 = 10"},{e:"🏷️",es:"10 % de 70 = 7",en:"10% of 70 = 7"}],
 gen:"porcentaje"});
lec({id:"tradiciones",nivel:"g68",area:"cultura",ico:"🕯️",titulo:["Tradiciones: Día de Muertos","Traditions: Day of the Dead"],
 instr:["Lee el texto y mira el vocabulario. Luego contesta las preguntas sobre la tradición.","Read the text and look at the vocabulary. Then answer the questions about the tradition."],
 explica:["Conocer las tradiciones nos ayuda a entender a las personas que hablan el idioma. Al leer sobre cultura, fíjate en las fechas, los objetos y el significado de cada costumbre.","Knowing traditions helps us understand the people who speak the language. When reading about culture, notice dates, objects and the meaning of each custom."],
 lectura:["El Día de Muertos se celebra en México el 1 y el 2 de noviembre. Las familias recuerdan con cariño a sus seres queridos que ya murieron. En casa ponen una ofrenda con fotos, velas, comida favorita, pan de muerto y flores de cempasúchil, de color naranja. Muchas personas creen que el olor y el color de las flores guían a las almas de regreso. No es una fiesta triste: es una forma de celebrar la vida.","Day of the Dead is celebrated in Mexico on November 1 and 2. Families lovingly remember loved ones who have died. At home they set up an ofrenda with photos, candles, favorite foods, pan de muerto and orange cempasúchil (marigold) flowers. Many people believe the scent and color of the flowers guide souls back home. It isn't a sad holiday: it's a way to celebrate life."],
 ejemplos:[{e:"🕯️",es:"la vela",en:"candle"},{e:"🌼",es:"el cempasúchil",en:"marigold"},{e:"🍞",es:"el pan de muerto",en:"Day of the Dead bread"},{e:"🖼️",es:"la ofrenda",en:"home altar"}],
 ejercicios:[
  {q:["¿Cuándo se celebra el Día de Muertos?","When is Day of the Dead celebrated?"],o:[["el 31 de octubre","October 31"],["el 1 y 2 de noviembre","November 1 and 2"],["el 25 de diciembre","December 25"]],a:1},
  {q:["¿De qué color es la flor de cempasúchil?","What color is the cempasúchil flower?"],o:[["azul","blue"],["morada","purple"],["naranja","orange"]],a:2},

lec({id:"lalo",nivel:"pk",area:"lectura",ico:"🐶",titulo:["Lectura: Mi perrito Lalo","Reading: My little dog Lalo"],
 instr:["Escucha el cuento con atención. Toca 🔊 para oírlo otra vez. Luego contesta las preguntas tocando la respuesta.","Listen to the story carefully. Tap 🔊 to hear it again. Then answer the questions by tapping the answer."],
 explica:["Cuando oímos un cuento pensamos en tres cosas: de quién habla, cómo es y qué hace. Los dibujos también nos ayudan a entender.","When we hear a story we think about three things: who it's about, what it's like and what it does. Pictures help us understand too."],
 lectura:["Tengo un perrito. Se llama Lalo. Lalo es café y pequeño. Le gusta correr en el parque. En la noche, Lalo duerme en su camita.","I have a little dog. His name is Lalo. Lalo is brown and small. He likes to run in the park. At night, Lalo sleeps in his little bed."],
 ejemplos:[{e:"🐶",es:"¿De quién habla? De Lalo.",en:"Who is it about? Lalo."},{e:"🟤",es:"¿Cómo es? Café y pequeño.",en:"What is he like? Brown and small."},{e:"🏃",es:"¿Qué le gusta? Correr.",en:"What does he like? Running."}],

lec({id:"sofia",nivel:"g12",area:"lectura",ico:"🎂",titulo:["Lectura: La fiesta de Sofía","Reading: Sofía's party"],
 instr:["Lee el cuento despacio. Si una palabra es difícil, tócala en voz alta por sílabas. Después contesta las preguntas.","Read the story slowly. If a word is hard, sound it out by syllables. Then answer the questions."],
 explica:["Un cuento tiene principio, medio y final. Para entenderlo, fíjate en quién es el personaje, qué pasa y en qué orden pasan las cosas.","A story has a beginning, a middle and an end. To understand it, notice who the character is, what happens and in what order."],
 lectura:["Hoy es el cumpleaños de Sofía. Cumple siete años. Su mamá hace un pastel de chocolate. Sus amigos llegan a las tres de la tarde. Juegan con una piñata llena de dulces. Al final, Sofía sopla las velas y pide un deseo.","Today is Sofía's birthday. She is turning seven. Her mom makes a chocolate cake. Her friends arrive at three in the afternoon. They play with a piñata full of candy. At the end, Sofía blows out the candles and makes a wish."],
 ejemplos:[{e:"👧",es:"Personaje: Sofía",en:"Character: Sofía"},{e:"🎂",es:"Principio: es su cumpleaños",en:"Beginning: it's her birthday"},{e:"🕯️",es:"Final: sopla las velas",en:"End: she blows out the candles"}],
 ejercicios:[
  {q:["¿Cuántos años cumple Sofía?","How old is Sofía turning?"],o:["5","7","9"],a:1},
  {q:["¿De qué es el pastel?","What kind of cake is it?"],o:[["de chocolate","chocolate"],["de fresa","strawberry"],["de vainilla","vanilla"]],a:0},
  {q:["¿A qué hora llegan los amigos?","What time do the friends arrive?"],o:[["a las tres","at three"],["a las ocho","at eight"],["a las doce","at twelve"]],a:0},
  {q:["¿Qué tiene la piñata?","What is in the piñata?"],o:[["dulces","candy"],["juguetes","toys"],["flores","flowers"]],a:0},
  {q:["¿Qué pasa al final del cuento?","What happens at the end?"],o:[["Sofía sopla las velas.","Sofía blows out the candles."],["Sofía se va a dormir.","Sofía goes to sleep."],["Llegan los amigos.","The friends arrive."]],a:0}
 ]});
lec({id:"murcielagos",nivel:"g35",area:"lectura",ico:"🦇",titulo:["Lectura: Los murciélagos de Austin","Reading: The bats of Austin"],
 instr:["Lee el texto informativo. Busca los números y las palabras que explican por qué pasan las cosas. Luego contesta las preguntas.","Read the informational text. Look for numbers and words that explain why things happen. Then answer the questions."],
 explica:["Un texto informativo enseña datos reales. Fíjate en los números, en las fechas y en palabras como «porque» y «cuando», que explican causas.","An informational text teaches real facts. Pay attention to numbers, dates and words like «because» and «when», which explain causes."],
 lectura:["Debajo del puente de la avenida Congress, en Austin, vive una de las colonias de murciélagos más grandes del mundo dentro de una ciudad. Son cerca de un millón y medio de murciélagos de cola libre mexicanos. Llegan de México en la primavera y se quedan hasta el otoño. Las mamás tienen a sus crías debajo del puente. Empezaron a vivir allí después de 1980, cuando arreglaron el puente y quedaron grietas angostas, perfectas para dormir. Cada tarde, cuando se pone el sol, salen volando en una nube enorme a buscar insectos.","Under the Congress Avenue bridge in Austin lives one of the largest city bat colonies in the world. There are about one and a half million Mexican free-tailed bats. They arrive from Mexico in spring and stay until fall. The mothers have their babies under the bridge. They started living there after 1980, when the bridge was repaired and narrow cracks were left that are perfect for sleeping. Every evening, when the sun goes down, they fly out in a huge cloud to look for insects."],
 ejemplos:[{e:"🔢",es:"Número: un millón y medio",en:"Number: one and a half million"},{e:"📅",es:"Fecha: después de 1980",en:"Date: after 1980"},{e:"🔗",es:"Causa: «cuando arreglaron el puente»",en:"Cause: «when the bridge was repaired»"}],
 ejercicios:[
  {q:["¿Dónde viven los murciélagos?","Where do the bats live?"],o:[["debajo de un puente","under a bridge"],["en una cueva","in a cave"],["en un árbol","in a tree"]],a:0},
  {q:["¿Cuántos murciélagos hay, más o menos?","About how many bats are there?"],o:[["un millón y medio","one and a half million"],["cien","one hundred"],["mil","one thousand"]],a:0},
  {q:["¿Cuándo salen volando?","When do they fly out?"],o:[["cuando se pone el sol","when the sun goes down"],["a mediodía","at noon"],["en la mañana","in the morning"]],a:0},
  {q:["¿Qué salen a buscar?","What do they go out to find?"],o:[["insectos","insects"],["frutas","fruit"],["pescado","fish"]],a:0},
  {q:["¿Por qué empezaron a vivir en el puente?","Why did they start living on the bridge?"],o:[["Al arreglarlo quedaron grietas para dormir.","Repairs left cracks for sleeping."],["Porque allí hace frío.","Because it's cold there."],["Porque la gente les da comida.","Because people feed them."]],a:0}
 ]});
lec({id:"cacao",nivel:"g68",area:"lectura",ico:"🍫",titulo:["Lectura: El cacao, de semilla a moneda","Reading: Cacao, from seed to money"],
 instr:["Lee el texto de historia. Ordena en tu mente qué pasó primero y piensa por qué la gente hacía lo que hacía. Después contesta, incluida una pregunta de inferencia.","Read the history text. Put in order what happened first and think about why people did what they did. Then answer, including an inference question."],
 explica:["En un texto de historia busca dos cosas: la secuencia en el tiempo (qué pasó antes y después) y la relación de causa y efecto (por qué pasó). Las fechas y las palabras como «antes», «para» y «tan… que» son pistas.","In a history text look for two things: the sequence in time (what happened before and after) and cause and effect (why it happened). Dates and words like «before», «to» and «so… that» are clues."],
 lectura:["Mucho antes de que existieran las barras de chocolate, los pueblos de Mesoamérica ya disfrutaban el cacao. Los olmecas lo usaban hace casi 4000 años. Los mayas preparaban una bebida espumosa y amarga con las semillas molidas, a veces con chile. Para los aztecas, las semillas de cacao eran tan valiosas que servían como dinero: con una semilla se podía comprar un tomate y con unas treinta, un conejo. Hoy el chocolate se come en todo el mundo, pero su historia como bebida empezó en Mesoamérica, en lo que hoy es México y Centroamérica.","Long before chocolate bars existed, the peoples of Mesoamerica already enjoyed cacao. The Olmecs used it almost 4,000 years ago. The Maya made a foamy, bitter drink with the ground seeds, sometimes with chili. For the Aztecs, cacao seeds were so valuable that they were used as money: one seed could buy a tomato, and about thirty could buy a rabbit. Today chocolate is eaten all over the world, but its history as a drink began in Mesoamerica, in what is now Mexico and Central America."],
 ejemplos:[{e:"⏳",es:"Secuencia: olmecas → mayas → aztecas",en:"Sequence: Olmecs → Maya → Aztecs"},{e:"🔗",es:"Causa y efecto: era valioso, por eso servía de dinero",en:"Cause and effect: it was valuable, so it worked as money"},{e:"🌶️",es:"Detalle: la bebida maya a veces llevaba chile",en:"Detail: the Maya drink sometimes had chili"}],
 ejercicios:[
  {q:["¿Cuál es la idea principal?","What is the main idea?"],o:[["La historia del cacao en Mesoamérica.","The history of cacao in Mesoamerica."],["Cómo hacer barras de chocolate.","How to make chocolate bars."],["Los conejos de México.","The rabbits of Mexico."]],a:0},
  {q:["Según el texto, ¿quiénes usaron el cacao primero?","According to the text, who used cacao first?"],o:[["los olmecas","the Olmecs"],["los aztecas","the Aztecs"],["los europeos","the Europeans"]],a:0},
  {q:["¿Cómo era la bebida de los mayas?","What was the Maya drink like?"],o:[["espumosa y amarga","foamy and bitter"],["fría y dulce","cold and sweet"],["de leche","made with milk"]],a:0},
  {q:["¿Para qué usaban los aztecas las semillas?","What did the Aztecs use the seeds for?"],o:[["como dinero","as money"],["como juguete","as toys"],["como medicina","as medicine"]],a:0},
  {q:["Inferencia: ¿por qué servían de dinero?","Inference: why did they work as money?"],o:[["Porque eran valiosas y todos las querían.","Because they were valuable and everyone wanted them."],["Porque no servían para nada.","Because they were useless."],["Porque eran muy grandes.","Because they were very big."]],a:0}
 ]});

lec({id:"fiestapk",nivel:"pk",area:"cultura",ico:"🎉",titulo:["Cultura: fiestas de cumpleaños","Culture: birthday parties"],

lec({id:"flotapk",nivel:"pk",area:"ciencias",ico:"🛟",titulo:["Ciencias: ¿flota o se hunde?","Science: float or sink?"],

lec({id:"sentidos",nivel:"pk",area:"biologia",ico:"👀",titulo:["Biología: los cinco sentidos","Biology: the five senses"],

 ]});

lec({id:"escucha12",nivel:"g12",area:"escuchar",ico:"👂",titulo:["Escucha el cuento","Listen to the story"],
 instr:["Toca «Escuchar el audio» y oye el cuento sin leerlo. Las preguntas también son de audio: escúchalas y toca la respuesta.","Tap «Listen to the audio» and hear the story without reading it. The questions are audio too: listen and tap the answer."],
 explica:["Cuando solo escuchas, imagina la historia como una película en tu cabeza. Escucha dos veces: la primera para entender y la segunda para buscar detalles.","When you only listen, picture the story like a movie in your head. Listen twice: first to understand, then to find details."],
 audioTexto:["Pepe tiene un paraguas rojo. Hoy llueve mucho. Pepe camina a la escuela con sus botas amarillas. En el camino ve una rana en un charco. La rana salta y Pepe se ríe.","Pepe has a red umbrella. Today it is raining a lot. Pepe walks to school in his yellow boots. On the way he sees a frog in a puddle. The frog jumps and Pepe laughs."],

lec({id:"papel12",nivel:"g12",area:"cultura",ico:"🎏",titulo:["Cultura: el papel picado","Culture: papel picado"],
 instr:["Lee sobre esta decoración mexicana y contesta las preguntas.","Read about this Mexican decoration and answer the questions."],
 explica:["Muchas fiestas tienen decoraciones especiales. Al leer sobre cultura, fíjate de dónde viene la costumbre, cómo se hace y cuándo se usa.","Many celebrations have special decorations. When reading about culture, notice where the custom comes from, how it's made and when it's used."],
 lectura:["El papel picado es una decoración mexicana. Se hace con papel de colores cortado con figuras, como flores, pájaros o calaveras. Se cuelga en hilos sobre las calles y los patios en las fiestas, como el Día de Muertos o las bodas. Cuando sopla el viento, el papel se mueve y hace un sonido suave.","Papel picado is a Mexican decoration. It is made of colored paper cut into shapes such as flowers, birds or skulls. It hangs on strings over streets and patios during celebrations like Day of the Dead or weddings. When the wind blows, the paper moves and makes a soft sound."],
 ejemplos:[{e:"📍",es:"¿De dónde? De México.",en:"Where from? Mexico."},{e:"✂️",es:"¿Cómo? Con papel cortado.",en:"How? With cut paper."},{e:"🎉",es:"¿Cuándo? En las fiestas.",en:"When? At celebrations."}],
 ejercicios:[
  {q:["¿De dónde es el papel picado?","Where is papel picado from?"],o:[["de México","Mexico"],["de China","China"],["de Francia","France"]],a:0},
  {q:["¿Con qué se hace?","What is it made of?"],o:[["papel de colores","colored paper"],["madera","wood"],["vidrio","glass"]],a:0},
  {q:["¿Dónde se cuelga?","Where does it hang?"],o:[["en hilos sobre las calles","on strings over the streets"],["en el piso","on the floor"],["dentro del refrigerador","inside the fridge"]],a:0},
  {q:["¿Qué pasa cuando sopla el viento?","What happens when the wind blows?"],o:[["El papel se mueve.","The paper moves."],["El papel se moja.","The paper gets wet."],["El papel se rompe siempre.","The paper always tears."]],a:0}
 ]});
lec({id:"aguaestados",nivel:"g12",area:"ciencias",ico:"🧊",titulo:["Ciencias: los estados del agua","Science: states of water"],
 instr:["Aprende los tres estados del agua con los ejemplos. Luego decide en qué estado está el agua en cada caso.","Learn the three states of water with the examples. Then decide which state the water is in each case."],
 explica:["El agua puede estar en tres estados. Sólido: el hielo, que es duro y frío. Líquido: el agua que tomamos, que corre y moja. Gas: el vapor, que sube cuando el agua hierve. Con calor el hielo se derrite, y con más calor el agua se evapora.","Water can be in three states. Solid: ice, which is hard and cold. Liquid: the water we drink, which flows and makes things wet. Gas: steam, which rises when water boils. Heat melts ice, and more heat makes water evaporate."],

 ejemplos:[{e:"🧊",es:"sólido: hielo",en:"solid: ice"},{e:"💧",es:"líquido: agua",en:"liquid: water"},{e:"♨️",es:"gas: vapor",en:"gas: steam"}],
 ejercicios:[
  {q:["El hielo es agua en estado…","Ice is water in which state?"],v:"🧊",o:[["sólido","solid"],["líquido","liquid"],["gaseoso","gas"]],a:0},

  {q:["La lluvia es agua…","Rain is water that is…"],v:"🌧️",o:[["líquida","liquid"],["sólida","solid"],["gaseosa","gas"]],a:0},

  {q:["¿Qué necesita el agua para hervir?","What does water need to boil?"],o:[["mucho calor","a lot of heat"],["mucho frío","a lot of cold"],["oscuridad","darkness"]],a:0}

lec({id:"plantas",nivel:"g12",area:"biologia",ico:"🌱",titulo:["Biología: lo que necesitan las plantas","Biology: what plants need"],
 instr:["Lee qué necesitan las plantas para vivir y conoce sus partes. Luego contesta las preguntas.","Read what plants need to live and learn their parts. Then answer the questions."],

lec({id:"escucha35",nivel:"g35",area:"escuchar",ico:"📞",titulo:["Escucha: una llamada","Listen: a phone call"],
 instr:["Escucha la llamada sin leerla. Las preguntas son de audio. También vas a escuchar números y elegir cómo se escriben.","Listen to the phone call without reading it. The questions are audio. You'll also hear numbers and choose how they're written."],
 explica:["En una conversación, pon atención a quién habla, qué planes tiene y los números (horas, días, cantidades). Si no entiendes una palabra, sigue escuchando: el resto te da pistas.","In a conversation, notice who is speaking, what plans they have and the numbers (times, days, amounts). If you miss a word, keep listening: the rest gives you clues."],
 audioTexto:["—¡Hola, abuela! Soy Mateo. —¡Hola, mi amor! ¿Cómo estás? —Bien. Mañana tengo un examen de matemáticas. —¿Ya estudiaste? —Sí, estudié dos horas. Después voy a jugar con mi primo. —Muy bien. El domingo te hago tamales.","—Hi, Grandma! It's Mateo. —Hi, sweetheart! How are you? —Good. Tomorrow I have a math test. —Did you study already? —Yes, I studied for two hours. Then I'm going to play with my cousin. —Very good. On Sunday I'll make you tamales."],

  {q:["¿Qué tiene Mateo mañana?","What does Mateo have tomorrow?"],audioQ:true,pasaje:true,o:[["un examen de matemáticas","a math test"],["una fiesta","a party"],["un partido","a game"]],a:0},

lec({id:"habla35",nivel:"g35",area:"hablar",ico:"🗣️",titulo:["Describo lo que veo","I describe what I see"],
 instr:["Mira el dibujo, escucha cómo se describe y dilo tú. Después intenta describirlo con tus propias palabras.","Look at the picture, listen to how it's described and say it yourself. Then try to describe it in your own words."],

lec({id:"escribe35",nivel:"g35",area:"escritura",ico:"✏️",titulo:["Escribo con verbos","Writing with verbs"],

 ejemplos:[{e:"🗣️",es:"Ella habla. Nosotros hablamos.",en:"She speaks. We speak."},{e:"🏠",es:"la casa blanca",en:"the white house"},{e:"✅",es:"Mayúscula, verbo correcto, punto",en:"Capital, correct verb, period"}],

lec({id:"compara35",nivel:"g35",area:"comparar",ico:"🔍",titulo:["Comparo: el correcaminos y el armadillo","Compare: the roadrunner and the armadillo"],
 instr:["Lee los dos textos informativos. Completa en tu mente la tabla y contesta las preguntas de comparación.","Read both informational texts. Fill in the chart in your head and answer the comparison questions."],
 explica:["Al comparar textos informativos, busca las mismas categorías en los dos: qué tipo de animal es, qué come y cómo se protege. Así es fácil ver lo que se parece y lo que cambia.","When comparing informational texts, look for the same categories in both: what kind of animal it is, what it eats and how it protects itself. That makes it easy to see what's alike and what's different."],
 lectura:["El correcaminos es un ave que vive en Texas, en el suroeste de Estados Unidos y en México. Puede volar un poco, pero prefiere correr, ¡y corre muy rápido! Come insectos, lagartijas y hasta serpientes.","The roadrunner is a bird that lives in Texas, the southwestern United States and Mexico. It can fly a little, but it prefers to run, and it runs very fast! It eats insects, lizards and even snakes."],
 lectura2:["El armadillo es un mamífero y es el pequeño mamífero oficial de Texas. Tiene el cuerpo cubierto de placas duras, como una armadura. Con sus garras escarba la tierra para buscar insectos. Si se asusta, ¡puede dar un salto!","The armadillo is a mammal and the official state small mammal of Texas. Its body is covered with hard plates, like armor. It digs in the soil with its claws to find insects. If it gets scared, it can jump!"],
 tit1:["El correcaminos","The roadrunner"],tit2:["El armadillo","The armadillo"],
 tabla:[["","correcaminos","armadillo"],["tipo","ave","mamífero"],["come","insectos, lagartijas, serpientes","insectos"],["se protege","corriendo","con su armadura"]],
 ejemplos:[{e:"🤝",es:"Se parecen: los dos viven en Texas y comen insectos.",en:"Alike: both live in Texas and eat insects."},{e:"↔️",es:"Diferente: uno es ave y el otro mamífero.",en:"Different: one is a bird, the other a mammal."}],
 ejercicios:[
  {q:["¿En qué se parecen los dos?","How are they alike?"],o:[["Los dos viven en Texas y comen insectos.","Both live in Texas and eat insects."],["Los dos son aves.","Both are birds."],["Los dos tienen armadura.","Both have armor."]],a:0},
  {q:["¿Cuál es un ave?","Which one is a bird?"],o:[["el correcaminos","the roadrunner"],["el armadillo","the armadillo"]],a:0},
  {q:["¿Quién tiene placas duras?","Which one has hard plates?"],o:[["el armadillo","the armadillo"],["el correcaminos","the roadrunner"]],a:0},

  {q:["¿Cuál es el pequeño mamífero oficial de Texas?","Which is the official state small mammal of Texas?"],o:[["el armadillo","the armadillo"],["el correcaminos","the roadrunner"],["el murciélago","the bat"]],a:0}
 ]});
lec({id:"ciclodelagua",nivel:"g35",area:"ciencias",ico:"🌧️",titulo:["Ciencias: el ciclo del agua","Science: the water cycle"],
 instr:["Estudia los cuatro pasos del ciclo del agua en orden. Luego contesta las preguntas.","Study the four steps of the water cycle in order. Then answer the questions."],
 explica:["El agua de la Tierra se mueve en un ciclo que no termina. Evaporación: el sol calienta el agua y sube como vapor. Condensación: el vapor se enfría y forma nubes. Precipitación: el agua cae como lluvia, nieve o granizo. Acumulación: el agua se junta en ríos, lagos, mares y debajo de la tierra, y el ciclo empieza otra vez.","Earth's water moves in a cycle that never ends. Evaporation: the sun heats water and it rises as vapor. Condensation: the vapor cools and forms clouds. Precipitation: water falls as rain, snow or hail. Collection: water gathers in rivers, lakes, oceans and underground, and the cycle starts again."],
 tabla:[["paso","¿qué pasa?"],["1. evaporación","el agua sube como vapor"],["2. condensación","se forman las nubes"],["3. precipitación","cae lluvia, nieve o granizo"],["4. acumulación","el agua se junta en ríos y mares"]],
 ejemplos:[{e:"☀️💧",es:"evaporación",en:"evaporation"},{e:"☁️",es:"condensación",en:"condensation"},{e:"🌧️",es:"precipitación",en:"precipitation"},{e:"🌊",es:"acumulación",en:"collection"}],
 ejercicios:[
  {q:["¿Cómo se llama cuando el agua sube como vapor?","What is it called when water rises as vapor?"],o:[["evaporación","evaporation"],["precipitación","precipitation"],["acumulación","collection"]],a:0},
  {q:["¿Qué se forma en la condensación?","What forms during condensation?"],o:[["las nubes","clouds"],["los ríos","rivers"],["las montañas","mountains"]],a:0},
  {q:["La lluvia y la nieve son…","Rain and snow are…"],o:[["precipitación","precipitation"],["evaporación","evaporation"],["condensación","condensation"]],a:0},
  {q:["¿Qué da la energía para que el agua se evapore?","What gives the energy for water to evaporate?"],o:[["el sol","the sun"],["la luna","the moon"],["el viento frío","cold wind"]],a:0},
  {q:["¿Qué pasa después de la acumulación?","What happens after collection?"],o:[["El ciclo empieza otra vez.","The cycle starts again."],["El agua desaparece.","The water disappears."],["Se acaba el ciclo.","The cycle ends."]],a:0}
 ]});

lec({id:"habla68",nivel:"g68",area:"hablar",ico:"🗣️",titulo:["Doy mi opinión","I give my opinion"],

lec({id:"fuerzas",nivel:"g68",area:"ciencias",ico:"🧲",titulo:["Ciencias: fuerzas y movimiento","Science: forces and motion"],

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function distractores(c,min=0){const s=new Set([c]);let t=0;while(s.size<3&&t<50){t++;const d=c+R(-4,4);if(d>=min&&d!==c)s.add(d)}let k=1;while(s.size<3){s.add(c+10*k);k++}return [...s]}

function numES(n){
  if(n<30) return U_ES[n];
  if(n<100){const d=Math.floor(n/10),u=n%10;return D_ES[d]+(u?" y "+U_ES[u]:"")}
  if(n<1000){if(n===100) return "cien";const c=Math.floor(n/100),r=n%100;return C_ES[c]+(r?" "+numES(r):"")}
  const m=Math.floor(n/1000),r=n%1000;return (m===1?"mil":numES(m)+" mil")+(r?" "+numES(r):"");
}

/* Dibujos SVG para geometría (se generan en la app, sin imágenes externas) */
const SVG_ESTILO=`style="width:min(260px,70vw);height:auto;display:block;margin:0 auto" role="img"`;
function svgPoligono(n){
  if(n===0) return `<svg viewBox="0 0 200 200" ${SVG_ESTILO} aria-label="círculo"><circle cx="100" cy="100" r="80" fill="#cfe6ff" stroke="#2b7bd8" stroke-width="6"/></svg>`;
  const giro=n%2===0?Math.PI/n:0;const pts=Array.from({length:n},(_,k)=>{const a=-Math.PI/2+giro+k*2*Math.PI/n;return `${(100+80*Math.cos(a)).toFixed(1)},${(105+80*Math.sin(a)).toFixed(1)}`}).join(" ");
  return `<svg viewBox="0 0 200 200" ${SVG_ESTILO} aria-label="figura de ${n} lados"><polygon points="${pts}" fill="#ffe7a8" stroke="#ff8c42" stroke-width="6" stroke-linejoin="round"/></svg>`;
}

  return `<svg viewBox="0 0 220 170" ${SVG_ESTILO} aria-label="rectángulo de ${w} por ${h}"><rect x="${x}" y="${y}" width="${W}" height="${H}" fill="#d9f5e4" stroke="#3bb273" stroke-width="5"/>
    <text x="110" y="${y+H+20}" text-anchor="middle" font-size="16" font-weight="800" fill="#21324a">${w} ${u}</text>
    <text x="${x-8}" y="${y+H/2+5}" text-anchor="end" font-size="16" font-weight="800" fill="#21324a">${h} ${u}</text></svg>`;
}
function svgAngulo(g){
  const cx=100,cy=125,r=88,rad=g*Math.PI/180,x2=cx+r*Math.cos(rad),y2=cy-r*Math.sin(rad),ra=34,ax=cx+ra*Math.cos(rad),ay=cy-ra*Math.sin(rad);
  const mid=g<45?rad+18*Math.PI/180:rad/2,dl=g<45?70:60,lx=cx+dl*Math.cos(mid),ly=cy-dl*Math.sin(mid)+6;
  const arco=g===90?`<path d="M${cx+24} ${cy} L${cx+24} ${cy-24} L${cx} ${cy-24}" fill="none" stroke="#ef5b5b" stroke-width="4"/>`
    :`<path d="M${cx+ra} ${cy} A${ra} ${ra} 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" stroke="#ef5b5b" stroke-width="4"/>`;
  return `<svg viewBox="0 0 200 145" ${SVG_ESTILO} aria-label="ángulo de ${g} grados"><line x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="#2b7bd8" stroke-width="6" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#2b7bd8" stroke-width="6" stroke-linecap="round"/>${arco}
    <circle cx="${cx}" cy="${cy}" r="4" fill="#21324a"/>
    <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="17" font-weight="800" fill="#ef5b5b">${g}°</text></svg>`;
}

function svgReloj(h,m){const cx=80,cy=80,r=70;let el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#2b7bd8" stroke-width="6"/>`;
  for(let k=1;k<=12;k++){const a=(k*30-90)*Math.PI/180;el+=`<text x="${cx+54*Math.cos(a)}" y="${cy+54*Math.sin(a)+6}" text-anchor="middle" font-size="16" font-weight="800" fill="#21324a">${k}</text>`}
  for(let k=0;k<60;k++){const a=(k*6-90)*Math.PI/180,r1=k%5?66:62;el+=`<line x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+69*Math.cos(a)}" y2="${cy+69*Math.sin(a)}" stroke="#9aa8ba" stroke-width="${k%5?1:2.5}"/>`}
  const ah=((h%12)*30+m*.5-90)*Math.PI/180,am=(m*6-90)*Math.PI/180;
  el+=`<line x1="${cx}" y1="${cy}" x2="${cx+34*Math.cos(ah)}" y2="${cy+34*Math.sin(ah)}" stroke="#21324a" stroke-width="7" stroke-linecap="round"/>`;
  el+=`<line x1="${cx}" y1="${cy}" x2="${cx+56*Math.cos(am)}" y2="${cy+56*Math.sin(am)}" stroke="#e8505b" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="#21324a"/>`;
  return `<svg viewBox="0 0 160 160" style="width:min(200px,60vw);height:auto;display:block;margin:0 auto" role="img" aria-label="reloj">${el}</svg>`}

  for(let k=0;k<=max;k++){const y=base-k*esc;el+=`<line x1="38" y1="${y}" x2="${W-6}" y2="${y}" stroke="#e3e9f1" stroke-width="1"/><text x="30" y="${y+5}" text-anchor="end" font-size="13" font-weight="700" fill="#5b6f88">${k}</text>`}
  const col=["#2b7bd8","#3bb273","#f5a623","#e8505b","#8e6bd8"];
  datos.forEach((d,i)=>{const x=50+i*60,h=d[1]*esc;el+=`<rect x="${x}" y="${base-h}" width="40" height="${h}" rx="4" fill="${col[i%5]}"/><text x="${x+20}" y="${base+26}" text-anchor="middle" font-size="22">${d[0]}</text>`});

function svgBloques(n){

  if(d)x+=4;
  for(let i=0;i<u;i++){const col=i%2,fil=Math.floor(i/2);el+=`<rect x="${x+col*10}" y="${6+H-8-fil*10}" width="8" height="8" fill="#ffe27a" stroke="#e0a400" stroke-width="1.5"/>`}
  if(u)x+=22;

function erroresDe(s,en){const v=[];
  const m1=minusInicio(s); if(m1!==s) v.push([m1,0]);
  if(/[.]$/.test(s)) v.push([s.slice(0,-1),1]);
  if(!en&&/^[¿¡]/.test(s)) v.push([s.slice(1),2]);
  if(en&&/\bI\b/.test(s.slice(1))) v.push([s[0]+s.slice(1).replace(/\bI\b/,"i"),2]);
  const tilde=s.match(/[áéíóú]/); if(!en&&tilde) v.push([s.replace(/[áéíóú]/,c=>({"á":"a","é":"e","í":"i","ó":"o","ú":"u"})[c]),3]);
  const pal=s.split(" "); if(pal.length>3){const k=R(1,pal.length-2);v.push([pal.slice(0,k).join(" ")+pal[k]+" "+pal.slice(k+1).join(" "),4])}
  return v}
