const GUIAS={"numerospk": {"es": ["10 objetos pequeños por niño (fichas, bloques o tapitas), tarjetas con los números del 1 al 10, un dado grande", "Cuenten juntos en voz alta del 1 al 10 tocando los dedos. Muestre una tarjeta y pida que levanten esa cantidad de dedos.", "Cada niño cuenta objetos tocándolos uno por uno y los pone sobre la tarjeta del número. Repita con 3, 5, 7 y 10.", "Lance el dado grande: el grupo cuenta los puntos y busca la tarjeta del número."], "en": ["10 small objects per child (counters, blocks or bottle caps), number cards 1–10, a large die", "Count together from 1 to 10 touching your fingers. Show a card and have children hold up that many fingers.", "Each child counts objects, touching them one by one, and places them on the number card. Repeat with 3, 5, 7 and 10.", "Roll the large die: the group counts the dots and finds the matching number card."]}, "cuentapk": {"es": ["Dos platos de cartón por pareja, 20 fichas o semillas, tarjetas «más» y «menos»", "Ponga 2 manzanas en una mano y 5 en la otra. Pregunte: ¿dónde hay más? ¿Cómo lo sabes?", "En parejas, un niño pone fichas en cada plato y el otro dice cuál tiene más y cuál tiene menos. Cuentan para comprobar.", "Cada niño dibuja dos grupos y encierra el que tiene más."], "en": ["Two paper plates per pair, 20 counters or seeds, «more» and «less» cards", "Put 2 apples in one hand and 5 in the other. Ask: where are there more? How do you know?", "In pairs, one child puts counters on each plate and the other says which has more and which has less. They count to check.", "Each child draws two groups and circles the one with more."]}, "patrones": {"es": ["Bloques o cuentas de dos o tres colores, cuerda, crayones", "Haga un patrón con los niños: aplauso, pisotón, aplauso, pisotón. Pregunte qué sigue.", "Cada niño arma un collar con un patrón AB o ABC. Su compañero lo lee en voz alta y dice qué sigue.", "Completen el patrón de la hoja y coloreen cada figura."], "en": ["Blocks or beads in two or three colors, string, crayons", "Make a pattern with the children: clap, stomp, clap, stomp. Ask what comes next.", "Each child makes a necklace with an AB or ABC pattern. A partner reads it aloud and says what comes next.", "Complete the pattern on the worksheet and color each shape."]}, "formas": {"es": ["Figuras de cartulina (círculo, cuadrado, triángulo, rectángulo), una bolsa de tela, objetos del salón", "Saque una figura de la bolsa sin mirar, tóquenla y adivinen cuál es por sus lados y esquinas.", "Hagan una cacería de formas en el salón: el reloj es un círculo, la puerta es un rectángulo. Anoten en una tabla.", "Cada niño dibuja un objeto de su casa que tenga una de las formas."], "en": ["Cardstock shapes (circle, square, triangle, rectangle), a cloth bag, classroom objects", "Pull a shape from the bag without looking, feel it and guess it by its sides and corners.", "Go on a shape hunt in the classroom: the clock is a circle, the door is a rectangle. Record them in a chart.", "Each child draws something from home that has one of the shapes."]}, "sumas": {"es": ["Recta numérica del 0 al 20, 20 fichas por pareja, dos dados", "Cuente una historia: «Tengo 3 manzanas y me dan 2 más». Represéntenla con fichas.", "En parejas, lanzan dos dados, juntan las fichas y escriben la suma. Practiquen la estrategia de empezar con el número mayor y seguir contando.", "Resuelvan la hoja. Revisen dos sumas en la recta numérica frente al grupo."], "en": ["Number line 0–20, 20 counters per pair, two dice", "Tell a story: «I have 3 apples and get 2 more». Act it out with counters.", "In pairs, children roll two dice, combine counters and write the sum. Practice starting with the bigger number and counting on.", "Solve the worksheet. Check two sums on the number line with the whole group."]}, "restas": {"es": ["Recta numérica del 0 al 20, fichas, vasitos", "Ponga 8 fichas, tape 3 con un vaso y pregunte cuántas quedan a la vista.", "Los niños resuelven historias de restar quitando fichas y comprueban saltando hacia atrás en la recta numérica.", "Cada niño inventa una historia de resta para un compañero."], "en": ["Number line 0–20, counters, small cups", "Put out 8 counters, cover 3 with a cup and ask how many are still showing.", "Children solve take-away stories by removing counters and check by jumping back on the number line.", "Each child makes up a subtraction story for a partner."]}, "numfalta": {"es": ["Tarjetas de números del 0 al 20, una caja o vaso para «esconder» un número, fichas", "Escriba 3 + □ = 8 y pregunte: ¿cuántos le faltan a 3 para llegar a 8?", "En parejas, uno esconde fichas bajo el vaso y dice el total; el otro descubre cuántas hay escondidas y escribe la igualdad.", "Expliquen en voz alta cómo encontraron el número que faltaba."], "en": ["Number cards 0–20, a box or cup to «hide» a number, counters", "Write 3 + □ = 8 and ask: how many more does 3 need to make 8?", "In pairs, one child hides counters under the cup and says the total; the other finds how many are hidden and writes the equation.", "Explain aloud how you found the missing number."]}, "lados": {"es": ["Palitos de manualidades o popotes, plastilina, figuras de cartulina", "Muestre un triángulo y un cuadrado. Cuenten juntos los lados y los vértices.", "Cada niño construye figuras con palitos y plastilina (los vértices) y registra cuántos lados y vértices tiene cada una.", "Clasifiquen las figuras del grupo por número de lados."], "en": ["Craft sticks or straws, play dough, cardstock shapes", "Show a triangle and a square. Count the sides and vertices together.", "Each child builds shapes with sticks and play dough (the vertices) and records how many sides and vertices each one has.", "Sort the group's shapes by number of sides."]}, "seriesnum": {"es": ["Tabla del 100, recta numérica hasta 1 000, pinzas de ropa con números", "Cuenten juntos de 2 en 2, de 5 en 5 y de 10 en 10 aplaudiendo en cada número.", "En la tabla del 100, coloreen los números de 5 en 5 y de 10 en 10 y busquen el patrón. Luego cuenten de 100 en 100 hasta 1 000 y hacia atrás.", "Cada niño inventa una serie con un número escondido para su compañero."], "en": ["Hundred chart, number line to 1,000, clothespins with numbers", "Count together by 2s, 5s and 10s, clapping on each number.", "On the hundred chart, color the numbers by 5s and by 10s and look for the pattern. Then count by 100s to 1,000 and back.", "Each child makes a sequence with a hidden number for a partner."]}, "valorpos": {"es": ["Bloques de base diez (o tiras de papel de 10 y cuadritos sueltos), tabla de centenas, decenas y unidades", "Muestre 243 con bloques: 2 centenas, 4 decenas y 3 unidades. Escriban 200 + 40 + 3.", "En parejas, uno forma un número con bloques y el otro lo escribe en forma normal y desarrollada. Comparen dos números con >, < o =.", "Digan qué número es 10 más y 100 más que el suyo."], "en": ["Base-ten blocks (or paper strips of 10 and loose squares), hundreds-tens-ones chart", "Show 243 with blocks: 2 hundreds, 4 tens and 3 ones. Write 200 + 40 + 3.", "In pairs, one builds a number with blocks and the other writes it in standard and expanded form. Compare two numbers with >, < or =.", "Say what number is 10 more and 100 more than yours."]}, "sumas3": {"es": ["Bloques de base diez, tabla de valor posicional, hoja cuadriculada", "Resuelva 47 + 38 con bloques: junten las unidades, cambien 10 unidades por 1 decena.", "Los niños resuelven sumas en columnas en papel cuadriculado (un dígito por cuadro) y usan bloques cuando necesitan reagrupar.", "Revisen con la estrategia de redondear: ¿el resultado tiene sentido?"], "en": ["Base-ten blocks, place value chart, grid paper", "Solve 47 + 38 with blocks: combine the ones and trade 10 ones for 1 ten.", "Children add in columns on grid paper (one digit per square) and use blocks when they need to regroup.", "Check with rounding: does the answer make sense?"]}, "restas3": {"es": ["Bloques de base diez, tabla de valor posicional, hoja cuadriculada", "Resuelva 52 − 27 con bloques: como no alcanzan las unidades, cambien 1 decena por 10 unidades.", "Los niños restan en columnas y comprueban cada resta sumando el resultado con el número de abajo.", "Expliquen a un compañero cuándo hay que desagrupar."], "en": ["Base-ten blocks, place value chart, grid paper", "Solve 52 − 27 with blocks: there aren't enough ones, so trade 1 ten for 10 ones.", "Children subtract in columns and check each answer by adding it to the bottom number.", "Explain to a partner when you need to regroup."]}, "reloj": {"es": ["Un reloj de manecillas grande, relojes de papel con broche (uno por niño)", "Muestre las dos manecillas: la corta marca la hora y la larga los minutos. Cuenten de 5 en 5 alrededor del reloj.", "Diga una hora y los niños la marcan en su reloj de papel; luego usted marca una hora y ellos la escriben en forma digital.", "Hagan un horario del día escolar con la hora de cada actividad."], "en": ["A large analog clock, paper clocks with a brad (one per child)", "Show the two hands: the short one shows the hour and the long one the minutes. Count by 5s around the clock.", "Say a time and children show it on their paper clock; then you show a time and they write it in digital form.", "Make a school-day schedule with the time of each activity."]}, "parimpar": {"es": ["Fichas o calcetines de papel, tarjetas con números del 1 al 40", "Formen parejas de niños: si alguien se queda sin pareja, el número de niños es impar.", "Con fichas, los niños forman parejas para números del 1 al 20 y clasifican cada número como par o impar. Busquen el patrón en el último dígito.", "Digan un número hasta 40 y el grupo responde «par» o «impar» con una seña."], "en": ["Counters or paper socks, number cards 1–40", "Make pairs of children: if someone is left without a partner, the number of children is odd.", "Children pair counters for the numbers 1–20 and label each number even or odd. Look for the pattern in the last digit.", "Say a number up to 40 and the group answers «even» or «odd» with a hand signal."]}, "graficas12": {"es": ["Papel cuadriculado, notas adhesivas, crayones", "Pregunte al grupo su fruta favorita y peguen una nota adhesiva por voto en el pizarrón.", "Conviertan los votos en una gráfica de barras con título y números. Escriban tres preguntas de suma o resta sobre la gráfica.", "Cada pareja contesta las preguntas de otra pareja."], "en": ["Grid paper, sticky notes, crayons", "Ask the group their favorite fruit and stick one note per vote on the board.", "Turn the votes into a bar graph with a title and numbers. Write three addition or subtraction questions about the graph.", "Each pair answers another pair's questions."]}, "fracciones12": {"es": ["Círculos y rectángulos de papel, tijeras, crayones", "Doble un círculo de papel por la mitad. ¿Las dos partes son iguales? Eso es un medio.", "Los niños doblan y colorean papeles en mitades, tercios, cuartos y octavos, y escriben la fracción pintada.", "Comparen: ¿qué pedazo es más grande, un medio o un cuarto?"], "en": ["Paper circles and rectangles, scissors, crayons", "Fold a paper circle in half. Are the two parts equal? That's one half.", "Children fold and color paper into halves, thirds, fourths and eighths, and write the fraction that is colored.", "Compare: which piece is bigger, one half or one fourth?"]}, "medir12": {"es": ["Reglas en centímetros (y pulgadas si se usan), lápices y objetos del salón", "Muestre cómo poner el 0 de la regla al inicio del objeto. Mida un lápiz frente al grupo.", "En parejas, estimen y luego midan cinco objetos del salón. Registren la estimación y la medida real en una tabla.", "Comenten cuál estimación fue más cercana y por qué."], "en": ["Rulers in centimeters (and inches if used), pencils and classroom objects", "Show how to put the 0 of the ruler at the start of the object. Measure a pencil in front of the group.", "In pairs, estimate and then measure five classroom objects. Record the estimate and the real length in a chart.", "Discuss which estimate was closest and why."]}, "multiplicar": {"es": ["Fichas, cartulinas con arreglos (filas y columnas), tabla de multiplicar", "Forme 3 grupos de 4 fichas. Cuenten de 4 en 4: 4, 8, 12. Escriban 3 × 4 = 12.", "Los niños hacen arreglos con fichas para multiplicaciones hasta 10 × 10 y escriben la operación de cada arreglo.", "Jueguen a las tarjetas rápidas con las tablas del 2, 5 y 10."], "en": ["Counters, array cards (rows and columns), multiplication chart", "Make 3 groups of 4 counters. Count by 4s: 4, 8, 12. Write 3 × 4 = 12.", "Children build arrays with counters for facts up to 10 × 10 and write the equation for each array.", "Play a quick flash-card game with the 2s, 5s and 10s."]}, "dividir": {"es": ["Fichas, platos de papel, tabla de multiplicar", "Reparta 12 galletas de papel entre 3 platos, una por una. ¿Cuántas tocan en cada plato?", "Los niños resuelven repartos con fichas y escriben la división y la multiplicación que la comprueba.", "Cada pareja inventa un problema de repartir para otra pareja."], "en": ["Counters, paper plates, multiplication chart", "Share 12 paper cookies among 3 plates, one at a time. How many are on each plate?", "Children solve sharing problems with counters and write the division and the multiplication that checks it.", "Each pair makes up a sharing problem for another pair."]}, "redondeo": {"es": ["Rectas numéricas de 0 a 100 y de 0 a 1 000, una pelota pequeña", "Dibuje una «montaña» en la recta entre 40 y 50: el 45 está en la cima y rueda hacia el 50.", "Los niños ubican números en la recta y deciden a qué decena o centena están más cerca. Usen el redondeo para estimar sumas.", "Comparen una suma exacta con su estimación."], "en": ["Number lines 0–100 and 0–1,000, a small ball", "Draw a «hill» on the number line between 40 and 50: 45 sits on top and rolls toward 50.", "Children place numbers on the line and decide which ten or hundred they are closer to. Use rounding to estimate sums.", "Compare an exact sum with its estimate."]}, "fracciones": {"es": ["Tiras de fracciones de papel, crayones, recta numérica del 0 al 1", "Muestre una tira entera y otra partida en cuartos. ¿Cuántos cuartos hay en un entero?", "Los niños representan fracciones con tiras, las ubican en la recta numérica y comparan fracciones con el mismo denominador.", "Expliquen por qué 1/8 es más pequeño que 1/4."], "en": ["Paper fraction strips, crayons, number line 0–1", "Show a whole strip and one cut into fourths. How many fourths make a whole?", "Children model fractions with strips, place them on the number line and compare fractions with the same denominator.", "Explain why 1/8 is smaller than 1/4."]}, "decimales": {"es": ["Cuadrículas de 10 × 10, tiras de 10 partes, monedas o billetes de juguete", "Muestre una cuadrícula de 100 cuadritos: pinten 25 y escriban 25/100 y 0,25 (o 0.25).", "Los niños representan décimos y centésimos en cuadrículas, los escriben como fracción y como decimal, y comparan decimales.", "Ordenen cinco decimales de menor a mayor en una recta numérica."], "en": ["10 × 10 grids, strips of 10 parts, play money", "Show a grid of 100 squares: color 25 and write 25/100 and 0.25 (or 0,25).", "Children show tenths and hundredths on grids, write them as fractions and decimals, and compare decimals.", "Order five decimals from least to greatest on a number line."]}, "patronesnum": {"es": ["Tabla de entrada y salida, tarjetas con reglas (+3, ×2, −5)", "Escriba 3, 7, 11, 15. Pregunte qué cambia de un número al siguiente.", "En parejas, uno elige una regla secreta y escribe cinco números; el otro descubre la regla y continúa la serie.", "Expliquen cómo comprobaron la regla con todos los números."], "en": ["Input-output table, rule cards (+3, ×2, −5)", "Write 3, 7, 11, 15. Ask what changes from one number to the next.", "In pairs, one chooses a secret rule and writes five numbers; the other finds the rule and continues the pattern.", "Explain how you checked the rule with every number."]}, "perimetro": {"es": ["Papel cuadriculado, regla, hilo o cinta", "Rodeen con hilo el borde de un libro: eso es el perímetro. Cuenten los cuadritos de adentro: eso es el área.", "Los niños dibujan rectángulos en papel cuadriculado y calculan perímetro y área de cada uno.", "Busquen dos rectángulos con el mismo perímetro y distinta área."], "en": ["Grid paper, ruler, string or tape", "Wrap string around the edge of a book: that's the perimeter. Count the squares inside: that's the area.", "Children draw rectangles on grid paper and find the perimeter and area of each one.", "Find two rectangles with the same perimeter and different areas."]}, "angulos35": {"es": ["Transportador, popotes con un broche, hojas de papel", "Muestre la esquina de una hoja: es un ángulo recto de 90°. Úsenla para comparar otros ángulos.", "Con popotes, los niños forman ángulos agudos, rectos, obtusos y llanos, y los miden con el transportador.", "Busquen ángulos en el salón y clasifíquenlos."], "en": ["Protractor, two straws joined with a brad, sheets of paper", "Show the corner of a sheet of paper: it's a right angle, 90°. Use it to compare other angles.", "With straws, children make acute, right, obtuse and straight angles and measure them with the protractor.", "Find angles around the classroom and classify them."]}, "ecuaciones": {"es": ["Balanza (o dibujo de una balanza), cubos, tarjetas con ecuaciones", "Muestre una balanza con x + 3 en un lado y 10 en el otro. ¿Qué hay que quitar para dejar sola la x?", "Los estudiantes resuelven ecuaciones de un paso haciendo la operación contraria en los dos lados, y comprueban sustituyendo.", "Cada estudiante escribe un problema real que se resuelva con una ecuación."], "en": ["A balance scale (or a drawing of one), cubes, equation cards", "Show a balance with x + 3 on one side and 10 on the other. What do we remove to leave x alone?", "Students solve one-step equations by doing the inverse operation on both sides, and check by substituting.", "Each student writes a real-life problem that can be solved with an equation."]}, "porcentajes": {"es": ["Cuadrículas de 10 × 10, anuncios de descuentos (pueden ser inventados)", "Pinten 25 de 100 cuadritos: eso es el 25 %, un cuarto.", "Los estudiantes calculan 10 %, 25 % y 50 % de distintas cantidades y resuelven problemas de descuentos.", "Comparen dos ofertas y decidan cuál conviene más."], "en": ["10 × 10 grids, sale ads (they can be made up)", "Color 25 out of 100 squares: that's 25%, one quarter.", "Students find 10%, 25% and 50% of different amounts and solve discount problems.", "Compare two sales and decide which is the better deal."]}, "expresiones": {"es": ["Tarjetas con expresiones y valores de x, pizarrones individuales", "Pregunte: si x = 4, ¿cuánto vale 3x + 2? Recuerden multiplicar antes de sumar.", "En parejas, uno saca una tarjeta de expresión y otra de valor; el otro evalúa y explica cada paso.", "Escriban una expresión para una situación real, como el costo de x boletos."], "en": ["Expression cards and x-value cards, individual whiteboards", "Ask: if x = 4, what is 3x + 2? Remember to multiply before adding.", "In pairs, one draws an expression card and a value card; the other evaluates it and explains each step.", "Write an expression for a real situation, like the cost of x tickets."]}, "dospasos": {"es": ["Tarjetas con ecuaciones de dos pasos, balanza dibujada", "Resuelva 2x + 5 = 17 frente al grupo: primero se quita el 5, luego se divide entre 2.", "Los estudiantes resuelven ecuaciones de dos pasos y comprueban cada solución sustituyendo.", "Cada pareja crea un problema escrito que lleve a una ecuación de dos pasos."], "en": ["Two-step equation cards, drawn balance scale", "Solve 2x + 5 = 17 in front of the group: first remove the 5, then divide by 2.", "Students solve two-step equations and check each solution by substituting.", "Each pair writes a word problem that leads to a two-step equation."]}, "razones": {"es": ["Fichas de dos colores, tablas de razones, recetas sencillas", "Muestre 2 fichas rojas por cada 3 azules. Escriban la razón 2 : 3.", "Los estudiantes completan tablas de razones equivalentes y calculan valores unitarios en problemas de velocidad y recetas.", "Duplicar o triplicar una receta: ¿cuánto se necesita de cada ingrediente?"], "en": ["Counters in two colors, ratio tables, simple recipes", "Show 2 red counters for every 3 blue ones. Write the ratio 2 : 3.", "Students complete tables of equivalent ratios and find unit rates in speed and recipe problems.", "Double or triple a recipe: how much of each ingredient do you need?"]}, "enteros": {"es": ["Recta numérica de −20 a 20 en el piso o en papel, termómetro dibujado", "Pregunte: si hace −3 °C y sube 5 grados, ¿qué temperatura hace? Muévanse en la recta del piso.", "Los estudiantes ordenan enteros, los comparan y suman enteros moviéndose en la recta numérica.", "Busquen ejemplos reales de números negativos: temperaturas, pisos, deudas."], "en": ["Number line from −20 to 20 on the floor or on paper, drawn thermometer", "Ask: if it's −3 °C and the temperature rises 5 degrees, what is the temperature? Move along the floor number line.", "Students order integers, compare them and add integers by moving on the number line.", "Find real examples of negative numbers: temperatures, floors, debts."]}, "estadistica": {"es": ["Tarjetas con datos (estaturas, puntajes), calculadora opcional", "Recolecten un dato del grupo, por ejemplo cuántos hermanos tienen.", "Los estudiantes ordenan los datos y calculan media, mediana, moda y rango. Comparen qué medida describe mejor al grupo.", "Expliquen qué pasa con la media si se agrega un dato muy grande."], "en": ["Data cards (heights, scores), optional calculator", "Collect one piece of data from the group, for example how many siblings they have.", "Students order the data and find the mean, median, mode and range. Discuss which measure best describes the group.", "Explain what happens to the mean when a very large value is added."]}, "probabilidad": {"es": ["Bolsa con canicas o fichas de colores, dados, tabla de resultados", "Muestre la bolsa con 3 rojas y 5 azules. ¿Qué es más probable sacar?", "Los estudiantes calculan probabilidades teóricas, hacen 20 extracciones y comparan con lo que pasó en realidad.", "Comenten por qué el resultado del experimento no siempre es igual al teórico."], "en": ["Bag with colored marbles or counters, dice, results chart", "Show the bag with 3 red and 5 blue. Which color are you more likely to pick?", "Students find theoretical probabilities, do 20 draws and compare with what actually happened.", "Discuss why the experiment doesn't always match the theoretical result."]}, "funciones": {"es": ["Papel cuadriculado, tablas de x y y, regla", "Muestre la tabla x: 0, 1, 2 → y: 3, 5, 7. ¿Cuánto sube y cada vez que x aumenta 1?", "Los estudiantes encuentran la pendiente y el valor inicial de varias tablas, escriben y = mx + b y grafican la recta.", "Relacionen una función con una situación: costo de entrada más costo por hora."], "en": ["Grid paper, x and y tables, ruler", "Show the table x: 0, 1, 2 → y: 3, 5, 7. How much does y go up each time x increases by 1?", "Students find the slope and starting value of several tables, write y = mx + b and graph the line.", "Connect a function to a situation: an entry fee plus a cost per hour."]}, "triangulos": {"es": ["Triángulos de papel, tijeras, transportador", "Cada estudiante corta las tres esquinas de un triángulo y las junta: forman una línea recta de 180°.", "Los estudiantes calculan ángulos que faltan en triángulos y escriben la ecuación de cada uno.", "Expliquen por qué un triángulo no puede tener dos ángulos rectos."], "en": ["Paper triangles, scissors, protractor", "Each student tears off the three corners of a triangle and puts them together: they form a straight line, 180°.", "Students find missing angles in triangles and write the equation for each one.", "Explain why a triangle can't have two right angles."]}, "areas68": {"es": ["Papel cuadriculado, regla, objetos circulares, hilo", "Corten un rectángulo por la diagonal: cada triángulo es la mitad. Por eso el área es base × altura ÷ 2.", "Los estudiantes miden objetos circulares con hilo, calculan circunferencia y área con π ≈ 3,14 y resuelven problemas.", "Comparen la circunferencia medida con hilo y la calculada."], "en": ["Grid paper, ruler, round objects, string", "Cut a rectangle along its diagonal: each triangle is half. That's why the area is base × height ÷ 2.", "Students measure round objects with string, find circumference and area with π ≈ 3.14, and solve problems.", "Compare the circumference measured with string and the calculated one."]}, "pitagoras": {"es": ["Papel cuadriculado, regla, tijeras", "Dibujen un triángulo rectángulo de 3 y 4 cuadritos. Midan la hipotenusa: mide 5.", "Los estudiantes construyen cuadrados sobre cada lado y comprueban que a² + b² = c². Luego resuelven problemas de distancias.", "Usen el teorema para saber si una escalera alcanza una ventana."], "en": ["Grid paper, ruler, scissors", "Draw a right triangle with legs of 3 and 4 squares. Measure the hypotenuse: it's 5.", "Students build squares on each side and check that a² + b² = c². Then they solve distance problems.", "Use the theorem to decide whether a ladder reaches a window."]}, "vocales": {"es": ["Tarjetas grandes de las vocales, imágenes que empiecen con cada vocal, plastilina", "Canten la canción de las vocales y hagan un gesto para cada una.", "Los niños clasifican imágenes según la vocal inicial y forman cada vocal con plastilina.", "Cada niño dice una palabra que empiece con su vocal favorita."], "en": ["Large Spanish vowel cards, pictures that start with each vowel, play dough", "Sing a vowel song and make a motion for each vowel.", "Children sort pictures by their first vowel and shape each vowel with play dough.", "Each child says a word that starts with their favorite vowel."]}, "lalo": {"es": ["El cuento en grande o proyectado, títeres o dibujos de los personajes", "Muestren la portada: ¿de qué creen que trata el cuento?", "Lea el cuento en voz alta dos veces. Hagan preguntas de quién, dónde y qué pasó, y dramaticen las partes.", "Cada niño dibuja su parte favorita y la cuenta."], "en": ["The story in large print or projected, puppets or character drawings", "Show the cover: what do you think the story is about?", "Read the story aloud twice. Ask who, where and what happened, and act out parts of it.", "Each child draws their favorite part and tells about it."]}, "escuchapk": {"es": ["Imágenes de las palabras de la lección, tarjetas de respuesta", "Juegue «Simón dice» para practicar escuchar con atención.", "Diga palabras y oraciones; los niños tocan o levantan la imagen correcta.", "Un niño hace de maestro y dice palabras para el grupo."], "en": ["Pictures of the lesson's words, answer cards", "Play «Simon says» to practice careful listening.", "Say words and sentences; children touch or hold up the matching picture.", "One child plays teacher and says words for the group."]}, "hablapk": {"es": ["Imágenes de la vida diaria, un micrófono de juguete", "Modele una oración completa: «Me gusta jugar con mi pelota».", "Los niños repiten frases cortas y luego describen una imagen con una oración completa.", "Ronda de «¿Qué te gusta?» con el micrófono de juguete."], "en": ["Everyday pictures, a toy microphone", "Model a complete sentence: «I like to play with my ball».", "Children repeat short phrases and then describe a picture with a complete sentence.", "Do a «What do you like?» round with the toy microphone."]}, "escribepk": {"es": ["Letras móviles o tarjetas de sílabas, pizarrones pequeños", "Aplaudan las sílabas de pato: pa-to.", "Los niños forman palabras con letras móviles y las copian en su pizarrón.", "Lean juntos las palabras que formaron."], "en": ["Movable letters or syllable cards, small whiteboards", "Clap the syllables of pato: pa-to.", "Children build words with movable letters and copy them on their whiteboards.", "Read together the words they built."]}, "comparapk": {"es": ["Imágenes de un gato y un perro, diagrama de Venn grande", "Pregunte: ¿en qué se parecen un gato y un perro?", "Completen juntos un diagrama de Venn con dibujos y palabras.", "Cada niño dice una cosa igual y una diferente."], "en": ["Pictures of a cat and a dog, large Venn diagram", "Ask: how are a cat and a dog alike?", "Complete a Venn diagram together with drawings and words.", "Each child names one thing that is the same and one that is different."]}, "rimaspk": {"es": ["Tarjetas con pares de imágenes que riman, una canción o poema con rimas", "Lean un poema corto y aplaudan cuando escuchen palabras que suenan igual al final.", "Juego de memoria con pares que riman: gato y pato, luna y cuna.", "Cada niño busca una palabra que rime con su nombre o con sol."], "en": ["Cards with pairs of rhyming pictures, a song or poem with rhymes", "Read a short poem and clap when you hear words that sound the same at the end.", "Play a memory game with rhyming pairs: cat and hat, moon and spoon.", "Each child finds a word that rhymes with sun or with their own name."]}, "oraciones": {"es": ["Tiras de oraciones, tarjetas de palabras, imágenes", "Lea una oración señalando cada palabra. ¿Cuántas palabras tiene?", "En parejas, los niños leen oraciones cortas y las unen con su imagen; luego arman oraciones con tarjetas.", "Lectura en coro de las oraciones armadas."], "en": ["Sentence strips, word cards, pictures", "Read a sentence, pointing to each word. How many words does it have?", "In pairs, children read short sentences and match them to a picture; then they build sentences with word cards.", "Read the sentences they built aloud together."]}, "articulos": {"es": ["Tarjetas de sustantivos con imágenes, tarjetas de el, la, los, las", "Muestre una imagen de un gato y otra de unas flores. ¿Decimos el gato o la gato?", "Los niños clasifican sustantivos en cuatro columnas: el, la, los, las.", "Busquen en el salón tres objetos y digan su artículo."], "en": ["Noun cards with pictures, cards with el, la, los, las", "Show a picture of a cat and one of some flowers. Do we say el gato or la gato?", "Children sort nouns into four columns: el, la, los, las.", "Find three objects in the classroom and say their article."]}, "dias": {"es": ["Calendario grande, tarjetas con los días de la semana", "Canten los días de la semana y señalen hoy en el calendario.", "Los niños ordenan las tarjetas de los días y contestan qué día viene antes o después.", "Cada niño dice qué hace los sábados."], "en": ["Large calendar, days-of-the-week cards", "Sing the days of the week and point to today on the calendar.", "Children put the day cards in order and answer which day comes before or after.", "Each child says what they do on Saturdays."]}, "sofia": {"es": ["El cuento impreso, organizador de inicio, desarrollo y final", "Lean el título y hagan una predicción.", "Lectura en parejas. Completen el organizador con lo que pasó al inicio, en medio y al final.", "Comenten cómo se sintió el personaje y por qué."], "en": ["The printed story, beginning-middle-end organizer", "Read the title and make a prediction.", "Partner reading. Complete the organizer with what happened at the beginning, middle and end.", "Discuss how the character felt and why."]}, "escucha12": {"es": ["El cuento para leer en voz alta (en esta guía), imágenes", "Pida a los niños que escuchen con atención porque habrá preguntas.", "Lea el texto dos veces. Los niños contestan las preguntas de la hoja levantando la mano o encerrando la respuesta.", "Vuelvan a contar el cuento entre todos."], "en": ["The story to read aloud (in this guide), pictures", "Ask children to listen carefully because there will be questions.", "Read the text twice. Children answer the worksheet questions by raising hands or circling answers.", "Retell the story as a group."]}, "habla12": {"es": ["Tarjetas con las frases de la lección, imágenes", "Modele una presentación corta: nombre, edad, comida favorita.", "En parejas, los niños practican las frases y se presentan uno al otro.", "Algunos voluntarios se presentan al grupo."], "en": ["Cards with the lesson's phrases, pictures", "Model a short introduction: name, age, favorite food.", "In pairs, children practice the phrases and introduce themselves to each other.", "A few volunteers introduce themselves to the group."]}, "escribe12": {"es": ["Tiras de oraciones desordenadas, cuaderno", "Recuerde: la oración empieza con mayúscula y termina con punto.", "Los niños ordenan palabras para formar oraciones y luego escriben una oración propia sobre su animal favorito.", "Revisen en parejas: ¿mayúscula al inicio y punto al final?"], "en": ["Scrambled sentence strips, notebook", "Remind them: a sentence starts with a capital letter and ends with a period.", "Children put words in order to make sentences and then write their own sentence about their favorite animal.", "Check in pairs: capital letter at the start and period at the end?"]}, "textos12": {"es": ["Organizador «Primero, Después, Al final», lápices de colores, lista de revisión", "Cuente algo que hizo usted el fin de semana usando primero, después y al final.", "Los niños corrigen oraciones con errores (mayúscula, punto, ¿?, ¡!) y luego escriben su propio texto de tres oraciones con el organizador.", "Usan la lista de revisión: mayúsculas, puntos, palabras de secuencia. Leen su texto a un compañero."], "en": ["«First, Next, Finally» organizer, colored pencils, editing checklist", "Tell about something you did last weekend using first, next and finally.", "Children fix sentences with mistakes (capital letters, periods, ¿?, ¡!) and then write their own three-sentence text with the organizer.", "They use the checklist: capitals, periods, sequence words. They read their text to a partner."]}, "compara12": {"es": ["Los dos textos de la lección, diagrama de Venn", "Pregunte cómo es el parque más cercano a la escuela.", "Lean los dos textos y completen el diagrama de Venn con las semejanzas y diferencias.", "Cada niño escribe una oración: «Los dos parques…»."], "en": ["The lesson's two texts, Venn diagram", "Ask what the park closest to school is like.", "Read the two texts and complete the Venn diagram with similarities and differences.", "Each child writes one sentence: «Both parks…»."]}, "huerto": {"es": ["El cuento impreso, marcatextos, organizador de preguntas (quién, dónde, cuándo, qué, por qué)", "Pregunte quién ha sembrado algo alguna vez.", "Lean el cuento dos veces y subrayen con colores las respuestas a quién, dónde, qué y por qué.", "Resuman el cuento en dos oraciones."], "en": ["The printed story, highlighters, question organizer (who, where, when, what, why)", "Ask who has ever planted something.", "Read the story twice and highlight the answers to who, where, what and why in different colors.", "Summarize the story in two sentences."]}, "adjetivos": {"es": ["Objetos o imágenes variados, tarjetas de adjetivos", "Muestre una pelota y pida palabras que la describan: roja, grande, redonda.", "Los niños describen objetos con adjetivos y cuidan que concuerden: el perro negro, las casas blancas.", "Juego de adivinanzas: describir un objeto sin decir su nombre."], "en": ["Assorted objects or pictures, adjective cards", "Show a ball and ask for words that describe it: red, big, round.", "Children describe objects with adjectives and make them agree: el perro negro, las casas blancas.", "Guessing game: describe an object without saying its name."]}, "verbosar": {"es": ["Tabla de conjugación de hablar, tarjetas de verbos -ar, dado de pronombres", "Conjuguen hablar en voz alta con movimientos: yo hablo (señalarse), tú hablas (señalar a otro).", "En parejas, lanzan el dado de pronombres, sacan un verbo -ar y dicen o escriben la forma correcta.", "Escriban tres oraciones sobre lo que hacen en la escuela."], "en": ["Conjugation chart for hablar, -ar verb cards, a pronoun die", "Conjugate hablar aloud with motions: yo hablo (point to yourself), tú hablas (point to someone else).", "In pairs, roll the pronoun die, draw an -ar verb and say or write the correct form.", "Write three sentences about what they do at school."]}, "presente": {"es": ["Tablas de comer y vivir, tarjetas de verbos -er e -ir", "Compare comemos y vivimos: ¿qué cambia?", "Los niños completan oraciones con verbos -er e -ir y explican la terminación que usaron.", "Cada niño dice una oración sobre su familia con un verbo -er o -ir."], "en": ["Charts for comer and vivir, -er and -ir verb cards", "Compare comemos and vivimos: what changes?", "Children complete sentences with -er and -ir verbs and explain the ending they used.", "Each child says a sentence about their family with an -er or -ir verb."]}, "preterito": {"es": ["Tabla del pretérito, línea del tiempo de «ayer»", "Pregunte qué hicieron ayer y escriba las respuestas: comí, jugué, estudié.", "Los niños completan oraciones en pretérito y marcan los acentos de yo y él/ella.", "Escriben tres oraciones sobre su fin de semana."], "en": ["Preterite chart, «yesterday» timeline", "Ask what they did yesterday and write the answers: comí, jugué, estudié.", "Children complete sentences in the preterite and mark the accents on yo and él/ella forms.", "Write three sentences about their weekend."]}, "sinonimos": {"es": ["Tarjetas de palabras para emparejar, diccionario escolar", "Pregunte otra forma de decir feliz. Luego pregunte lo contrario de alto.", "Juego de memoria: los niños emparejan sinónimos y antónimos y escriben oraciones con ellos.", "Reescriban una oración cambiando una palabra por un sinónimo."], "en": ["Word cards for matching, student dictionary", "Ask for another way to say happy. Then ask for the opposite of tall.", "Memory game: children match synonyms and antonyms and write sentences with them.", "Rewrite a sentence, replacing one word with a synonym."]}, "murcielagos": {"es": ["El texto impreso, mapa de Texas, organizador de idea principal y detalles", "Pregunte qué saben de los murciélagos y anoten ideas.", "Lean el texto y completen el organizador con la idea principal y tres detalles.", "Comparen lo que sabían antes con lo que aprendieron."], "en": ["The printed text, map of Texas, main idea and details organizer", "Ask what they know about bats and write down their ideas.", "Read the text and complete the organizer with the main idea and three details.", "Compare what they knew before with what they learned."]}, "escucha35": {"es": ["El audio de la lección leído por el maestro (en esta guía)", "Explique que van a escuchar un mensaje y deben tomar notas.", "Lea el mensaje dos veces; los niños anotan quién, cuándo y para qué, y contestan las preguntas.", "Comparen sus notas con un compañero."], "en": ["The lesson's audio message read by the teacher (in this guide)", "Explain that they will hear a message and must take notes.", "Read the message twice; children note who, when and why, and answer the questions.", "Compare notes with a partner."]}, "habla35": {"es": ["Imágenes con escenas detalladas", "Modele una descripción usando adjetivos y lugar: arriba, al lado de.", "En parejas, uno describe una imagen y el otro la dibuja sin verla.", "Comparen el dibujo con la imagen original."], "en": ["Detailed scene pictures", "Model a description using adjectives and position words: above, next to.", "In pairs, one describes a picture and the other draws it without seeing it.", "Compare the drawing with the original picture."]}, "escribe35": {"es": ["Organizador de párrafo, lista de verbos", "Lean un párrafo modelo y subrayen los verbos.", "Los niños escriben un párrafo de tres oraciones sobre su comida favorita usando verbos en presente.", "Revisen mayúsculas, puntos y concordancia."], "en": ["Paragraph organizer, verb list", "Read a model paragraph and underline the verbs.", "Children write a three-sentence paragraph about their favorite food using present-tense verbs.", "Check capitals, periods and agreement."]}, "compara35": {"es": ["Los dos textos de la lección, diagrama de Venn o tabla", "Muestren imágenes del correcaminos y del armadillo.", "Lean los dos textos y completen una tabla de semejanzas y diferencias.", "Escriban un párrafo corto que compare a los dos animales."], "en": ["The lesson's two texts, Venn diagram or chart", "Show pictures of the roadrunner and the armadillo.", "Read the two texts and complete a chart of similarities and differences.", "Write a short paragraph comparing the two animals."]}, "monarca": {"es": ["El texto impreso, mapa de América del Norte, organizador de idea principal", "Muestren en el mapa la ruta de la mariposa monarca.", "Lean el texto, identifiquen la idea principal, los detalles y una inferencia.", "Escriban un resumen de cuatro oraciones."], "en": ["The printed text, map of North America, main idea organizer", "Show the monarch butterfly's route on the map.", "Read the text and identify the main idea, details and one inference.", "Write a four-sentence summary."]}, "cacao": {"es": ["El texto impreso, línea del tiempo, organizador de causa y efecto", "Pregunte de dónde creen que viene el chocolate.", "Lean el texto y completen la línea del tiempo (olmecas, mayas, aztecas) y la tabla de causa y efecto.", "Comenten por qué el cacao servía como dinero."], "en": ["The printed text, timeline, cause-and-effect organizer", "Ask where they think chocolate comes from.", "Read the text and complete the timeline (Olmecs, Maya, Aztecs) and the cause-and-effect chart.", "Discuss why cacao was used as money."]}, "serestar": {"es": ["Tabla de ser y estar, tarjetas de oraciones", "Compare: «Soy alta» y «Estoy cansada». ¿Cuál cambia y cuál no?", "Los estudiantes clasifican oraciones según el uso (origen, profesión, lugar, estado) y completan con ser o estar.", "Escriban dos oraciones sobre sí mismos con ser y dos con estar."], "en": ["Ser and estar chart, sentence cards", "Compare «Soy alta» and «Estoy cansada». Which one changes and which doesn't?", "Students sort sentences by use (origin, profession, location, condition) and fill in ser or estar.", "Write two sentences about themselves with ser and two with estar."]}, "acentos": {"es": ["Lista de palabras, colores para marcar la sílaba tónica", "Pronuncien canción, árbol y música aplaudiendo la sílaba más fuerte.", "Los estudiantes separan palabras en sílabas, marcan la sílaba tónica, las clasifican y deciden si llevan tilde.", "Corrijan un párrafo corto con palabras sin tilde."], "en": ["Word list, colors to mark the stressed syllable", "Say canción, árbol and música, clapping on the strongest syllable.", "Students split words into syllables, mark the stressed syllable, classify the words and decide whether they need an accent mark.", "Correct a short paragraph with missing accent marks."]}, "figurado": {"es": ["Tarjetas con frases de canciones, cuentos o dichos populares (escritas por el maestro)", "Diga «Llueve a cántaros» y pregunte qué significa de verdad.", "Los estudiantes clasifican frases en símil, metáfora, personificación e hipérbole, y explican su significado.", "Cada estudiante escribe un ejemplo propio de cada figura."], "en": ["Cards with lines from songs, stories or popular sayings (written by the teacher)", "Say «It's raining cats and dogs» and ask what it really means.", "Students sort phrases into simile, metaphor, personification and hyperbole, and explain their meaning.", "Each student writes their own example of each figure."]}, "escucha68": {"es": ["El anuncio de la lección leído por el maestro (en esta guía)", "Pida que preparen una hoja para tomar notas.", "Lea el anuncio dos veces; los estudiantes anotan datos clave (qué, cuándo, dónde) y contestan las preguntas.", "Comparen notas y discutan qué detalle era más importante."], "en": ["The lesson's announcement read by the teacher (in this guide)", "Have them get a sheet ready for note-taking.", "Read the announcement twice; students note key facts (what, when, where) and answer the questions.", "Compare notes and discuss which detail was most important."]}, "habla68": {"es": ["Preguntas de opinión, frases para dar opinión", "Modele: «Yo pienso que… porque…».", "En parejas, los estudiantes dan su opinión sobre un tema escolar con razones y responden con respeto a su compañero.", "Algunos voluntarios comparten su opinión con el grupo."], "en": ["Opinion questions, opinion sentence starters", "Model: «I think that… because…».", "In pairs, students give their opinion on a school topic with reasons and respond respectfully to their partner.", "A few volunteers share their opinion with the group."]}, "escribe68": {"es": ["Organizador de narración en pasado, lista de conectores", "Lean un párrafo modelo en pasado y marquen los conectores.", "Los estudiantes escriben un párrafo de cuatro oraciones sobre un viaje o paseo, en pretérito y con conectores.", "Revisión entre pares con la lista: verbos en pasado, acentos, conectores."], "en": ["Past-tense narrative organizer, list of connectors", "Read a model paragraph in the past and mark the connectors.", "Students write a four-sentence paragraph about a trip or outing, in the preterite and with connectors.", "Peer review with the checklist: past-tense verbs, accent marks, connectors."]}, "compara68": {"es": ["Los dos textos de la lección, tabla de comparación", "Pregunte qué celebraciones conocen a finales de octubre y principios de noviembre.", "Lean los dos textos y completen la tabla: fecha, origen, costumbres, significado.", "Escriban un párrafo que compare las dos celebraciones con respeto."], "en": ["The lesson's two texts, comparison chart", "Ask what celebrations they know at the end of October and beginning of November.", "Read the two texts and complete the chart: date, origin, customs, meaning.", "Write a paragraph that respectfully compares the two celebrations."]}, "paisajepk": {"es": ["Imágenes de montañas, ríos y mares, plastilina o arena, papel azul", "Muestre las imágenes: ¿dónde hay agua? ¿dónde es alto?", "Los niños modelan una montaña con plastilina y un río y un mar con papel azul.", "Cada niño dice qué paisaje le gustaría visitar."], "en": ["Pictures of mountains, rivers and seas, play dough or sand, blue paper", "Show the pictures: where is there water? where is it high?", "Children model a mountain with play dough and a river and sea with blue paper.", "Each child says which landscape they would like to visit."]}, "cardinales": {"es": ["Brújula, letreros N, S, E, O, plano sencillo del salón", "Pongan los letreros en las paredes del salón usando la brújula. Recuerden que el sol sale por el este.", "Los niños siguen instrucciones («camina dos pasos al norte») y ubican objetos en el plano del salón.", "Cada niño describe dónde está su mesa usando los puntos cardinales."], "en": ["Compass, N, S, E, W signs, simple map of the classroom", "Put the signs on the classroom walls using the compass. Remember that the sun rises in the east.", "Children follow directions («walk two steps north») and locate objects on the classroom map.", "Each child describes where their desk is using the cardinal directions."]}, "continentes": {"es": ["Mapamundi o globo terráqueo, mapa en blanco para colorear", "Señalen en el globo dónde vivimos. ¿En qué continente está?", "Los niños colorean y nombran los continentes y los océanos en el mapa en blanco.", "Juego rápido: el maestro dice un continente y el grupo lo señala en el globo."], "en": ["World map or globe, blank map to color", "Point on the globe to where we live. Which continent is it on?", "Children color and label the continents and oceans on the blank map.", "Quick game: the teacher says a continent and the group points to it on the globe."]}, "latlong": {"es": ["Mapamundi con cuadrícula, globo terráqueo", "Señalen el ecuador y el meridiano de Greenwich en el globo.", "Los estudiantes localizan ciudades con coordenadas y dicen en qué hemisferio están.", "Cada estudiante da las coordenadas aproximadas de su ciudad."], "en": ["World map with a grid, globe", "Point out the equator and the Prime Meridian on the globe.", "Students locate cities by their coordinates and say which hemisphere they are in.", "Each student gives the approximate coordinates of their city."]}, "paises": {"es": ["Mapa de América y de España, banderas impresas o dibujadas", "Pregunte en qué países se habla español y ubíquenlos en el mapa.", "Los niños emparejan país, capital y bandera, y colorean los países hispanohablantes en el mapa.", "Cada niño presenta un dato de un país."], "en": ["Map of the Americas and Spain, printed or drawn flags", "Ask in which countries Spanish is spoken and find them on the map.", "Children match country, capital and flag, and color the Spanish-speaking countries on the map.", "Each child presents one fact about a country."]}, "fiestapk": {"es": ["Una piñata pequeña o foto de una piñata, bolsitas de papel, crayones, la lectura impresa", "Pregunte cómo celebran los cumpleaños en su casa. Escuche a varios niños sin juzgar ninguna costumbre.", "Lea la lectura dos veces y muestre la piñata. Los niños dibujan algo de una fiesta en México y algo de una fiesta en su casa.", "Cada niño muestra su dibujo y dice una cosa que se parece y una que es diferente."], "en": ["A small piñata or a photo of one, paper bags, crayons, the printed reading", "Ask how they celebrate birthdays at home. Listen to several children without judging any custom.", "Read the text twice and show the piñata. Children draw something from a party in Mexico and something from a party at their home.", "Each child shows the drawing and says one thing that is alike and one that is different."]}, "flotapk": {"es": ["Una tina con agua, toallas, objetos para probar (corcho, piedra, hoja, cuchara, crayón, esponja, moneda), tabla «flota / se hunde»", "Muestre una piedra y una hoja. Pregunte cuál creen que flota y por qué.", "Antes de meter cada objeto, el grupo predice con el pulgar arriba (flota) o abajo (se hunde). Lo prueban y pegan una foto o dibujo en la columna correcta.", "Comparen las predicciones con lo que pasó: ¿qué nos sorprendió?"], "en": ["A tub of water, towels, objects to test (cork, rock, leaf, spoon, crayon, sponge, coin), a «floats / sinks» chart", "Show a rock and a leaf. Ask which one they think will float and why.", "Before dropping each object, the group predicts with thumbs up (floats) or down (sinks). They test it and put a picture or drawing in the right column.", "Compare the predictions with what happened: what surprised us?"]}, "sentidos": {"es": ["Bolsa misteriosa con objetos de texturas distintas, frascos con olores (canela, limón, café), un instrumento sencillo, fruta en trocitos (revise alergias antes)", "Señale ojos, orejas, nariz, lengua y manos mientras cantan una canción de los sentidos.", "Monte cinco estaciones, una por sentido. En grupos pequeños, los niños adivinan lo que tocan, huelen, oyen, ven y prueban, y dicen qué parte del cuerpo usaron.", "Cada niño dice cuál fue su estación favorita y qué sentido usó."], "en": ["A mystery bag with objects of different textures, jars with smells (cinnamon, lemon, coffee), a simple instrument, small pieces of fruit (check allergies first)", "Point to eyes, ears, nose, tongue and hands while singing a song about the senses.", "Set up five stations, one per sense. In small groups, children guess what they touch, smell, hear, see and taste, and say which body part they used.", "Each child says which station was their favorite and which sense they used."]}, "papel12": {"es": ["Papel de china o servilletas de colores, tijeras de punta redonda, hilo, cinta, la lectura impresa", "Muestre un papel picado (real o en foto). Pregunten dónde lo han visto.", "Lean la lectura y busquen de dónde viene, cómo se hace y cuándo se usa. Después, cada niño dobla su papel y corta figuras sencillas. Cuelguen todos en un hilo.", "Cada niño escribe una oración sobre el papel picado y la lee al grupo."], "en": ["Tissue paper or colored napkins, safety scissors, string, tape, the printed reading", "Show papel picado (real or in a photo). Ask where they have seen it.", "Read the text and find where it comes from, how it is made and when it is used. Then each child folds their paper and cuts simple shapes. Hang them all on a string.", "Each child writes one sentence about papel picado and reads it to the group."]}, "aguaestados": {"es": ["Cubitos de hielo, vasos transparentes, agua tibia, una tetera o foto de vapor (solo el maestro usa calor), tabla de tres columnas", "Muestre un cubito de hielo y un vaso de agua. ¿En qué se parecen? ¿En qué son diferentes?", "Dejen hielo en un vaso al sol y otro a la sombra, y revisen cada 10 minutos. Clasifiquen fotos o dibujos en sólido, líquido y gas, y digan qué causa cada cambio.", "Completen la oración: «Con calor, el hielo se…; con más calor, el agua se…»."], "en": ["Ice cubes, clear cups, warm water, a kettle or a photo of steam (only the teacher uses heat), a three-column chart", "Show an ice cube and a cup of water. How are they alike? How are they different?", "Leave ice in one cup in the sun and one in the shade, and check every 10 minutes. Sort photos or drawings into solid, liquid and gas, and say what causes each change.", "Finish the sentence: «With heat, ice…; with more heat, water…»."]}, "plantas": {"es": ["Semillas de frijol, vasos, algodón o tierra, agua, una caja para tapar luz, diario de observación", "Pregunte: ¿qué necesitamos nosotros para vivir? ¿Y una planta?", "Siembren frijoles en cuatro vasos: uno con todo, uno sin agua, uno sin luz y uno sin tierra (con algodón seco). Los niños dibujan y miden cada vaso durante dos semanas.", "Comparen los vasos y señalen la raíz, el tallo y las hojas. ¿Qué le faltó a cada planta?"], "en": ["Bean seeds, cups, cotton or soil, water, a box to block light, an observation journal", "Ask: what do we need to live? And a plant?", "Plant beans in four cups: one with everything, one without water, one without light and one without soil (dry cotton). Children draw and measure each cup for two weeks.", "Compare the cups and point to the root, stem and leaves. What was each plant missing?"]}, "ciclodelagua": {"es": ["Bolsa de plástico con cierre, agua con colorante azul, cinta, marcador, una ventana con sol", "Pregunte: ¿de dónde viene la lluvia? Anote las ideas del grupo.", "Cada pareja dibuja el sol, nubes y mar en la bolsa, pone un poco de agua y la pega en la ventana. Durante varios días observan gotas arriba (condensación) y agua que baja (precipitación). Rotulan las cuatro etapas.", "Cada estudiante explica el ciclo con sus palabras usando evaporación, condensación, precipitación y acumulación."], "en": ["A zip-top plastic bag, water with blue food coloring, tape, a marker, a sunny window", "Ask: where does rain come from? Write down the group's ideas.", "Each pair draws the sun, clouds and ocean on the bag, adds a little water and tapes it to the window. Over several days they watch drops form at the top (condensation) and water run down (precipitation). They label the four stages.", "Each student explains the cycle in their own words using evaporation, condensation, precipitation and collection."]}, "mariposa": {"es": ["Tarjetas con las cuatro etapas, platos de papel, pasta de distintas formas, pegamento", "Muestre una foto de una oruga y otra de una mariposa. ¿Creen que son el mismo animal?", "Los estudiantes ordenan las tarjetas y hacen un ciclo de vida en un plato dividido en cuatro: huevo, oruga, crisálida y mariposa, usando pasta para cada etapa. Escriben qué pasa en cada una.", "Explique la palabra metamorfosis y compárenla con cómo crece una persona."], "en": ["Cards with the four stages, paper plates, pasta in different shapes, glue", "Show a photo of a caterpillar and one of a butterfly. Do they think it is the same animal?", "Students order the cards and make a life cycle on a plate divided into four: egg, caterpillar, chrysalis and butterfly, using pasta for each stage. They write what happens in each one.", "Explain the word metamorphosis and compare it with how a person grows."]}, "ecosistemas": {"es": ["Tarjetas de seres vivos de un ecosistema local (pasto, saltamontes, rana, culebra, halcón), estambre, cinta", "Pregunte: ¿de dónde sacan su energía las plantas? ¿Y los animales?", "Cada estudiante recibe una tarjeta. Con estambre, el grupo arma cadenas alimentarias empezando por el productor y luego une varias cadenas en una red. Clasifiquen herbívoros, carnívoros y omnívoros.", "Quiten una tarjeta: ¿qué pasa con los demás seres vivos de la red?"], "en": ["Cards with living things from a local ecosystem (grass, grasshopper, frog, snake, hawk), yarn, tape", "Ask: where do plants get their energy? And animals?", "Each student gets a card. With yarn, the group builds food chains starting with the producer, then joins several chains into a web. Sort herbivores, carnivores and omnivores.", "Remove one card: what happens to the other living things in the web?"]}, "tierrasol": {"es": ["Linterna, globo terráqueo o pelota, una pelota pequeña para la Luna, cuarto con poca luz", "Pregunte: ¿por qué hay día y noche?", "La linterna es el Sol. Un estudiante gira el globo para mostrar la rotación (día y noche) y camina alrededor de la linterna para mostrar la traslación (un año). Otro mueve la Luna alrededor de la Tierra.", "Cada estudiante completa: «La rotación dura…, la traslación dura…»."], "en": ["A flashlight, a globe or ball, a small ball for the Moon, a dim room", "Ask: why do we have day and night?", "The flashlight is the Sun. One student spins the globe to show rotation (day and night) and walks around the flashlight to show revolution (one year). Another moves the Moon around the Earth.", "Each student completes: «Rotation takes…, revolution takes…»."]}, "tradiciones": {"es": ["La lectura impresa, fotos de ofrendas, flores de cempasúchil (reales o de papel), organizador de vocabulario", "Pregunte qué tradiciones tienen para recordar a personas queridas. Aclare que se va a aprender sobre la costumbre, y que nadie tiene que participar en algo que no sea de su familia.", "Lean el texto y completen el organizador: fecha, objetos de la ofrenda y lo que significa cada uno. En grupos, hagan flores de cempasúchil de papel o una ofrenda de clase para un personaje histórico.", "Cada estudiante escribe dos oraciones sobre por qué no es una fiesta triste."], "en": ["The printed reading, photos of ofrendas, marigold flowers (real or paper), a vocabulary organizer", "Ask what traditions they have to remember loved ones. Make clear that the class is learning about the custom, and no one has to take part in something that is not from their family.", "Read the text and complete the organizer: date, objects on the ofrenda and what each one means. In groups, make paper marigolds or a class ofrenda for a historical figure.", "Each student writes two sentences about why it is not a sad celebration."]}, "fuerzas": {"es": ["Carritos de juguete, rampa (tabla o libro), superficies distintas (alfombra, papel de lija, mesa lisa), regla o cinta métrica", "Empuje y jale un objeto. Pregunte qué hizo que se moviera y qué hace que se detenga.", "En parejas, sueltan el carrito por la rampa sobre cada superficie y miden la distancia tres veces. Registran los datos y explican el resultado con la palabra fricción.", "Relacionen el experimento con la primera ley de Newton: ¿por qué al final se detiene el carrito?"], "en": ["Toy cars, a ramp (a board or book), different surfaces (carpet, sandpaper, smooth table), a ruler or measuring tape", "Push and pull an object. Ask what made it move and what makes it stop.", "In pairs, students roll the car down the ramp onto each surface and measure the distance three times. They record the data and explain the result using the word friction.", "Connect the experiment to Newton's first law: why does the car stop at the end?"]}, "celula": {"es": ["Bolsas con cierre, gel transparente o gelatina sin sabor, objetos pequeños para organelos (uvas, frijoles, botones), una cajita para la pared celular", "Pregunte de qué están hechos todos los seres vivos.", "Cada grupo arma una célula animal en una bolsa y una vegetal dentro de una cajita. Rotulan membrana, citoplasma, núcleo, y en la vegetal pared celular y cloroplastos. Explican la función de cada parte.", "Completen un diagrama de Venn: célula animal y célula vegetal."], "en": ["Zip-top bags, clear gel or unflavored gelatin, small objects for organelles (grapes, beans, buttons), a small box for the cell wall", "Ask what all living things are made of.", "Each group builds an animal cell in a bag and a plant cell inside a small box. They label membrane, cytoplasm and nucleus, and for the plant cell, cell wall and chloroplasts. They explain what each part does.", "Complete a Venn diagram: animal cell and plant cell."]}, "fotosintesis": {"es": ["Hojas de espinaca o de árbol, un vaso con agua, lupa, foto de una planta acuática con burbujas, organizador «entra / sale»", "Pregunte: si las plantas no comen, ¿cómo consiguen su alimento?", "Pongan hojas en agua al sol y busquen burbujas después de una hora. Completen el organizador: entra luz, agua y dióxido de carbono; sale glucosa y oxígeno. Escriban la ecuación en palabras.", "Discutan por qué las plantas son importantes para los animales y las personas."], "en": ["Spinach or tree leaves, a cup of water, a magnifying glass, a photo of a water plant with bubbles, an «in / out» organizer", "Ask: if plants don't eat, how do they get their food?", "Put leaves in water in the sun and look for bubbles after an hour. Complete the organizer: light, water and carbon dioxide go in; glucose and oxygen come out. Write the equation in words.", "Discuss why plants matter for animals and people."]}, "materia": {"es": ["Hielo, vasos, bicarbonato y vinagre, una bolsa con cierre, un clavo oxidado y uno nuevo, balanza de cocina", "Muestre hielo que se derrite y una manzana cortada que se pone café. ¿Cuál es una sustancia nueva?", "Los estudiantes hacen tres pruebas: derretir hielo, romper papel y mezclar bicarbonato con vinagre dentro de la bolsa cerrada. Pesan antes y después, y clasifican cada cambio como físico o químico con evidencia.", "Expliquen por qué la masa no cambió dentro de la bolsa cerrada."], "en": ["Ice, cups, baking soda and vinegar, a zip-top bag, a rusty nail and a new one, a kitchen scale", "Show ice melting and a cut apple turning brown. Which one is a new substance?", "Students do three tests: melt ice, tear paper and mix baking soda with vinegar inside the closed bag. They weigh before and after, and classify each change as physical or chemical with evidence.", "Explain why the mass did not change inside the closed bag."]}, "herencia": {"es": ["Tarjetas de rasgos, monedas para «heredar» rasgos al azar, crayones", "Muestre fotos de animales y sus crías (perros, gatos). ¿En qué se parecen? ¿En qué no?", "En parejas, lanzan monedas para decidir qué rasgo recibe una criatura inventada de cada «progenitor» y la dibujan. Comparen: todos tienen los mismos padres, pero las criaturas no son iguales. Después clasifiquen rasgos en heredados y adquiridos.", "Expliquen por qué los hermanos se parecen pero no son idénticos. Use ejemplos de animales, no de la familia de los estudiantes."], "en": ["Trait cards, coins to «inherit» traits at random, crayons", "Show photos of animals and their young (dogs, cats). How are they alike? How are they different?", "In pairs, students flip coins to decide which trait an invented creature gets from each «parent» and draw it. Compare: all have the same parents, but the creatures are not the same. Then sort traits into inherited and acquired.", "Explain why siblings look alike but are not identical. Use animal examples, not students' families."]}};
/* ----- Hojas de trabajo para imprimir: nuevas cada vez, en tres niveles de apoyo ----- */
let HOJA={nivel:null,lec:null,apoyo:"estandar",n:8,idioma:"es",guia:true,clave:true};
const escH=x=>String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function crearHoja(){
  const l=L.find(x=>x.id===HOJA.lec);if(!l)return;
  const k=HOJA.idioma==="en"?1:0,ix=p=>Array.isArray(p)?p[k]:p;
  // generar con el nivel de apoyo elegido, sin tocar el progreso del niño
  const guardaApoyo=apoyo,guardaLang=lang,guardaNota=notas[l.id];
  apoyo=HOJA.apoyo;lang=HOJA.idioma;
  const qs=[];
  try{
    if(!l.frases){const f=fuenteSinFin(l),vistos=new Set();
      for(let i=0;i<HOJA.n*6&&qs.length<HOJA.n;i++){
        notas[l.id]=HOJA.apoyo==="simplificado"?0:HOJA.apoyo==="avanzado"?(i%2?4:5):[0,2,3][i%3];
        const q=f();const cor=Array.isArray(q.o)&&Number.isInteger(q.a)?q.o[q.a]:(q.a!==undefined?q.a:q.resp);const key=JSON.stringify([q.q,q.v,q.piezas,cor]);if(vistos.has(key))continue;vistos.add(key);qs.push(q)}}
  }finally{apoyo=guardaApoyo;lang=guardaLang;if(guardaNota===undefined)delete notas[l.id];else notas[l.id]=guardaNota}
  const nv=nivelDe(l.nivel),nom=HOJA.idioma==="en"?["Name","Date","Learn","Practice","Answer key","Teacher guide","Objective","Materials","Activity","Start","Main activity","Closing","Support"]:["Nombre","Fecha","Aprende","Practica","Clave de respuestas","Guía del maestro","Objetivo","Materiales","Actividad","Inicio","Desarrollo","Cierre","Apoyo"];
  const apoyoTxt=ix(APOYO[HOJA.apoyo]);
  const ej=(q,n)=>{let c;
    if(q.tipo==="ordenar"){const p=mezclar(q.piezas);c=`<div><b>${escH(ix(q.q))}</b><div class="fichH">${p.map(x=>`<span>${escH(x)}</span>`).join("")}</div><div class="linH"></div></div>`}
    else if(q.tipo==="escribir"){c=`<div><b>${escH(ix(q.q))}</b>${q.v?`<div class="visH">${q.v}</div>`:""}<div class="linH" style="max-width:3in"></div></div>`}
    else{const txt=String(ix(q.q)).replace(/toca el dibujo|tap the picture/i,HOJA.idioma==="en"?"circle the picture your teacher says":"encierra el dibujo que dice tu maestro").replace(/^Escucha\b/,"Escucha a tu maestro.");
      c=`<div>${q.reto?`<span class="tagH">🚀 ${HOJA.idioma==="en"?"Challenge":"Reto"}</span> `:""}<b>${escH(txt)}</b>${q.v?`<div class="visH">${q.v}</div>`:""}<div class="opsH">${(q.o||[]).map(o=>`<span><i></i>${ix(o)}</span>`).join("")}</div></div>`}
    return `<div class="ejH"><b class="n">${n}.</b>${c}</div>`};
  const resp=q=>q.tipo==="ordenar"?q.piezas.join(q.sep||" "):q.tipo==="escribir"?q.resp:String(ix(q.o[q.a])).replace(/<[^>]+>/g,"");
  const est=ESTANDARES[l.id]||["","",""],g=GUIAS[l.id]&&GUIAS[l.id][HOJA.idioma];
  let h="";
  if(HOJA.guia||HOJA.clave){
    h+=`<section class="hoja"><div class="cabH"><div><span class="tagH">${nom[5]}</span><span class="tagH">${escH(ix(nv.nombre))}</span><span class="tagH">${nom[12]}: ${escH(apoyoTxt)}</span><div class="tH">${l.ico} ${escH(ix(l.titulo))}</div></div><small>Ethan</small></div>
     <small>📚 Common Core/NGSS: ${escH(est[0])} · Texas: ${escH(/^\d/.test(est[1])?"TEKS "+est[1]:est[1])} · Chile: ${escH(est[2])}</small>`;
    if(HOJA.guia){h+=`<h3>🎯 ${nom[6]}</h3><p>${escH(ix(l.instr))}</p>`;
      if(g)h+=`<h3>🧺 ${nom[7]}</h3><p>${escH(g[0])}</p><h3>👩‍🏫 ${nom[8]}</h3><ol><li><b>${nom[9]}:</b> ${escH(g[1])}</li><li><b>${nom[10]}:</b> ${escH(g[2])}</li><li><b>${nom[11]}:</b> ${escH(g[3])}</li></ol>`;
      h+=`<p><b>${nom[12]} ${escH(apoyoTxt)}:</b> ${HOJA.apoyo==="simplificado"?(k?"two answer choices per question, basic difficulty. Read the questions aloud.":"dos opciones por pregunta y dificultad básica. Lea las preguntas en voz alta."):HOJA.apoyo==="avanzado"?(k?"harder questions and next-level challenges (🚀). Ask students to explain their answers.":"preguntas más difíciles y retos del siguiente nivel (🚀). Pida que expliquen sus respuestas."):(k?"grade-level questions with mixed difficulty.":"preguntas al nivel del grado, de dificultad variada.")}</p>`;
      if(l.audioTexto)h+=`<h3>🔊 ${k?"Read aloud twice":"Lea en voz alta dos veces"}</h3><div class="lecH">${escH(ix(l.audioTexto))}</div>`}
    if(HOJA.clave&&qs.length)h+=`<h3>🔑 ${nom[4]}</h3><ol class="claveH">${qs.map(q=>`<li>${escH(resp(q))}${q.audio?` <i>(${escH(q.audio[0])})</i>`:""}</li>`).join("")}</ol>`;
    h+=`</section>`}
  h+=`<section class="hoja"><div class="nomH"><span>${nom[0]}:</span><span style="flex:.5">${nom[1]}:</span></div>
   <div class="cabH"><div><span class="tagH">${escH(ix(nv.nombre))}</span><div class="tH">${l.ico} ${escH(ix(l.titulo))}</div></div><small>Ethan</small></div>
   <div class="apr"><b>💡 ${nom[2]}:</b> ${escH(ix(HOJA.apoyo==="simplificado"?dosOraciones(l.explica):l.explica))}<br><small>${l.ejemplos.slice(0,4).map(e=>`<b>${escH(k?e.en:e.es)}</b>`).join(" · ")}</small></div>`;
  if(l.lectura&&l.lectura2)h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="lecH"><b>${escH(ix(l.tit1))}</b><br>${escH(ix(l.lectura))}</div><div class="lecH"><b>${escH(ix(l.tit2))}</b><br>${escH(ix(l.lectura2))}</div></div>`;
  else if(l.lectura)h+=`<div class="lecH">${escH(ix(l.lectura))}</div>`;
  if(qs.length)h+=`<h3>✏️ ${nom[3]}</h3><div class="ejsH">${qs.map((q,i)=>ej(q,i+1)).join("")}</div>`;
  if(l.frases)h+=`<h3>🗣️ ${k?"Say each sentence out loud. Check ☐ when you say it well.":"Di cada frase en voz alta. Marca ☐ cuando la digas bien."}</h3>${l.frases.map(f=>`<p style="font-size:15pt">☐ ${f[2]||""} ${escH(f[k])}</p>`).join("")}`;
  if(l.libre)h+=`<h3>✍️ ${escH(ix(l.libre.q))}</h3>${'<div class="linH"></div>'.repeat(HOJA.apoyo==="simplificado"?5:9)}`;
  h+=`</section>`;
  const im=$("#imprimir");im.className=l.nivel==="pk"?"pkH":"";im.innerHTML=h;
  return qs.length;
}
P.hojas=()=>{
  if(!HOJA.nivel){HOJA.nivel=nivelActual||"g12";HOJA.idioma=lang==="en"?"en":"es"}

/* ----- Etapas del búho: cada lección crece de huevito a búho sabio (0 a 5 estrellas) ----- */
const DOM=[["Sin empezar","Not started","#c7d2df"],["🥚 Huevito","🥚 Little egg","#ffd9b8"],["🥚 Huevito","🥚 Little egg","#ffd9b8"],["🐣 Pollito","🐣 Chick","#ffe27a"],["🐦 Ya vuela","🐦 Flying","#9cc9ff"],["🦉 Búho sabio","🦉 Wise owl","#8fdcaf"]];
const dominio=n=>DOM[Math.max(0,Math.min(5,n||0))];
const insignia=n=>{const d=dominio(n);return `<span class="insignia" style="background:${d[2]}">${tx([d[0],d[1]])}</span>`};
function preguntasDe(l,n=5){
  if(l.gen) return Array.from({length:n},()=>({...GEN[l.gen](),lec:l.id}));
  return mezclar(l.ejercicios).slice(0,n).map(e=>{const orden=mezclar(e.o.map((o,i)=>i));return {...e,o:orden.map(i=>e.o[i]),a:orden.indexOf(e.a),lec:l.id}});
}
function dosOraciones(p){const f=t=>{const m=t.match(/^[\s\S]*?[.!?](?=\s|$)[\s\S]*?[.!?](?=\s|$)/);return m?m[0]:t};return [f(p[0]),f(p[1])]}
function primeraDe(t){const m=t.match(/^[\s\S]*?[.!?](?=\s|$)/);return m?m[0]:t}
function primeraOracion(p){return [primeraDe(p[0]),primeraDe(p[1])]}
/* Sesión de preguntas con pistas. Tipos: opción múltiple (con o sin audio), ordenar piezas y escribir.
   fuente(): da la siguiente pregunta. total: número de preguntas o Infinity (práctica sin fin).
   alBloque(aciertosDelBloque): cada 5 preguntas en modo sin fin. alTerminar(aciertos, resultados, contestadas). */
const limpiaResp=s=>s.trim().toLowerCase().replace(/\s+/g," ").replace(/[.!¡?¿,;:]/g,"");
const sinTilde=s=>s.replace(/ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"ñ");
function sesion(caja,fuente,total,alTerminar,alBloque){
  let i=0,aciertos=0,intentos=0,pistas=0,racha=0,bloque=0;const res=[];const sinFin=total===Infinity;
  function avanzar(){if(!caja.isConnected)return;i++;if(sinFin&&i%5===0){const b=bloque;bloque=0;if(alBloque) alBloque(b)}pintar()}
  function pintar(){
    if(i>=total) return alTerminar(aciertos,res,i);
    const p=fuente(); intentos=0; pistas=0;
    const lp=L.find(x=>x.id===p.lec), tipo=p.tipo||"mc";
    caja.__p=p; // referencia interna para pruebas automáticas (no se muestra)
    const cabeza=sinFin
      ?`<div class="fila" style="justify-content:space-between;align-items:center;margin:0 0 8px"><span class="insignia" style="background:#fff3c4">🔥 ${tx(["Racha","Streak"])}: ${racha}</span>
         <span class="sub" style="margin:0">✔ ${aciertos} / ${i}</span><button class="oir" id="terminar">🏁 ${tx(["Terminar","Finish"])}</button></div>
         <div class="barra"><i style="width:${(i%5)/5*100}%"></i></div>`
      :`<div class="barra"><i style="width:${i/total*100}%"></i></div><p class="sub">${i+1} / ${total}</p>`;
    const qHTML=(p.reto?`<span class="insignia" style="background:#e9ddff">🚀 ${tx(["Reto del siguiente nivel","Next-level challenge"])}</span><br>`:"")+(lang==="bi"?`${p.q[0]}<small>${p.q[1]}</small>`:tx(p.q));
    const botonOirP=p.audio?`<button class="btn naranja" id="oirP">🔊 ${tx(["Escuchar","Listen"])}</button>`
      :p.oir?`<button class="btn naranja" id="oirP">${t("oir")}</button>`
      :p.audioQ?`<button class="btn naranja" id="oirP">🔊 ${tx(["Escuchar la pregunta","Hear the question"])}</button>`
      :`<button class="oir" id="oirP">🔊 ${lang==="en"?"Read it to me":"Léemelo"}</button>`;
    const botonPasaje=p.pasaje&&lp&&lp.audioTexto?`<button class="btn" id="pasaje">📻 ${tx(["Escuchar el audio","Listen to the audio"])}</button>`:"";
    let cuerpo="";
    if(tipo==="mc") cuerpo=`<div class="resp">${p.o.map((o,k)=>`<button data-r="${k}" style="${p.grande?"font-size:2.4rem":""}">${tx(o)}</button>`).join("")}</div>`;
    else if(tipo==="ordenar") cuerpo=`<div class="armado" id="armado" aria-label="respuesta"></div><div class="fichas" id="fichas"></div>
      <div class="fila"><button class="btn verde" id="comprobar">✔ ${tx(["Comprobar","Check"])}</button><button class="oir" id="borrarO">↩︎ ${tx(["Empezar de nuevo","Start over"])}</button></div>`;
    else cuerpo=`<div class="fila"><input id="escr" class="campo" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="respuesta"></div>
      <div class="fila"><button class="btn verde" id="comprobar">✔ ${tx(["Comprobar","Check"])}</button></div>`;
    caja.innerHTML=`${cabeza}
      <div class="pregunta" id="txtQ" ${p.audioQ?"hidden":""}>${qHTML}</div>
      ${p.audioQ?`<div class="fila" style="margin:0"><button class="oir" id="verQ">👁️ ${tx(["Ver la pregunta","Show the question"])}</button></div>`:""}
      ${p.v?`<div class="visual">${p.v}</div>`:""}
      <div class="fila" style="margin-top:6px">${botonPasaje}${botonOirP}<button class="oir" id="pista">💡 ${tx(["Pista","Hint"])}</button></div>
      <div class="pista" id="txtPista" hidden></div>${cuerpo}
      <div class="mensaje" id="msg"></div><div class="fila" id="sigFila"></div>`;
    if(sinFin) $("#terminar").onclick=()=>{caja.dataset.bloq="0";pararVoz();alTerminar(aciertos,res,i)};
    const conLetras=x=>/[a-záéíóúñ]/i.test(typeof x==="string"?x:x[0]);
    const opcionesVoz=()=>{ // las opciones con palabras también se leen, para quien todavía no lee

    const exito=el=>{

      setTimeout(()=>{if(!caja.isConnected)return;caja.dataset.bloq="0";avanzar()},1300);

    let revelar=()=>{};
    const error=(el,casi)=>{

    let pista2=()=>{};

    if(tipo==="mc"){

      revelar=()=>botones[p.a].classList.add("revela");
      pista2=()=>{const malas=botones.filter((b,k)=>k!==p.a&&!b.disabled);if(malas.length>1){const m=malas[R(0,malas.length-1)];m.disabled=true;m.style.opacity=".3"}return ["Quité una respuesta incorrecta.","I removed one wrong answer."]};
      botones.forEach(b=>b.onclick=()=>{if(caja.dataset.bloq==="1"||b.disabled)return;+b.dataset.r===p.a?exito(b):error(b)});
    } else if(tipo==="ordenar"){
      const correcta=p.piezas.join(p.sep);
      let fichas=p.piezas.map((x,k)=>({x,k}));let t2=0;do{fichas=mezclar(fichas);t2++}while(t2<10&&fichas.length>1&&fichas.map(f=>f.x).join(p.sep)===correcta);
      let puestas=[];

        $("#fichas").innerHTML=fichas.map((f,k)=>puestas.includes(f)?`<span class="ficha vacia">${f.x}</span>`:`<button class="ficha" data-f="${k}">${f.x}</button>`).join("");
        caja.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{if(caja.dataset.bloq==="1")return;puestas.push(fichas[+b.dataset.f]);dibuja()});
        caja.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{if(caja.dataset.bloq==="1")return;puestas.splice(+b.dataset.q,1);dibuja()});
      };

      $("#borrarO").onclick=()=>{if(caja.dataset.bloq==="1")return;puestas=[];dibuja()};
      revelar=()=>{$("#armado").innerHTML=`<span class="ficha puesta revela">${correcta}</span>`};
      pista2=()=>{const primera=fichas.find(f=>f.k===0);puestas=[primera];dibuja();return ["Puse la primera pieza.","I placed the first piece."]};
      $("#comprobar").onclick=()=>{

      revelar=()=>{$("#msg").insertAdjacentHTML("afterend",`<p class="texto" style="text-align:center">✔ <b>${p.resp}</b></p>`)};
      pista2=()=>{const n=Math.max(1,Math.floor(p.resp.length/2));campo.placeholder=p.resp.slice(0,n)+"…";return [`Empieza así: ${p.resp.slice(0,n)}…`,`It starts like this: ${p.resp.slice(0,n)}…`]};
      const revisa=()=>{
        if(caja.dataset.bloq==="1")return;
        const v=limpiaResp(campo.value),r=limpiaResp(p.resp);if(!v)return;
        if(v===r) return exito(campo);

    }
    $("#pista").onclick=()=>{
      pistas++; const tp=$("#txtPista"); tp.hidden=false;
      if(pistas===1&&lp){const f=primeraOracion(lp.explica);tp.innerHTML=`💡 ${lang==="bi"?`${f[0]}<br><small>${f[1]}</small>`:tx(f)}`;decirPar(f)}
      else{const m=pista2();tp.innerHTML+=`<br>✂️ ${tx(m)}`;$("#pista").disabled=true;$("#pista").style.opacity=".5"}
    };
  }
  caja.dataset.bloq="0"; pintar();
}
