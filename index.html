 explica:["Cada dígito vale según el lugar donde está. En 243, el 2 está en las centenas y vale 200, el 4 está en las decenas y vale 40, y el 3 está en las unidades y vale 3. Por eso 243 = 200 + 40 + 3. Una centena son 10 decenas y una decena son 10 unidades.","Each digit's value depends on its place. In 243, the 2 is in the hundreds place and is worth 200, the 4 is in the tens place and is worth 40, and the 3 is in the ones place and is worth 3. So 243 = 200 + 40 + 3. One hundred is 10 tens, and one ten is 10 ones."],
 tabla:[["centenas","decenas","unidades"],["2","4","3"],["200","40","3"]],
 ejemplos:[{e:"243",es:"200 + 40 + 3",en:"200 + 40 + 3"},{e:"508",es:"5 centenas, 0 decenas, 8 unidades",en:"5 hundreds, 0 tens, 8 ones"},{e:"347 > 326",es:"Compara primero las centenas, luego las decenas",en:"Compare the hundreds first, then the tens"},{e:"450 + 10 = 460",es:"10 más: cambian las decenas",en:"10 more: the tens change"}]});
lec({id:"sumas3",nivel:"g12",area:"matematicas",ico:"➕",titulo:["Sumas de dos y tres dígitos","Adding 2- and 3-digit numbers"],
 instr:["Acomoda los números en columnas y suma empezando por las unidades. Si una columna llega a 10 o más, reagrupa (lleva) a la siguiente columna.","Line up the numbers in columns and add starting with the ones. If a column makes 10 or more, regroup (carry) to the next column."],
 explica:["Para sumar en columnas, pon unidades debajo de unidades, decenas debajo de decenas y centenas debajo de centenas. Suma primero las unidades. Si te da 10 o más, escribe las unidades y pasa 1 decena a la columna de las decenas: eso es reagrupar, o «llevar». Haz lo mismo con las decenas. Al final, revisa si tu resultado tiene sentido.","To add in columns, put ones under ones, tens under tens and hundreds under hundreds. Add the ones first. If you get 10 or more, write the ones and move 1 ten to the tens column: that's regrouping, or carrying. Do the same with the tens. At the end, check that your answer makes sense."],
 ejemplos:[{e:"34 + 25 = 59",es:"sin reagrupar",en:"no regrouping"},{e:"47 + 38 = 85",es:"7 + 8 = 15: escribo 5 y llevo 1",en:"7 + 8 = 15: write 5, carry 1"},{e:"352 + 214 = 566",es:"tres columnas",en:"three columns"},{e:"468 + 275 = 743",es:"reagrupo dos veces",en:"regroup twice"}]});
lec({id:"restas3",nivel:"g12",area:"matematicas",ico:"➖",titulo:["Restas de dos y tres dígitos","Subtracting 2- and 3-digit numbers"],
 instr:["Acomoda los números en columnas y resta empezando por las unidades. Si arriba hay menos que abajo, desagrupa (pide prestado) una decena o una centena.","Line up the numbers in columns and subtract starting with the ones. If the top digit is smaller, regroup (borrow) a ten or a hundred."],
 explica:["El número más grande va arriba. Resta primero las unidades. Si el dígito de arriba es menor que el de abajo, desagrupa: cambia 1 decena por 10 unidades. Así 52 − 27: como 2 es menor que 7, el 52 se convierte en 4 decenas y 12 unidades; 12 − 7 = 5 y 4 − 2 = 2, el resultado es 25. Para comprobar, suma el resultado con el número de abajo: 25 + 27 = 52.","The bigger number goes on top. Subtract the ones first. If the top digit is smaller than the bottom one, regroup: trade 1 ten for 10 ones. So for 52 − 27: since 2 is less than 7, 52 becomes 4 tens and 12 ones; 12 − 7 = 5 and 4 − 2 = 2, so the answer is 25. To check, add your answer to the bottom number: 25 + 27 = 52."],
 ejemplos:[{e:"68 − 25 = 43",es:"sin desagrupar",en:"no regrouping"},{e:"52 − 27 = 25",es:"12 − 7 = 5 y 4 − 2 = 2",en:"12 − 7 = 5 and 4 − 2 = 2"},{e:"475 − 132 = 343",es:"tres columnas",en:"three columns"},{e:"25 + 27 = 52",es:"compruebo con una suma",en:"check with addition"}]});
lec({id:"textos12",nivel:"g12",area:"escritura",ico:"📝",titulo:["Escribo y corrijo textos cortos","I write and fix short texts"],
 instr:["Primero encuentra los errores en las oraciones y ordena los cuentos. Después escribe tu propio texto corto y usa el botón «Revisar y corregir».","First find the mistakes in the sentences and put the stories in order. Then write your own short text and use the «Check and fix» button."],
 explica:["Un texto corto cuenta algo en orden: lo que pasó primero, después y al final. Cada oración empieza con mayúscula y termina con punto. Las preguntas llevan ¿ al principio y ? al final, y las exclamaciones llevan ¡ y !. Los nombres de personas y lugares también van con mayúscula. Cuando termines, léelo otra vez para corregirlo.","A short text tells something in order: what happened first, next and at the end. Each sentence starts with a capital letter and ends with a period. In Spanish, questions use ¿ at the start and ? at the end, and exclamations use ¡ and !. Names of people and places also start with a capital letter. When you finish, read it again to fix it."],
 ejemplos:[{e:"✅",es:"Hoy fuimos al parque.",en:"We went to the park today."},{e:"❌ → ✅",es:"hoy fuimos al parque → Hoy fuimos al parque.",en:"we went to the park → We went to the park."},{e:"❓",es:"¿Quieres jugar conmigo?",en:"Do you want to play with me?"},{e:"1️⃣2️⃣3️⃣",es:"Primero… Después… Al final…",en:"First… Next… Finally…"}],
 libre:{q:["Escribe un texto corto de tres oraciones sobre algo que hiciste. Usa «primero», «después» y «al final».","Write a short text of three sentences about something you did. Use «first», «next» and «finally»."],min:15,oraciones:3,secuencia:true}});

/* ---------- Lecciones agregadas para cubrir los estándares de cada nivel ---------- */
lec({id:"numerospk",nivel:"pk",area:"matematicas",ico:"🔟",titulo:["Los números del 1 al 10","Numbers 1 to 10"],
 instr:["Cuenta los dibujos tocando cada uno con el dedo. Después toca el número que dice cuántos hay.","Count the pictures, touching each one with your finger. Then tap the number that tells how many."],
 explica:["Para contar, tocamos cada cosa una sola vez y decimos un número para cada una: uno, dos, tres. El último número que dices es cuántas hay.","To count, we touch each thing only once and say one number for each: one, two, three. The last number you say tells how many there are."],
 ejemplos:[{e:"🍎",es:"1 · uno",en:"1 · one"},{e:"🐤🐤🐤",es:"3 · tres",en:"3 · three"},{e:"⭐⭐⭐⭐⭐",es:"5 · cinco",en:"5 · five"},{e:"🎈🎈🎈🎈🎈🎈🎈🎈🎈🎈",es:"10 · diez",en:"10 · ten"}]});
lec({id:"rimaspk",nivel:"pk",area:"escuchar",ico:"🎶",titulo:["Palabras que riman","Rhyming words"],
 instr:["Escucha las palabras. Toca la que suena igual al final.","Listen to the words. Tap the one that sounds the same at the end."],
 explica:["Dos palabras riman cuando terminan con el mismo sonido. Gato y pato riman porque las dos terminan en «ato». Escucha bien el final de cada palabra.","Two words rhyme when they end with the same sound. Cat and hat rhyme because they both end in «at». Listen carefully to the end of each word."],
 ejemplos:[{e:"🐱 🦆",es:"gato · pato",en:"cat · hat"},{e:"🌙 🛏️",es:"luna · cuna",en:"moon · spoon"},{e:"☀️ 🥬",es:"sol · col",en:"sun · bun"}]});
lec({id:"reloj",nivel:"g12",area:"matematicas",ico:"🕒",titulo:["La hora en el reloj","Telling time"],
 instr:["Mira las manecillas del reloj. Primero lee la corta (la hora) y después la larga (los minutos).","Look at the clock hands. First read the short hand (the hour), then the long hand (the minutes)."],
 explica:["El reloj tiene dos manecillas. La corta marca la hora y la larga marca los minutos. Cuando la larga está en el 12, es la hora en punto: 3:00. Cuando está en el 6, es y media: 3:30. Cada número del reloj vale 5 minutos para la manecilla larga, así que en el 3 son 15 minutos y en el 9 son 45.","A clock has two hands. The short hand shows the hour and the long hand shows the minutes. When the long hand is on the 12, it's o'clock: 3:00. When it's on the 6, it's half past: 3:30. Each number on the clock is worth 5 minutes for the long hand, so the 3 means 15 minutes and the 9 means 45."],
 ejemplos:[{e:"🕒",es:"3:00 · las tres en punto",en:"3:00 · three o'clock"},{e:"🕞",es:"3:30 · las tres y media",en:"3:30 · half past three"},{e:"🕘",es:"9:00 · las nueve",en:"9:00 · nine o'clock"}],
 dibujo:()=>svgReloj(3,30)});
lec({id:"parimpar",nivel:"g12",area:"matematicas",ico:"👫",titulo:["Números pares e impares","Even and odd numbers"],
 instr:["Haz parejas con los dibujos. Si a ninguno le falta pareja, el número es par.","Make pairs with the pictures. If everyone has a partner, the number is even."],
 explica:["Un número es par si se puede repartir en parejas sin que sobre nada: 2, 4, 6, 8, 10. Es impar si sobra uno: 1, 3, 5, 7, 9. Para saberlo rápido, mira solo el último dígito: si termina en 0, 2, 4, 6 u 8, es par.","A number is even if it can be split into pairs with nothing left over: 2, 4, 6, 8, 10. It is odd if one is left over: 1, 3, 5, 7, 9. To check quickly, look only at the last digit: if it ends in 0, 2, 4, 6 or 8, it's even."],
 ejemplos:[{e:"🧦🧦 🧦🧦",es:"4 es par",en:"4 is even"},{e:"🧦🧦 🧦🧦 🧦",es:"5 es impar: sobra uno",en:"5 is odd: one is left over"},{e:"38",es:"termina en 8: par",en:"ends in 8: even"}]});
lec({id:"graficas12",nivel:"g12",area:"matematicas",ico:"📊",titulo:["Pictogramas y gráficas de barras","Picture graphs and bar graphs"],
 instr:["Lee el título de la gráfica y el nombre de cada barra. Después cuenta y compara.","Read the graph's title and the name of each bar. Then count and compare."],
 explica:["Una gráfica de barras muestra datos con barras. Entre más alta es la barra, más votos o cosas tiene. Para leerla, sigue la parte de arriba de la barra hasta el número de la izquierda. Para saber cuántos más tiene uno que otro, resta los dos números.","A bar graph shows data with bars. The taller the bar, the more votes or things it has. To read it, follow the top of the bar to the number on the left. To find how many more one has than another, subtract the two numbers."],
 ejemplos:[{e:"🍎 ▮▮▮▮▮",es:"la manzana tiene 5 votos",en:"apple has 5 votes"},{e:"🍌 ▮▮",es:"el plátano tiene 2",en:"banana has 2"},{e:"5 − 2 = 3",es:"la manzana tiene 3 más",en:"apple has 3 more"}],
 dibujo:()=>svgBarras([["🍎",5],["🍌",2],["🍇",4],["🍓",3]])});
lec({id:"fracciones12",nivel:"g12",area:"geometria",ico:"🍕",titulo:["Mitades, tercios y cuartos","Halves, thirds and fourths"],
 instr:["Mira en cuántas partes iguales está dividida la figura y cuántas están pintadas.","Look at how many equal parts the shape is divided into and how many are colored."],
 explica:["Cuando partimos algo en partes iguales, cada parte tiene un nombre. Si son 2 partes iguales, cada una es una mitad (1/2). Si son 3, cada una es un tercio (1/3). Si son 4, cada una es un cuarto (1/4). Las partes tienen que ser del mismo tamaño.","When we split something into equal parts, each part has a name. If there are 2 equal parts, each one is a half (1/2). If there are 3, each one is a third (1/3). If there are 4, each one is a fourth (1/4). The parts must be the same size."],
 ejemplos:[{e:"🟦⬜",es:"1/2 · una mitad",en:"1/2 · one half"},{e:"🟦⬜⬜",es:"1/3 · un tercio",en:"1/3 · one third"},{e:"🟦🟦🟦⬜",es:"3/4 · tres cuartos",en:"3/4 · three fourths"}],
 dibujo:()=>svgFila([svgFraccion(2,1),svgFraccion(3,1),svgFraccion(4,3)])});
lec({id:"medir12",nivel:"g12",area:"matematicas",ico:"📏",titulo:["Medir con la regla","Measuring with a ruler"],
 instr:["Pon atención a dónde empieza el objeto. Cuenta los centímetros desde el 0 hasta donde termina.","Notice where the object starts. Count the centimeters from 0 to where it ends."],
 explica:["Para medir, el objeto debe empezar en el 0 de la regla. El número donde termina es lo que mide. Medimos en centímetros (cm). En Estados Unidos también se usan pulgadas: una pulgada mide un poco más de 2 centímetros y medio.","To measure, the object must start at the 0 on the ruler. The number where it ends is its length. We measure in centimeters (cm). In the United States, inches are also used: one inch is a little more than 2 and a half centimeters."],
 ejemplos:[{e:"✏️",es:"el lápiz mide 9 cm",en:"the pencil is 9 cm long"},{e:"0 ➜ 6",es:"si empieza en 0 y termina en 6, mide 6 cm",en:"starts at 0, ends at 6: it's 6 cm"}],
 dibujo:()=>svgRegla(9)});
lec({id:"dividir",nivel:"g35",area:"matematicas",ico:"➗",titulo:["Dividir","Dividing"],
 instr:["Reparte en grupos iguales. Usa las tablas de multiplicar para encontrar el resultado.","Share into equal groups. Use your multiplication facts to find the answer."],
 explica:["Dividir es repartir en partes iguales. Si repartes 12 galletas entre 3 amigos, a cada uno le tocan 4: 12 ÷ 3 = 4. La división es lo contrario de la multiplicación: como 3 × 4 = 12, sabemos que 12 ÷ 3 = 4.","Dividing means sharing equally. If you share 12 cookies among 3 friends, each one gets 4: 12 ÷ 3 = 4. Division is the opposite of multiplication: since 3 × 4 = 12, we know 12 ÷ 3 = 4."],
 ejemplos:[{e:"🍪🍪🍪🍪 | 🍪🍪🍪🍪 | 🍪🍪🍪🍪",es:"12 ÷ 3 = 4",en:"12 ÷ 3 = 4"},{e:"3 × 4 = 12",es:"por eso 12 ÷ 4 = 3",en:"so 12 ÷ 4 = 3"},{e:"20 ÷ 5 = 4",es:"5 grupos de 4",en:"5 groups of 4"}]});
lec({id:"redondeo",nivel:"g35",area:"matematicas",ico:"🎯",titulo:["Redondear números","Rounding numbers"],
 instr:["Busca entre qué decenas o centenas está el número. Después decide de cuál está más cerca.","Find which tens or hundreds the number is between. Then decide which one it's closer to."],
 explica:["Redondear es cambiar un número por otro cercano que es más fácil de usar. Para redondear a la decena, mira las unidades: si son 5 o más, sube; si son 4 o menos, se queda. Así, 47 se redondea a 50 y 43 a 40. Para redondear a la centena, mira las decenas: 362 se redondea a 400 y 328 a 300.","Rounding means changing a number to a nearby one that's easier to use. To round to the nearest ten, look at the ones: if they're 5 or more, round up; if they're 4 or less, stay. So 47 rounds to 50 and 43 rounds to 40. To round to the nearest hundred, look at the tens: 362 rounds to 400 and 328 rounds to 300."],
 ejemplos:[{e:"47 → 50",es:"7 es 5 o más: sube",en:"7 is 5 or more: round up"},{e:"43 → 40",es:"3 es menos de 5: se queda",en:"3 is less than 5: stay"},{e:"362 → 400",es:"a la centena",en:"to the nearest hundred"}]});
lec({id:"decimales",nivel:"g35",area:"matematicas",ico:"🔸",titulo:["Décimos y centésimos","Tenths and hundredths"],
 instr:["Lee cada número decimal con su nombre: décimos o centésimos. Después compáralos.","Read each decimal with its name: tenths or hundredths. Then compare them."],
 explica:["Los decimales sirven para escribir partes de un entero. Un décimo es una de 10 partes iguales: 1/10 = 0{D}1. Un centésimo es una de 100 partes: 1/100 = 0{D}01. Para comparar decimales, compara primero los enteros, luego los décimos y luego los centésimos: 0{D}5 es mayor que 0{D}45 porque 5 décimos es más que 4 décimos. En algunos países se escribe coma decimal (0,5) y en otros punto (0.5).","Decimals are used to write parts of a whole. A tenth is one of 10 equal parts: 1/10 = 0{D}1. A hundredth is one of 100 parts: 1/100 = 0{D}01. To compare decimals, compare the whole numbers first, then the tenths, then the hundredths: 0{D}5 is greater than 0{D}45 because 5 tenths is more than 4 tenths. Some countries write a decimal comma (0,5) and others a decimal point (0.5)."],
 ejemplos:[{e:"3/10",es:"0{D}3 · tres décimos",en:"0{D}3 · three tenths"},{e:"25/100",es:"0{D}25 · veinticinco centésimos",en:"0{D}25 · twenty-five hundredths"},{e:"0{D}5 > 0{D}45",es:"5 décimos > 4 décimos",en:"5 tenths > 4 tenths"}]});
lec({id:"sinonimos",nivel:"g35",area:"vocabulario",ico:"🔁",titulo:["Sinónimos y antónimos","Synonyms and antonyms"],
 instr:["Lee la palabra y busca la que significa lo mismo (sinónimo) o lo contrario (antónimo).","Read the word and find the one that means the same (synonym) or the opposite (antonym)."],
 explica:["Los sinónimos son palabras que significan casi lo mismo, como contento y feliz. Los antónimos significan lo contrario, como alto y bajo. Usarlos hace que lo que escribes no repita siempre las mismas palabras.","Synonyms are words that mean almost the same, like happy and glad. Antonyms mean the opposite, like tall and short. Using them keeps your writing from repeating the same words."],
 ejemplos:[{e:"😊",es:"contento = feliz",en:"happy = glad"},{e:"📏",es:"alto ↔ bajo",en:"tall ↔ short"},{e:"🐢🐇",es:"lento ↔ rápido",en:"slow ↔ fast"}]});
lec({id:"ecosistemas",nivel:"g35",area:"biologia",ico:"🦊",titulo:["Biología: cadenas alimentarias","Biology: food chains"],
 instr:["Sigue las flechas de la cadena: muestran quién se come a quién y hacia dónde va la energía.","Follow the arrows in the chain: they show who eats whom and where the energy goes."],
 explica:["En un ecosistema, los productores, como las plantas, hacen su propio alimento con la luz del sol. Los consumidores se comen a otros seres vivos: los herbívoros comen plantas, los carnívoros comen animales y los omnívoros comen de los dos. Los descomponedores, como los hongos, las bacterias y las lombrices, deshacen a los seres muertos y devuelven nutrientes a la tierra. La energía de toda la cadena viene del Sol.","In an ecosystem, producers, like plants, make their own food using sunlight. Consumers eat other living things: herbivores eat plants, carnivores eat animals and omnivores eat both. Decomposers, like fungi, bacteria and worms, break down dead things and return nutrients to the soil. The energy for the whole chain comes from the Sun."],
 ejemplos:[{e:"☀️→🌾→🐇→🦊",es:"sol → pasto → conejo → zorro",en:"sun → grass → rabbit → fox"},{e:"🌱",es:"productor",en:"producer"},{e:"🍄🪱",es:"descomponedores",en:"decomposers"}],
 ejercicios:[
  {q:["¿Quién es el productor en la cadena: pasto → conejo → zorro?","Who is the producer in the chain: grass → rabbit → fox?"],o:[["el pasto","the grass"],["el conejo","the rabbit"],["el zorro","the fox"]],a:0},
  {q:["¿De dónde viene la energía de una cadena alimentaria?","Where does the energy in a food chain come from?"],o:[["del Sol","from the Sun"],["del zorro","from the fox"],["de la lluvia","from the rain"]],a:0},
  {q:["Un animal que solo come plantas es…","An animal that only eats plants is…"],o:[["herbívoro","an herbivore"],["carnívoro","a carnivore"],["descomponedor","a decomposer"]],a:0},
  {q:["¿Qué hacen los hongos y las lombrices?","What do fungi and worms do?"],o:[["Deshacen a los seres muertos y devuelven nutrientes a la tierra.","They break down dead things and return nutrients to the soil."],["Hacen alimento con la luz del sol.","They make food from sunlight."],["Cazan conejos.","They hunt rabbits."]],a:0},
  {q:["Si desaparecen los conejos, ¿qué le pasa al zorro?","If the rabbits disappear, what happens to the fox?"],o:[["Tiene menos comida.","It has less food."],["Tiene más comida.","It has more food."],["No le pasa nada.","Nothing happens to it."]],a:0},
  {q:["Un oso come peces y también moras. Es…","A bear eats fish and also berries. It is…"],o:[["omnívoro","an omnivore"],["herbívoro","an herbivore"],["productor","a producer"]],a:0}
 ]});
lec({id:"tierrasol",nivel:"g35",area:"ciencias",ico:"🌍",titulo:["Ciencias: la Tierra, el Sol y la Luna","Science: Earth, Sun and Moon"],
 instr:["Lee la explicación y fíjate en la diferencia entre rotación y traslación. Luego contesta.","Read the explanation and notice the difference between rotation and revolution. Then answer."],
 explica:["El Sol es una estrella. La Tierra gira sobre sí misma una vez al día: eso es la rotación, y por eso hay día y noche. Además, la Tierra le da una vuelta completa al Sol en un año, más o menos 365 días: eso es la traslación. La Luna gira alrededor de la Tierra y tarda cerca de un mes. Al mediodía el Sol está más alto y las sombras son más cortas. Como la Tierra está inclinada, hay estaciones; cuando es verano en el hemisferio norte, es invierno en el sur.","The Sun is a star. Earth spins once a day: that's rotation, and it's why we have day and night. Earth also travels all the way around the Sun in one year, about 365 days: that's revolution. The Moon goes around Earth and takes about a month. At noon the Sun is highest and shadows are shortest. Because Earth is tilted, we have seasons; when it's summer in the northern hemisphere, it's winter in the southern one."],
 ejemplos:[{e:"🌍🔄",es:"rotación: 1 día",en:"rotation: 1 day"},{e:"🌍➰☀️",es:"traslación: 1 año",en:"revolution: 1 year"},{e:"🌙",es:"la Luna gira alrededor de la Tierra",en:"the Moon goes around Earth"}],
 ejercicios:[
  {q:["¿Por qué hay día y noche?","Why do we have day and night?"],o:[["Porque la Tierra gira sobre sí misma.","Because Earth spins."],["Porque el Sol se apaga en la noche.","Because the Sun turns off at night."],["Porque la Luna tapa al Sol.","Because the Moon covers the Sun."]],a:0},
  {q:["¿Cuánto tarda la Tierra en darle la vuelta al Sol?","How long does Earth take to go around the Sun?"],o:[["un año","one year"],["un día","one day"],["una semana","one week"]],a:0},
  {q:["El Sol es…","The Sun is…"],o:[["una estrella","a star"],["un planeta","a planet"],["una luna","a moon"]],a:0},
  {q:["¿A qué hora del día son más cortas las sombras?","At what time of day are shadows shortest?"],o:[["al mediodía","at noon"],["en la mañana temprano","early morning"],["al atardecer","at sunset"]],a:0},
  {q:["¿Qué gira alrededor de la Tierra?","What goes around Earth?"],o:[["la Luna","the Moon"],["el Sol","the Sun"],["Marte","Mars"]],a:0},
  {q:["En diciembre es verano en…","In December it's summer in…"],o:[["Chile y Argentina","Chile and Argentina"],["Canadá","Canada"],["México","Mexico"]],a:0}
 ]});
lec({id:"razones",nivel:"g68",area:"matematicas",ico:"⚖️",titulo:["Razones y proporciones","Ratios and proportions"],
 instr:["Escribe la razón, busca el valor por unidad y úsalo para resolver.","Write the ratio, find the unit rate and use it to solve."],
 explica:["Una razón compara dos cantidades. Si en una receta hay 2 tazas de harina por cada 3 huevos, la razón es 2 : 3. Dos razones son proporcionales si se multiplican por el mismo número: 2 : 3 es igual a 4 : 6. El valor unitario dice cuánto hay por cada uno: si 4 boletos cuestan 20, un boleto cuesta 20 ÷ 4 = 5.","A ratio compares two amounts. If a recipe uses 2 cups of flour for every 3 eggs, the ratio is 2 : 3. Two ratios are proportional if both parts are multiplied by the same number: 2 : 3 equals 4 : 6. The unit rate tells how much for each one: if 4 tickets cost 20, one ticket costs 20 ÷ 4 = 5."],
 ejemplos:[{e:"🔴🔴 : 🔵🔵🔵",es:"2 : 3",en:"2 : 3"},{e:"2 : 3 = 4 : 6",es:"multiplico las dos partes por 2",en:"multiply both parts by 2"},{e:"120 km / 2 h",es:"60 km por hora",en:"60 km per hour"}]});
lec({id:"enteros",nivel:"g68",area:"matematicas",ico:"🌡️",titulo:["Números negativos","Negative numbers"],
 instr:["Ubica los números en la recta numérica. A la derecha son mayores; a la izquierda, menores.","Place the numbers on the number line. To the right they're greater; to the left, smaller."],
 explica:["Los números negativos están a la izquierda del 0. Se usan para temperaturas bajo cero, pisos bajo tierra o deudas. Entre más a la izquierda, más pequeño: −8 es menor que −3. Para sumar en la recta, un número positivo te mueve a la derecha y uno negativo a la izquierda: −4 + 6 = 2.","Negative numbers are to the left of 0. They're used for temperatures below zero, floors underground or debts. The farther left, the smaller: −8 is less than −3. To add on the number line, a positive number moves you right and a negative one moves you left: −4 + 6 = 2."],
 ejemplos:[{e:"🥶 −5 °C",es:"5 grados bajo cero",en:"5 degrees below zero"},{e:"−8 < −3",es:"−8 está más a la izquierda",en:"−8 is farther left"},{e:"−4 + 6 = 2",es:"avanzo 6 a la derecha",en:"move 6 to the right"}]});
lec({id:"estadistica",nivel:"g68",area:"matematicas",ico:"📈",titulo:["Media, mediana y moda","Mean, median and mode"],
 instr:["Ordena los datos de menor a mayor antes de buscar la mediana. Para la media, suma y divide.","Order the data from least to greatest before finding the median. For the mean, add and divide."],
 explica:["La media (o promedio) se calcula sumando todos los datos y dividiendo entre cuántos son. La mediana es el dato del centro cuando los ordenas. La moda es el dato que más se repite. El rango es la diferencia entre el mayor y el menor.","The mean (average) is found by adding all the data and dividing by how many there are. The median is the middle value when you order them. The mode is the value that appears most often. The range is the difference between the greatest and the least."],
 ejemplos:[{e:"2, 4, 4, 6, 9",es:"media: 25 ÷ 5 = 5",en:"mean: 25 ÷ 5 = 5"},{e:"2, 4, 4, 6, 9",es:"mediana: 4 · moda: 4",en:"median: 4 · mode: 4"},{e:"9 − 2",es:"rango: 7",en:"range: 7"}]});
lec({id:"probabilidad",nivel:"g68",area:"matematicas",ico:"🎲",titulo:["Probabilidad","Probability"],
 instr:["Cuenta los casos favorables y los casos posibles. Escribe la probabilidad como fracción.","Count the favorable outcomes and the possible outcomes. Write the probability as a fraction."],
 explica:["La probabilidad dice qué tan posible es que algo pase. Se calcula así: casos favorables ÷ casos posibles. Si una bolsa tiene 3 canicas rojas y 5 azules, la probabilidad de sacar una roja es 3/8. Va de 0 (imposible) a 1 (seguro).","Probability tells how likely something is to happen. It's found like this: favorable outcomes ÷ possible outcomes. If a bag has 3 red marbles and 5 blue ones, the probability of picking red is 3/8. It goes from 0 (impossible) to 1 (certain)."],
 ejemplos:[{e:"🔴🔴🔴🔵🔵🔵🔵🔵",es:"P(roja) = 3/8",en:"P(red) = 3/8"},{e:"🎲",es:"P(sacar 6) = 1/6",en:"P(rolling a 6) = 1/6"},{e:"0 … 1",es:"imposible … seguro",en:"impossible … certain"}]});
lec({id:"funciones",nivel:"g68",area:"algebra",ico:"📐",titulo:["Álgebra: funciones lineales","Algebra: linear functions"],
 instr:["Mira cómo cambia y cuando x aumenta 1. Ese cambio es la pendiente. Después busca la regla.","See how y changes when x goes up by 1. That change is the slope. Then find the rule."],
 explica:["Una función lineal tiene la forma y = mx + b. La pendiente m dice cuánto cambia y cada vez que x aumenta 1, y b es el valor de y cuando x = 0. En la tabla x: 0, 1, 2 → y: 3, 5, 7, la y sube de 2 en 2, así que m = 2, y empieza en 3, así que b = 3: y = 2x + 3.","A linear function has the form y = mx + b. The slope m tells how much y changes each time x goes up by 1, and b is the value of y when x = 0. In the table x: 0, 1, 2 → y: 3, 5, 7, y goes up by 2, so m = 2, and it starts at 3, so b = 3: y = 2x + 3."],
 ejemplos:[{e:"x: 0, 1, 2 → y: 3, 5, 7",es:"y = 2x + 3",en:"y = 2x + 3"},{e:"m = 2",es:"sube 2 por cada 1",en:"up 2 for every 1"},{e:"b = 3",es:"empieza en 3",en:"starts at 3"}]});
lec({id:"acentos",nivel:"g68",area:"gramatica",ico:"´",titulo:["Acentos: agudas, llanas y esdrújulas","Accents: agudas, llanas and esdrújulas"],
 instr:["Separa la palabra en sílabas y busca la que suena más fuerte (la sílaba tónica). Después aplica la regla.","Split the word into syllables and find the one that sounds strongest (the stressed syllable). Then apply the rule."],
 explica:["Las palabras agudas se pronuncian más fuerte en la última sílaba y llevan tilde si terminan en vocal, n o s: can-ción, ca-fé, pero re-loj no. Las llanas (o graves) suenan fuerte en la penúltima y llevan tilde si NO terminan en vocal, n o s: ár-bol, lá-piz, pero me-sa no. Las esdrújulas suenan fuerte en la antepenúltima y siempre llevan tilde: mú-si-ca, pá-ja-ro.","In Spanish, agudas are stressed on the last syllable and take an accent mark if they end in a vowel, n or s: can-ción, ca-fé, but not re-loj. Llanas (graves) are stressed on the second-to-last syllable and take an accent mark if they do NOT end in a vowel, n or s: ár-bol, lá-piz, but not me-sa. Esdrújulas are stressed on the third-to-last syllable and always take an accent mark: mú-si-ca, pá-ja-ro."],
 tabla:[["tipo","sílaba fuerte","¿tilde?","ejemplos"],["aguda","última","si termina en vocal, n o s","canción, café, reloj"],["llana","penúltima","si NO termina en vocal, n o s","árbol, lápiz, mesa"],["esdrújula","antepenúltima","siempre","música, pájaro"]],
 ejemplos:[{e:"can-CIÓN",es:"aguda con tilde",en:"aguda with accent"},{e:"ÁR-bol",es:"llana con tilde",en:"llana with accent"},{e:"MÚ-si-ca",es:"esdrújula: siempre tilde",en:"esdrújula: always an accent"}]});
lec({id:"figurado",nivel:"g68",area:"lectura",ico:"🎭",titulo:["Lenguaje figurado","Figurative language"],
 instr:["Lee cada frase y decide qué figura usa el autor y qué quiere decir de verdad.","Read each phrase and decide which figure the author uses and what it really means."],
 explica:["El lenguaje figurado dice las cosas de forma creativa, no literal. El símil compara usando «como»: corre como el viento. La metáfora dice que una cosa es otra: sus ojos son dos luceros. La personificación le da acciones humanas a algo que no es persona: el viento susurraba. La hipérbole exagera: te lo dije un millón de veces.","Figurative language says things creatively, not literally. A simile compares using «like» or «as»: runs like the wind. A metaphor says one thing is another: her eyes are two stars. Personification gives human actions to something that isn't a person: the wind whispered. Hyperbole exaggerates: I told you a million times."],
 ejemplos:[{e:"🌬️🏃",es:"símil: corre como el viento",en:"simile: runs like the wind"},{e:"✨👀",es:"metáfora: sus ojos son dos luceros",en:"metaphor: her eyes are two stars"},{e:"🍃🗣️",es:"personificación: el viento susurraba",en:"personification: the wind whispered"}],
 ejercicios:[
  {q:["«Corre tan rápido como el viento.» ¿Qué figura es?","«He runs as fast as the wind.» Which figure is it?"],o:[["símil","simile"],["metáfora","metaphor"],["hipérbole","hyperbole"]],a:0},
  {q:["«Sus ojos son dos luceros.» ¿Qué figura es?","«Her eyes are two stars.» Which figure is it?"],o:[["metáfora","metaphor"],["símil","simile"],["personificación","personification"]],a:0},
  {q:["«El viento susurraba entre los árboles.» ¿Qué figura es?","«The wind whispered through the trees.» Which figure is it?"],o:[["personificación","personification"],["hipérbole","hyperbole"],["símil","simile"]],a:0},
  {q:["«Te lo he dicho un millón de veces.» ¿Qué figura es?","«I've told you a million times.» Which figure is it?"],o:[["hipérbole","hyperbole"],["metáfora","metaphor"],["personificación","personification"]],a:0},
  {q:["«El sol nos sonríe cada mañana.» ¿Qué figura es?","«The sun smiles at us every morning.» Which figure is it?"],o:[["personificación","personification"],["símil","simile"],["hipérbole","hyperbole"]],a:0},
  {q:["«Es tan alto como una jirafa.» ¿Qué quiere decir?","«He's as tall as a giraffe.» What does it mean?"],o:[["Que es muy alto.","That he is very tall."],["Que es una jirafa.","That he is a giraffe."],["Que vive en el zoológico.","That he lives at the zoo."]],a:0},
  {q:["«Mi cuarto es un horno.» ¿Qué quiere decir?","«My room is an oven.» What does it mean?"],o:[["Que hace mucho calor.","That it's very hot."],["Que ahí se cocina.","That people cook there."],["Que es muy pequeño.","That it's very small."]],a:0}
 ]});
lec({id:"materia",nivel:"g68",area:"ciencias",ico:"⚗️",titulo:["Ciencias: átomos y cambios químicos","Science: atoms and chemical changes"],
 instr:["Lee la explicación. Fíjate si en cada cambio se forma una sustancia nueva o no.","Read the explanation. Notice whether each change makes a new substance or not."],
 explica:["Toda la materia está hecha de átomos, partículas tan pequeñas que no se ven. Un elemento tiene un solo tipo de átomo, como el oxígeno o el hierro. Un compuesto une átomos de distintos elementos, como el agua (H₂O). En un cambio físico la sustancia sigue siendo la misma, como el hielo que se derrite. En un cambio químico se forma una sustancia nueva, como la madera que se quema o el hierro que se oxida. En una reacción química la masa total no cambia.","All matter is made of atoms, particles too small to see. An element has only one kind of atom, like oxygen or iron. A compound joins atoms of different elements, like water (H₂O). In a physical change the substance stays the same, like ice melting. In a chemical change a new substance forms, like wood burning or iron rusting. In a chemical reaction the total mass does not change."],
 ejemplos:[{e:"🧊→💧",es:"cambio físico",en:"physical change"},{e:"🔥🪵",es:"cambio químico",en:"chemical change"},{e:"H₂O",es:"compuesto: agua",en:"compound: water"}],
 ejercicios:[
  {q:["¿Qué tipo de cambio es el hielo que se derrite?","What kind of change is ice melting?"],o:[["físico","physical"],["químico","chemical"]],a:0},
  {q:["¿Qué tipo de cambio es la madera que se quema?","What kind of change is wood burning?"],o:[["químico","chemical"],["físico","physical"]],a:0},
  {q:["El agua (H₂O) es…","Water (H₂O) is…"],o:[["un compuesto","a compound"],["un elemento","an element"],["un átomo solo","a single atom"]],a:0},
  {q:["¿Qué señal indica un cambio químico?","Which sign shows a chemical change?"],o:[["Se forma una sustancia nueva, con gas, color u olor nuevos.","A new substance forms, with new gas, color or smell."],["El objeto cambia de forma.","The object changes shape."],["El agua se congela.","Water freezes."]],a:0},
  {q:["En una reacción química, la masa total…","In a chemical reaction, the total mass…"],o:[["se conserva","stays the same"],["desaparece","disappears"],["siempre aumenta","always increases"]],a:0},
  {q:["Cortar papel en pedazos es un cambio…","Cutting paper into pieces is a…"],o:[["físico","physical change"],["químico","chemical change"]],a:0}
 ]});
lec({id:"herencia",nivel:"g68",area:"biologia",ico:"🧬",titulo:["Biología: rasgos heredados","Biology: inherited traits"],
 instr:["Lee la explicación y decide si cada rasgo se hereda o se aprende.","Read the explanation and decide whether each trait is inherited or learned."],
 explica:["Los rasgos heredados pasan de padres a hijos por medio de los genes, que están en el ADN dentro del núcleo de las células. En la reproducción sexual, cada hijo recibe la mitad de sus genes de cada progenitor; por eso los hermanos se parecen pero no son iguales. Los rasgos adquiridos se aprenden o se forman durante la vida, como hablar un idioma o tener una cicatriz, y no se heredan.","Inherited traits pass from parents to offspring through genes, which are in the DNA inside the nucleus of cells. In sexual reproduction, each offspring gets half of its genes from each parent; that's why siblings look alike but aren't identical. Acquired traits are learned or formed during life, like speaking a language or having a scar, and are not inherited."],
 ejemplos:[{e:"👁️",es:"color de ojos: heredado",en:"eye color: inherited"},{e:"🗣️",es:"hablar español: aprendido",en:"speaking Spanish: learned"},{e:"🧬",es:"los genes están en el ADN",en:"genes are in DNA"}],
 ejercicios:[
  {q:["¿Dónde están los genes?","Where are genes found?"],o:[["en el ADN, dentro del núcleo","in the DNA, inside the nucleus"],["en la piel solamente","only in the skin"],["en la sangre del corazón","in the heart's blood"]],a:0},
  {q:["El color de ojos es un rasgo…","Eye color is a trait that is…"],o:[["heredado","inherited"],["aprendido","learned"]],a:0},
  {q:["Saber andar en bicicleta es un rasgo…","Knowing how to ride a bike is a trait that is…"],o:[["aprendido","learned"],["heredado","inherited"]],a:0},
  {q:["En la reproducción sexual, ¿cuántos genes recibes de cada progenitor?","In sexual reproduction, how many genes do you get from each parent?"],o:[["la mitad","half"],["todos","all of them"],["ninguno","none"]],a:0},
  {q:["¿Por qué los hermanos no son iguales?","Why aren't siblings identical?"],o:[["Cada uno recibe una combinación distinta de genes.","Each one gets a different combination of genes."],["Porque comen diferente.","Because they eat differently."],["Porque nacieron en días distintos.","Because they were born on different days."]],a:0}
 ]});
lec({id:"patronesnum",nivel:"g35",area:"algebra",ico:"🔢",titulo:["Álgebra: patrones numéricos","Algebra: number patterns"],
 instr:["Busca la regla que convierte cada número en el siguiente. Después úsala para encontrar el número que sigue.","Find the rule that turns each number into the next. Then use it to find the next number."],
 explica:["Un patrón numérico sigue una regla. Para encontrarla, compara dos números seguidos: ¿se suma, se resta o se multiplica? En 3, 7, 11, 15 la regla es «sumar 4», así que sigue 19. Comprueba la regla con todos los números, no solo con los dos primeros.","A number pattern follows a rule. To find it, compare two numbers in a row: is something added, subtracted or multiplied? In 3, 7, 11, 15 the rule is «add 4», so 19 comes next. Check the rule with every number, not just the first two."],
 ejemplos:[{e:"3, 7, 11, 15 → 19",es:"regla: +4",en:"rule: +4"},{e:"2, 4, 8, 16 → 32",es:"regla: ×2",en:"rule: ×2"},{e:"50, 45, 40, 35 → 30",es:"regla: −5",en:"rule: −5"}]});
lec({id:"perimetro",nivel:"g35",area:"geometria",ico:"📏",dibujo:()=>svgRect(5,3),titulo:["Geometría: perímetro y área","Geometry: perimeter and area"],
 instr:["Mira el rectángulo y sus medidas. Lee bien si te piden el perímetro o el área antes de contestar.","Look at the rectangle and its measurements. Read carefully whether you're asked for perimeter or area before answering."],
 explica:["El perímetro es lo que mide el borde: se suman todos los lados. En un rectángulo: largo + ancho + largo + ancho. El área es el espacio de adentro: se multiplica largo × ancho y se mide en unidades cuadradas (cm²).","Perimeter is the distance around the edge: add all the sides. For a rectangle: length + width + length + width. Area is the space inside: multiply length × width, measured in square units (cm²)."],
 tabla:[["","¿qué mide?","rectángulo de 5 × 3"],["perímetro","el borde","5 + 3 + 5 + 3 = 16 cm"],["área","el espacio de adentro","5 × 3 = 15 cm²"]],
 ejemplos:[{e:"▭ 5 × 3",es:"perímetro: 16 cm",en:"perimeter: 16 cm"},{e:"▭ 5 × 3",es:"área: 15 cm²",en:"area: 15 cm²"},{e:"🟥 4 × 4",es:"perímetro 16 cm, área 16 cm²",en:"perimeter 16 cm, area 16 cm²"}]});
lec({id:"angulos35",nivel:"g35",area:"geometria",ico:"📐",dibujo:()=>svgFila([45,90,130,180].map(svgAngulo)),titulo:["Geometría: tipos de ángulos","Geometry: types of angles"],
 instr:["Mira cada ángulo y su medida. Decide si es agudo, recto, obtuso o llano.","Look at each angle and its measure. Decide if it is acute, right, obtuse or straight."],
 explica:["Un ángulo se forma cuando dos líneas salen del mismo punto, y se mide en grados (°). Agudo: menos de 90°. Recto: exactamente 90°, como la esquina de una hoja. Obtuso: más de 90° y menos de 180°. Llano: 180°, una línea recta.","An angle forms when two lines start from the same point, and it is measured in degrees (°). Acute: less than 90°. Right: exactly 90°, like the corner of a sheet of paper. Obtuse: more than 90° and less than 180°. Straight: 180°, a straight line."],
 tabla:[["ángulo","medida"],["agudo","menos de 90°"],["recto","90°"],["obtuso","entre 90° y 180°"],["llano","180°"]],
 ejemplos:[{e:"45°",es:"agudo",en:"acute"},{e:"90°",es:"recto",en:"right"},{e:"130°",es:"obtuso",en:"obtuse"},{e:"180°",es:"llano",en:"straight"}]});
lec({id:"expresiones",nivel:"g68",area:"algebra",ico:"🔣",titulo:["Álgebra: expresiones","Algebra: expressions"],
 instr:["Practica tres cosas: evaluar una expresión, juntar términos semejantes y usar la propiedad distributiva.","Practice three things: evaluating an expression, combining like terms and using the distributive property."],
 explica:["Una expresión algebraica combina números y variables, como 3x + 2. Evaluar es cambiar la variable por su valor: si x = 4, 3x + 2 = 12 + 2 = 14. Los términos semejantes tienen la misma variable y se suman: 2x + 5x = 7x. La propiedad distributiva multiplica lo de afuera por cada término: 3(x + 4) = 3x + 12.","An algebraic expression combines numbers and variables, like 3x + 2. Evaluating means replacing the variable with its value: if x = 4, 3x + 2 = 12 + 2 = 14. Like terms have the same variable and are added: 2x + 5x = 7x. The distributive property multiplies the outside number by each term: 3(x + 4) = 3x + 12."],
 ejemplos:[{e:"x = 4",es:"3x + 2 = 14",en:"3x + 2 = 14"},{e:"➕",es:"2x + 5x = 7x",en:"2x + 5x = 7x"},{e:"✖️",es:"3(x + 4) = 3x + 12",en:"3(x + 4) = 3x + 12"}]});
lec({id:"dospasos",nivel:"g68",area:"algebra",ico:"⚖️",titulo:["Álgebra: ecuaciones de dos pasos","Algebra: two-step equations"],
 instr:["Resuelve cada ecuación en dos pasos y comprueba tu respuesta poniéndola en lugar de la x.","Solve each equation in two steps and check your answer by putting it in place of x."],
 explica:["Para resolver 2x + 3 = 11, deshaz las operaciones en orden contrario. Paso 1: quita lo que se suma o se resta (11 − 3 = 8, queda 2x = 8). Paso 2: divide entre el número que multiplica a la x (8 ÷ 2 = 4). Comprueba: 2 · 4 + 3 = 11.","To solve 2x + 3 = 11, undo the operations in reverse order. Step 1: remove what is added or subtracted (11 − 3 = 8, leaving 2x = 8). Step 2: divide by the number multiplying x (8 ÷ 2 = 4). Check: 2 · 4 + 3 = 11."],
 ejemplos:[{e:"2x + 3 = 11",es:"2x = 8 → x = 4",en:"2x = 8 → x = 4"},{e:"5x − 4 = 21",es:"5x = 25 → x = 5",en:"5x = 25 → x = 5"},{e:"3x + 6 = 6",es:"3x = 0 → x = 0",en:"3x = 0 → x = 0"}]});
lec({id:"triangulos",nivel:"g68",area:"geometria",ico:"🔺",dibujo:()=>svgTriangulo(50,60,"70°"),titulo:["Geometría: ángulos del triángulo","Geometry: triangle angles"],
 instr:["Usa la regla de los 180° para encontrar el ángulo que falta en cada triángulo.","Use the 180° rule to find the missing angle in each triangle."],
 explica:["Los tres ángulos de cualquier triángulo siempre suman 180°. Para encontrar el que falta, suma los dos que conoces y réstalo de 180. Si los ángulos son 50° y 60°, el tercero es 180 − 110 = 70°.","The three angles of any triangle always add up to 180°. To find the missing one, add the two you know and subtract from 180. If the angles are 50° and 60°, the third is 180 − 110 = 70°."],
 ejemplos:[{e:"50° + 60° + ?",es:"? = 70°",en:"? = 70°"},{e:"90° + 45° + ?",es:"? = 45°",en:"? = 45°"},{e:"60° + 60° + ?",es:"? = 60° (equilátero)",en:"? = 60° (equilateral)"}]});
lec({id:"areas68",nivel:"g68",area:"geometria",ico:"⭕",dibujo:()=>svgCirculo(5),titulo:["Geometría: área del triángulo y del círculo","Geometry: area of triangles and circles"],
 instr:["Mira la figura y sus medidas. Usa la fórmula correcta y π ≈ 3.14 para los círculos.","Look at the shape and its measurements. Use the right formula and π ≈ 3.14 for circles."],
 explica:["Área del triángulo: base × altura ÷ 2. Área del círculo: π × r², donde r es el radio. La circunferencia (el borde del círculo) es 2 × π × r. En estos ejercicios usamos π ≈ 3.14.","Area of a triangle: base × height ÷ 2. Area of a circle: π × r², where r is the radius. The circumference (the edge of the circle) is 2 × π × r. In these exercises we use π ≈ 3.14."],
 tabla:[["figura","fórmula"],["triángulo (área)","base × altura ÷ 2"],["círculo (área)","π × r²"],["círculo (circunferencia)","2 × π × r"]],
 ejemplos:[{e:"🔺 b = 6, h = 4",es:"área = 12",en:"area = 12"},{e:"⭕ r = 5",es:"área = 78.5",en:"area = 78.5"},{e:"⭕ r = 5",es:"circunferencia = 31.4",en:"circumference = 31.4"}]});
lec({id:"pitagoras",nivel:"g68",area:"geometria",ico:"📐",dibujo:()=>svgRectangulo(3,4,"5"),titulo:["Geometría: teorema de Pitágoras","Geometry: Pythagorean theorem"],
 instr:["En cada triángulo rectángulo, encuentra el lado que falta con a² + b² = c².","In each right triangle, find the missing side using a² + b² = c²."],
 explica:["En un triángulo rectángulo, el lado más largo se llama hipotenusa (c) y está frente al ángulo recto. Los otros dos son los catetos (a y b). Siempre se cumple a² + b² = c². Si a = 3 y b = 4: 9 + 16 = 25, y la raíz de 25 es 5, así que c = 5.","In a right triangle, the longest side is the hypotenuse (c), opposite the right angle. The other two are the legs (a and b). It's always true that a² + b² = c². If a = 3 and b = 4: 9 + 16 = 25, and the square root of 25 is 5, so c = 5."],
 ejemplos:[{e:"3, 4 → ?",es:"c = 5",en:"c = 5"},{e:"6, 8 → ?",es:"c = 10",en:"c = 10"},{e:"5, ? → 13",es:"b = 12",en:"b = 12"}]});

/* ---------- Generadores ---------- */
const PATRON_EMOJIS=[["🔴","🔵","🟢"],["🐶","🐱","🐰"],["⭐","🌙","☀️"],["🍎","🍌","🍇"],["🚗","🚌","🚲"],["🟥","🟨","🟦"]];
const FIGURAS=[[3,"triángulo","triangle"],[4,"cuadrado","square"],[5,"pentágono","pentagon"],[6,"hexágono","hexagon"],[8,"octágono","octagon"],[0,"círculo","circle"]];
const TRIPLES=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[7,24,25],[12,16,20],[15,20,25]];
Object.assign(GENL,{
  patrones(){const set=PATRON_EMOJIS[R(0,PATRON_EMOJIS.length-1)];const tipos=[[0,1],[0,0,1],[0,1,2],[0,1,1]];const pat=tipos[R(0,tipos.length-1)];
    const largo=pat.length*2+R(0,pat.length-1);const fila=Array.from({length:largo},(_,k)=>set[pat[k%pat.length]]);const sig=set[pat[largo%pat.length]];
    const malas=set.filter(x=>x!==sig);const ops=mezclar([sig,...malas]).slice(0,3);if(!ops.includes(sig))ops[0]=sig;const o=mezclar(ops);
    return {q:["¿Qué sigue en el patrón?","What comes next in the pattern?"],v:fila.join(" ")+" ❓",o,a:o.indexOf(sig),grande:true}},

/* Fuente de preguntas sin fin: mezcla preguntas nuevas con las de la lección y evita repetir la anterior */
function fuenteSinFin(l){
  let bolsa=[],ultima="";
  const estatica=()=>{if(!bolsa.length) bolsa=preguntasDe(l,99);return bolsa.pop()};
  const nueva=()=>{
    if(l.gen) return {...GEN[l.gen](),lec:l.id};
    const g=GENL[l.id];
    if(g&&(!l.ejercicios||Math.random()<.7)) return {...g(),lec:l.id};
    return estatica();
  };
  const base=()=>{let q,k=0;do{q=nueva();k++}while(k<6&&q.q[0]+(q.v||"")===ultima);ultima=q.q[0]+(q.v||"");return q};
  // Avanzado: a veces trae un reto de la misma materia del nivel siguiente
  const orden=["pk","g12","g35","g68"],sig=orden[orden.indexOf(l.nivel)+1];
  const otras=sig?L.filter(x=>x.nivel===sig&&x.area===l.area&&!x.frases&&(x.gen||GENL[x.id]||x.ejercicios)):[];
  const fuentesReto={};
  return ()=>{
    let q=base();
    if(apoyo==="avanzado"&&otras.length&&Math.random()<.25){
      try{const o2=otras[R(0,otras.length-1)];if(!fuentesReto[o2.id])fuentesReto[o2.id]=fuenteSinFin.__crudo(o2);const r=fuentesReto[o2.id]();if(r&&r.q)q={...r,reto:true}}catch(e){}
    }
    if(apoyo==="simplificado"&&(q.tipo||"mc")==="mc"&&q.o&&q.o.length>2){
      const malas=q.o.map((o,i)=>i).filter(i=>i!==q.a);const quita=malas[R(0,malas.length-1)];
      const o=q.o.filter((x,i)=>i!==quita);q={...q,o,a:o.indexOf(q.o[q.a])};
    }
    return q};
}

fuenteSinFin.__crudo=l=>{let bolsa=[];const est=()=>{if(!bolsa.length)bolsa=preguntasDe(l,99);return bolsa.pop()};
