const PATRON_EMOJIS=[["🔴","🔵","🟢"],["🐶","🐱","🐰"],["⭐","🌙","☀️"],["🍎","🍌","🍇"],["🚗","🚌","🚲"],["🟥","🟨","🟦"]];
const FIGURAS=[[3,"triángulo","triangle"],[4,"cuadrado","square"],[5,"pentágono","pentagon"],[6,"hexágono","hexagon"],[8,"octágono","octagon"],[0,"círculo","circle"]];
const TRIPLES=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[7,24,25],[12,16,20],[15,20,25]];
Object.assign(GENL,{
  patrones(){const set=PATRON_EMOJIS[R(0,PATRON_EMOJIS.length-1)];const tipos=[[0,1],[0,0,1],[0,1,2],[0,1,1]];const pat=tipos[R(0,tipos.length-1)];
    const largo=pat.length*2+R(0,pat.length-1);const fila=Array.from({length:largo},(_,k)=>set[pat[k%pat.length]]);const sig=set[pat[largo%pat.length]];
    const malas=set.filter(x=>x!==sig);const ops=mezclar([sig,...malas]).slice(0,3);if(!ops.includes(sig))ops[0]=sig;const o=mezclar(ops);
    return {q:["¿Qué sigue en el patrón?","What comes next in the pattern?"],v:fila.join(" ")+" ❓",o,a:o.indexOf(sig),grande:true}},
  numfalta(){const t=R(0,2);let a,b,c,txt,ans;
    if(t===0){a=R(1,12);ans=R(1,20-a);c=a+ans;txt=`${a} + □ = ${c}`}
    else if(t===1){b=R(1,12);ans=R(1,20-b);c=ans+b;txt=`□ + ${b} = ${c}`}
    else{a=R(5,20);ans=R(1,a-1);c=a-ans;txt=`${a} − □ = ${c}`}
    return {q:["¿Qué número va en el cuadrito?","Which number goes in the box?"],v:txt,...opcionesNum(ans,0,20)}},
  lados(){const [n,es,en]=FIGURAS[R(0,FIGURAS.length-1)];const t=R(0,2);
    if(t===0) return {q:[`¿Cuántos lados tiene esta figura?`,`How many sides does this shape have?`],v:svgPoligono(n),...opc3(String(n),["3","4","5","6","8","0"].filter(x=>x!==String(n)))};
    if(t===1) return {q:[`¿Cómo se llama esta figura?`,`What is this shape called?`],v:svgPoligono(n),...opc3([es,en],FIGURAS.filter(f=>f[0]!==n).map(f=>[f[1],f[2]]))};
    return {q:[`¿Cuántos vértices (esquinas) tiene un ${es}?`,`How many vertices (corners) does a ${en} have?`],...opc3(String(n),["3","4","5","6","8","0"].filter(x=>x!==String(n)))}},
  patronesnum(){const t=R(0,2);let serie,sig,regla,malasR;
    if(t===0){const d=R(2,9),a=R(1,20);serie=[0,1,2,3].map(k=>a+d*k);sig=a+4*d;regla=`+${d}`;malasR=[`+${d+1}`,`−${d}`,`×${d}`]}
    else if(t===1){const d=R(2,8),a=R(40,90);serie=[0,1,2,3].map(k=>a-d*k);sig=a-4*d;regla=`−${d}`;malasR=[`+${d}`,`−${d+1}`,`×2`]}
    else{const m=R(2,3),a=R(1,5);serie=[0,1,2,3].map(k=>a*m**k);sig=a*m**4;regla=`×${m}`;malasR=[`+${m}`,`×${m+1}`,`+${serie[1]-serie[0]}`]}
    if(Math.random()<.6) return {q:["¿Qué número sigue?","Which number comes next?"],v:serie.join(", ")+", …",...opcionesNum(sig,0,9999)};
    return {q:["¿Cuál es la regla del patrón?","What is the rule of the pattern?"],v:serie.join(", "),...opc3(regla,[...new Set(malasR)].filter(x=>x!==regla))}},
  perimetro(){const w=R(2,12),h=R(2,9),per=2*(w+h),ar=w*h,pideArea=Math.random()<.5;
    const c=pideArea?`${ar} cm²`:`${per} cm`,otra=pideArea?`${per} cm²`:`${ar} cm`,otra2=pideArea?`${w+h} cm²`:`${w+h} cm`;
    return {q:pideArea?["¿Cuál es el área del rectángulo?","What is the area of the rectangle?"]:["¿Cuál es el perímetro del rectángulo?","What is the perimeter of the rectangle?"],v:svgRect(w,h),...opc3(c,[otra,otra2].filter(x=>x!==c))}},
  angulos35(){const lista=[[R(2,17)*5,"agudo","acute"],[90,"recto","right"],[R(19,35)*5,"obtuso","obtuse"],[180,"llano","straight"]];const [g,es,en]=lista[R(0,3)];
    const nombres=[["agudo","acute"],["recto","right"],["obtuso","obtuse"],["llano","straight"]];
    return {q:["¿Qué tipo de ángulo es?","What type of angle is it?"],v:svgAngulo(g),...opc3([es,en],nombres.filter(x=>x[0]!==es))}},
  expresiones(){const t=R(0,2);
    if(t===0){const a=R(2,9),b=R(1,12),x=R(1,10),c=a*x+b;return {q:[`Si x = ${x}, ¿cuánto vale ${a}x + ${b}?`,`If x = ${x}, what is ${a}x + ${b}?`],...opcionesNum(c,0,999)}}
    if(t===1){const a=R(2,9),b=R(2,9),s=a+b;return {q:["Junta los términos semejantes.","Combine like terms."],v:`${a}x + ${b}x`,...opc3(`${s}x`,[`${a*b}x`,`${s}x²`,`${s+1}x`])}}
    const a=R(2,9),b=R(1,9);return {q:["Usa la propiedad distributiva.","Use the distributive property."],v:`${a}(x + ${b})`,...opc3(`${a}x + ${a*b}`,[`${a}x + ${b}`,`x + ${a*b}`,`${a+b}x`])}},
  dospasos(){const a=R(2,9),x=R(0,12),b=R(1,20),resta=Math.random()<.4,c=resta?a*x-b:a*x+b;
    return {q:["Resuelve. ¿Cuánto vale x?","Solve. What is x?"],v:`${a}x ${resta?"−":"+"} ${b} = ${c}`,...opcionesNum(x,-20,99)}},
  triangulos(){let a=R(3,14)*5,b=R(3,14)*5;while(a+b>=170)b=R(3,10)*5;const c=180-a-b;
    return {q:["¿Cuánto mide el ángulo que falta?","What is the missing angle?"],v:svgTriangulo(a,b,"?"),...opc3(`${c}°`,[`${c+10}°`,`${Math.abs(c-10)}°`,`${360-a-b}°`].filter(x=>x!==`${c}°`))}},
  areas68(){const t=R(0,2);
    if(t===0){const b=R(2,12)*2,h=R(2,10),ar=b*h/2;return {q:[`Triángulo: base = ${b}, altura = ${h}. ¿Cuál es el área?`,`Triangle: base = ${b}, height = ${h}. What is the area?`],...opc3(String(ar),[String(b*h),String(b+h),String(ar+h)])}}
    const r=R(1,10),area=fmt(3.14*r*r),circ=fmt(2*3.14*r);
    if(t===1) return {q:[`Círculo de radio ${r}. ¿Cuál es el área? (π ≈ 3.14)`,`Circle with radius ${r}. What is the area? (π ≈ 3.14)`],v:svgCirculo(r),...opc3(area,[circ,fmt(3.14*r),fmt(3.14*r*r*2)].filter(x=>x!==area))};
    return {q:[`Círculo de radio ${r}. ¿Cuál es la circunferencia? (π ≈ 3.14)`,`Circle with radius ${r}. What is the circumference? (π ≈ 3.14)`],v:svgCirculo(r),...opc3(circ,[area,fmt(3.14*r),fmt(4*3.14*r)].filter(x=>x!==circ))}},
  pitagoras(){const [a,b,c]=TRIPLES[R(0,TRIPLES.length-1)];
    if(Math.random()<.6) return {q:["¿Cuánto mide la hipotenusa?","How long is the hypotenuse?"],v:svgRectangulo(a,b,"?"),...opc3(String(c),[String(a+b),String(c+1),String(c-1)].filter(x=>x!==String(c)))};
    return {q:[`La hipotenusa mide ${c}. ¿Cuánto mide el cateto que falta?`,`The hypotenuse is ${c}. How long is the missing leg?`],v:svgRectangulo(a,"?",c),...opc3(String(b),[String(c-a),String(b+1),String(a)].filter(x=>x!==String(b)))}}
});

/* Fuente de preguntas sin fin: mezcla preguntas nuevas con las de la lección y evita repetir la anterior */
function fuenteSinFin(l){

function decir(partes){pararVoz();cola=[...partes];hablando=true;Musica.bajar();siguiente()}
function siguiente(){
  const p=cola.shift(); if(!p){hablando=false;Musica.subir();return}
  const c=p[1], txt=lugar(p[0],c), clip=CLIPS.get(c+"|"+txt);
  if(clip){audioActual=new Audio(clip);audioActual.onended=siguiente;audioActual.play().catch(()=>{audioActual=null;sintetizar(txt,c)});return}
  sintetizar(txt,c);
}
function sintetizar(txt,c){
  if(!("speechSynthesis" in window)){siguiente();return}
  const limpio=textoParaVoz(txt,c); if(!limpio){siguiente();return}
  const v=mejorVoz(c), lento=store.get("vozLenta",false), trozos=enOraciones(limpio);
  let empezo=false;
  const hablarTodo=()=>{
    trozos.forEach((tr,k)=>{
      const u=new SpeechSynthesisUtterance(tr);
      u.lang=c==="es"?datoPais().loc:"en-US"; if(v) u.voice=v;
      u.rate=lento?.78:.92; u.pitch=1; u.volume=1;
      u.onstart=()=>{empezo=true;vozFunciona=true};
      u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled"){avisoVoz();if(k===trozos.length-1)siguiente()}};
      if(k===trozos.length-1) u.onend=siguiente;
      speechSynthesis.speak(u);
    });
    if(speechSynthesis.paused) speechSynthesis.resume();
    setTimeout(()=>{if(!empezo&&hablando) avisoVoz()},2500);
  };
  const espera=Date.now()-canceladoEn;
  if(espera<150) setTimeout(hablarTodo,150-espera); else hablarTodo();
}

let ac=null;
const audioCtx=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac};

function tono(notas,vol=.16,forma="triangle"){if(!efectosOn)return;try{const a=audioCtx();if(!a)return;const t0=a.currentTime;
  notas.forEach(([f,d,i])=>{const o=a.createOscillator(),g=a.createGain();o.type=forma;o.frequency.value=f;o.connect(g);g.connect(a.destination);
    g.gain.setValueAtTime(.0001,t0+i);g.gain.exponentialRampToValueAtTime(vol,t0+i+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+i+d);o.start(t0+i);o.stop(t0+i+d+.05)})}catch(e){}}
const sBien=()=>tono([[660,.15,0],[880,.22,.12]]),
      sMal=()=>tono([[240,.12,0],[200,.18,.1]],.12,"sine"),
      sFin=()=>tono([[523,.15,0],[659,.15,.15],[784,.15,.3],[1046,.4,.45]]),
      sToque=()=>tono([[700,.05,0]],.06,"sine"),
      sPagina=()=>tono([[420,.08,0],[630,.1,.06]],.07,"sine"),
      sEstrella=()=>tono([[1318,.08,0],[1760,.12,.07]],.08,"sine"),
      sBuho=()=>tono([[392,.22,0],[330,.35,.28]],.14,"sine"),

/* Música de fondo: una melodía original y alegre en escala pentatónica. Baja el volumen cuando habla la voz. */
const Musica={on:store.get("musica",false),master:null,timer:null,siguienteT:0,paso:0,
  MEL:[0,2,4,7,4,2,4,-1, 7,9,7,4,2,4,2,-1, 0,2,4,7,9,7,4,2, 4,2,0,2,0,-1,-1,-1],
  BAJO:[0,0,-3,-3,-7,-7,-5,-5],
  ESC:{0:261.63,2:293.66,4:329.63,7:392,9:440,"-3":220,"-5":196,"-7":174.61},
  iniciar(){const a=audioCtx();if(!a)return;if(!this.master){this.master=a.createGain();this.master.gain.value=.0001;this.master.connect(a.destination)}
    this.master.gain.setTargetAtTime(hablando?.012:.045,a.currentTime,.3);this.siguienteT=a.currentTime+.1;
    clearInterval(this.timer);this.timer=setInterval(()=>this.programar(),120)},
  detener(){clearInterval(this.timer);this.timer=null;if(this.master&&ac)this.master.gain.setTargetAtTime(.0001,ac.currentTime,.2)},
  nota(f,t,d,tipo,v){const o=ac.createOscillator(),g=ac.createGain();o.type=tipo;o.frequency.value=f;o.connect(g);g.connect(this.master);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)},
  programar(){if(!ac)return;const corchea=.32;
    while(this.siguienteT<ac.currentTime+.6){const i=this.paso%this.MEL.length,m=this.MEL[i];
      if(m>=0) this.nota(this.ESC[m]*2,this.siguienteT,corchea*.9,"sine",.5);
      if(i%4===0){const b=this.BAJO[(i/4)%this.BAJO.length];this.nota(this.ESC[b]/2*(b===0?1:1),this.siguienteT,corchea*3.6,"triangle",.35)}
      this.siguienteT+=corchea;this.paso++}},
  bajar(){if(this.on&&this.master&&ac)this.master.gain.setTargetAtTime(.012,ac.currentTime,.15)},
  subir(){if(this.on&&this.master&&ac)this.master.gain.setTargetAtTime(.045,ac.currentTime,.6)},
  alternar(){this.on=!this.on;store.set("musica",this.on);this.on?this.iniciar():this.detener()}
};

      <div class="ejemplos">${l.ejemplos.map((e,i)=>`<button class="ejemplo" data-ej="${i}"><span class="e">${e.e}</span>${lang==="en"&&!/[áéíóúñ¿¡]/i.test(e.es)&&false?e.en:e.es}${lang!=="es"?`<small>${e.en}</small>`:""}</button>`).join("")}</div>

/* ----- Etapas del búho: cada lección crece de huevito a búho sabio (0 a 5 estrellas) ----- */
const DOM=[["Sin empezar","Not started","#c7d2df"],["🥚 Huevito","🥚 Little egg","#ffd9b8"],["🥚 Huevito","🥚 Little egg","#ffd9b8"],["🐣 Pollito","🐣 Chick","#ffe27a"],["🐦 Ya vuela","🐦 Flying","#9cc9ff"],["🦉 Búho sabio","🦉 Wise owl","#8fdcaf"]];
const dominio=n=>DOM[Math.max(0,Math.min(5,n||0))];
const insignia=n=>{const d=dominio(n);return `<span class="insignia" style="background:${d[2]}">${tx([d[0],d[1]])}</span>`};
function preguntasDe(l,n=5){
  if(l.gen) return Array.from({length:n},()=>({...GEN[l.gen](),lec:l.id}));
  return mezclar(l.ejercicios).slice(0,n).map(e=>{const orden=mezclar(e.o.map((o,i)=>i));return {...e,o:orden.map(i=>e.o[i]),a:orden.indexOf(e.a),lec:l.id}});
}
function primeraDe(t){const m=t.match(/^[\s\S]*?[.!?](?=\s|$)/);return m?m[0]:t}
function primeraOracion(p){return [primeraDe(p[0]),primeraDe(p[1])]}
/* Sesión de preguntas con pistas. Tipos: opción múltiple (con o sin audio), ordenar piezas y escribir.
   fuente(): da la siguiente pregunta. total: número de preguntas o Infinity (práctica sin fin).
   alBloque(aciertosDelBloque): cada 5 preguntas en modo sin fin. alTerminar(aciertos, resultados, contestadas). */
const limpiaResp=s=>s.trim().toLowerCase().replace(/\s+/g," ").replace(/[.!¡?¿,;:]/g,"");
const sinTilde=s=>s.replace(/ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"ñ");
function sesion(caja,fuente,total,alTerminar,alBloque){
  let i=0,aciertos=0,intentos=0,pistas=0,racha=0,bloque=0;const res=[];const sinFin=total===Infinity;
  function avanzar(){if(!caja.isConnected)return;i++;if(sinFin&&i%5===0){const b=bloque;bloque=0;if(alBloque) alBloque(b)}pintar()}
  function pintar(){
    if(i>=total) return alTerminar(aciertos,res,i);
    const p=fuente(); intentos=0; pistas=0;
    const lp=L.find(x=>x.id===p.lec), tipo=p.tipo||"mc";
    caja.__p=p; // referencia interna para pruebas automáticas (no se muestra)
    const cabeza=sinFin
      ?`<div class="fila" style="justify-content:space-between;align-items:center;margin:0 0 8px"><span class="insignia" style="background:#fff3c4">🔥 ${tx(["Racha","Streak"])}: ${racha}</span>
         <span class="sub" style="margin:0">✔ ${aciertos} / ${i}</span><button class="oir" id="terminar">🏁 ${tx(["Terminar","Finish"])}</button></div>
         <div class="barra"><i style="width:${(i%5)/5*100}%"></i></div>`
      :`<div class="barra"><i style="width:${i/total*100}%"></i></div><p class="sub">${i+1} / ${total}</p>`;
    const qHTML=lang==="bi"?`${p.q[0]}<small>${p.q[1]}</small>`:tx(p.q);
    const botonOirP=p.audio?`<button class="btn naranja" id="oirP">🔊 ${tx(["Escuchar","Listen"])}</button>`
      :p.oir?`<button class="btn naranja" id="oirP">${t("oir")}</button>`
      :p.audioQ?`<button class="btn naranja" id="oirP">🔊 ${tx(["Escuchar la pregunta","Hear the question"])}</button>`
      :`<button class="oir" id="oirP">🔊 ${lang==="en"?"Read it to me":"Léemelo"}</button>`;
    const botonPasaje=p.pasaje&&lp&&lp.audioTexto?`<button class="btn" id="pasaje">📻 ${tx(["Escuchar el audio","Listen to the audio"])}</button>`:"";
    let cuerpo="";
    if(tipo==="mc") cuerpo=`<div class="resp">${p.o.map((o,k)=>`<button data-r="${k}" style="${p.grande?"font-size:2.4rem":""}">${tx(o)}</button>`).join("")}</div>`;
    else if(tipo==="ordenar") cuerpo=`<div class="armado" id="armado" aria-label="respuesta"></div><div class="fichas" id="fichas"></div>
      <div class="fila"><button class="btn verde" id="comprobar">✔ ${tx(["Comprobar","Check"])}</button><button class="oir" id="borrarO">↩︎ ${tx(["Empezar de nuevo","Start over"])}</button></div>`;
    else cuerpo=`<div class="fila"><input id="escr" class="campo" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="respuesta"></div>
      <div class="fila"><button class="btn verde" id="comprobar">✔ ${tx(["Comprobar","Check"])}</button></div>`;
    caja.innerHTML=`${cabeza}
      <div class="pregunta" id="txtQ" ${p.audioQ?"hidden":""}>${qHTML}</div>
      ${p.audioQ?`<div class="fila" style="margin:0"><button class="oir" id="verQ">👁️ ${tx(["Ver la pregunta","Show the question"])}</button></div>`:""}
      ${p.v?`<div class="visual">${p.v}</div>`:""}
      <div class="fila" style="margin-top:6px">${botonPasaje}${botonOirP}<button class="oir" id="pista">💡 ${tx(["Pista","Hint"])}</button></div>
      <div class="pista" id="txtPista" hidden></div>${cuerpo}
      <div class="mensaje" id="msg"></div><div class="fila" id="sigFila"></div>`;
    if(sinFin) $("#terminar").onclick=()=>{caja.dataset.bloq="0";pararVoz();alTerminar(aciertos,res,i)};
    const conLetras=x=>/[a-záéíóúñ]/i.test(typeof x==="string"?x:x[0]);
    const opcionesVoz=()=>{ // las opciones con palabras también se leen, para quien todavía no lee
      if(tipo!=="mc"||!p.o.some(conLetras)) return [];
      const c=lang==="en"?"en":"es";
      return p.o.map(o=>[Array.isArray(o)?(c==="en"?o[1]:o[0]):o,c]);
    };
    const hablarP=()=>{
      if(p.audio){decir([p.audio]);return}
      if(p.oir){decir([p.oir,...opcionesVoz()]);return}
      const preg=lang==="es"?[[p.q[0],"es"]]:lang==="en"?[[p.q[1],"en"]]:[[p.q[0],"es"],[p.q[1],"en"]];
      decir([...preg,...opcionesVoz()]);
    };
    $("#oirP").onclick=hablarP;
    if($("#verQ")) $("#verQ").onclick=()=>{$("#txtQ").hidden=false;$("#verQ").remove()};
    if($("#pasaje")) $("#pasaje").onclick=()=>{const k=lang==="en"?1:0;decir([[lp.audioTexto[k],k?"en":"es"]])};
    if(p.audio||p.audioQ||(lp&&(lp.nivel==="pk"||lp.nivel==="g12"))) setTimeout(hablarP,350);

    // --- resultado común ---
    const exito=el=>{
      caja.dataset.bloq="1"; if(el) el.classList.add("bien"); sBien();
      const limpio=intentos===0&&pistas===0;
      if(limpio){aciertos++;bloque++;racha++;sumarEstrella()} else racha=0;
      res.push({lec:p.lec,ok:limpio});
      $("#msg").textContent=limpio?t("bien"):tx(["¡Bien! La próxima sin pista.","Good! Next time without a hint."]); decirPar(limpio?T.bien:["¡Bien!","Good!"]);
      setTimeout(()=>{if(!caja.isConnected)return;caja.dataset.bloq="0";avanzar()},1300);
    };
    let revelar=()=>{};
    const error=(el,casi)=>{
      intentos++; racha=0; if(el){el.classList.remove("mal");void el.offsetWidth;el.classList.add("mal")} sMal();
      if(intentos>=2){
        caja.dataset.bloq="1"; revelar(); res.push({lec:p.lec,ok:false});
        $("#msg").textContent=t("esla");
        $("#sigFila").innerHTML=`<button class="btn" id="sigP">${t("sigPreg")}</button>`;
        $("#sigP").onclick=()=>{caja.dataset.bloq="0";avanzar()};
      } else { $("#msg").textContent=casi?tx(casi):t("intenta"); decirPar(casi||T.intenta) }
    };
    let pista2=()=>{};

    if(tipo==="mc"){
      const botones=[...caja.querySelectorAll(".resp button")];
      revelar=()=>botones[p.a].classList.add("revela");
      pista2=()=>{const malas=botones.filter((b,k)=>k!==p.a&&!b.disabled);if(malas.length>1){const m=malas[R(0,malas.length-1)];m.disabled=true;m.style.opacity=".3"}return ["Quité una respuesta incorrecta.","I removed one wrong answer."]};
      botones.forEach(b=>b.onclick=()=>{if(caja.dataset.bloq==="1"||b.disabled)return;+b.dataset.r===p.a?exito(b):error(b)});
    } else if(tipo==="ordenar"){
      const correcta=p.piezas.join(p.sep);
      let fichas=p.piezas.map((x,k)=>({x,k}));let t2=0;do{fichas=mezclar(fichas);t2++}while(t2<10&&fichas.length>1&&fichas.map(f=>f.x).join(p.sep)===correcta);
      let puestas=[];
      const dibuja=()=>{
        $("#armado").innerHTML=puestas.length?puestas.map((f,k)=>`<button class="ficha puesta" data-q="${k}">${f.x}</button>`).join(""):`<span class="sub" style="margin:0">${tx(["Toca las piezas en orden","Tap the pieces in order"])}</span>`;
        $("#fichas").innerHTML=fichas.map((f,k)=>puestas.includes(f)?`<span class="ficha vacia">${f.x}</span>`:`<button class="ficha" data-f="${k}">${f.x}</button>`).join("");
        caja.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{if(caja.dataset.bloq==="1")return;puestas.push(fichas[+b.dataset.f]);dibuja()});
        caja.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{if(caja.dataset.bloq==="1")return;puestas.splice(+b.dataset.q,1);dibuja()});
      };
      dibuja();
      $("#borrarO").onclick=()=>{if(caja.dataset.bloq==="1")return;puestas=[];dibuja()};
      revelar=()=>{$("#armado").innerHTML=`<span class="ficha puesta revela">${correcta}</span>`};
      pista2=()=>{const primera=fichas.find(f=>f.k===0);puestas=[primera];dibuja();return ["Puse la primera pieza.","I placed the first piece."]};
      $("#comprobar").onclick=()=>{
        if(caja.dataset.bloq==="1")return;
        if(puestas.length<fichas.length){$("#msg").textContent=tx(["Usa todas las piezas.","Use all the pieces."]);return}
        puestas.map(f=>f.x).join(p.sep)===correcta?exito($("#armado")):error($("#armado"));
      };
    } else {
      const campo=$("#escr");
      revelar=()=>{$("#msg").insertAdjacentHTML("afterend",`<p class="texto" style="text-align:center">✔ <b>${p.resp}</b></p>`)};
      pista2=()=>{const n=Math.max(1,Math.floor(p.resp.length/2));campo.placeholder=p.resp.slice(0,n)+"…";return [`Empieza así: ${p.resp.slice(0,n)}…`,`It starts like this: ${p.resp.slice(0,n)}…`]};
      const revisa=()=>{
        if(caja.dataset.bloq==="1")return;
        const v=limpiaResp(campo.value),r=limpiaResp(p.resp);if(!v)return;
        if(v===r) return exito(campo);
        if(sinTilde(v)===sinTilde(r)) return error(campo,["¡Casi! Revisa los acentos (´).","Almost! Check the accent marks (´)."]);
        error(campo);
      };
      $("#comprobar").onclick=revisa; campo.onkeydown=e=>{if(e.key==="Enter")revisa()};
    }
    $("#pista").onclick=()=>{
      pistas++; const tp=$("#txtPista"); tp.hidden=false;
      if(pistas===1&&lp){const f=primeraOracion(lp.explica);tp.innerHTML=`💡 ${lang==="bi"?`${f[0]}<br><small>${f[1]}</small>`:tx(f)}`;decirPar(f)}
      else{const m=pista2();tp.innerHTML+=`<br>✂️ ${tx(m)}`;$("#pista").disabled=true;$("#pista").style.opacity=".5"}
    };
  }
  caja.dataset.bloq="0"; pintar();
}

/* ----- Hablar: escucha el modelo, dilo en voz alta y evalúate ----- */
let flujoNino=null,grabNino=null;
function apagarMicNino(){try{if(grabNino&&grabNino.state==="recording")grabNino.stop()}catch(e){}if(flujoNino){flujoNino.getTracks().forEach(t=>t.stop());flujoNino=null}}
function hablarPractica(l){
  const caja=$("#practica"), permitido=store.get("micNinos",false), meta=lang==="en"?"en":"es";
  let orden=mezclar(l.frases.map((f,k)=>k)),k=0,bien=0,dichas=0,miVoz=null;
  function fin(){
    apagarMicNino(); if(miVoz){URL.revokeObjectURL(miVoz);miVoz=null}
    sFin(); if(bien>=5) confeti();
    caja.innerHTML=`<div style="text-align:center"><svg class="flota" viewBox="0 0 100 100" style="width:110px"><use href="#buho"/></svg>
      <h2>${tx(["¡Qué bien hablaste!","Great speaking!"])}</h2><div class="pal" style="font-size:1.6rem;font-weight:800">😀 ${bien} / ${dichas}</div>
      <p style="margin:6px 0">${insignia(notas[l.id])}</p>
      <div class="fila"><button class="btn verde" id="otraH2">♾️ ${tx(["Seguir practicando","Keep practicing"])}</button><button class="btn" data-ir="nivel">${t("otras")}</button></div></div>`;
    $("#otraH2").onclick=()=>hablarPractica(l);

    if(miVoz){URL.revokeObjectURL(miVoz);miVoz=null}
    caja.innerHTML=`<div class="fila" style="justify-content:space-between;align-items:center;margin:0 0 8px"><span class="insignia" style="background:#fff3c4">🗣️ ${bien} / ${dichas}</span><button class="oir" id="terminar">🏁 ${tx(["Terminar","Finish"])}</button></div>
      <div class="visual">${f[2]}</div>
      <p class="frase-hablar">${texto}</p>${lang==="bi"?`<p class="sub">${f[1]}</p>`:""}
      <div class="fila"><button class="btn naranja" id="modelo">🔊 ${tx(["Escuchar","Listen"])}</button>
        ${permitido?`<button class="btn" id="grabarme">🎙️ ${tx(["Grabarme","Record me"])}</button><button class="btn gris" id="escucharme" disabled style="opacity:.5">▶ ${tx(["Escucharme","Hear myself"])}</button>`:""}</div>
      <p class="sub" style="margin-top:12px">${tx(["Ahora dilo tú en voz alta. ¿Cómo te salió?","Now say it out loud. How did it go?"])}</p>
      <div class="fila"><button class="btn verde" id="bienH">😀 ${tx(["¡Lo dije bien!","I said it well!"])}</button><button class="btn gris" id="otraH">🔁 ${tx(["Otra vez","Again"])}</button></div>
      <div class="mensaje" id="msg"></div>`;

    $("#terminar").onclick=fin;

      apagarMicNino(); bien++; dichas++; sumarEstrella(); sBien();
      const prev=notas[l.id]||0, nueva=Math.min(5,Math.floor(bien/2));
      if(nueva>prev){notas[l.id]=nueva;store.set("notas",notas)}
      $("#msg").textContent=t("bien"); decirPar(T.bien); k++; setTimeout(pinta,1100);
    };
    $("#otraH").onclick=()=>{dichas++;$("#msg").textContent=tx(["¡Escucha y prueba otra vez!","Listen and try again!"]);modelo()};
    if(permitido){
      $("#grabarme").onclick=async()=>{

          const tipos=["audio/mp4","audio/webm;codecs=opus","audio/webm"];const mt=tipos.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x));
          grabNino=new MediaRecorder(flujoNino,mt?{mimeType:mt}:undefined);const trozos=[];
          grabNino.ondataavailable=e=>{if(e.data.size)trozos.push(e.data)};
          grabNino.onstop=()=>{if(miVoz)URL.revokeObjectURL(miVoz);miVoz=URL.createObjectURL(new Blob(trozos,{type:grabNino.mimeType||"audio/mp4"}));
            const b=$("#escucharme");if(b){b.disabled=false;b.style.opacity=1}const g=$("#grabarme");if(g)g.innerHTML="🎙️ "+tx(["Grabarme otra vez","Record again"])};

      };
      $("#escucharme").onclick=()=>{if(miVoz){pararVoz();audioActual=new Audio(miVoz);audioActual.play().catch(()=>{})}};
    }

/* ----- Escritura libre: lista de revisión en vivo. No se guarda nada. ----- */
function escrituraLibre(l){
  const caja=$("#practica"), E=l.libre;
  caja.innerHTML=`<h2>✍️ ${lang==="bi"?`${E.q[0]}</h2><p class="sub" style="text-align:left">${E.q[1]}</p>`:tx(E.q)+"</h2>"}
    <textarea id="libreTxt" rows="6" class="campo" style="width:100%;max-width:none;text-align:left" spellcheck="false" autocomplete="off" autocorrect="off" aria-label="texto"></textarea>
    <ul class="checks" id="checks"></ul>
    <p class="sub">🔒 ${tx(["Lo que escribes no se guarda ni se envía a ningún lado.","What you write is not saved or sent anywhere."])}</p>
    <div class="fila"><button class="oir" id="leerLibre">🔊 ${tx(["Léeme lo que escribí","Read my writing to me"])}</button><button class="btn verde" id="terminarLibre">✔ ${tx(["Terminé","I'm done"])}</button></div>
    <div class="mensaje" id="msg"></div>`;
  const revisa=()=>{
    const v=$("#libreTxt").value.trim(), palabras=v?v.split(/\s+/).length:0, oraciones=(v.match(/[.!?](\s|$)/g)||[]).length;
    const c=[[/^[¡¿]?[A-ZÁÉÍÓÚÑ]/.test(v),["Empieza con mayúscula","Starts with a capital letter"]],[/[.!?]$/.test(v),["Termina con punto","Ends with a period"]],
      [palabras>=E.min,[`Tiene al menos ${E.min} palabras (llevas ${palabras})`,`Has at least ${E.min} words (you have ${palabras})`]],
      [oraciones>=E.oraciones,[`Tiene al menos ${E.oraciones} ${E.oraciones>1?"oraciones":"oración"} (llevas ${oraciones})`,`Has at least ${E.oraciones} sentence${E.oraciones>1?"s":""} (you have ${oraciones})`]]];
    if(E.conector) c.push([/(además|sin embargo|por eso)/i.test(v),["Usa «además», «sin embargo» o «por eso»","Uses «además», «sin embargo» or «por eso»"]]);
    $("#checks").innerHTML=c.map(([ok,txt])=>`<li class="${ok?"ok":""}">${ok?"✅":"⬜"} ${tx(txt)}</li>`).join("");
    return c.every(x=>x[0]);
  };
  revisa(); $("#libreTxt").oninput=revisa; setTimeout(()=>decirPar(E.q),300);
  $("#leerLibre").onclick=()=>{const v=$("#libreTxt").value.trim();if(v)decir([[v,lang==="en"?"en":"es"]])};
  $("#terminarLibre").onclick=()=>{
    if(revisa()){sumarEstrella(3);sFin();confeti();$("#msg").textContent=tx(["¡Excelente! Tu escrito cumple con todo. +3 ⭐","Excellent! Your writing meets every goal. +3 ⭐"]);decirPar(["¡Excelente!","Excellent!"])}
    else{$("#msg").textContent=tx(["Revisa la lista: todavía falta algo.","Check the list: something is still missing."]);sMal()}
  };
}

/* Práctica sin fin: cada bloque de 5 cuenta para el búho de la lección */
function practicar(l){
  const caja=$("#practica");
  let mejorBloque=0;
  sesion(caja,fuenteSinFin(l),Infinity,(aciertos,res,contestadas)=>{

const DB={db:null,
  abrir(){return new Promise((res,rej)=>{try{if(this.db) return res(this.db);const r=indexedDB.open("ethan_voces",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("clips");r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async op(modo,fn){const db=await this.abrir();return new Promise((res,rej)=>{const t=db.transaction("clips",modo),st=t.objectStore("clips");const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  guardar(k,b){return this.op("readwrite",st=>st.put(b,k))},
  borrar(k){return this.op("readwrite",st=>st.delete(k))},
  async todas(){const db=await this.abrir();return new Promise((res,rej)=>{const out=[];const st=db.transaction("clips").objectStore("clips");const c=st.openCursor();
    c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
};

function dataABlob(d){const [h,b64]=d.split(",");const tipo=(h.match(/data:([^;]+)/)||[])[1]||"audio/mp4";const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:tipo})}
function blobAData(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
async function cargarVocesHumanas(){

      Object.entries(j).forEach(([k,d])=>{if(typeof d==="string"&&d.startsWith("data:audio")){CLIPS.set(k,URL.createObjectURL(dataABlob(d)));grabadas.add(k)}})}}catch(e){}

    if(l.audioTexto) it.push(...par(l.audioTexto));
    if(l.frases) l.frases.forEach(f=>it.push(["es",f[0]],["en",f[1]]));
    if(l.libre) it.push(...par(l.libre.q));
    l.ejemplos.forEach(e=>it.push(["es",e.es],["en",e.en]));
    (l.ejercicios||[]).forEach(e=>{if(e.oir) it.push([e.oir[1],e.oir[0]]); it.push(...par(e.q))});
    const nv=NIVELES.find(n=>n.id===l.nivel);add([`${nv.ico} ${nv.nombre[0]} · ${l.ico} ${l.titulo[0]}`,`${nv.ico} ${nv.nombre[1]} · ${l.ico} ${l.titulo[1]}`],it)});
  return G;
}

let grupoI=0,fraseI=0,grabadora=null,trozos=[],tomaBlob=null,flujo=null;

      $("#msgE").textContent=`✔ ${n} ${tx(["grabaciones importadas","recordings imported"])}`;setTimeout(P.estudio,900)}catch(err){$("#msgE").textContent=tx(["Ese archivo no es un paquete de voces.","That file is not a voice pack."])}};
};

      <p class="sub" style="margin:4px 0 0">${tx(["En modo continuo: lee la frase después del «bip». Cuando te callas, se guarda sola y pasa a la siguiente.","Continuous mode: read the phrase after the «beep». When you stop talking it saves by itself and moves on."])}</p>
      <div class="mensaje" id="msgG"></div>

        ${ya?`<button class="oir" id="borrarF">🗑️ ${tx(["Borrar","Delete"])}</button>`:""}</div></div>`;
  const ir2=d=>{fraseI=(fraseI+d+g.items.length)%g.items.length;autoParar(false);pararMic();P.grabar()};
  $("#continuoBtn").onclick=()=>{if(continuo){continuo=false;autoParar(false);P.grabar()}else{continuo=true;P.grabar()}};
  if(continuo) setTimeout(()=>autoGrabar(k,()=>ir2(1)),350);
  $("#antF").onclick=()=>ir2(-1);$("#sigF").onclick=()=>ir2(1);

function pararMic(){try{if(grabadora&&grabadora.state==="recording")grabadora.stop()}catch(e){}}
/* Grabación continua: detecta cuando la persona empieza y deja de hablar, guarda y avanza sola */
let continuo=false,autoTimer=null,autoRec=null,fuenteMic=null,analizador=null;
function autoParar(guardar){clearInterval(autoTimer);autoTimer=null;if(autoRec&&autoRec.state==="recording"){autoRec._guardar=guardar;autoRec.stop()}}
async function autoGrabar(k,despues){
  if(!continuo||pantalla!=="grabar") return;
  try{
    flujo=flujo||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const a=audioCtx();
    if(!analizador||!fuenteMic||fuenteMic.mediaStream!==flujo){fuenteMic=a.createMediaStreamSource(flujo);analizador=a.createAnalyser();analizador.fftSize=1024;fuenteMic.connect(analizador)}
    const tipos=["audio/mp4","audio/webm;codecs=opus","audio/webm"];const mt=tipos.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x));
    const efAntes=efectosOn;efectosOn=true;tono([[880,.12,0]],.12,"sine");efectosOn=efAntes; // bip de inicio
    await new Promise(r=>setTimeout(r,260));
    if(!continuo||pantalla!=="grabar") return;
    const trozosA=[];autoRec=new MediaRecorder(flujo,mt?{mimeType:mt}:undefined);autoRec._guardar=true;
    autoRec.ondataavailable=e=>{if(e.data.size)trozosA.push(e.data)};
    autoRec.onstop=async()=>{
      const guardar=autoRec._guardar;const blob=new Blob(trozosA,{type:autoRec.mimeType||"audio/mp4"});
      if(guardar&&blob.size>0){try{await DB.guardar(k,blob);CLIPS.set(k,URL.createObjectURL(blob));grabadas.add(k);sBien();despues()}catch(e){continuo=false;const m=$("#msgG");if(m)m.textContent=tx(["No se pudo guardar en este aparato.","Couldn't save on this device."])}}
    };
    autoRec.start();
    const m=$("#msgG");if(m)m.textContent="🔴 "+tx(["Grabando… lee la frase","Recording… read the phrase"]);
    // Calibra el ruido del cuarto en los primeros 300 ms para que funcione también en un salón con ruido
    const datos=new Float32Array(analizador.fftSize);const inicio=performance.now();let hablo=false,ultima=inicio,piso=0,muestras=0,umbral=.02;
    autoTimer=setInterval(()=>{
      analizador.getFloatTimeDomainData(datos);let s=0;for(const x of datos)s+=x*x;const rms=Math.sqrt(s/datos.length),ahora=performance.now();
      const barra=$("#nivelMic");if(barra)barra.style.width=Math.min(100,rms*600)+"%";
      if(ahora-inicio<300){piso+=rms;muestras++;return}
      if(muestras){umbral=Math.max(.015,(piso/muestras)*3);muestras=0}
      if(rms>umbral){hablo=true;ultima=ahora}
      if(hablo&&ahora-ultima>1100) autoParar(true);
      else if(!hablo&&ahora-inicio>7000){continuo=false;autoParar(false);const m2=$("#msgG");if(m2)m2.textContent=tx(["No oí nada. Toca «Grabación continua» cuando estés lista.","I didn't hear anything. Tap «Continuous recording» when you're ready."]);const cb=$("#continuoBtn");if(cb){cb.className="btn verde";cb.textContent="🔁 "+tx(["Grabación continua","Continuous recording"])}}
      else if(ahora-inicio>30000) autoParar(true);
    },50);
  }catch(e){continuo=false;const m=$("#msgG");if(m)m.textContent=tx(["No se pudo usar el micrófono. Abre la app desde su enlace de GitHub (https) y permite el micrófono.","Couldn't use the microphone. Open the app from its GitHub link (https) and allow the microphone."])}
}
function apagarMic(){continuo=false;autoParar(false);pararMic();if(flujo){flujo.getTracks().forEach(t=>t.stop());flujo=null}}

    if(lang==="es") decir([[ex.es,"es"]]); else if(lang==="en") decir([[ex.en,"en"]]); else decir([[ex.es,"es"],[ex.en,"en"]]);return}
  if(d.letra!==undefined){letraI=+d.letra;ir("letra");return}
  if(d.sub){subLeer=d.sub;render();return}
  if(d.cons){consonante=d.cons;render();decir([[NOMBRE_CONS[consonante],"es"]]);return}
  if(d.fam){familia=d.fam;render();decir([[familia.slice(1),"en"]]);return}
  if(d.decirEs){b.classList.add("on");decir([[d.decirEs,"es"]]);return}
  if(d.decirEn){b.classList.add("on");decir([[d.decirEn,"en"]]);return}
  if(d.palEs){const p=[[d.palEs,"es"]];if(lang==="bi")p.push([d.tr,"en"]);decir(p);return}
  if(d.palEn){const p=[[d.palEn,"en"]];if(lang==="bi")p.push([d.tr,"es"]);decir(p);return}
  if(d.num){numActivo=+d.num;P.numeros();conteo(numActivo);return}
  if(d.color!==undefined){const c=COLORES[+d.color];b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");decirPar([c[0],c[1]]);return}
});
