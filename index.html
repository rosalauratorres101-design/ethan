/* ----- Escritura libre: lista de revisión en vivo. No se guarda nada. ----- */
/* Corrector de textos: reglas sencillas de 2.º grado en adelante, sin internet y sin IA.
   Sugiere y el niño decide si acepta cada cambio. */
const LETRA="A-Za-zÁÉÍÓÚÜÑáéíóúüñ";
const ORTO_ES={ke:"que",q:"que",xq:"porque",porqe:"porque",aser:"hacer",asemos:"hacemos",bamos:"vamos",boy:"voy",berde:"verde",tanbien:"también",tambien:"también",mui:"muy",llo:"yo",aora:"ahora",haora:"ahora",ise:"hice",iso:"hizo",aki:"aquí",aqui:"aquí",asta:"hasta",ermano:"hermano",ermana:"hermana",abia:"había",estava:"estaba",jugava:"jugaba",iva:"iba",despues:"después",jugé:"jugué",gueno:"bueno",nesecito:"necesito",nesesito:"necesito",ciempre:"siempre",sielo:"cielo",pajaro:"pájaro",facil:"fácil",dificil:"difícil",musica:"música",telefono:"teléfono",sabado:"sábado",miercoles:"miércoles",pelicula:"película",lapiz:"lápiz",dia:"día",dias:"días",corason:"corazón",futbol:"fútbol",rapido:"rápido",arbol:"árbol",raton:"ratón",cancion:"canción",mama:"mamá",tambíen:"también",bibo:"vivo",bive:"vive",yeno:"lleno",yuvia:"lluvia",cabayo:"caballo"};
const ORTO_EN={becuase:"because",becaus:"because",becuz:"because",freind:"friend",frend:"friend",wich:"which",alot:"a lot",dont:"don't",im:"I'm",cant:"can't",didnt:"didn't",thier:"their",realy:"really",beutiful:"beautiful",whent:"went",sed:"said",skool:"school",becose:"because",freinds:"friends",tomorow:"tomorrow",togeter:"together",wus:"was"};
function conMayus(orig,nueva){return /^[A-ZÁÉÍÓÚÑ]/.test(orig)?nueva.charAt(0).toUpperCase()+nueva.slice(1):nueva}
function revisarTexto(t,en){
  const out=[];const add=(re,fn,msg)=>{const i=t.search(re);if(i>=0){const a=Math.max(0,i-12),b=Math.min(t.length,i+18);out.push({msg,ej:(a>0?"…":"")+t.slice(a,b)+(b<t.length?"…":""),fix:x=>x.replace(re,fn)})}};
  add(/ {2,}/g," ",["Hay espacios de más entre palabras.","There are extra spaces between words."]);
  add(/ +([.,!?;:])/g,"$1",["Quita el espacio antes del signo de puntuación.","Remove the space before the punctuation mark."]);
  add(new RegExp("([.!?])(["+LETRA+"¿¡])","g"),"$1 $2",["Deja un espacio después del punto.","Leave a space after the period."]);
  add(new RegExp("(^|[.!?]\\s+)([¿¡]?)([a-záéíóúñü])","g"),(m,a,b,c)=>a+b+c.toUpperCase(),["Cada oración empieza con mayúscula.","Every sentence starts with a capital letter."]);
  add(new RegExp("(^|[^"+LETRA+"])(["+LETRA+"]+)\\s+\\2(?=[^"+LETRA+"]|$)","gi"),"$1$2",["Hay una palabra repetida.","A word is repeated."]);
  add(/([a-záéíóúñü0-9])\s+(Después|Despues|Luego|Al final|Finalmente|Primero|Entonces|Then|Next|Finally|First|After that)(?=[\s,])/g,"$1. $2",["Parece que falta un punto antes de una palabra con mayúscula.","It looks like a period is missing before a capitalized word."]);
  if(en) add(/(^|[\s"(])i(?=[\s.,!?']|$)/g,"$1I",["La palabra «I» siempre va con mayúscula.","The word «I» is always a capital letter."]);
  if(!en){
    const oraciones=t.match(/[^.!?]+[.!?]+/g)||[];
    oraciones.forEach(o=>{const lim=o.trim();
      if(/\?$/.test(lim)&&lim.indexOf("¿")<0) out.push({msg:["Las preguntas empiezan con ¿.","Questions start with ¿ in Spanish."],ej:lim,fix:x=>x.replace(lim,"¿"+lim.charAt(0).toUpperCase()+lim.slice(1))});
      if(/!$/.test(lim)&&lim.indexOf("¡")<0) out.push({msg:["Las exclamaciones empiezan con ¡.","Exclamations start with ¡ in Spanish."],ej:lim,fix:x=>x.replace(lim,"¡"+lim.charAt(0).toUpperCase()+lim.slice(1))});
    });
  }
  const dic=en?ORTO_EN:ORTO_ES;
  const re=new RegExp("(^|[^"+LETRA+"'])("+Object.keys(dic).sort((a,b)=>b.length-a.length).join("|")+")(?=[^"+LETRA+"']|$)","gi");
  let m;const vistos=new Set();
  while((m=re.exec(t))){const pal=m[2],bien=conMayus(pal,dic[pal.toLowerCase()]);if(vistos.has(pal))continue;vistos.add(pal);
    const r1=new RegExp("(^|[^"+LETRA+"'])"+pal+"(?=[^"+LETRA+"']|$)","g");
    out.push({msg:[`¿Quisiste escribir «${bien}»?`,`Did you mean «${bien}»?`],ej:`${pal} → ${bien}`,fix:x=>x.replace(r1,"$1"+bien)})}
  if(t.trim()&&!/[.!?]["»]?$/.test(t.trim())) out.push({msg:["Termina con punto.","End with a period."],ej:t.trim().slice(-12),fix:x=>x.trim()+"."});
  return out;
}
function pintarCorrecciones(en){
  const ta=$("#libreTxt"),caja=$("#correcciones");if(!ta||!caja)return;
  const lista=revisarTexto(ta.value,en);

  if(!lista.length){caja.innerHTML=`<p class="mensaje" style="margin:6px 0">✅ ${tx(["¡No encontré errores! Léelo una vez más en voz alta.","I didn't find any mistakes! Read it out loud one more time."])}</p>`;return}
  caja.innerHTML=`<p class="texto" style="margin:6px 0"><b>🔎 ${tx(["Revisa estos cambios. Tú decides si los aceptas:","Check these changes. You decide whether to accept them:"])}</b></p>
    <ul class="correcciones">${lista.map((c,i)=>`<li><span>${tx(c.msg)}<br><small style="color:var(--gris)">${c.ej.replace(/</g,"&lt;")}</small></span><button class="btn verde" style="padding:8px 14px;font-size:1rem" data-corr="${i}">✔ ${tx(["Corregir","Fix"])}</button></li>`).join("")}</ul>
    <div class="fila" style="margin-top:4px"><button class="oir" id="corrTodo">✨ ${tx(["Corregir todo","Fix all"])}</button></div>`;
  caja.querySelectorAll("[data-corr]").forEach(b=>b.onclick=()=>{const c=lista[+b.dataset.corr];ta.value=c.fix(ta.value);ta.dispatchEvent(new Event("input"));sToque();pintarCorrecciones(en)});

}

    <textarea id="libreTxt" rows="6" class="campo" style="width:100%;max-width:none;text-align:left" spellcheck="false" autocomplete="off" autocorrect="off" aria-label="texto"></textarea>

    <div class="mensaje" id="msg"></div>`;
  const revisa=()=>{

    const c=[[/^[¡¿]?[A-ZÁÉÍÓÚÑ]/.test(v),["Empieza con mayúscula","Starts with a capital letter"]],[/[.!?]$/.test(v),["Termina con punto","Ends with a period"]],
      [palabras>=E.min,[`Tiene al menos ${E.min} palabras (llevas ${palabras})`,`Has at least ${E.min} words (you have ${palabras})`]],
      [oraciones>=E.oraciones,[`Tiene al menos ${E.oraciones} ${E.oraciones>1?"oraciones":"oración"} (llevas ${oraciones})`,`Has at least ${E.oraciones} sentence${E.oraciones>1?"s":""} (you have ${oraciones})`]]];
    if(E.conector) c.push([/(además|sin embargo|por eso)/i.test(v),["Usa «además», «sin embargo» o «por eso»","Uses «además», «sin embargo» or «por eso»"]]);
    if(E.secuencia){const n=[/\b(primero|first)\b/i,/\b(despu[eé]s|luego|next|then)\b/i,/\b(al final|finalmente|finally|at the end|in the end)\b/i].filter(r=>r.test(v)).length;
      c.push([n===3,[`Usa «primero», «después» y «al final» (llevas ${n} de 3)`,`Uses «first», «next» and «finally» (${n} of 3)`]])}
    c.push([revisarTexto(v,lang==="en").length===0&&!!v,["Sin errores de escritura","No writing mistakes"]]);
    $("#checks").innerHTML=c.map(([ok,txt])=>`<li class="${ok?"ok":""}">${ok?"✅":"⬜"} ${tx(txt)}</li>`).join("");
    return c.every(x=>x[0]);
  };
  revisa(); $("#libreTxt").oninput=()=>{revisa();if($("#correcciones").innerHTML)pintarCorrecciones(lang==="en")};
  $("#revisarLibre").onclick=()=>{pintarCorrecciones(lang==="en");sToque()}; setTimeout(()=>decirPar(E.q),300);
  $("#leerLibre").onclick=()=>{const v=$("#libreTxt").value.trim();if(v)decir([[v,lang==="en"?"en":"es"]])};
  $("#terminarLibre").onclick=()=>{
    if(revisa()){sumarEstrella(3);sFin();confeti();$("#msg").textContent=tx(["¡Excelente! Tu escrito cumple con todo. +3 ⭐","Excellent! Your writing meets every goal. +3 ⭐"]);decirPar(["¡Excelente!","Excellent!"])}
    else{$("#msg").textContent=tx(["Revisa la lista: todavía falta algo.","Check the list: something is still missing."]);sMal();pintarCorrecciones(lang==="en")}
  };
}

/* Práctica sin fin: cada bloque de 5 cuenta para el búho de la lección */
function practicar(l){
  const caja=$("#practica");
  let mejorBloque=0;
  sesion(caja,fuenteSinFin(l),Infinity,(aciertos,res,contestadas)=>{
    sFin(); if(aciertos>=5) confeti();
    const frase=contestadas===0?["¡Cuando quieras seguimos!","Come back any time!"]:aciertos/contestadas>=.8?["¡Excelente trabajo! Sigue así.","Excellent work! Keep it up."]:aciertos/contestadas>=.5?["¡Buen trabajo! Repasa las que fallaste.","Good work! Review the ones you missed."]:["Vamos a repasar la explicación y lo intentamos otra vez.","Let's review the explanation and try again."];

const DB={db:null,
  abrir(){return new Promise((res,rej)=>{try{if(this.db) return res(this.db);const r=indexedDB.open("ethan_voces",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("clips");r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async op(modo,fn){const db=await this.abrir();return new Promise((res,rej)=>{const t=db.transaction("clips",modo),st=t.objectStore("clips");const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  guardar(k,b){return this.op("readwrite",st=>st.put(b,k))},
  borrar(k){return this.op("readwrite",st=>st.delete(k))},
  async todas(){const db=await this.abrir();return new Promise((res,rej)=>{const out=[];const st=db.transaction("clips").objectStore("clips");const c=st.openCursor();
    c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
};
const grabadas=new Set();
function dataABlob(d){const [h,b64]=d.split(",");const tipo=(h.match(/data:([^;]+)/)||[])[1]||"audio/mp4";const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:tipo})}
function blobAData(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
async function cargarVocesHumanas(){

      Object.entries(j).forEach(([k,d])=>{if(typeof d==="string"&&d.startsWith("data:audio")){CLIPS.set(k,URL.createObjectURL(dataABlob(d)));grabadas.add(k)}})}}catch(e){}

    const nv=NIVELES.find(n=>n.id===l.nivel);add([`${nv.ico} ${nv.nombre[0]} · ${l.ico} ${l.titulo[0]}`,`${nv.ico} ${nv.nombre[1]} · ${l.ico} ${l.titulo[1]}`],it)});
  return G;
}

let grupoI=0,fraseI=0,grabadora=null,trozos=[],tomaBlob=null,flujo=null;

      $("#msgE").textContent=`✔ ${n} ${tx(["grabaciones importadas","recordings imported"])}`;setTimeout(P.estudio,900)}catch(err){$("#msgE").textContent=tx(["Ese archivo no es un paquete de voces.","That file is not a voice pack."])}};
};

      <p class="sub" style="margin:4px 0 0">${tx(["En modo continuo: lee la frase después del «bip». Cuando te callas, se guarda sola y pasa a la siguiente.","Continuous mode: read the phrase after the «beep». When you stop talking it saves by itself and moves on."])}</p>
      <div class="mensaje" id="msgG"></div>
      <div class="fila"><button class="btn gris" id="antF">${t("ant")}</button><button class="btn" id="sigF">${t("sig")}</button>
        ${ya?`<button class="oir" id="borrarF">🗑️ ${tx(["Borrar","Delete"])}</button>`:""}</div></div>`;
  const ir2=d=>{fraseI=(fraseI+d+g.items.length)%g.items.length;autoParar(false);pararMic();P.grabar()};
  $("#continuoBtn").onclick=()=>{if(continuo){continuo=false;autoParar(false);P.grabar()}else{continuo=true;P.grabar()}};
  if(continuo) setTimeout(()=>autoGrabar(k,()=>ir2(1)),350);
  $("#antF").onclick=()=>ir2(-1);$("#sigF").onclick=()=>ir2(1);

  };
  $("#guardar").onclick=async()=>{if(!tomaBlob)return;

};
function pararMic(){try{if(grabadora&&grabadora.state==="recording")grabadora.stop()}catch(e){}}
/* Grabación continua: detecta cuando la persona empieza y deja de hablar, guarda y avanza sola */
let continuo=false,autoTimer=null,autoRec=null,fuenteMic=null,analizador=null;
function autoParar(guardar){clearInterval(autoTimer);autoTimer=null;if(autoRec&&autoRec.state==="recording"){autoRec._guardar=guardar;autoRec.stop()}}
async function autoGrabar(k,despues){
  if(!continuo||pantalla!=="grabar") return;
  try{
    flujo=flujo||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const a=audioCtx();
    if(!analizador||!fuenteMic||fuenteMic.mediaStream!==flujo){fuenteMic=a.createMediaStreamSource(flujo);analizador=a.createAnalyser();analizador.fftSize=1024;fuenteMic.connect(analizador)}
    const tipos=["audio/mp4","audio/webm;codecs=opus","audio/webm"];const mt=tipos.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x));
    const efAntes=efectosOn;efectosOn=true;tono([[880,.12,0]],.12,"sine");efectosOn=efAntes; // bip de inicio
    await new Promise(r=>setTimeout(r,260));
    if(!continuo||pantalla!=="grabar") return;
    const trozosA=[];autoRec=new MediaRecorder(flujo,mt?{mimeType:mt}:undefined);autoRec._guardar=true;
    autoRec.ondataavailable=e=>{if(e.data.size)trozosA.push(e.data)};
    autoRec.onstop=async()=>{
      const guardar=autoRec._guardar;const blob=new Blob(trozosA,{type:autoRec.mimeType||"audio/mp4"});
      if(guardar&&blob.size>0){try{await DB.guardar(k,blob);CLIPS.set(k,URL.createObjectURL(blob));grabadas.add(k);sBien();despues()}catch(e){continuo=false;const m=$("#msgG");if(m)m.textContent=tx(["No se pudo guardar en este aparato.","Couldn't save on this device."])}}
    };
    autoRec.start();
    const m=$("#msgG");if(m)m.textContent="🔴 "+tx(["Grabando… lee la frase","Recording… read the phrase"]);
    // Calibra el ruido del cuarto en los primeros 300 ms para que funcione también en un salón con ruido
    const datos=new Float32Array(analizador.fftSize);const inicio=performance.now();let hablo=false,ultima=inicio,piso=0,muestras=0,umbral=.02;
    autoTimer=setInterval(()=>{
      analizador.getFloatTimeDomainData(datos);let s=0;for(const x of datos)s+=x*x;const rms=Math.sqrt(s/datos.length),ahora=performance.now();
      const barra=$("#nivelMic");if(barra)barra.style.width=Math.min(100,rms*600)+"%";
      if(ahora-inicio<300){piso+=rms;muestras++;return}
      if(muestras){umbral=Math.max(.015,(piso/muestras)*3);muestras=0}
      if(rms>umbral){hablo=true;ultima=ahora}
      if(hablo&&ahora-ultima>1100) autoParar(true);
      else if(!hablo&&ahora-inicio>7000){continuo=false;autoParar(false);const m2=$("#msgG");if(m2)m2.textContent=tx(["No oí nada. Toca «Grabación continua» cuando estés lista.","I didn't hear anything. Tap «Continuous recording» when you're ready."]);const cb=$("#continuoBtn");if(cb){cb.className="btn verde";cb.textContent="🔁 "+tx(["Grabación continua","Continuous recording"])}}
      else if(ahora-inicio>30000) autoParar(true);
    },50);
  }catch(e){continuo=false;const m=$("#msgG");if(m)m.textContent=tx(["No se pudo usar el micrófono. Abre la app desde su enlace de GitHub (https) y permite el micrófono.","Couldn't use the microphone. Open the app from its GitHub link (https) and allow the microphone."])}
}
function apagarMic(){continuo=false;autoParar(false);pararMic();if(flujo){flujo.getTracks().forEach(t=>t.stop());flujo=null}}

  if(d.cons){consonante=d.cons;render();decir([[NOMBRE_CONS[consonante],"es"]]);return}
  if(d.fam){familia=d.fam;render();decir([[familia.slice(1),"en"]]);return}
  if(d.decirEs){b.classList.add("on");decir([[d.decirEs,"es"]]);return}
  if(d.decirEn){b.classList.add("on");decir([[d.decirEn,"en"]]);return}
  if(d.palEs){const p=[[d.palEs,"es"]];if(lang==="bi")p.push([d.tr,"en"]);decir(p);return}
  if(d.palEn){const p=[[d.palEn,"en"]];if(lang==="bi")p.push([d.tr,"es"]);decir(p);return}
  if(d.num){numActivo=+d.num;P.numeros();conteo(numActivo);return}
  if(d.color!==undefined){const c=COLORES[+d.color];b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");decirPar([c[0],c[1]]);return}
});
