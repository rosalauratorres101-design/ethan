<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethan para Maestros · AI tools for teachers</title>
<style>
:root{--azul:#2b7bd8;--azul-osc:#1d4f8f;--verde:#3bb273;--naranja:#f5a623;--rojo:#e8505b;--tinta:#21324a;--gris:#5b6f88;--fondo:#f4f8fd;--linea:#dfe6ee}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);background:linear-gradient(180deg,#e3f1ff,#fff8e6);min-height:100vh;font-size:17px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
.logo{font-size:1.3rem;color:var(--azul-osc)}.logo span{font-size:.95rem;color:var(--gris);font-weight:700}
.toggle{display:flex;gap:4px;background:#eef3f9;border-radius:999px;padding:4px}
.toggle button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:800;color:#4a5d77;cursor:pointer;min-height:40px}.toggle .on{background:var(--azul);color:#fff}
main{max-width:920px;margin:0 auto;padding:14px}
.aviso{background:#fff7e0;border:2px solid #f5d27a;border-radius:16px;padding:12px 14px;margin:10px 0;line-height:1.45}
.estado{background:#fff;border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tabs button{border:0;border-radius:999px;padding:10px 14px;background:#fff;font-weight:800;color:var(--tinta);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08);min-height:44px}
.tabs .on{background:var(--azul);color:#fff}
.card{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 5px 0 rgba(0,0,0,.06);margin-bottom:14px}
.sub{color:var(--gris);font-weight:700;margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}.grid label{min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:.92rem}
label.full{margin-top:10px}
select,input,textarea{max-width:100%;min-width:0;font:inherit;font-weight:500;padding:10px 12px;border-radius:12px;border:2px solid var(--linea);background:#fff;width:100%}
.estado label{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}.estado select{width:auto;max-width:100%}
.fila{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
button{font:inherit}
.fila button,#prep{border:0;border-radius:16px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--verde);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);min-height:46px}
button.sec{background:#eef3f9;color:var(--tinta)}button:disabled{opacity:.6}
.est{color:var(--gris);font-size:.85rem;margin:8px 0 0}
.badge{display:inline-block;border-radius:999px;padding:5px 10px;font-weight:800;font-size:.85rem}.badge.dev{background:#d9f5e4;color:#1d6b43}.badge.nube{background:#e3efff;color:#1d4f8f}
.texto{line-height:1.6;font-size:1.05rem;white-space:pre-wrap}
.nota{background:#f4f8fd;border-radius:12px;padding:10px}
.revisar{color:var(--gris);font-size:.85rem}
.barra{height:16px;background:#e3efff;border-radius:999px;overflow:hidden}.barra .dev{display:block;height:100%;background:var(--verde)}
.respaldo{border:2px dashed #c9d6e8}
.cargando{text-align:center;font-weight:800}
footer{text-align:center;color:var(--gris);font-size:.85rem;padding:20px}
@media print{header,.aviso,.estado,.tabs,.no-print,footer,.revisar,#panel>.card:first-child{display:none!important}.card{box-shadow:none}body{background:#fff}}
</style>
</head>

<script type="application/json" id="datos">{"niveles":[{"id":"pk","ico":"🧸","nombre":["PreK – Kínder","PreK – Kinder"]},{"id":"g12","ico":"📖","nombre":["1.º y 2.º grado","Grades 1–2"]},{"id":"g35","ico":"🚀","nombre":["3.º a 5.º grado","Grades 3–5"]},{"id":"g68","ico":"🌎","nombre":["6.º a 8.º grado","Grades 6–8"]}],"paises":[{"k":"US","n":["Estados Unidos","United States"],"f":"🇺🇸"},{"k":"MX","n":["México","Mexico"],"f":"🇲🇽"},{"k":"PR","n":["Puerto Rico","Puerto Rico"],"f":"🇵🇷"},{"k":"AR","n":["Argentina","Argentina"],"f":"🇦🇷"},{"k":"BO","n":["Bolivia","Bolivia"],"f":"🇧🇴"},{"k":"CL","n":["Chile","Chile"],"f":"🇨🇱"},{"k":"CO","n":["Colombia","Colombia"],"f":"🇨🇴"},{"k":"CR","n":["Costa Rica","Costa Rica"],"f":"🇨🇷"},{"k":"CU","n":["Cuba","Cuba"],"f":"🇨🇺"},{"k":"EC","n":["Ecuador","Ecuador"],"f":"🇪🇨"},{"k":"SV","n":["El Salvador","El Salvador"],"f":"🇸🇻"},{"k":"ES","n":["España","Spain"],"f":"🇪🇸"},{"k":"GT","n":["Guatemala","Guatemala"],"f":"🇬🇹"},{"k":"GQ","n":["Guinea Ecuatorial","Equatorial Guinea"],"f":"🇬🇶"},{"k":"HN","n":["Honduras","Honduras"],"f":"🇭🇳"},{"k":"NI","n":["Nicaragua","Nicaragua"],"f":"🇳🇮"},{"k":"PA","n":["Panamá","Panama"],"f":"🇵🇦"},{"k":"PY","n":["Paraguay","Paraguay"],"f":"🇵🇾"},{"k":"PE","n":["Perú","Peru"],"f":"🇵🇪"},{"k":"DO","n":["República Dominicana","Dominican Republic"],"f":"🇩🇴"},{"k":"UY","n":["Uruguay","Uruguay"],"f":"🇺🇾"},{"k":"VE","n":["Venezuela","Venezuela"],"f":"🇻🇪"}],"lecciones":[{"id":"vocales","nivel":"pk","area":"lectura","ico":"🅰️","titulo":["Las vocales","The vowels"],"explica":["En español hay cinco vocales: a, e, i, o, u. Siempre suenan igual, en cualquier palabra. Por eso, si sabes las vocales, ya puedes leer muchas sílabas.","Spanish has five vowels: a, e, i, o, u. They always sound the same in every word. Once you know them, you can read lots of syllables."],"ejemplos":[["a · árbol","tree"],["e · estrella","star"],["i · iguana","iguana"],["o · ojo","eye"],["u · uno","one"]],"ejercicios":[{"q":["¿Con qué vocal empieza oso?","Which vowel does oso (bear) start with?"],"o":["a","e","o"],"a":2},{"q":["¿Con qué vocal empieza abeja?","Which vowel does abeja (bee) start with?"],"o":["a","i","u"],"a":0},{"q":["¿Con qué vocal empieza iguana?","Which vowel does iguana start with?"],"o":["o","i","e"],"a":1},{"q":["¿Con qué vocal empieza uvas?","Which vowel does uvas (grapes) start with?"],"o":["u","a","o"],"a":0},{"q":["¿Con qué vocal empieza elefante?","Which vowel does elefante start with?"],"o":["i","e","a"],"a":1}],"est":["Head Start ELOF: alfabetización · prepara RF.K.1","PreK Guidelines: alfabetización emergente","Parvularia: Lenguaje verbal"]},{"id":"formas","nivel":"pk","area":"geometria","ico":"🔺","titulo":["Las formas","Shapes"],"explica":["Las cosas que vemos tienen formas. Un círculo es redondo y no tiene esquinas. Un cuadrado tiene 4 lados iguales. Un triángulo tiene 3 lados. Un rectángulo tiene 4 lados, dos largos y dos cortos.","Things around us have shapes. A circle is round with no corners. A square has 4 equal sides. A triangle has 3 sides. A rectangle has 4 sides: two long and two short."],"ejemplos":[["círculo","circle"],["cuadrado","square"],["triángulo","triangle"],["rectángulo","rectangle"],["estrella","star"]],"ejercicios":[{"q":["¿Qué forma tiene la pelota?","What shape is the ball?"],"o":[["círculo","circle"],["triángulo","triangle"],["cuadrado","square"]],"a":0},{"q":["¿Qué forma tiene un pedazo de pizza?","What shape is a slice of pizza?"],"o":[["cuadrado","square"],["triángulo","triangle"],["círculo","circle"]],"a":1},{"q":["¿Cuántos lados tiene un triángulo?","How many sides does a triangle have?"],"o":["2","3","4"],"a":1},{"q":["¿Qué forma tiene 4 lados iguales?","Which shape has 4 equal sides?"],"o":[["cuadrado","square"],["círculo","circle"],["triángulo","triangle"]],"a":0},{"q":["¿Qué forma no tiene esquinas?","Which shape has no corners?"],"o":[["triángulo","triangle"],["cuadrado","square"],["círculo","circle"]],"a":2}],"est":["ELOF: geometría · prepara K.G.2","PreK Guidelines: matemáticas – geometría","Parvularia: Pensamiento matemático"]},{"id":"cuentapk","nivel":"pk","area":"matematicas","ico":"🧮","titulo":["Más y menos","More and less"],"explica":["Para saber cuál grupo tiene más, cuentas los dos. El número más grande tiene más. El número más pequeño tiene menos.","To find which group has more, count both. The bigger number has more. The smaller number has less."],"ejemplos":[["3 es más que 1","3 is more than 1"],["2 es menos que 4","2 is less than 4"]],"ejercicios":[{"q":["¿Qué grupo tiene más?","Which group has more?"],"o":["🍓🍓","🍓🍓🍓🍓🍓"],"a":1},{"q":["¿Qué grupo tiene menos?","Which group has less?"],"o":["🐥🐥🐥🐥","🐥"],"a":1},{"q":["¿Qué grupo tiene más?","Which group has more?"],"o":["🎈🎈🎈🎈🎈🎈","🎈🎈🎈"],"a":0},{"q":["¿Qué número es más grande?","Which number is bigger?"],"o":["7","4"],"a":0},{"q":["¿Qué número es más pequeño?","Which number is smaller?"],"o":["9","2"],"a":1}],"est":["ELOF: números · prepara K.CC.6","PreK Guidelines: matemáticas – conteo","Parvularia: Pensamiento matemático"]},{"id":"oraciones","nivel":"g12","area":"lectura","ico":"📝","titulo":["Leo oraciones","I read sentences"],"explica":["Una oración es un grupo de palabras que dice una idea completa. Empieza con letra mayúscula y termina con punto.","A sentence is a group of words that tells a complete idea. It starts with a capital letter and ends with a period."],"ejemplos":[["Mi mamá me ama.","My mom loves me."],["El pato nada.","The duck swims."],["La luna sale de noche.","The moon comes out at night."]],"ejercicios":[{"q":["Lee: «El sapo salta.» ¿Qué dibujo va?","Read: «El sapo salta.» Which picture matches?"],"o":["🐸","🐶","🐱"],"a":0},{"q":["Lee: «Veo un sol amarillo.»","Read: «Veo un sol amarillo.»"],"o":["🌙","☀️","⭐"],"a":1},{"q":["Lee: «Mi gato toma leche.»","Read: «Mi gato toma leche.»"],"o":["🐶🦴","🐭🧀","🐱🥛"],"a":2},{"q":["¿Cuál oración está bien escrita?","Which sentence is written correctly?"],"o":["el perro corre","El perro corre.","El perro corre"],"a":1},{"q":["Lee: «La niña come una manzana.»","Read: «La niña come una manzana.»"],"o":["👧🍎","👦🍌","👧🍕"],"a":0}],"est":["RF.1.4, RF.2.4","ELAR/SLAR 1.º–2.º: fluidez y comprensión","Lenguaje 1º–2º: lectura"]},{"id":"articulos","nivel":"g12","area":"gramatica","ico":"🏷️","titulo":["El, la, los, las","Articles: el, la, los, las"],"explica":["En español las palabras son masculinas o femeninas. Muchas que terminan en -o usan «el» y muchas que terminan en -a usan «la». Si son varias, usamos «los» o «las». ¡Ojo! Hay excepciones: decimos «la mano» y «el día».","In Spanish, nouns are masculine or feminine. Many ending in -o use «el», and many ending in -a use «la». For more than one, use «los» or «las». Watch out for exceptions: «la mano» and «el día»."],"ejemplos":[["el gato","the cat"],["la casa","the house"],["los libros","the books"],["las flores","the flowers"]],"ejercicios":[{"q":["___ mesa","___ mesa (table)"],"o":["el","la","los"],"a":1},{"q":["___ perro","___ perro (dog)"],"o":["la","las","el"],"a":2},{"q":["___ niñas","___ niñas (girls)"],"o":["las","los","la"],"a":0},{"q":["___ zapatos","___ zapatos (shoes)"],"o":["las","los","el"],"a":1},{"q":["___ mano (¡es una excepción!)","___ mano (it's an exception!)"],"o":["el","la"],"a":1}],"est":["L.1.1h (determinantes)","SLAR 1.º–2.º: convenciones","Lenguaje 1º–2º"]},{"id":"sumas","nivel":"g12","area":"matematicas","ico":"➕","titulo":["Sumas hasta 20","Adding up to 20"],"explica":["Sumar es juntar. Si tienes 3 manzanas y te dan 2 más, juntas todo y cuentas: 3 + 2 = 5. Un truco: empieza con el número más grande y sigue contando.","Adding means putting together. If you have 3 apples and get 2 more, put them all together and count: 3 + 2 = 5. Tip: start with the bigger number and count on."],"ejemplos":[["3 + 2 = 5","3 plus 2 equals 5"],["6 + 3 = 9","6 plus 3 equals 9"],["10 + 4 = 14","10 plus 4 equals 14"]],"ejercicios":[],"est":["1.OA.6, 2.OA.2","1.3D, 2.4A","Matemática 1º–2º"]},{"id":"restas","nivel":"g12","area":"matematicas","ico":"➖","titulo":["Restas","Subtracting"],"explica":["Restar es quitar. Si tienes 5 globos y se van volando 2, te quedan 3: 5 − 2 = 3. En estas restas el primer número es el más grande, así que el resultado nunca baja de cero.","Subtracting means taking away. If you have 5 balloons and 2 fly away, 3 are left: 5 − 2 = 3. In these problems the first number is the biggest, so the answer never goes below zero."],"ejemplos":[["5 − 2 = 3","5 minus 2 equals 3"],["8 − 3 = 5","8 minus 3 equals 5"]],"ejercicios":[],"est":["1.OA.6, 2.OA.2","1.3D, 2.4A","Matemática 1º–2º"]},{"id":"dias","nivel":"g12","area":"vocabulario","ico":"📅","titulo":["Los días de la semana","Days of the week"],"explica":["La semana tiene 7 días. En español los días se escriben con minúscula, a menos que estén al principio de la oración. En muchos calendarios en español la semana empieza el lunes.","A week has 7 days. In Spanish, days are written in lowercase unless they start a sentence. On many Spanish calendars the week starts on Monday."],"ejemplos":[["lunes","Monday"],["martes","Tuesday"],["miércoles","Wednesday"],["jueves","Thursday"],["viernes","Friday"],["sábado","Saturday"],["domingo","Sunday"]],"ejercicios":[{"q":["¿Qué día viene después del lunes?","Which day comes after lunes?"],"o":["domingo","martes","jueves"],"a":1},{"q":["¿Qué día va antes del viernes?","Which day comes before viernes?"],"o":["jueves","sábado","miércoles"],"a":0},{"q":["¿Cómo se dice Saturday en español?","How do you say Saturday in Spanish?"],"o":["domingo","sábado","lunes"],"a":1},{"q":["¿Cuántos días tiene una semana?","How many days are in a week?"],"o":["5","7","10"],"a":1},{"q":["¿Cuál está bien escrita en medio de una oración?","Which is written correctly in the middle of a sentence?"],"o":["Hoy es Martes.","Hoy es martes."],"a":1}],"est":["L.1.5 (vocabulario)","ELAR/SLAR 1.º: vocabulario","Lenguaje 1º"]},{"id":"huerto","nivel":"g35","area":"lectura","ico":"🍅","titulo":["Cuento: El huerto de Ana","Story: Ana's garden"],"explica":["Un buen lector se pregunta: ¿Quién? ¿Dónde? ¿Cuándo? ¿Qué pasó? ¿Por qué? Las respuestas casi siempre están en el texto. Si no estás seguro, vuelve a leer la parte que habla de eso.","A good reader asks: Who? Where? When? What happened? Why? The answers are almost always in the text. If you're not sure, reread that part."],"ejemplos":[["¿Quién? → Ana","Who? → Ana"],["¿Dónde? → en Texas","Where? → in Texas"],["¿Por qué riegan? → porque hace calor","Why water? → because it's hot"]],"ejercicios":[{"q":["¿A quién ayuda Ana?","Who does Ana help?"],"o":[["a su mamá","her mom"],["a su abuelo","her grandpa"],["a su maestra","her teacher"]],"a":1},{"q":["¿Qué día van al huerto?","What day do they go to the garden?"],"o":[["el lunes","Monday"],["el domingo","Sunday"],["el sábado","Saturday"]],"a":2},{"q":["¿Qué hacen primero?","What do they do first?"],"o":[["riegan los chiles","water the chiles"],["sacan las hierbas malas","pull the weeds"],["hacen salsa","make salsa"]],"a":1},{"q":["¿Por qué riegan las plantas?","Why do they water the plants?"],"o":[["porque hace mucho calor","because it is very hot"],["porque llueve","because it rains"],["porque es de noche","because it's night"]],"a":0},{"q":["¿Qué prepara el abuelo con el tomate?","What does grandpa make with the tomato?"],"o":[["sopa","soup"],["pizza","pizza"],["salsa","salsa"]],"a":2}],"est":["RL.3.1, RL.3.3","ELAR/SLAR 3.º: comprensión","Lenguaje 3º–4º"]},{"id":"adjetivos","nivel":"g35","area":"gramatica","ico":"🎨","titulo":["Los adjetivos","Adjectives"],"explica":["Un adjetivo describe a un sustantivo. En español el adjetivo va casi siempre después y concuerda: si el sustantivo es femenino, el adjetivo también; si es plural, el adjetivo también.","An adjective describes a noun. In Spanish it usually goes after the noun and agrees with it: feminine noun, feminine adjective; plural noun, plural adjective."],"ejemplos":[["el gato negro","the black cat"],["la casa blanca","the white house"],["los perros pequeños","the small dogs"],["las flores rojas","the red flowers"]],"ejercicios":[{"q":["La niña es ___.","The girl is ___ (tall)."],"o":["alto","alta","altos"],"a":1},{"q":["Los libros son ___.","The books are ___ (new)."],"o":["nuevos","nueva","nuevo"],"a":0},{"q":["Tengo dos camisas ___.","I have two ___ shirts (yellow)."],"o":["amarillo","amarillas","amarilla"],"a":1},{"q":["El perro es muy ___.","The dog is very ___ (funny)."],"o":["chistosa","chistosos","chistoso"],"a":2},{"q":["Las ventanas están ___.","The windows are ___ (open)."],"o":["abiertas","abiertos","abierta"],"a":0}],"est":["L.3.1a","SLAR 3.º: convenciones","Lenguaje 3º"]},{"id":"verbosar","nivel":"g35","area":"gramatica","ico":"🗣️","titulo":["Verbos -ar en presente","-ar verbs in the present"],"explica":["Para conjugar un verbo que termina en -ar, quitas la terminación -ar y le pones la terminación de la persona: -o, -as, -a, -amos, -an.","To conjugate a verb ending in -ar, drop the -ar and add the ending for the person: -o, -as, -a, -amos, -an."],"ejemplos":[["Yo bailo.","I dance."],["Nosotros cantamos.","We sing."],["Ella estudia.","She studies."]],"ejercicios":[{"q":["Yo ___ (bailar) en la fiesta.","I ___ (bailar) at the party."],"o":["bailas","bailo","bailan"],"a":1},{"q":["Nosotros ___ (cantar) en el coro.","We ___ (cantar) in the choir."],"o":["cantamos","cantan","canto"],"a":0},{"q":["Ella ___ (estudiar) mucho.","She ___ (estudiar) a lot."],"o":["estudian","estudio","estudia"],"a":2},{"q":["Tú ___ (nadar) muy rápido.","You ___ (nadar) very fast."],"o":["nadas","nada","nadamos"],"a":0},{"q":["Ellos ___ (caminar) a la escuela.","They ___ (caminar) to school."],"o":["camina","caminan","caminas"],"a":1}],"est":["L.3.1d, L.3.1e","SLAR 3.º: convenciones (verbos)","Lenguaje 3º–4º"]},{"id":"multiplicar","nivel":"g35","area":"matematicas","ico":"✖️","titulo":["Multiplicar","Multiplying"],"explica":["Multiplicar es sumar el mismo número varias veces. 3 × 4 quiere decir 3 grupos de 4: 4 + 4 + 4 = 12. El orden no cambia el resultado: 3 × 4 = 4 × 3.","Multiplying is adding the same number several times. 3 × 4 means 3 groups of 4: 4 + 4 + 4 = 12. Order doesn't change the answer: 3 × 4 = 4 × 3."],"ejemplos":[["3 × 4 = 12","3 times 4 equals 12"],["2 × 5 = 10","2 times 5 equals 10"],["8 patas × 2 arañas = 16","8 legs × 2 spiders = 16"]],"ejercicios":[],"est":["3.OA.7","3.4D, 3.4F","Matemática 3º"]},{"id":"fracciones","nivel":"g35","area":"matematicas","ico":"🍕","titulo":["Fracciones","Fractions"],"explica":["Una fracción es una parte de un entero. El número de abajo (denominador) dice en cuántas partes iguales se cortó. El de arriba (numerador) dice cuántas partes tomas. Si una pizza se corta en 4 y comes 1, comiste 1/4.","A fraction is part of a whole. The bottom number (denominator) tells how many equal parts. The top number (numerator) tells how many parts you take. If a pizza is cut into 4 and you eat 1, you ate 1/4."],"ejemplos":[["1/2 = la mitad","1/2 = one half"],["1/4 = un cuarto","1/4 = one fourth"],["2/4 = 1/2","2/4 equals 1/2"]],"ejercicios":[{"q":["Una pizza tiene 4 partes iguales. Comes 1. ¿Qué fracción comiste?","A pizza has 4 equal parts. You eat 1. What fraction did you eat?"],"o":["1/2","1/4","4/1"],"a":1},{"q":["¿Qué es más grande?","Which is bigger?"],"o":["1/2","1/4","1/8"],"a":0},{"q":["2/4 es igual a…","2/4 is equal to…"],"o":["1/2","1/4","2/2"],"a":0},{"q":["En 3/5, ¿cuál es el denominador?","In 3/5, what is the denominator?"],"o":["3","5","8"],"a":1},{"q":["Tienes 8 crayones y la mitad son rojos. ¿Cuántos son rojos?","You have 8 crayons and half are red. How many are red?"],"o":["2","4","6"],"a":1}],"est":["3.NF.1–3","3.3A, 3.3C, 3.3H","Matemática 3º–4º"]},{"id":"paises","nivel":"g35","area":"cultura","ico":"🗺️","titulo":["Países y capitales","Countries and capitals"],"explica":["El español es idioma oficial en 20 países y en Puerto Rico: en España, en Guinea Ecuatorial y en casi toda Latinoamérica. La capital es la ciudad donde está el gobierno del país.","Spanish is an official language in 20 countries plus Puerto Rico: Spain, Equatorial Guinea and most of Latin America. The capital is the city where the country's government is."],"ejemplos":[["México · Ciudad de México","Mexico · Mexico City"],["España · Madrid","Spain · Madrid"],["Colombia · Bogotá","Colombia · Bogotá"],["Argentina · Buenos Aires","Argentina · Buenos Aires"],["Perú · Lima","Peru · Lima"],["Cuba · La Habana","Cuba · Havana"]],"ejercicios":[{"q":["¿Cuál es la capital de Perú?","What is the capital of Peru?"],"o":["Lima","Quito","Santiago"],"a":0},{"q":["¿Cuál es la capital de España?","What is the capital of Spain?"],"o":["Barcelona","Madrid","Sevilla"],"a":1},{"q":["¿Cuál es la capital de Colombia?","What is the capital of Colombia?"],"o":["Medellín","Caracas","Bogotá"],"a":2},{"q":["¿Cuál es la capital de Argentina?","What is the capital of Argentina?"],"o":["Buenos Aires","Montevideo","Córdoba"],"a":0},{"q":["¿Qué país tiene esta bandera?","Which country has this flag?"],"o":["Guatemala","México","Chile"],"a":1}],"est":["WA Estudios Sociales 3.º–5.º: geografía","TEKS Estudios Sociales 3.º–5.º: geografía","Historia, Geografía y CC. SS. 3º–5º"]},{"id":"monarca","nivel":"g68","area":"lectura","ico":"🦋","titulo":["Lectura: La mariposa monarca","Reading: The monarch butterfly"],"explica":["La idea principal es de qué trata todo el texto. Un detalle es un dato que la apoya. Una inferencia es una conclusión que sacas usando lo que dice el texto y lo que ya sabes, aunque el texto no lo diga directamente.","The main idea is what the whole text is about. A detail is a fact that supports it. An inference is a conclusion you draw from the text plus what you already know, even if the text doesn't say it directly."],"ejemplos":[["Idea principal: la migración de la monarca","Main idea: the monarch's migration"],["Detalle: pasan por Texas","Detail: they pass through Texas"],["Inferencia: sin algodoncillo no hay orugas","Inference: no milkweed, no caterpillars"]],"ejercicios":[{"q":["¿Cuál es la idea principal del texto?","What is the main idea of the text?"],"o":[["Las orugas comen hojas.","Caterpillars eat leaves."],["La monarca hace un gran viaje cada año.","The monarch makes a long journey every year."],["México tiene bosques.","Mexico has forests."]],"a":1},{"q":["¿Dónde pasan el invierno las monarcas?","Where do monarchs spend the winter?"],"o":[["en Canadá","in Canada"],["en el centro de México","in central Mexico"],["en Texas","in Texas"]],"a":1},{"q":["¿Por qué se juntan en los árboles?","Why do they cluster in the trees?"],"o":[["para protegerse del frío","to stay protected from the cold"],["para comer","to eat"],["para poner huevos","to lay eggs"]],"a":0},{"q":["Inferencia: ¿qué pasaría si desaparece el algodoncillo?","Inference: what would happen if milkweed disappeared?"],"o":[["Habría más monarcas.","There would be more monarchs."],["Las orugas no tendrían qué comer.","The caterpillars would have nothing to eat."],["Viajarían a Canadá en invierno.","They would fly to Canada in winter."]],"a":1},{"q":["Según el texto, ¿qué es el oyamel?","According to the text, what is an oyamel?"],"o":[["un tipo de árbol","a kind of tree"],["una mariposa","a butterfly"],["una ciudad","a city"]],"a":0}],"est":["RI.6.2","ELAR/SLAR 6.º: idea principal","Lengua y Literatura 6º–7º"]},{"id":"presente","nivel":"g35","area":"gramatica","ico":"🔁","titulo":["Presente: -er e -ir","Present: -er and -ir verbs"],"explica":["Los verbos que terminan en -er e -ir usan casi las mismas terminaciones: -o, -es, -e, -en. La diferencia está en nosotros: comemos (-emos) pero vivimos (-imos).","Verbs ending in -er and -ir use almost the same endings: -o, -es, -e, -en. The difference is nosotros: comemos (-emos) but vivimos (-imos)."],"ejemplos":[["Nosotros comemos tacos.","We eat tacos."],["Ustedes viven en Austin.","You all live in Austin."],["Yo escribo un poema.","I write a poem."]],"ejercicios":[{"q":["Mi hermano ___ (leer) un libro.","My brother ___ (leer) a book."],"o":["leo","lee","leemos"],"a":1},{"q":["Nosotros ___ (escribir) cartas.","We ___ (escribir) letters."],"o":["escribemos","escriben","escribimos"],"a":2},{"q":["Tú ___ (beber) agua.","You ___ (beber) water."],"o":["bebes","bebe","bebo"],"a":0},{"q":["Ellas ___ (abrir) la puerta.","They ___ (abrir) the door."],"o":["abre","abrimos","abren"],"a":2},{"q":["Nosotros ___ (aprender) español.","We ___ (aprender) Spanish."],"o":["aprendimos","aprendemos","aprenden"],"a":1}],"est":["L.3.1e","SLAR 3.º–4.º: tiempos verbales","Lenguaje 3º–4º"]},{"id":"preterito","nivel":"g35","area":"gramatica","ico":"⏪","titulo":["El pretérito","The preterite (past)"],"explica":["Usamos el pretérito para acciones terminadas en el pasado: ayer, anoche, el año pasado. Las formas de yo y él/ella llevan acento: hablé, habló, comí, comió. Los verbos -er e -ir comparten las mismas terminaciones.","We use the preterite for completed actions in the past: yesterday, last night, last year. The yo and él/ella forms have accents: hablé, habló, comí, comió. -er and -ir verbs share the same endings."],"ejemplos":[["Ayer comí pizza.","Yesterday I ate pizza."],["Ella bailó toda la noche.","She danced all night."],["Ellos escribieron una carta.","They wrote a letter."]],"ejercicios":[{"q":["Ayer yo ___ (comer) en casa de mi abuela.","Yesterday I ___ (comer) at my grandma's."],"o":["como","comí","comió"],"a":1},{"q":["Anoche ella ___ (bailar) en la fiesta.","Last night she ___ (bailar) at the party."],"o":["bailó","bailé","baila"],"a":0},{"q":["El año pasado nosotros ___ (vivir) en Houston.","Last year we ___ (vivir) in Houston."],"o":["vivieron","vivimos","viví"],"a":1},{"q":["Ellos ___ (escribir) un cuento.","They ___ (escribir) a story."],"o":["escribieron","escribió","escriben"],"a":0},{"q":["¿Tú ___ (estudiar) para el examen?","Did you ___ (estudiar) for the test?"],"o":["estudiaste","estudió","estudias"],"a":0}],"est":["L.3.1e","SLAR 3.º–4.º: tiempos verbales","Lenguaje 3º–4º"]},{"id":"serestar","nivel":"g68","area":"gramatica","ico":"⚖️","titulo":["Ser y estar","Ser vs. estar"],"explica":["Los dos significan «to be». Ser describe lo que algo es: origen, profesión, características, la hora. Estar dice dónde está algo y cómo está en este momento: lugar, emociones, estados que cambian.","Both mean «to be». Ser tells what something is: origin, job, traits, time. Estar tells where something is and how it is right now: location, feelings, changing conditions."],"ejemplos":[["Mi mamá es maestra.","My mom is a teacher. (ser: job)"],["Estamos en la escuela.","We are at school. (estar: place)"],["Estoy cansado hoy.","I am tired today. (estar: feeling)"]],"ejercicios":[{"q":["Mi papá ___ doctor.","My dad ___ a doctor."],"o":["es","está"],"a":0},{"q":["Nosotros ___ en la biblioteca.","We ___ at the library."],"o":["somos","estamos"],"a":1},{"q":["Yo ___ muy feliz hoy.","I ___ very happy today."],"o":["soy","estoy"],"a":1},{"q":["Ellos ___ de Guatemala.","They ___ from Guatemala."],"o":["son","están"],"a":0},{"q":["La sopa ___ caliente.","The soup ___ hot."],"o":["es","está"],"a":1}],"est":["Español como lengua de herencia","SLAR 6.º–8.º: convenciones","Lengua y Literatura 7º"]},{"id":"ecuaciones","nivel":"g68","area":"algebra","ico":"🟰","titulo":["Ecuaciones de un paso","One-step equations"],"explica":["Una ecuación es como una balanza: lo que haces de un lado lo haces del otro. Para dejar sola la x, usas la operación contraria: si está sumando, restas; si está multiplicando, divides.","An equation is like a balance: whatever you do to one side you do to the other. To get x alone, use the opposite operation: if a number is added, subtract it; if it multiplies, divide."],"ejemplos":[["x + 5 = 12 → x = 12 − 5 = 7","x + 5 = 12 → x = 7"],["3x = 18 → x = 18 ÷ 3 = 6","3x = 18 → x = 6"],["x − 4 = 10 → x = 10 + 4 = 14","x − 4 = 10 → x = 14"]],"ejercicios":[],"est":["6.EE.7","6.10A","Matemática 6º–7º"]},{"id":"porcentajes","nivel":"g68","area":"matematicas","ico":"💯","titulo":["Porcentajes","Percentages"],"explica":["Por ciento quiere decir «de cada 100». El 50 % es la mitad, el 25 % es la cuarta parte y el 10 % se saca dividiendo entre 10.","Percent means «out of 100». 50% is half, 25% is a quarter, and you find 10% by dividing by 10."],"ejemplos":[["50 % de 80 = 40","50% of 80 = 40"],["25 % de 40 = 10","25% of 40 = 10"],["10 % de 70 = 7","10% of 70 = 7"]],"ejercicios":[],"est":["6.RP.3c","6.4F, 6.5B","Matemática 6º–7º"]},{"id":"tradiciones","nivel":"g68","area":"cultura","ico":"🕯️","titulo":["Tradiciones: Día de Muertos","Traditions: Day of the Dead"],"explica":["Conocer las tradiciones nos ayuda a entender a las personas que hablan el idioma. Al leer sobre cultura, fíjate en las fechas, los objetos y el significado de cada costumbre.","Knowing traditions helps us understand the people who speak the language. When reading about culture, notice dates, objects and the meaning of each custom."],"ejemplos":[["la vela","candle"],["el cempasúchil","marigold"],["el pan de muerto","Day of the Dead bread"],["la ofrenda","home altar"]],"ejercicios":[{"q":["¿Cuándo se celebra el Día de Muertos?","When is Day of the Dead celebrated?"],"o":[["el 31 de octubre","October 31"],["el 1 y 2 de noviembre","November 1 and 2"],["el 25 de diciembre","December 25"]],"a":1},{"q":["¿De qué color es la flor de cempasúchil?","What color is the cempasúchil flower?"],"o":[["azul","blue"],["morada","purple"],["naranja","orange"]],"a":2},{"q":["¿Qué es una ofrenda?","What is an ofrenda?"],"o":[["un altar con fotos y comida","an altar with photos and food"],["un tipo de baile","a type of dance"],["una canción","a song"]],"a":0},{"q":["Según el texto, ¿para qué sirven las flores?","According to the text, what are the flowers for?"],"o":[["para guiar a las almas","to guide the souls"],["para comer","to eat"],["para vender","to sell"]],"a":0},{"q":["¿Cómo es el tono de la celebración?","What is the tone of the celebration?"],"o":[["muy triste","very sad"],["una forma de celebrar la vida","a way to celebrate life"],["de miedo","scary"]],"a":1}],"est":["WA Estudios Sociales 6.º–8.º: cultura","TEKS Estudios Sociales 6.º: culturas del mundo","Historia, Geografía y CC. SS. 7º"]},{"id":"lalo","nivel":"pk","area":"lectura","ico":"🐶","titulo":["Lectura: Mi perrito Lalo","Reading: My little dog Lalo"],"explica":["Cuando oímos un cuento pensamos en tres cosas: de quién habla, cómo es y qué hace. Los dibujos también nos ayudan a entender.","When we hear a story we think about three things: who it's about, what it's like and what it does. Pictures help us understand too."],"ejemplos":[["¿De quién habla? De Lalo.","Who is it about? Lalo."],["¿Cómo es? Café y pequeño.","What is he like? Brown and small."],["¿Qué le gusta? Correr.","What does he like? Running."]],"ejercicios":[{"q":["¿Quién es Lalo?","Who is Lalo?"],"o":["🐶","🐱","🐰"],"a":0},{"q":["¿De qué color es Lalo?","What color is Lalo?"],"o":[["café","brown"],["azul","blue"],["verde","green"]],"a":0},{"q":["¿Dónde le gusta correr?","Where does he like to run?"],"o":[["en el parque","in the park"],["en la escuela","at school"],["en la playa","at the beach"]],"a":0},{"q":["¿Qué hace Lalo en la noche?","What does Lalo do at night?"],"o":[["duerme","sleeps"],["come","eats"],["nada","swims"]],"a":0},{"q":["¿Lalo es grande o pequeño?","Is Lalo big or small?"],"o":[["pequeño","small"],["grande","big"]],"a":0}],"est":["ELOF: comprensión · prepara RL.K.1","PreK Guidelines: lenguaje y comunicación","Parvularia: Lenguaje verbal"]},{"id":"sofia","nivel":"g12","area":"lectura","ico":"🎂","titulo":["Lectura: La fiesta de Sofía","Reading: Sofía's party"],"explica":["Un cuento tiene principio, medio y final. Para entenderlo, fíjate en quién es el personaje, qué pasa y en qué orden pasan las cosas.","A story has a beginning, a middle and an end. To understand it, notice who the character is, what happens and in what order."],"ejemplos":[["Personaje: Sofía","Character: Sofía"],["Principio: es su cumpleaños","Beginning: it's her birthday"],["Final: sopla las velas","End: she blows out the candles"]],"ejercicios":[{"q":["¿Cuántos años cumple Sofía?","How old is Sofía turning?"],"o":["5","7","9"],"a":1},{"q":["¿De qué es el pastel?","What kind of cake is it?"],"o":[["de chocolate","chocolate"],["de fresa","strawberry"],["de vainilla","vanilla"]],"a":0},{"q":["¿A qué hora llegan los amigos?","What time do the friends arrive?"],"o":[["a las tres","at three"],["a las ocho","at eight"],["a las doce","at twelve"]],"a":0},{"q":["¿Qué tiene la piñata?","What is in the piñata?"],"o":[["dulces","candy"],["juguetes","toys"],["flores","flowers"]],"a":0},{"q":["¿Qué pasa al final del cuento?","What happens at the end?"],"o":[["Sofía sopla las velas.","Sofía blows out the candles."],["Sofía se va a dormir.","Sofía goes to sleep."],["Llegan los amigos.","The friends arrive."]],"a":0}],"est":["RL.2.1, RL.2.3","ELAR/SLAR 2.º: comprensión","Lenguaje 2º: lectura"]},{"id":"murcielagos","nivel":"g35","area":"lectura","ico":"🦇","titulo":["Lectura: Los murciélagos de Austin","Reading: The bats of Austin"],"explica":["Un texto informativo enseña datos reales. Fíjate en los números, en las fechas y en palabras como «porque» y «cuando», que explican causas.","An informational text teaches real facts. Pay attention to numbers, dates and words like «because» and «when», which explain causes."],"ejemplos":[["Número: un millón y medio","Number: one and a half million"],["Fecha: después de 1980","Date: after 1980"],["Causa: «cuando arreglaron el puente»","Cause: «when the bridge was repaired»"]],"ejercicios":[{"q":["¿Dónde viven los murciélagos?","Where do the bats live?"],"o":[["debajo de un puente","under a bridge"],["en una cueva","in a cave"],["en un árbol","in a tree"]],"a":0},{"q":["¿Cuántos murciélagos hay, más o menos?","About how many bats are there?"],"o":[["un millón y medio","one and a half million"],["cien","one hundred"],["mil","one thousand"]],"a":0},{"q":["¿Cuándo salen volando?","When do they fly out?"],"o":[["cuando se pone el sol","when the sun goes down"],["a mediodía","at noon"],["en la mañana","in the morning"]],"a":0},{"q":["¿Qué salen a buscar?","What do they go out to find?"],"o":[["insectos","insects"],["frutas","fruit"],["pescado","fish"]],"a":0},{"q":["¿Por qué empezaron a vivir en el puente?","Why did they start living on the bridge?"],"o":[["Al arreglarlo quedaron grietas para dormir.","Repairs left cracks for sleeping."],["Porque allí hace frío.","Because it's cold there."],["Porque la gente les da comida.","Because people feed them."]],"a":0}],"est":["RI.3.1, RI.3.2","ELAR/SLAR 3.º: textos informativos","Lenguaje 3º–4º"]},{"id":"cacao","nivel":"g68","area":"lectura","ico":"🍫","titulo":["Lectura: El cacao, de semilla a moneda","Reading: Cacao, from seed to money"],"explica":["En un texto de historia busca dos cosas: la secuencia en el tiempo (qué pasó antes y después) y la relación de causa y efecto (por qué pasó). Las fechas y las palabras como «antes», «para» y «tan… que» son pistas.","In a history text look for two things: the sequence in time (what happened before and after) and cause and effect (why it happened). Dates and words like «before», «to» and «so… that» are clues."],"ejemplos":[["Secuencia: olmecas → mayas → aztecas","Sequence: Olmecs → Maya → Aztecs"],["Causa y efecto: era valioso, por eso servía de dinero","Cause and effect: it was valuable, so it worked as money"],["Detalle: la bebida maya a veces llevaba chile","Detail: the Maya drink sometimes had chili"]],"ejercicios":[{"q":["¿Cuál es la idea principal?","What is the main idea?"],"o":[["La historia del cacao en Mesoamérica.","The history of cacao in Mesoamerica."],["Cómo hacer barras de chocolate.","How to make chocolate bars."],["Los conejos de México.","The rabbits of Mexico."]],"a":0},{"q":["Según el texto, ¿quiénes usaron el cacao primero?","According to the text, who used cacao first?"],"o":[["los olmecas","the Olmecs"],["los aztecas","the Aztecs"],["los europeos","the Europeans"]],"a":0},{"q":["¿Cómo era la bebida de los mayas?","What was the Maya drink like?"],"o":[["espumosa y amarga","foamy and bitter"],["fría y dulce","cold and sweet"],["de leche","made with milk"]],"a":0},{"q":["¿Para qué usaban los aztecas las semillas?","What did the Aztecs use the seeds for?"],"o":[["como dinero","as money"],["como juguete","as toys"],["como medicina","as medicine"]],"a":0},{"q":["Inferencia: ¿por qué servían de dinero?","Inference: why did they work as money?"],"o":[["Porque eran valiosas y todos las querían.","Because they were valuable and everyone wanted them."],["Porque no servían para nada.","Because they were useless."],["Porque eran muy grandes.","Because they were very big."]],"a":0}],"est":["RI.6.1, RI.6.3","ELAR/SLAR 6.º: textos informativos","Lengua y Literatura 6º–7º"]},{"id":"escuchapk","nivel":"pk","area":"escuchar","ico":"👂","titulo":["Escucho y toco","Listen and tap"],"explica":["Para escuchar bien, haz silencio, mira la pantalla y oye toda la palabra antes de tocar. Si no la oíste bien, tócala otra vez.","To listen well, be quiet, look at the screen and hear the whole word before you tap. If you didn't hear it, tap it again."],"ejemplos":[["abeja","bee"],["vaca","cow"],["luna","moon"]],"ejercicios":[],"est":["ELOF: escuchar y comprender","PreK Guidelines: escuchar y comprender","Parvularia: Lenguaje verbal"]},{"id":"hablapk","nivel":"pk","area":"hablar","ico":"🗣️","titulo":["Repite conmigo","Repeat after me"],"explica":["Hablar se aprende hablando. Escucha cómo suena, fíjate en tu boca y repite despacio. Si te equivocas no pasa nada: ¡otra vez!","You learn to speak by speaking. Listen to how it sounds, notice your mouth and repeat slowly. If you make a mistake, that's okay: try again!"],"ejemplos":[["Hola.","Hello."],["Gracias.","Thank you."],["¿Cómo estás?","How are you?"]],"ejercicios":[],"est":["ELOF: expresión oral","PreK Guidelines: lenguaje y comunicación","Parvularia: Lenguaje verbal"]},{"id":"escribepk","nivel":"pk","area":"escritura","ico":"✏️","titulo":["Formo palabras","I build words"],"explica":["Las palabras se forman con letras en orden. Si cambias el orden, la palabra cambia. Di la palabra despacio para oír cada sonido.","Words are made of letters in order. If you change the order, the word changes. Say the word slowly to hear each sound."],"ejemplos":[["o - s - o → oso","bear"],["s - o - l → sol","sun"],["p - a - t - o → pato","duck"]],"ejercicios":[],"est":["ELOF: escritura emergente","PreK Guidelines: escritura emergente","Parvularia: Lenguaje verbal"]},{"id":"comparapk","nivel":"pk","area":"comparar","ico":"🔍","titulo":["Comparo: el gato y el perro","Compare: the cat and the dog"],"explica":["Comparar es buscar en qué se parecen y en qué son diferentes dos cosas. El gato y el perro son mascotas, pero cada uno hace cosas distintas.","Comparing means finding how two things are alike and different. Cats and dogs are both pets, but each one does different things."],"ejemplos":[["Se parecen: los dos son mascotas.","Alike: both are pets."],["Diferente: uno dice miau y otro guau.","Different: one says meow, the other woof."]],"ejercicios":[{"q":["¿Quién dice «guau»?","Who says «woof»?"],"o":["🐶","🐱"],"a":0},{"q":["¿Quién es pequeño y suave?","Who is small and soft?"],"o":["🐱","🐶"],"a":0},{"q":["¿En qué se parecen?","How are they alike?"],"o":[["Los dos son mascotas.","Both are pets."],["Los dos dicen miau.","Both say meow."],["Los dos son azules.","Both are blue."]],"a":0},{"q":["¿A quién le gusta dormir al sol?","Who likes to sleep in the sun?"],"o":["🐱","🐶"],"a":0},{"q":["¿Quién corre con la pelota?","Who runs with the ball?"],"o":["🐶","🐱"],"a":0}],"est":["ELOF: comprensión","PreK Guidelines: comprensión","Parvularia: Lenguaje verbal"]},{"id":"fiestapk","nivel":"pk","area":"cultura","ico":"🎉","titulo":["Cultura: fiestas de cumpleaños","Culture: birthday parties"],"explica":["Cada lugar tiene sus costumbres. Conocerlas nos ayuda a entender y a respetar a otras familias.","Every place has its own customs. Knowing them helps us understand and respect other families."],"ejemplos":[["la piñata","piñata"],["los dulces","candy"],["Las mañanitas","a birthday song"]],"ejercicios":[{"q":["¿Qué tiene la piñata?","What is in the piñata?"],"o":[["dulces","candy"],["piedras","rocks"],["libros","books"]],"a":0},{"q":["¿Con qué le pegan a la piñata?","What do they hit the piñata with?"],"o":[["con un palo","with a stick"],["con la mano","with a hand"],["con una pelota","with a ball"]],"a":0},{"q":["¿Qué canción se canta?","What song do people sing?"],"o":[["Las mañanitas","Las mañanitas"],["Los pollitos dicen","Los pollitos dicen"]],"a":0},{"q":["¿En qué país es esta costumbre?","In which country is this custom?"],"o":[["México","Mexico"],["Japón","Japan"],["Canadá","Canada"]],"a":0}],"est":["ELOF: desarrollo social","PreK Guidelines: estudios sociales","Parvularia: Comprensión del entorno sociocultural"]},{"id":"flotapk","nivel":"pk","area":"ciencias","ico":"🛟","titulo":["Ciencias: ¿flota o se hunde?","Science: float or sink?"],"explica":["Algunas cosas se quedan arriba del agua: flotan. Otras bajan al fondo: se hunden. Las cosas ligeras, como una hoja, casi siempre flotan. Las pesadas y duras, como una piedra, se hunden.","Some things stay on top of the water: they float. Others go to the bottom: they sink. Light things, like a leaf, usually float. Heavy, hard things, like a rock, sink."],"ejemplos":[["La hoja flota.","The leaf floats."],["La piedra se hunde.","The rock sinks."],["El patito de hule flota.","The rubber duck floats."]],"ejercicios":[{"q":["La piedra…","The rock…"],"o":[["flota","floats"],["se hunde","sinks"]],"a":1},{"q":["La hoja…","The leaf…"],"o":[["flota","floats"],["se hunde","sinks"]],"a":0},{"q":["La llave de metal…","The metal key…"],"o":[["flota","floats"],["se hunde","sinks"]],"a":1},{"q":["El patito de hule…","The rubber duck…"],"o":[["flota","floats"],["se hunde","sinks"]],"a":0},{"q":["La moneda…","The coin…"],"o":[["flota","floats"],["se hunde","sinks"]],"a":1}],"est":["ELOF: indagación científica","PreK Guidelines: ciencias","Parvularia: Exploración del entorno natural"]},{"id":"sentidos","nivel":"pk","area":"biologia","ico":"👀","titulo":["Biología: los cinco sentidos","Biology: the five senses"],"explica":["Tenemos cinco sentidos para conocer el mundo: con los ojos vemos, con las orejas oímos, con la nariz olemos, con la lengua probamos los sabores y con la piel sentimos lo que tocamos.","We have five senses to learn about the world: we see with our eyes, hear with our ears, smell with our nose, taste with our tongue and feel what we touch with our skin."],"ejemplos":[["vista: los ojos","sight: eyes"],["oído: las orejas","hearing: ears"],["olfato: la nariz","smell: nose"],["gusto: la lengua","taste: tongue"],["tacto: la piel","touch: skin"]],"ejercicios":[{"q":["¿Con qué olemos una flor?","What do we smell a flower with?"],"o":["👃","👂","👀"],"a":0},{"q":["¿Con qué oímos la música?","What do we hear music with?"],"o":["👅","👂","🖐️"],"a":1},{"q":["¿Con qué vemos los colores?","What do we see colors with?"],"o":["👀","👃","👅"],"a":0},{"q":["¿Con qué probamos si el limón es ácido?","What do we use to taste if a lemon is sour?"],"o":["🖐️","👅","👂"],"a":1},{"q":["¿Con qué sentimos que el hielo está frío?","What do we use to feel that ice is cold?"],"o":["🖐️","👀","👃"],"a":0}],"est":["ELOF: ciencias · prepara 1-LS1","PreK Guidelines: ciencias de la vida","Parvularia: Exploración del entorno natural"]},{"id":"paisajepk","nivel":"pk","area":"geografia","ico":"⛰️","titulo":["Geografía: montaña, río y mar","Geography: mountain, river and sea"],"explica":["La Tierra tiene muchos paisajes. Una montaña es muy alta. Un río es agua que corre. El mar es agua salada muy grande. Un desierto casi no tiene agua. Una isla tiene agua alrededor.","The Earth has many landscapes. A mountain is very tall. A river is flowing water. The sea is a huge body of salt water. A desert has almost no water. An island has water all around it."],"ejemplos":[["la montaña","mountain"],["el río","river"],["el mar","sea"],["el desierto","desert"],["la isla","island"]],"ejercicios":[{"q":["¿Cuál es la montaña?","Which one is the mountain?"],"o":["⛰️","🌊","🏝️"],"a":0},{"q":["¿Cuál tiene agua alrededor?","Which one has water all around?"],"o":["🏜️","🏝️","⛰️"],"a":1},{"q":["¿Cuál casi no tiene agua?","Which one has almost no water?"],"o":["🌊","🏞️","🏜️"],"a":2},{"q":["¿Dónde hay agua salada y olas?","Where is there salt water and waves?"],"o":["🌊","⛰️","🏜️"],"a":0}],"est":["ELOF: entorno","PreK Guidelines: estudios sociales – geografía","Parvularia: Comprensión del entorno sociocultural"]},{"id":"escucha12","nivel":"g12","area":"escuchar","ico":"👂","titulo":["Escucha el cuento","Listen to the story"],"explica":["Cuando solo escuchas, imagina la historia como una película en tu cabeza. Escucha dos veces: la primera para entender y la segunda para buscar detalles.","When you only listen, picture the story like a movie in your head. Listen twice: first to understand, then to find details."],"ejemplos":[["Imagina: Pepe, la lluvia, la rana","Picture it: Pepe, the rain, the frog"],["Escucha dos veces","Listen twice"]],"ejercicios":[{"q":["¿De qué color es el paraguas?","What color is the umbrella?"],"o":[["rojo","red"],["azul","blue"],["verde","green"]],"a":0},{"q":["¿Qué tiempo hace?","What's the weather like?"],"o":["🌧️","☀️","❄️"],"a":0},{"q":["¿Qué ve Pepe en el charco?","What does Pepe see in the puddle?"],"o":["🐸","🐟","🦆"],"a":0},{"q":["¿De qué color son sus botas?","What color are his boots?"],"o":[["amarillas","yellow"],["negras","black"],["rojas","red"]],"a":0},{"q":["¿Qué hace Pepe al final?","What does Pepe do at the end?"],"o":[["se ríe","he laughs"],["llora","he cries"],["duerme","he sleeps"]],"a":0}],"est":["SL.2.2","ELAR/SLAR 2.º: escuchar","Lenguaje 2º: comunicación oral"]},{"id":"habla12","nivel":"g12","area":"hablar","ico":"🗣️","titulo":["Hablo de mí","I talk about me"],"explica":["Para hablar con claridad, abre bien la boca y no corras. Las vocales en español siempre suenan igual, así que pronúncialas completas.","To speak clearly, open your mouth well and don't rush. Spanish vowels always sound the same, so say them fully."],"ejemplos":[["Me gusta jugar fútbol.","I like to play soccer."],["Mi color favorito es el azul.","My favorite color is blue."]],"ejercicios":[],"est":["SL.2.4, SL.2.6","ELAR/SLAR 2.º: hablar","Lenguaje 2º: comunicación oral"]},{"id":"escribe12","nivel":"g12","area":"escritura","ico":"✏️","titulo":["Escribo oraciones","I write sentences"],"explica":["Una oración empieza con mayúscula y termina con punto. Casi siempre primero va quién (el sujeto) y luego qué hace (el verbo).","A sentence starts with a capital letter and ends with a period. Usually first comes who (the subject), then what they do (the verb)."],"ejemplos":[["El perro corre.","The dog runs."],["La niña lee un libro.","The girl reads a book."],["Mayúscula al inicio, punto al final","Capital at the start, period at the end"]],"ejercicios":[],"est":["L.2.1f, L.2.2","2.11D","Lenguaje 2º: escritura"]},{"id":"compara12","nivel":"g12","area":"comparar","ico":"🔍","titulo":["Comparo: dos parques","Compare: two parks"],"explica":["Para comparar dos textos, busca lo que tienen los dos (se parecen) y lo que solo tiene uno (son diferentes). Una tabla ayuda a ordenar las ideas.","To compare two texts, look for what both have (alike) and what only one has (different). A chart helps organize the ideas."],"ejemplos":[["Se parecen: los dos tienen columpios.","Alike: both have swings."],["Diferente: uno tiene lago y el otro fuente.","Different: one has a lake, the other a fountain."]],"ejercicios":[{"q":["¿Qué tienen los dos parques?","What do both parks have?"],"o":[["columpios","swings"],["un lago","a lake"],["una fuente","a fountain"]],"a":0},{"q":["¿Qué parque tiene un lago?","Which park has a lake?"],"o":[["Parque Sol","Sol Park"],["Parque Luna","Luna Park"]],"a":0},{"q":["¿Dónde puedes jugar fútbol?","Where can you play soccer?"],"o":[["Parque Luna","Luna Park"],["Parque Sol","Sol Park"]],"a":0},{"q":["¿Dónde hay patos?","Where are there ducks?"],"o":[["Parque Sol","Sol Park"],["Parque Luna","Luna Park"]],"a":0},{"q":["¿Qué tiene el parque Luna en lugar de lago?","What does Luna Park have instead of a lake?"],"o":[["una fuente","a fountain"],["una resbaladilla","a slide"],["un río","a river"]],"a":0}],"est":["RL.2.9","ELAR/SLAR 2.º: comparar textos","Lenguaje 2º"]},{"id":"papel12","nivel":"g12","area":"cultura","ico":"🎏","titulo":["Cultura: el papel picado","Culture: papel picado"],"explica":["Muchas fiestas tienen decoraciones especiales. Al leer sobre cultura, fíjate de dónde viene la costumbre, cómo se hace y cuándo se usa.","Many celebrations have special decorations. When reading about culture, notice where the custom comes from, how it's made and when it's used."],"ejemplos":[["¿De dónde? De México.","Where from? Mexico."],["¿Cómo? Con papel cortado.","How? With cut paper."],["¿Cuándo? En las fiestas.","When? At celebrations."]],"ejercicios":[{"q":["¿De dónde es el papel picado?","Where is papel picado from?"],"o":[["de México","Mexico"],["de China","China"],["de Francia","France"]],"a":0},{"q":["¿Con qué se hace?","What is it made of?"],"o":[["papel de colores","colored paper"],["madera","wood"],["vidrio","glass"]],"a":0},{"q":["¿Dónde se cuelga?","Where does it hang?"],"o":[["en hilos sobre las calles","on strings over the streets"],["en el piso","on the floor"],["dentro del refrigerador","inside the fridge"]],"a":0},{"q":["¿Qué pasa cuando sopla el viento?","What happens when the wind blows?"],"o":[["El papel se mueve.","The paper moves."],["El papel se moja.","The paper gets wet."],["El papel se rompe siempre.","The paper always tears."]],"a":0}],"est":["WA Estudios Sociales 2.º: cultura","TEKS Estudios Sociales 2.º: cultura","Historia, Geografía y CC. SS. 2º: diversidad cultural"]},{"id":"aguaestados","nivel":"g12","area":"ciencias","ico":"🧊","titulo":["Ciencias: los estados del agua","Science: states of water"],"explica":["El agua puede estar en tres estados. Sólido: el hielo, que es duro y frío. Líquido: el agua que tomamos, que corre y moja. Gas: el vapor, que sube cuando el agua hierve. Con calor el hielo se derrite, y con más calor el agua se evapora.","Water can be in three states. Solid: ice, which is hard and cold. Liquid: the water we drink, which flows and makes things wet. Gas: steam, which rises when water boils. Heat melts ice, and more heat makes water evaporate."],"ejemplos":[["sólido: hielo","solid: ice"],["líquido: agua","liquid: water"],["gas: vapor","gas: steam"]],"ejercicios":[{"q":["El hielo es agua en estado…","Ice is water in which state?"],"o":[["sólido","solid"],["líquido","liquid"],["gaseoso","gas"]],"a":0},{"q":["El vapor que sale de la olla es…","The steam from the pot is…"],"o":[["gas","gas"],["sólido","solid"],["líquido","liquid"]],"a":0},{"q":["La lluvia es agua…","Rain is water that is…"],"o":[["líquida","liquid"],["sólida","solid"],["gaseosa","gas"]],"a":0},{"q":["¿Qué le pasa al hielo con el calor del sol?","What happens to ice in the sun's heat?"],"o":[["se derrite","it melts"],["se hace más duro","it gets harder"],["no cambia","it doesn't change"]],"a":0},{"q":["¿Qué necesita el agua para hervir?","What does water need to boil?"],"o":[["mucho calor","a lot of heat"],["mucho frío","a lot of cold"],["oscuridad","darkness"]],"a":0}],"est":["NGSS 2-PS1-1","TEKS Ciencias 2.º: propiedades de la materia","Ciencias Naturales 2º–3º"]},{"id":"plantas","nivel":"g12","area":"biologia","ico":"🌱","titulo":["Biología: lo que necesitan las plantas","Biology: what plants need"],"explica":["Las plantas son seres vivos. Para crecer necesitan agua, luz del sol, aire y tierra con nutrientes. La raíz toma el agua de la tierra, el tallo la lleva hacia arriba y las hojas usan la luz del sol para hacer su alimento.","Plants are living things. To grow they need water, sunlight, air and soil with nutrients. The root takes water from the soil, the stem carries it up, and the leaves use sunlight to make food."],"ejemplos":[["agua","water"],["luz del sol","sunlight"],["aire","air"],["tierra","soil"]],"ejercicios":[{"q":["¿Qué parte toma el agua de la tierra?","Which part takes water from the soil?"],"o":[["la raíz","the root"],["la flor","the flower"],["la hoja","the leaf"]],"a":0},{"q":["¿Qué usan las hojas para hacer alimento?","What do leaves use to make food?"],"o":[["la luz del sol","sunlight"],["la oscuridad","darkness"],["el ruido","noise"]],"a":0},{"q":["¿Qué NO necesita una planta para vivir?","What does a plant NOT need to live?"],"o":[["juguetes","toys"],["agua","water"],["luz","light"]],"a":0},{"q":["¿Qué parte hace las semillas?","Which part makes the seeds?"],"o":[["la flor","the flower"],["la raíz","the root"],["el tallo","the stem"]],"a":0},{"q":["¿Una planta es un ser vivo?","Is a plant a living thing?"],"o":[["sí","yes"],["no","no"]],"a":0}],"est":["NGSS 2-LS2-1","TEKS Ciencias 2.º: organismos y ambiente","Ciencias Naturales 1º–3º"]},{"id":"cardinales","nivel":"g12","area":"geografia","ico":"🧭","titulo":["Geografía: los puntos cardinales","Geography: cardinal directions"],"explica":["Los puntos cardinales nos ayudan a ubicarnos en un mapa: norte, sur, este y oeste. En casi todos los mapas el norte está arriba. El sol sale por el este y se pone por el oeste.","Cardinal directions help us find our way on a map: north, south, east and west. On almost every map, north is at the top. The sun rises in the east and sets in the west."],"ejemplos":[["norte","north"],["sur","south"],["este","east"],["oeste","west"]],"ejercicios":[{"q":["En un mapa, ¿qué punto está arriba?","On a map, which direction is at the top?"],"o":[["norte","north"],["sur","south"],["oeste","west"]],"a":0},{"q":["¿Por dónde sale el sol?","Where does the sun rise?"],"o":[["por el este","in the east"],["por el oeste","in the west"],["por el sur","in the south"]],"a":0},{"q":["¿Qué punto es lo contrario del norte?","What is the opposite of north?"],"o":[["sur","south"],["este","east"],["oeste","west"]],"a":0},{"q":["En un mapa, la flecha ➡️ apunta al…","On a map, the arrow ➡️ points…"],"o":[["este","east"],["oeste","west"],["norte","north"]],"a":0},{"q":["¿Por dónde se pone el sol?","Where does the sun set?"],"o":[["por el oeste","in the west"],["por el este","in the east"],["por el norte","in the north"]],"a":0}],"est":["WA Estudios Sociales 1.º–2.º: mapas","TEKS Estudios Sociales 1.º–2.º: mapas","Historia, Geografía y CC. SS. 1º–2º"]},{"id":"escucha35","nivel":"g35","area":"escuchar","ico":"📞","titulo":["Escucha: una llamada","Listen: a phone call"],"explica":["En una conversación, pon atención a quién habla, qué planes tiene y los números (horas, días, cantidades). Si no entiendes una palabra, sigue escuchando: el resto te da pistas.","In a conversation, notice who is speaking, what plans they have and the numbers (times, days, amounts). If you miss a word, keep listening: the rest gives you clues."],"ejemplos":[["¿Quién habla? Mateo y su abuela","Who's talking? Mateo and his grandma"],["Números: dos horas, domingo","Numbers: two hours, Sunday"]],"ejercicios":[{"q":["¿Con quién habla Mateo?","Who is Mateo talking to?"],"o":[["con su abuela","his grandma"],["con su maestra","his teacher"],["con su papá","his dad"]],"a":0},{"q":["¿Qué tiene Mateo mañana?","What does Mateo have tomorrow?"],"o":[["un examen de matemáticas","a math test"],["una fiesta","a party"],["un partido","a game"]],"a":0},{"q":["¿Cuántas horas estudió?","How many hours did he study?"],"o":["1","2","5"],"a":1},{"q":["¿Con quién va a jugar?","Who is he going to play with?"],"o":[["con su primo","his cousin"],["con su perro","his dog"],["con su hermana","his sister"]],"a":0},{"q":["¿Qué va a hacer la abuela el domingo?","What will Grandma do on Sunday?"],"o":[["tamales","tamales"],["un pastel","a cake"],["una sopa","a soup"]],"a":0}],"est":["SL.3.2","ELAR/SLAR 3.º: escuchar","Lenguaje 3º–4º: comunicación oral"]},{"id":"habla35","nivel":"g35","area":"hablar","ico":"🗣️","titulo":["Describo lo que veo","I describe what I see"],"explica":["Para describir, di qué ves, cómo es y qué pasa. Usa adjetivos (grande, roja, alto) y verbos (hay, está, tiene).","To describe, say what you see, what it's like and what's happening. Use adjectives (big, red, tall) and verbs (there is, is, has)."],"ejemplos":[["En la playa hace sol y hay olas.","At the beach it's sunny and there are waves."],["El árbol es alto y tiene muchas hojas.","The tree is tall and has many leaves."]],"ejercicios":[],"est":["SL.4.4","ELAR/SLAR 4.º: hablar","Lenguaje 3º–4º: comunicación oral"]},{"id":"escribe35","nivel":"g35","area":"escritura","ico":"✏️","titulo":["Escribo con verbos","Writing with verbs"],"explica":["Al escribir, revisa tres cosas: que el verbo vaya con la persona (yo hablo, ella habla), que los adjetivos concuerden (la casa blanca) y que cada oración tenga mayúscula y punto.","When writing, check three things: the verb matches the person (yo hablo, ella habla), adjectives agree (la casa blanca), and each sentence has a capital letter and a period."],"ejemplos":[["Ella habla. Nosotros hablamos.","She speaks. We speak."],["la casa blanca","the white house"],["Mayúscula, verbo correcto, punto","Capital, correct verb, period"]],"ejercicios":[],"est":["W.3.2, L.3.1","ELAR/SLAR 3.º: escritura","Lenguaje 3º–4º: escritura"]},{"id":"compara35","nivel":"g35","area":"comparar","ico":"🔍","titulo":["Comparo: el correcaminos y el armadillo","Compare: the roadrunner and the armadillo"],"explica":["Al comparar textos informativos, busca las mismas categorías en los dos: qué tipo de animal es, qué come y cómo se protege. Así es fácil ver lo que se parece y lo que cambia.","When comparing informational texts, look for the same categories in both: what kind of animal it is, what it eats and how it protects itself. That makes it easy to see what's alike and what's different."],"ejemplos":[["Se parecen: los dos viven en Texas y comen insectos.","Alike: both live in Texas and eat insects."],["Diferente: uno es ave y el otro mamífero.","Different: one is a bird, the other a mammal."]],"ejercicios":[{"q":["¿En qué se parecen los dos?","How are they alike?"],"o":[["Los dos viven en Texas y comen insectos.","Both live in Texas and eat insects."],["Los dos son aves.","Both are birds."],["Los dos tienen armadura.","Both have armor."]],"a":0},{"q":["¿Cuál es un ave?","Which one is a bird?"],"o":[["el correcaminos","the roadrunner"],["el armadillo","the armadillo"]],"a":0},{"q":["¿Quién tiene placas duras?","Which one has hard plates?"],"o":[["el armadillo","the armadillo"],["el correcaminos","the roadrunner"]],"a":0},{"q":["¿Qué prefiere hacer el correcaminos?","What does the roadrunner prefer to do?"],"o":[["correr","run"],["nadar","swim"],["escarbar","dig"]],"a":0},{"q":["¿Cuál es el pequeño mamífero oficial de Texas?","Which is the official state small mammal of Texas?"],"o":[["el armadillo","the armadillo"],["el correcaminos","the roadrunner"],["el murciélago","the bat"]],"a":0}],"est":["RI.3.9","ELAR/SLAR 3.º: comparar textos","Lenguaje 3º–4º"]},{"id":"ciclodelagua","nivel":"g35","area":"ciencias","ico":"🌧️","titulo":["Ciencias: el ciclo del agua","Science: the water cycle"],"explica":["El agua de la Tierra se mueve en un ciclo que no termina. Evaporación: el sol calienta el agua y sube como vapor. Condensación: el vapor se enfría y forma nubes. Precipitación: el agua cae como lluvia, nieve o granizo. Acumulación: el agua se junta en ríos, lagos, mares y debajo de la tierra, y el ciclo empieza otra vez.","Earth's water moves in a cycle that never ends. Evaporation: the sun heats water and it rises as vapor. Condensation: the vapor cools and forms clouds. Precipitation: water falls as rain, snow or hail. Collection: water gathers in rivers, lakes, oceans and underground, and the cycle starts again."],"ejemplos":[["evaporación","evaporation"],["condensación","condensation"],["precipitación","precipitation"],["acumulación","collection"]],"ejercicios":[{"q":["¿Cómo se llama cuando el agua sube como vapor?","What is it called when water rises as vapor?"],"o":[["evaporación","evaporation"],["precipitación","precipitation"],["acumulación","collection"]],"a":0},{"q":["¿Qué se forma en la condensación?","What forms during condensation?"],"o":[["las nubes","clouds"],["los ríos","rivers"],["las montañas","mountains"]],"a":0},{"q":["La lluvia y la nieve son…","Rain and snow are…"],"o":[["precipitación","precipitation"],["evaporación","evaporation"],["condensación","condensation"]],"a":0},{"q":["¿Qué da la energía para que el agua se evapore?","What gives the energy for water to evaporate?"],"o":[["el sol","the sun"],["la luna","the moon"],["el viento frío","cold wind"]],"a":0},{"q":["¿Qué pasa después de la acumulación?","What happens after collection?"],"o":[["El ciclo empieza otra vez.","The cycle starts again."],["El agua desaparece.","The water disappears."],["Se acaba el ciclo.","The cycle ends."]],"a":0}],"est":["NGSS 5-ESS2-1","TEKS Ciencias 5.º: ciclo del agua","Ciencias Naturales 2º–5º"]},{"id":"mariposa","nivel":"g35","area":"biologia","ico":"🐛","titulo":["Biología: el ciclo de vida de la mariposa","Biology: the butterfly life cycle"],"explica":["La mariposa cambia de forma por completo; a eso se le llama metamorfosis. Primero es un huevo. Del huevo nace una oruga que come muchas hojas. La oruga forma una crisálida, donde su cuerpo cambia. Al final sale una mariposa adulta, que pondrá nuevos huevos.","A butterfly changes its form completely; this is called metamorphosis. First it is an egg. A caterpillar hatches and eats lots of leaves. The caterpillar forms a chrysalis, where its body changes. Finally an adult butterfly comes out and will lay new eggs."],"ejemplos":[["1. huevo","1. egg"],["2. oruga","2. caterpillar"],["3. crisálida","3. chrysalis"],["4. mariposa","4. butterfly"]],"ejercicios":[{"q":["¿Cuál es la primera etapa?","What is the first stage?"],"o":[["huevo","egg"],["oruga","caterpillar"],["mariposa","butterfly"]],"a":0},{"q":["¿Qué hace la oruga casi todo el tiempo?","What does the caterpillar do most of the time?"],"o":[["come hojas","eats leaves"],["vuela","flies"],["pone huevos","lays eggs"]],"a":0},{"q":["¿Cómo se llama el cambio completo de forma?","What is the complete change of form called?"],"o":[["metamorfosis","metamorphosis"],["evaporación","evaporation"],["fotosíntesis","photosynthesis"]],"a":0},{"q":["¿Qué etapa va antes de la mariposa?","Which stage comes before the butterfly?"],"o":[["crisálida","chrysalis"],["huevo","egg"],["semilla","seed"]],"a":0},{"q":["¿Por qué decimos que es un ciclo?","Why do we call it a cycle?"],"o":[["Porque la mariposa pone huevos y empieza otra vez.","Because the butterfly lays eggs and it starts again."],["Porque la mariposa es redonda.","Because the butterfly is round."],["Porque solo pasa una vez.","Because it only happens once."]],"a":0}],"est":["NGSS 3-LS1-1","TEKS Ciencias 3.º–4.º: ciclos de vida","Ciencias Naturales 1º–3º"]},{"id":"continentes","nivel":"g35","area":"geografia","ico":"🌍","titulo":["Geografía: continentes y océanos","Geography: continents and oceans"],"explica":["La Tierra tiene siete continentes: América del Norte, América del Sur, Europa, Asia, África, Oceanía y la Antártida. Los océanos son el Pacífico, el Atlántico, el Índico, el Ártico y el Austral. El Pacífico es el océano más grande y Asia es el continente más grande.","Earth has seven continents: North America, South America, Europe, Asia, Africa, Oceania (Australia) and Antarctica. The oceans are the Pacific, Atlantic, Indian, Arctic and Southern. The Pacific is the largest ocean and Asia is the largest continent."],"ejemplos":[["América del Norte: México, Estados Unidos, Canadá","North America: Mexico, United States, Canada"],["Asia: el continente más grande","Asia: the largest continent"],["Pacífico: el océano más grande","Pacific: the largest ocean"],["Antártida: el continente más frío","Antarctica: the coldest continent"]],"ejercicios":[{"q":["¿En qué continente está México?","Which continent is Mexico in?"],"o":[["América del Norte","North America"],["América del Sur","South America"],["Europa","Europe"]],"a":0},{"q":["¿Cuál es el océano más grande?","Which is the largest ocean?"],"o":[["el Pacífico","the Pacific"],["el Atlántico","the Atlantic"],["el Ártico","the Arctic"]],"a":0},{"q":["¿Cuántos continentes hay?","How many continents are there?"],"o":["5","7","9"],"a":1},{"q":["¿En qué continente está Argentina?","Which continent is Argentina in?"],"o":[["América del Sur","South America"],["África","Africa"],["Asia","Asia"]],"a":0},{"q":["¿Cuál es el continente más grande?","Which is the largest continent?"],"o":[["Asia","Asia"],["Europa","Europe"],["Oceanía","Oceania"]],"a":0},{"q":["¿En qué continente está España?","Which continent is Spain in?"],"o":[["Europa","Europe"],["América del Sur","South America"],["África","Africa"]],"a":0}],"est":["WA Estudios Sociales 3.º–5.º: geografía","TEKS Estudios Sociales 3.º–5.º: geografía","Historia, Geografía y CC. SS. 2º–3º"]},{"id":"escucha68","nivel":"g68","area":"escuchar","ico":"📢","titulo":["Escucha: anuncio de la escuela","Listen: school announcement"],"explica":["En un anuncio la información importante suele ser: qué pasa, cuándo, dónde y qué tienes que hacer. Toma notas mentales de fechas, horas y lugares.","In an announcement, the key information is usually what is happening, when, where and what you need to do. Make mental notes of dates, times and places."],"ejemplos":[["¿Qué? la feria de ciencias","What? the science fair"],["¿Cuándo? el lunes","When? Monday"],["¿Dónde? en el gimnasio","Where? in the gym"]],"ejercicios":[{"q":["¿Por qué no hay clases el viernes?","Why is there no school on Friday?"],"o":[["por la junta de maestros","teachers' meeting"],["por la lluvia","rain"],["por un partido","a game"]],"a":0},{"q":["¿Dónde es la feria de ciencias?","Where is the science fair?"],"o":[["en el gimnasio","in the gym"],["en la biblioteca","in the library"],["en la cafetería","in the cafeteria"]],"a":0},{"q":["¿Cuándo se entregan los proyectos?","When are the projects due?"],"o":[["el jueves antes de las cuatro","Thursday before four"],["el lunes a las nueve","Monday at nine"],["el viernes","Friday"]],"a":0},{"q":["¿A qué hora termina la feria?","What time does the fair end?"],"o":[["a las dos de la tarde","at two in the afternoon"],["a las cuatro","at four"],["a las nueve","at nine"]],"a":0},{"q":["¿En qué salón está la maestra Ramírez?","Which room is Ms. Ramírez in?"],"o":["120","210","201"],"a":1}],"est":["SL.6.2","ELAR/SLAR 6.º: escuchar","Lengua y Literatura 7º: comunicación oral"]},{"id":"habla68","nivel":"g68","area":"hablar","ico":"🗣️","titulo":["Doy mi opinión","I give my opinion"],"explica":["Para dar una opinión, empieza con una frase como «en mi opinión», «creo que» o «me parece que», y explica por qué con «porque». Para no estar de acuerdo con respeto, usa «entiendo tu punto, pero…».","To give an opinion, start with a phrase like «in my opinion», «I think» or «it seems to me», and explain why with «because». To disagree respectfully, use «I understand your point, but…»."],"ejemplos":[["En mi opinión… porque…","In my opinion… because…"],["Entiendo tu punto, pero…","I understand your point, but…"]],"ejercicios":[],"est":["SL.6.1, SL.7.4","ELAR/SLAR 6.º–7.º: hablar","Lengua y Literatura 7º: comunicación oral"]},{"id":"escribe68","nivel":"g68","area":"escritura","ico":"✏️","titulo":["Escribo en pasado","Writing in the past"],"explica":["Un buen párrafo tiene una idea principal, detalles y conectores que unen las ideas: «además» suma, «sin embargo» contrasta y «por eso» muestra una consecuencia. Revisa los acentos del pretérito: hablé, comió.","A good paragraph has a main idea, details and connectors that link ideas: «además» adds, «sin embargo» contrasts and «por eso» shows a result. Check preterite accents: hablé, comió."],"ejemplos":[["además","also / in addition"],["sin embargo","however"],["por eso","that's why"]],"ejercicios":[],"est":["W.6.3, L.6.2","ELAR/SLAR 6.º: escritura","Lengua y Literatura 7º: escritura"]},{"id":"compara68","nivel":"g68","area":"comparar","ico":"🔍","titulo":["Comparo: Día de Muertos y Halloween","Compare: Day of the Dead and Halloween"],"explica":["Para comparar usamos «los dos», «también» o «igual que». Para contrastar usamos «en cambio», «sin embargo» o «a diferencia de». Al comparar celebraciones, piensa en la fecha, el propósito y las costumbres.","To compare we use «los dos», «también» or «igual que». To contrast we use «en cambio», «sin embargo» or «a diferencia de». When comparing celebrations, think about the date, the purpose and the customs."],"ejemplos":[["Las dos fiestas son a finales de octubre o principios de noviembre.","Both are in late October or early November."],["A diferencia de Halloween, el Día de Muertos recuerda a la familia.","Unlike Halloween, Day of the Dead remembers family."]],"ejercicios":[{"q":["¿En qué se parecen las dos celebraciones?","How are the two celebrations alike?"],"o":[["Las dos son a finales de octubre o principios de noviembre.","Both are in late October or early November."],["Las dos usan calabazas talladas.","Both use carved pumpkins."],["Las dos son en diciembre.","Both are in December."]],"a":0},{"q":["¿Cuál es el propósito del Día de Muertos?","What is the purpose of Day of the Dead?"],"o":[["recordar a los seres queridos","to remember loved ones"],["asustar a la gente","to scare people"],["pedir dulces","to ask for candy"]],"a":0},{"q":["¿Qué hacen los niños en Halloween?","What do children do on Halloween?"],"o":[["se disfrazan y piden dulces","wear costumes and ask for candy"],["ponen ofrendas","set up ofrendas"],["cantan Las mañanitas","sing Las mañanitas"]],"a":0},{"q":["¿Qué palabra muestra contraste?","Which word shows contrast?"],"o":[["en cambio","on the other hand"],["también","also"],["los dos","both"]],"a":0},{"q":["¿Cuál oración contrasta correctamente?","Which sentence contrasts correctly?"],"o":[["A diferencia de Halloween, el Día de Muertos es para recordar a la familia.","Unlike Halloween, Day of the Dead is for remembering family."],["Halloween y el Día de Muertos son iguales.","Halloween and Day of the Dead are the same."],["El Día de Muertos es el 31 de octubre.","Day of the Dead is October 31."]],"a":0}],"est":["RI.7.9","ELAR/SLAR 7.º: comparar textos","Lengua y Literatura 7º"]},{"id":"fuerzas","nivel":"g68","area":"ciencias","ico":"🧲","titulo":["Ciencias: fuerzas y movimiento","Science: forces and motion"],"explica":["Una fuerza es un empuje o un jalón que puede mover un objeto, detenerlo o cambiar su dirección. La gravedad jala los objetos hacia la Tierra. La fricción es una fuerza que frena el movimiento cuando dos superficies se rozan. Según la primera ley de Newton, un objeto quieto sigue quieto y uno en movimiento sigue moviéndose, a menos que una fuerza lo cambie.","A force is a push or a pull that can move an object, stop it or change its direction. Gravity pulls objects toward the Earth. Friction is a force that slows motion when two surfaces rub. According to Newton's first law, an object at rest stays at rest and a moving object keeps moving unless a force changes it."],"ejemplos":[["Patear una pelota es empujar.","Kicking a ball is a push."],["La gravedad hace caer la manzana.","Gravity makes the apple fall."],["La fricción frena la bicicleta.","Friction slows the bike."]],"ejercicios":[{"q":["¿Qué fuerza hace que una manzana caiga del árbol?","Which force makes an apple fall from a tree?"],"o":[["la gravedad","gravity"],["la fricción","friction"],["el magnetismo","magnetism"]],"a":0},{"q":["¿Qué fuerza frena una bicicleta cuando usas los frenos?","Which force slows a bike when you brake?"],"o":[["la fricción","friction"],["la gravedad","gravity"],["la luz","light"]],"a":0},{"q":["Abrir un cajón es un ejemplo de…","Opening a drawer is an example of…"],"o":[["jalar","pulling"],["empujar","pushing"],["flotar","floating"]],"a":0},{"q":["Según la primera ley de Newton, una pelota quieta…","According to Newton's first law, a ball at rest…"],"o":[["sigue quieta hasta que una fuerza la mueva","stays at rest until a force moves it"],["se mueve sola","moves by itself"],["desaparece","disappears"]],"a":0},{"q":["¿Por qué es más fácil deslizarse en el hielo que en la arena?","Why is it easier to slide on ice than on sand?"],"o":[["El hielo tiene menos fricción.","Ice has less friction."],["El hielo tiene más gravedad.","Ice has more gravity."],["La arena es más fría.","Sand is colder."]],"a":0}],"est":["NGSS MS-PS2-2","TEKS Ciencias 6.º–8.º: fuerza y movimiento","Ciencias Naturales 7º–8º"]},{"id":"celula","nivel":"g68","area":"biologia","ico":"🔬","titulo":["Biología: la célula","Biology: the cell"],"explica":["La célula es la unidad más pequeña de los seres vivos. Todas tienen membrana, que controla lo que entra y sale, y citoplasma, donde están los organelos. El núcleo guarda la información genética. La célula vegetal además tiene pared celular, que le da forma rígida, y cloroplastos, donde se hace la fotosíntesis.","The cell is the smallest unit of living things. All cells have a membrane, which controls what goes in and out, and cytoplasm, where the organelles are. The nucleus stores genetic information. Plant cells also have a cell wall, which gives them a rigid shape, and chloroplasts, where photosynthesis happens."],"ejemplos":[["núcleo: guarda el ADN","nucleus: stores DNA"],["cloroplasto: fotosíntesis","chloroplast: photosynthesis"],["pared celular: solo en plantas","cell wall: only in plants"]],"ejercicios":[{"q":["¿Qué parte guarda la información genética?","Which part stores genetic information?"],"o":[["el núcleo","the nucleus"],["la membrana","the membrane"],["la pared celular","the cell wall"]],"a":0},{"q":["¿Qué tiene la célula vegetal que NO tiene la animal?","What does a plant cell have that an animal cell does NOT?"],"o":[["cloroplastos y pared celular","chloroplasts and a cell wall"],["núcleo","a nucleus"],["membrana","a membrane"]],"a":0},{"q":["¿Qué controla lo que entra y sale de la célula?","What controls what enters and leaves the cell?"],"o":[["la membrana","the membrane"],["el núcleo","the nucleus"],["el cloroplasto","the chloroplast"]],"a":0},{"q":["¿Dónde se hace la fotosíntesis?","Where does photosynthesis happen?"],"o":[["en los cloroplastos","in the chloroplasts"],["en el núcleo","in the nucleus"],["en la membrana","in the membrane"]],"a":0},{"q":["La célula es…","The cell is…"],"o":[["la unidad más pequeña de los seres vivos","the smallest unit of living things"],["un órgano del cuerpo","an organ of the body"],["un tipo de planta","a kind of plant"]],"a":0}],"est":["NGSS MS-LS1-1, MS-LS1-2","TEKS Ciencias 7.º: organismos","Ciencias Naturales 7º–8º"]},{"id":"fotosintesis","nivel":"g68","area":"biologia","ico":"🌿","titulo":["Biología: la fotosíntesis","Biology: photosynthesis"],"explica":["En la fotosíntesis, las plantas usan la energía de la luz del sol para convertir agua y dióxido de carbono en glucosa, que es su alimento. Como resultado liberan oxígeno al aire. Por eso las plantas son tan importantes para los seres vivos que respiramos oxígeno.","In photosynthesis, plants use energy from sunlight to turn water and carbon dioxide into glucose, which is their food. As a result they release oxygen into the air. That's why plants are so important for living things that breathe oxygen."],"ejemplos":[["energía: la luz del sol","energy: sunlight"],["entran agua y dióxido de carbono","water and carbon dioxide go in"],["salen glucosa y oxígeno","glucose and oxygen come out"]],"ejercicios":[{"q":["¿Qué energía usan las plantas para la fotosíntesis?","What energy do plants use for photosynthesis?"],"o":[["la luz del sol","sunlight"],["el calor de la tierra","heat from the ground"],["el viento","wind"]],"a":0},{"q":["¿Qué gas toman las plantas del aire?","Which gas do plants take from the air?"],"o":[["dióxido de carbono","carbon dioxide"],["oxígeno","oxygen"],["helio","helium"]],"a":0},{"q":["¿Qué gas liberan las plantas?","Which gas do plants release?"],"o":[["oxígeno","oxygen"],["dióxido de carbono","carbon dioxide"],["vapor de hierro","iron vapor"]],"a":0},{"q":["¿Cómo se llama el alimento que hace la planta?","What is the food the plant makes called?"],"o":[["glucosa","glucose"],["proteína","protein"],["sal","salt"]],"a":0},{"q":["¿Por qué las plantas son importantes para nosotros?","Why are plants important for us?"],"o":[["Producen el oxígeno que respiramos.","They produce the oxygen we breathe."],["Producen dióxido de carbono.","They produce carbon dioxide."],["Nos quitan la luz.","They take our light."]],"a":0}],"est":["NGSS MS-LS1-6","TEKS Ciencias 7.º: organismos","Ciencias Naturales 6º"]},{"id":"latlong","nivel":"g68","area":"geografia","ico":"🌐","titulo":["Geografía: latitud y longitud","Geography: latitude and longitude"],"explica":["Para ubicar cualquier lugar usamos líneas imaginarias. Los paralelos van de este a oeste y miden la latitud: el ecuador está en 0° y divide la Tierra en hemisferio norte y sur. Los meridianos van de polo a polo y miden la longitud: el meridiano de Greenwich está en 0°.","To locate any place we use imaginary lines. Parallels run east–west and measure latitude: the equator is at 0° and divides Earth into the northern and southern hemispheres. Meridians run pole to pole and measure longitude: the Prime Meridian (Greenwich) is at 0°."],"ejemplos":[["ecuador: latitud 0°","equator: 0° latitude"],["Greenwich: longitud 0°","Greenwich: 0° longitude"],["Estados Unidos está en el hemisferio norte","United States is in the northern hemisphere"]],"ejercicios":[{"q":["¿Qué línea está en latitud 0°?","Which line is at 0° latitude?"],"o":[["el ecuador","the equator"],["el meridiano de Greenwich","the Prime Meridian"],["el trópico de Cáncer","the Tropic of Cancer"]],"a":0},{"q":["Los meridianos van…","Meridians run…"],"o":[["de polo a polo","from pole to pole"],["de este a oeste","east to west"],["en círculos pequeños","in small circles"]],"a":0},{"q":["¿Qué mide la latitud?","What does latitude measure?"],"o":[["qué tan al norte o al sur está un lugar","how far north or south a place is"],["qué tan alto es un lugar","how high a place is"],["la temperatura","temperature"]],"a":0},{"q":["El ecuador divide la Tierra en…","The equator divides Earth into…"],"o":[["hemisferio norte y sur","northern and southern hemispheres"],["este y oeste","east and west"],["día y noche","day and night"]],"a":0},{"q":["¿En qué hemisferio está Estados Unidos?","Which hemisphere is United States in?"],"o":[["norte","northern"],["sur","southern"]],"a":0}],"est":["WA Estudios Sociales 6.º–8.º: geografía","TEKS Estudios Sociales 6.º: geografía","Historia, Geografía y CC. SS. 3º–5º"]},{"id":"patrones","nivel":"pk","area":"algebra","ico":"🔁","titulo":["Álgebra: patrones","Algebra: patterns"],"explica":["Un patrón es algo que se repite siempre igual. Si ves rojo, azul, rojo, azul, lo que sigue es rojo. Los patrones son el primer paso del álgebra.","A pattern is something that repeats the same way. If you see red, blue, red, blue, what comes next is red. Patterns are the first step of algebra."],"ejemplos":[["rojo, azul, rojo, azul… ¡rojo!","red, blue, red, blue… red!"],["perro, perro, gato…","dog, dog, cat…"],["estrella, luna, sol…","star, moon, sun…"]],"ejercicios":[],"est":["ELOF: patrones · prepara K.OA","PreK Guidelines: matemáticas – patrones","Parvularia: Pensamiento matemático"]},{"id":"numfalta","nivel":"g12","area":"algebra","ico":"🔲","titulo":["Álgebra: el número que falta","Algebra: the missing number"],"explica":["En una igualdad, los dos lados valen lo mismo. Si 3 + □ = 8, piensa: ¿cuánto le falta a 3 para llegar a 8? Cuenta 4, 5, 6, 7, 8: son 5. E
