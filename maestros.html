se cuadrito es como la «x» que vas a usar en álgebra.","In an equation both sides are worth the same. If 3 + □ = 8, think: how many more does 3 need to reach 8? Count 4, 5, 6, 7, 8: that's 5. The box is like the «x» you'll use in algebra."],"ejemplos":[["□ = 5","□ = 5"],["□ = 6","□ = 6"],["□ = 3","□ = 3"]],"ejercicios":[],"est":["1.OA.8","1.5F","Matemática 1º–2º"]},{"id":"lados","nivel":"g12","area":"geometria","ico":"⬡","titulo":["Geometría: lados y vértices","Geometry: sides and corners"],"explica":["Las figuras planas tienen lados (las líneas) y vértices (las esquinas donde se juntan dos lados). Un triángulo tiene 3 lados y 3 vértices, un cuadrado tiene 4, un pentágono 5, un hexágono 6 y un octágono 8. El círculo no tiene lados rectos ni vértices.","Flat shapes have sides (the lines) and vertices (the corners where two sides meet). A triangle has 3 sides and 3 vertices, a square has 4, a pentagon 5, a hexagon 6 and an octagon 8. A circle has no straight sides and no vertices."],"ejemplos":[["triángulo: 3 lados","triangle: 3 sides"],["cuadrado: 4 lados","square: 4 sides"],["hexágono: 6 lados","hexagon: 6 sides"],["octágono: 8 lados","octagon: 8 sides"]],"ejercicios":[],"est":["2.G.1","2.8C","Matemática 2º"]},{"id":"seriesnum","nivel":"g12","area":"algebra","ico":"🪜","titulo":["Series numéricas","Number sequences"],"explica":["Una serie numérica es una fila de números que siguen una regla. Podemos contar de 2 en 2, de 5 en 5, de 10 en 10 o de 100 en 100, hacia adelante o hacia atrás. Para descubrir la regla, fíjate cuánto cambia de un número al siguiente. Si cuentas de 10 en 10, solo cambia el dígito de las decenas: 340, 350, 360.","A number sequence is a row of numbers that follow a rule. We can count by 2s, 5s, 10s or 100s, forward or backward. To find the rule, notice how much changes from one number to the next. When you count by 10s, only the tens digit changes: 340, 350, 360."],"ejemplos":[["de 2 en 2","counting by 2s"],["de 5 en 5","counting by 5s"],["de 10 en 10","counting by 10s"],["de 100 en 100 hacia atrás","counting back by 100s"]],"ejercicios":[],"est":["2.NBT.2","2.7B","Matemática 2º OA 1 (contar de 2, 5, 10 y 100 hasta 1 000)"]},{"id":"valorpos","nivel":"g12","area":"matematicas","ico":"🧱","titulo":["Valor posicional: centenas, decenas y unidades","Place value: hundreds, tens and ones"],"explica":["Cada dígito vale según el lugar donde está. En 243, el 2 está en las centenas y vale 200, el 4 está en las decenas y vale 40, y el 3 está en las unidades y vale 3. Por eso 243 = 200 + 40 + 3. Una centena son 10 decenas y una decena son 10 unidades.","Each digit's value depends on its place. In 243, the 2 is in the hundreds place and is worth 200, the 4 is in the tens place and is worth 40, and the 3 is in the ones place and is worth 3. So 243 = 200 + 40 + 3. One hundred is 10 tens, and one ten is 10 ones."],"ejemplos":[["200 + 40 + 3","200 + 40 + 3"],["5 centenas, 0 decenas, 8 unidades","5 hundreds, 0 tens, 8 ones"],["Compara primero las centenas, luego las decenas","Compare the hundreds first, then the tens"],["10 más: cambian las decenas","10 more: the tens change"]],"ejercicios":[],"est":["2.NBT.1, 2.NBT.3, 2.NBT.4, 2.NBT.8","2.2A, 2.2B, 2.2D, 2.7B (hasta 1,200)","Matemática 2º (0–100) y 3º (0–1 000)"]},{"id":"sumas3","nivel":"g12","area":"matematicas","ico":"➕","titulo":["Sumas de dos y tres dígitos","Adding 2- and 3-digit numbers"],"explica":["Para sumar en columnas, pon unidades debajo de unidades, decenas debajo de decenas y centenas debajo de centenas. Suma primero las unidades. Si te da 10 o más, escribe las unidades y pasa 1 decena a la columna de las decenas: eso es reagrupar, o «llevar». Haz lo mismo con las decenas. Al final, revisa si tu resultado tiene sentido.","To add in columns, put ones under ones, tens under tens and hundreds under hundreds. Add the ones first. If you get 10 or more, write the ones and move 1 ten to the tens column: that's regrouping, or carrying. Do the same with the tens. At the end, check that your answer makes sense."],"ejemplos":[["sin reagrupar","no regrouping"],["7 + 8 = 15: escribo 5 y llevo 1","7 + 8 = 15: write 5, carry 1"],["tres columnas","three columns"],["reagrupo dos veces","regroup twice"]],"ejercicios":[],"est":["2.NBT.5, 2.NBT.7","2.4B, 2.4C (hasta 1,000)","Matemática 2º (0–100) y 3º (0–1 000)"]},{"id":"restas3","nivel":"g12","area":"matematicas","ico":"➖","titulo":["Restas de dos y tres dígitos","Subtracting 2- and 3-digit numbers"],"explica":["El número más grande va arriba. Resta primero las unidades. Si el dígito de arriba es menor que el de abajo, desagrupa: cambia 1 decena por 10 unidades. Así 52 − 27: como 2 es menor que 7, el 52 se convierte en 4 decenas y 12 unidades; 12 − 7 = 5 y 4 − 2 = 2, el resultado es 25. Para comprobar, suma el resultado con el número de abajo: 25 + 27 = 52.","The bigger number goes on top. Subtract the ones first. If the top digit is smaller than the bottom one, regroup: trade 1 ten for 10 ones. So for 52 − 27: since 2 is less than 7, 52 becomes 4 tens and 12 ones; 12 − 7 = 5 and 4 − 2 = 2, so the answer is 25. To check, add your answer to the bottom number: 25 + 27 = 52."],"ejemplos":[["sin desagrupar","no regrouping"],["12 − 7 = 5 y 4 − 2 = 2","12 − 7 = 5 and 4 − 2 = 2"],["tres columnas","three columns"],["compruebo con una suma","check with addition"]],"ejercicios":[],"est":["2.NBT.5, 2.NBT.7","2.4B, 2.4C (hasta 1,000)","Matemática 2º (0–100) y 3º (0–1 000)"]},{"id":"textos12","nivel":"g12","area":"escritura","ico":"📝","titulo":["Escribo y corrijo textos cortos","I write and fix short texts"],"explica":["Un texto corto cuenta algo en orden: lo que pasó primero, después y al final. Cada oración empieza con mayúscula y termina con punto. Las preguntas llevan ¿ al principio y ? al final, y las exclamaciones llevan ¡ y !. Los nombres de personas y lugares también van con mayúscula. Cuando termines, léelo otra vez para corregirlo.","A short text tells something in order: what happened first, next and at the end. Each sentence starts with a capital letter and ends with a period. In Spanish, questions use ¿ at the start and ? at the end, and exclamations use ¡ and !. Names of people and places also start with a capital letter. When you finish, read it again to fix it."],"ejemplos":[["Hoy fuimos al parque.","We went to the park today."],["hoy fuimos al parque → Hoy fuimos al parque.","we went to the park → We went to the park."],["¿Quieres jugar conmigo?","Do you want to play with me?"],["Primero… Después… Al final…","First… Next… Finally…"]],"ejercicios":[],"est":["W.2.3, L.2.2","2.11D (editar: mayúsculas, puntuación, ortografía)","Lenguaje 2º: mayúscula, punto final, ¿? y ¡!"]},{"id":"numerospk","nivel":"pk","area":"matematicas","ico":"🔟","titulo":["Los números del 1 al 10","Numbers 1 to 10"],"explica":["Para contar, tocamos cada cosa una sola vez y decimos un número para cada una: uno, dos, tres. El último número que dices es cuántas hay.","To count, we touch each thing only once and say one number for each: one, two, three. The last number you say tells how many there are."],"ejemplos":[["1 · uno","1 · one"],["3 · tres","3 · three"],["5 · cinco","5 · five"],["10 · diez","10 · ten"]],"ejercicios":[],"est":["ELOF: números · prepara K.CC.4–5","PreK Guidelines: matemáticas – conteo","Parvularia: Pensamiento matemático"]},{"id":"rimaspk","nivel":"pk","area":"escuchar","ico":"🎶","titulo":["Palabras que riman","Rhyming words"],"explica":["Dos palabras riman cuando terminan con el mismo sonido. Gato y pato riman porque las dos terminan en «ato». Escucha bien el final de cada palabra.","Two words rhyme when they end with the same sound. Cat and hat rhyme because they both end in «at». Listen carefully to the end of each word."],"ejemplos":[["gato · pato","cat · hat"],["luna · cuna","moon · spoon"],["sol · col","sun · bun"]],"ejercicios":[],"est":["ELOF: conciencia fonológica · prepara RF.K.2a","PreK Guidelines: conciencia fonológica (rimas)","Parvularia: Lenguaje verbal (conciencia fonológica)"]},{"id":"reloj","nivel":"g12","area":"matematicas","ico":"🕒","titulo":["La hora en el reloj","Telling time"],"explica":["El reloj tiene dos manecillas. La corta marca la hora y la larga marca los minutos. Cuando la larga está en el 12, es la hora en punto: 3:00. Cuando está en el 6, es y media: 3:30. Cada número del reloj vale 5 minutos para la manecilla larga, así que en el 3 son 15 minutos y en el 9 son 45.","A clock has two hands. The short hand shows the hour and the long hand shows the minutes. When the long hand is on the 12, it's o'clock: 3:00. When it's on the 6, it's half past: 3:30. Each number on the clock is worth 5 minutes for the long hand, so the 3 means 15 minutes and the 9 means 45."],"ejemplos":[["3:00 · las tres en punto","3:00 · three o'clock"],["3:30 · las tres y media","3:30 · half past three"],["9:00 · las nueve","9:00 · nine o'clock"]],"ejercicios":[],"est":["1.MD.3, 2.MD.7","1.7E, 2.9G","Matemática 2º–3º"]},{"id":"parimpar","nivel":"g12","area":"matematicas","ico":"👫","titulo":["Números pares e impares","Even and odd numbers"],"explica":["Un número es par si se puede repartir en parejas sin que sobre nada: 2, 4, 6, 8, 10. Es impar si sobra uno: 1, 3, 5, 7, 9. Para saberlo rápido, mira solo el último dígito: si termina en 0, 2, 4, 6 u 8, es par.","A number is even if it can be split into pairs with nothing left over: 2, 4, 6, 8, 10. It is odd if one is left over: 1, 3, 5, 7, 9. To check quickly, look only at the last digit: if it ends in 0, 2, 4, 6 or 8, it's even."],"ejemplos":[["4 es par","4 is even"],["5 es impar: sobra uno","5 is odd: one is left over"],["termina en 8: par","ends in 8: even"]],"ejercicios":[],"est":["2.OA.3","2.7A","Matemática 2º–3º"]},{"id":"graficas12","nivel":"g12","area":"matematicas","ico":"📊","titulo":["Pictogramas y gráficas de barras","Picture graphs and bar graphs"],"explica":["Una gráfica de barras muestra datos con barras. Entre más alta es la barra, más votos o cosas tiene. Para leerla, sigue la parte de arriba de la barra hasta el número de la izquierda. Para saber cuántos más tiene uno que otro, resta los dos números.","A bar graph shows data with bars. The taller the bar, the more votes or things it has. To read it, follow the top of the bar to the number on the left. To find how many more one has than another, subtract the two numbers."],"ejemplos":[["la manzana tiene 5 votos","apple has 5 votes"],["el plátano tiene 2","banana has 2"],["la manzana tiene 3 más","apple has 3 more"]],"ejercicios":[],"est":["2.MD.10","2.10A, 2.10B, 2.10C","Matemática 1º–3º: pictogramas y gráficos de barra"]},{"id":"fracciones12","nivel":"g12","area":"geometria","ico":"🍕","titulo":["Mitades, tercios y cuartos","Halves, thirds and fourths"],"explica":["Cuando partimos algo en partes iguales, cada parte tiene un nombre. Si son 2 partes iguales, cada una es una mitad (1/2). Si son 3, cada una es un tercio (1/3). Si son 4, cada una es un cuarto (1/4). Las partes tienen que ser del mismo tamaño.","When we split something into equal parts, each part has a name. If there are 2 equal parts, each one is a half (1/2). If there are 3, each one is a third (1/3). If there are 4, each one is a fourth (1/4). The parts must be the same size."],"ejemplos":[["1/2 · una mitad","1/2 · one half"],["1/3 · un tercio","1/3 · one third"],["3/4 · tres cuartos","3/4 · three fourths"]],"ejercicios":[],"est":["2.G.3","2.3A, 2.3D","Matemática 3º: fracciones"]},{"id":"medir12","nivel":"g12","area":"matematicas","ico":"📏","titulo":["Medir con la regla","Measuring with a ruler"],"explica":["Para medir, el objeto debe empezar en el 0 de la regla. El número donde termina es lo que mide. Medimos en centímetros (cm). En Estados Unidos también se usan pulgadas: una pulgada mide un poco más de 2 centímetros y medio.","To measure, the object must start at the 0 on the ruler. The number where it ends is its length. We measure in centimeters (cm). In the United States, inches are also used: one inch is a little more than 2 and a half centimeters."],"ejemplos":[["el lápiz mide 9 cm","the pencil is 9 cm long"],["si empieza en 0 y termina en 6, mide 6 cm","starts at 0, ends at 6: it's 6 cm"]],"ejercicios":[],"est":["2.MD.1","2.9D","Matemática 2º–3º: medición"]},{"id":"dividir","nivel":"g35","area":"matematicas","ico":"➗","titulo":["Dividir","Dividing"],"explica":["Dividir es repartir en partes iguales. Si repartes 12 galletas entre 3 amigos, a cada uno le tocan 4: 12 ÷ 3 = 4. La división es lo contrario de la multiplicación: como 3 × 4 = 12, sabemos que 12 ÷ 3 = 4.","Dividing means sharing equally. If you share 12 cookies among 3 friends, each one gets 4: 12 ÷ 3 = 4. Division is the opposite of multiplication: since 3 × 4 = 12, we know 12 ÷ 3 = 4."],"ejemplos":[["12 ÷ 3 = 4","12 ÷ 3 = 4"],["por eso 12 ÷ 4 = 3","so 12 ÷ 4 = 3"],["5 grupos de 4","5 groups of 4"]],"ejercicios":[],"est":["3.OA.2, 3.OA.7","3.4H, 3.4J, 3.4K","Matemática 3º–4º"]},{"id":"redondeo","nivel":"g35","area":"matematicas","ico":"🎯","titulo":["Redondear números","Rounding numbers"],"explica":["Redondear es cambiar un número por otro cercano que es más fácil de usar. Para redondear a la decena, mira las unidades: si son 5 o más, sube; si son 4 o menos, se queda. Así, 47 se redondea a 50 y 43 a 40. Para redondear a la centena, mira las decenas: 362 se redondea a 400 y 328 a 300.","Rounding means changing a number to a nearby one that's easier to use. To round to the nearest ten, look at the ones: if they're 5 or more, round up; if they're 4 or less, stay. So 47 rounds to 50 and 43 rounds to 40. To round to the nearest hundred, look at the tens: 362 rounds to 400 and 328 rounds to 300."],"ejemplos":[["7 es 5 o más: sube","7 is 5 or more: round up"],["3 es menos de 5: se queda","3 is less than 5: stay"],["a la centena","to the nearest hundred"]],"ejercicios":[],"est":["3.NBT.1, 4.NBT.3","3.4B, 4.2D","Matemática 4º"]},{"id":"decimales","nivel":"g35","area":"matematicas","ico":"🔸","titulo":["Décimos y centésimos","Tenths and hundredths"],"explica":["Los decimales sirven para escribir partes de un entero. Un décimo es una de 10 partes iguales: 1/10 = 0.1. Un centésimo es una de 100 partes: 1/100 = 0.01. Para comparar decimales, compara primero los enteros, luego los décimos y luego los centésimos: 0.5 es mayor que 0.45 porque 5 décimos es más que 4 décimos. En algunos países se escribe coma decimal (0,5) y en otros punto (0.5).","Decimals are used to write parts of a whole. A tenth is one of 10 equal parts: 1/10 = 0.1. A hundredth is one of 100 parts: 1/100 = 0.01. To compare decimals, compare the whole numbers first, then the tenths, then the hundredths: 0.5 is greater than 0.45 because 5 tenths is more than 4 tenths. Some countries write a decimal comma (0,5) and others a decimal point (0.5)."],"ejemplos":[["0.3 · tres décimos","0.3 · three tenths"],["0.25 · veinticinco centésimos","0.25 · twenty-five hundredths"],["5 décimos > 4 décimos","5 tenths > 4 tenths"]],"ejercicios":[],"est":["4.NF.6, 4.NF.7","4.2E, 4.2F, 4.2G","Matemática 4º–5º: decimales"]},{"id":"sinonimos","nivel":"g35","area":"vocabulario","ico":"🔁","titulo":["Sinónimos y antónimos","Synonyms and antonyms"],"explica":["Los sinónimos son palabras que significan casi lo mismo, como contento y feliz. Los antónimos significan lo contrario, como alto y bajo. Usarlos hace que lo que escribes no repita siempre las mismas palabras.","Synonyms are words that mean almost the same, like happy and glad. Antonyms mean the opposite, like tall and short. Using them keeps your writing from repeating the same words."],"ejemplos":[["contento = feliz","happy = glad"],["alto ↔ bajo","tall ↔ short"],["lento ↔ rápido","slow ↔ fast"]],"ejercicios":[],"est":["L.4.5c","ELAR/SLAR 3.3D","Lenguaje 3º–4º: vocabulario"]},{"id":"ecosistemas","nivel":"g35","area":"biologia","ico":"🦊","titulo":["Biología: cadenas alimentarias","Biology: food chains"],"explica":["En un ecosistema, los productores, como las plantas, hacen su propio alimento con la luz del sol. Los consumidores se comen a otros seres vivos: los herbívoros comen plantas, los carnívoros comen animales y los omnívoros comen de los dos. Los descomponedores, como los hongos, las bacterias y las lombrices, deshacen a los seres muertos y devuelven nutrientes a la tierra. La energía de toda la cadena viene del Sol.","In an ecosystem, producers, like plants, make their own food using sunlight. Consumers eat other living things: herbivores eat plants, carnivores eat animals and omnivores eat both. Decomposers, like fungi, bacteria and worms, break down dead things and return nutrients to the soil. The energy for the whole chain comes from the Sun."],"ejemplos":[["sol → pasto → conejo → zorro","sun → grass → rabbit → fox"],["productor","producer"],["descomponedores","decomposers"]],"ejercicios":[{"q":["¿Quién es el productor en la cadena: pasto → conejo → zorro?","Who is the producer in the chain: grass → rabbit → fox?"],"o":[["el pasto","the grass"],["el conejo","the rabbit"],["el zorro","the fox"]],"a":0},{"q":["¿De dónde viene la energía de una cadena alimentaria?","Where does the energy in a food chain come from?"],"o":[["del Sol","from the Sun"],["del zorro","from the fox"],["de la lluvia","from the rain"]],"a":0},{"q":["Un animal que solo come plantas es…","An animal that only eats plants is…"],"o":[["herbívoro","an herbivore"],["carnívoro","a carnivore"],["descomponedor","a decomposer"]],"a":0},{"q":["¿Qué hacen los hongos y las lombrices?","What do fungi and worms do?"],"o":[["Deshacen a los seres muertos y devuelven nutrientes a la tierra.","They break down dead things and return nutrients to the soil."],["Hacen alimento con la luz del sol.","They make food from sunlight."],["Cazan conejos.","They hunt rabbits."]],"a":0},{"q":["Si desaparecen los conejos, ¿qué le pasa al zorro?","If the rabbits disappear, what happens to the fox?"],"o":[["Tiene menos comida.","It has less food."],["Tiene más comida.","It has more food."],["No le pasa nada.","Nothing happens to it."]],"a":0},{"q":["Un oso come peces y también moras. Es…","A bear eats fish and also berries. It is…"],"o":[["omnívoro","an omnivore"],["herbívoro","an herbivore"],["productor","a producer"]],"a":0}],"est":["NGSS 5-LS2-1","TEKS Ciencias 5.º: redes alimentarias","Ciencias Naturales 4º–6º"]},{"id":"tierrasol","nivel":"g35","area":"ciencias","ico":"🌍","titulo":["Ciencias: la Tierra, el Sol y la Luna","Science: Earth, Sun and Moon"],"explica":["El Sol es una estrella. La Tierra gira sobre sí misma una vez al día: eso es la rotación, y por eso hay día y noche. Además, la Tierra le da una vuelta completa al Sol en un año, más o menos 365 días: eso es la traslación. La Luna gira alrededor de la Tierra y tarda cerca de un mes. Al mediodía el Sol está más alto y las sombras son más cortas. Como la Tierra está inclinada, hay estaciones; cuando es verano en el hemisferio norte, es invierno en el sur.","The Sun is a star. Earth spins once a day: that's rotation, and it's why we have day and night. Earth also travels all the way around the Sun in one year, about 365 days: that's revolution. The Moon goes around Earth and takes about a month. At noon the Sun is highest and shadows are shortest. Because Earth is tilted, we have seasons; when it's summer in the northern hemisphere, it's winter in the southern one."],"ejemplos":[["rotación: 1 día","rotation: 1 day"],["traslación: 1 año","revolution: 1 year"],["la Luna gira alrededor de la Tierra","the Moon goes around Earth"]],"ejercicios":[{"q":["¿Por qué hay día y noche?","Why do we have day and night?"],"o":[["Porque la Tierra gira sobre sí misma.","Because Earth spins."],["Porque el Sol se apaga en la noche.","Because the Sun turns off at night."],["Porque la Luna tapa al Sol.","Because the Moon covers the Sun."]],"a":0},{"q":["¿Cuánto tarda la Tierra en darle la vuelta al Sol?","How long does Earth take to go around the Sun?"],"o":[["un año","one year"],["un día","one day"],["una semana","one week"]],"a":0},{"q":["El Sol es…","The Sun is…"],"o":[["una estrella","a star"],["un planeta","a planet"],["una luna","a moon"]],"a":0},{"q":["¿A qué hora del día son más cortas las sombras?","At what time of day are shadows shortest?"],"o":[["al mediodía","at noon"],["en la mañana temprano","early morning"],["al atardecer","at sunset"]],"a":0},{"q":["¿Qué gira alrededor de la Tierra?","What goes around Earth?"],"o":[["la Luna","the Moon"],["el Sol","the Sun"],["Marte","Mars"]],"a":0},{"q":["En diciembre es verano en…","In December it's summer in…"],"o":[["Chile y Argentina","Chile and Argentina"],["Canadá","Canada"],["México","Mexico"]],"a":0}],"est":["NGSS 1-ESS1-1, 5-ESS1-2","TEKS Ciencias 3.º–5.º: Tierra y espacio","Ciencias Naturales 3º–5º"]},{"id":"razones","nivel":"g68","area":"matematicas","ico":"⚖️","titulo":["Razones y proporciones","Ratios and proportions"],"explica":["Una razón compara dos cantidades. Si en una receta hay 2 tazas de harina por cada 3 huevos, la razón es 2 : 3. Dos razones son proporcionales si se multiplican por el mismo número: 2 : 3 es igual a 4 : 6. El valor unitario dice cuánto hay por cada uno: si 4 boletos cuestan 20, un boleto cuesta 20 ÷ 4 = 5.","A ratio compares two amounts. If a recipe uses 2 cups of flour for every 3 eggs, the ratio is 2 : 3. Two ratios are proportional if both parts are multiplied by the same number: 2 : 3 equals 4 : 6. The unit rate tells how much for each one: if 4 tickets cost 20, one ticket costs 20 ÷ 4 = 5."],"ejemplos":[["2 : 3","2 : 3"],["multiplico las dos partes por 2","multiply both parts by 2"],["60 km por hora","60 km per hour"]],"ejercicios":[],"est":["6.RP.1, 6.RP.2, 6.RP.3","6.4B, 6.4D, 6.5A","Matemática 6º–7º"]},{"id":"enteros","nivel":"g68","area":"matematicas","ico":"🌡️","titulo":["Números negativos","Negative numbers"],"explica":["Los números negativos están a la izquierda del 0. Se usan para temperaturas bajo cero, pisos bajo tierra o deudas. Entre más a la izquierda, más pequeño: −8 es menor que −3. Para sumar en la recta, un número positivo te mueve a la derecha y uno negativo a la izquierda: −4 + 6 = 2.","Negative numbers are to the left of 0. They're used for temperatures below zero, floors underground or debts. The farther left, the smaller: −8 is less than −3. To add on the number line, a positive number moves you right and a negative one moves you left: −4 + 6 = 2."],"ejemplos":[["5 grados bajo cero","5 degrees below zero"],["−8 está más a la izquierda","−8 is farther left"],["avanzo 6 a la derecha","move 6 to the right"]],"ejercicios":[],"est":["6.NS.5–7, 7.NS.1","6.2C, 7.3A","Matemática 7º OA 1"]},{"id":"estadistica","nivel":"g68","area":"matematicas","ico":"📈","titulo":["Media, mediana y moda","Mean, median and mode"],"explica":["La media (o promedio) se calcula sumando todos los datos y dividiendo entre cuántos son. La mediana es el dato del centro cuando los ordenas. La moda es el dato que más se repite. El rango es la diferencia entre el mayor y el menor.","The mean (average) is found by adding all the data and dividing by how many there are. The median is the middle value when you order them. The mode is the value that appears most often. The range is the difference between the greatest and the least."],"ejemplos":[["media: 25 ÷ 5 = 5","mean: 25 ÷ 5 = 5"],["mediana: 4 · moda: 4","median: 4 · mode: 4"],["rango: 7","range: 7"]],"ejercicios":[],"est":["6.SP.5","6.12C, 6.12D","Matemática 7º–8º"]},{"id":"probabilidad","nivel":"g68","area":"matematicas","ico":"🎲","titulo":["Probabilidad","Probability"],"explica":["La probabilidad dice qué tan posible es que algo pase. Se calcula así: casos favorables ÷ casos posibles. Si una bolsa tiene 3 canicas rojas y 5 azules, la probabilidad de sacar una roja es 3/8. Va de 0 (imposible) a 1 (seguro).","Probability tells how likely something is to happen. It's found like this: favorable outcomes ÷ possible outcomes. If a bag has 3 red marbles and 5 blue ones, the probability of picking red is 3/8. It goes from 0 (impossible) to 1 (certain)."],"ejemplos":[["P(roja) = 3/8","P(red) = 3/8"],["P(sacar 6) = 1/6","P(rolling a 6) = 1/6"],["imposible … seguro","impossible … certain"]],"ejercicios":[],"est":["7.SP.5–7","7.6A, 7.6E","Matemática 7º–8º"]},{"id":"funciones","nivel":"g68","area":"algebra","ico":"📐","titulo":["Álgebra: funciones lineales","Algebra: linear functions"],"explica":["Una función lineal tiene la forma y = mx + b. La pendiente m dice cuánto cambia y cada vez que x aumenta 1, y b es el valor de y cuando x = 0. En la tabla x: 0, 1, 2 → y: 3, 5, 7, la y sube de 2 en 2, así que m = 2, y empieza en 3, así que b = 3: y = 2x + 3.","A linear function has the form y = mx + b. The slope m tells how much y changes each time x goes up by 1, and b is the value of y when x = 0. In the table x: 0, 1, 2 → y: 3, 5, 7, y goes up by 2, so m = 2, and it starts at 3, so b = 3: y = 2x + 3."],"ejemplos":[["y = 2x + 3","y = 2x + 3"],["sube 2 por cada 1","up 2 for every 1"],["empieza en 3","starts at 3"]],"ejercicios":[],"est":["8.F.3, 8.F.4","8.4C, 8.5B, 8.5I","Matemática 8º"]},{"id":"acentos","nivel":"g68","area":"gramatica","ico":"´","titulo":["Acentos: agudas, llanas y esdrújulas","Accents: agudas, llanas and esdrújulas"],"explica":["Las palabras agudas se pronuncian más fuerte en la última sílaba y llevan tilde si terminan en vocal, n o s: can-ción, ca-fé, pero re-loj no. Las llanas (o graves) suenan fuerte en la penúltima y llevan tilde si NO terminan en vocal, n o s: ár-bol, lá-piz, pero me-sa no. Las esdrújulas suenan fuerte en la antepenúltima y siempre llevan tilde: mú-si-ca, pá-ja-ro.","In Spanish, agudas are stressed on the last syllable and take an accent mark if they end in a vowel, n or s: can-ción, ca-fé, but not re-loj. Llanas (graves) are stressed on the second-to-last syllable and take an accent mark if they do NOT end in a vowel, n or s: ár-bol, lá-piz, but not me-sa. Esdrújulas are stressed on the third-to-last syllable and always take an accent mark: mú-si-ca, pá-ja-ro."],"ejemplos":[["aguda con tilde","aguda with accent"],["llana con tilde","llana with accent"],["esdrújula: siempre tilde","esdrújula: always an accent"]],"ejercicios":[],"est":["Español: ortografía acentual","SLAR 4.º–6.º: ortografía","Lenguaje 5º: agudas, graves y esdrújulas"]},{"id":"figurado","nivel":"g68","area":"lectura","ico":"🎭","titulo":["Lenguaje figurado","Figurative language"],"explica":["El lenguaje figurado dice las cosas de forma creativa, no literal. El símil compara usando «como»: corre como el viento. La metáfora dice que una cosa es otra: sus ojos son dos luceros. La personificación le da acciones humanas a algo que no es persona: el viento susurraba. La hipérbole exagera: te lo dije un millón de veces.","Figurative language says things creatively, not literally. A simile compares using «like» or «as»: runs like the wind. A metaphor says one thing is another: her eyes are two stars. Personification gives human actions to something that isn't a person: the wind whispered. Hyperbole exaggerates: I told you a million times."],"ejemplos":[["símil: corre como el viento","simile: runs like the wind"],["metáfora: sus ojos son dos luceros","metaphor: her eyes are two stars"],["personificación: el viento susurraba","personification: the wind whispered"]],"ejercicios":[{"q":["«Corre tan rápido como el viento.» ¿Qué figura es?","«He runs as fast as the wind.» Which figure is it?"],"o":[["símil","simile"],["metáfora","metaphor"],["hipérbole","hyperbole"]],"a":0},{"q":["«Sus ojos son dos luceros.» ¿Qué figura es?","«Her eyes are two stars.» Which figure is it?"],"o":[["metáfora","metaphor"],["símil","simile"],["personificación","personification"]],"a":0},{"q":["«El viento susurraba entre los árboles.» ¿Qué figura es?","«The wind whispered through the trees.» Which figure is it?"],"o":[["personificación","personification"],["hipérbole","hyperbole"],["símil","simile"]],"a":0},{"q":["«Te lo he dicho un millón de veces.» ¿Qué figura es?","«I've told you a million times.» Which figure is it?"],"o":[["hipérbole","hyperbole"],["metáfora","metaphor"],["personificación","personification"]],"a":0},{"q":["«El sol nos sonríe cada mañana.» ¿Qué figura es?","«The sun smiles at us every morning.» Which figure is it?"],"o":[["personificación","personification"],["símil","simile"],["hipérbole","hyperbole"]],"a":0},{"q":["«Es tan alto como una jirafa.» ¿Qué quiere decir?","«He's as tall as a giraffe.» What does it mean?"],"o":[["Que es muy alto.","That he is very tall."],["Que es una jirafa.","That he is a giraffe."],["Que vive en el zoológico.","That he lives at the zoo."]],"a":0}],"est":["L.6.5a, L.7.5a","ELAR/SLAR 6.º–7.º: lenguaje figurado","Lenguaje 5º–7º: figuras literarias"]},{"id":"materia","nivel":"g68","area":"ciencias","ico":"⚗️","titulo":["Ciencias: átomos y cambios químicos","Science: atoms and chemical changes"],"explica":["Toda la materia está hecha de átomos, partículas tan pequeñas que no se ven. Un elemento tiene un solo tipo de átomo, como el oxígeno o el hierro. Un compuesto une átomos de distintos elementos, como el agua (H₂O). En un cambio físico la sustancia sigue siendo la misma, como el hielo que se derrite. En un cambio químico se forma una sustancia nueva, como la madera que se quema o el hierro que se oxida. En una reacción química la masa total no cambia.","All matter is made of atoms, particles too small to see. An element has only one kind of atom, like oxygen or iron. A compound joins atoms of different elements, like water (H₂O). In a physical change the substance stays the same, like ice melting. In a chemical change a new substance forms, like wood burning or iron rusting. In a chemical reaction the total mass does not change."],"ejemplos":[["cambio físico","physical change"],["cambio químico","chemical change"],["compuesto: agua","compound: water"]],"ejercicios":[{"q":["¿Qué tipo de cambio es el hielo que se derrite?","What kind of change is ice melting?"],"o":[["físico","physical"],["químico","chemical"]],"a":0},{"q":["¿Qué tipo de cambio es la madera que se quema?","What kind of change is wood burning?"],"o":[["químico","chemical"],["físico","physical"]],"a":0},{"q":["El agua (H₂O) es…","Water (H₂O) is…"],"o":[["un compuesto","a compound"],["un elemento","an element"],["un átomo solo","a single atom"]],"a":0},{"q":["¿Qué señal indica un cambio químico?","Which sign shows a chemical change?"],"o":[["Se forma una sustancia nueva, con gas, color u olor nuevos.","A new substance forms, with new gas, color or smell."],["El objeto cambia de forma.","The object changes shape."],["El agua se congela.","Water freezes."]],"a":0},{"q":["En una reacción química, la masa total…","In a chemical reaction, the total mass…"],"o":[["se conserva","stays the same"],["desaparece","disappears"],["siempre aumenta","always increases"]],"a":0},{"q":["Cortar papel en pedazos es un cambio…","Cutting paper into pieces is a…"],"o":[["físico","physical change"],["químico","chemical change"]],"a":0}],"est":["NGSS MS-PS1-1, MS-PS1-2","TEKS Ciencias 6.º–8.º: materia","Ciencias Naturales 7º–8º"]},{"id":"herencia","nivel":"g68","area":"biologia","ico":"🧬","titulo":["Biología: rasgos heredados","Biology: inherited traits"],"explica":["Los rasgos heredados pasan de padres a hijos por medio de los genes, que están en el ADN dentro del núcleo de las células. En la reproducción sexual, cada hijo recibe la mitad de sus genes de cada progenitor; por eso los hermanos se parecen pero no son iguales. Los rasgos adquiridos se aprenden o se forman durante la vida, como hablar un idioma o tener una cicatriz, y no se heredan.","Inherited traits pass from parents to offspring through genes, which are in the DNA inside the nucleus of cells. In sexual reproduction, each offspring gets half of its genes from each parent; that's why siblings look alike but aren't identical. Acquired traits are learned or formed during life, like speaking a language or having a scar, and are not inherited."],"ejemplos":[["color de ojos: heredado","eye color: inherited"],["hablar español: aprendido","speaking Spanish: learned"],["los genes están en el ADN","genes are in DNA"]],"ejercicios":[{"q":["¿Dónde están los genes?","Where are genes found?"],"o":[["en el ADN, dentro del núcleo","in the DNA, inside the nucleus"],["en la piel solamente","only in the skin"],["en la sangre del corazón","in the heart's blood"]],"a":0},{"q":["El color de ojos es un rasgo…","Eye color is a trait that is…"],"o":[["heredado","inherited"],["aprendido","learned"]],"a":0},{"q":["Saber andar en bicicleta es un rasgo…","Knowing how to ride a bike is a trait that is…"],"o":[["aprendido","learned"],["heredado","inherited"]],"a":0},{"q":["En la reproducción sexual, ¿cuántos genes recibes de cada progenitor?","In sexual reproduction, how many genes do you get from each parent?"],"o":[["la mitad","half"],["todos","all of them"],["ninguno","none"]],"a":0},{"q":["¿Por qué los hermanos no son iguales?","Why aren't siblings identical?"],"o":[["Cada uno recibe una combinación distinta de genes.","Each one gets a different combination of genes."],["Porque comen diferente.","Because they eat differently."],["Porque nacieron en días distintos.","Because they were born on different days."]],"a":0}],"est":["NGSS MS-LS3-2","TEKS Ciencias 7.º: herencia","Ciencias Naturales 6º–8º"]},{"id":"patronesnum","nivel":"g35","area":"algebra","ico":"🔢","titulo":["Álgebra: patrones numéricos","Algebra: number patterns"],"explica":["Un patrón numérico sigue una regla. Para encontrarla, compara dos números seguidos: ¿se suma, se resta o se multiplica? En 3, 7, 11, 15 la regla es «sumar 4», así que sigue 19. Comprueba la regla con todos los números, no solo con los dos primeros.","A number pattern follows a rule. To find it, compare two numbers in a row: is something added, subtracted or multiplied? In 3, 7, 11, 15 the rule is «add 4», so 19 comes next. Check the rule with every number, not just the first two."],"ejemplos":[["regla: +4","rule: +4"],["regla: ×2","rule: ×2"],["regla: −5","rule: −5"]],"ejercicios":[],"est":["3.OA.9, 4.OA.5","3.5E, 4.5B","Matemática 3º–4º: patrones"]},{"id":"perimetro","nivel":"g35","area":"geometria","ico":"📏","titulo":["Geometría: perímetro y área","Geometry: perimeter and area"],"explica":["El perímetro es lo que mide el borde: se suman todos los lados. En un rectángulo: largo + ancho + largo + ancho. El área es el espacio de adentro: se multiplica largo × ancho y se mide en unidades cuadradas (cm²).","Perimeter is the distance around the edge: add all the sides. For a rectangle: length + width + length + width. Area is the space inside: multiply length × width, measured in square units (cm²)."],"ejemplos":[["perímetro: 16 cm","perimeter: 16 cm"],["área: 15 cm²","area: 15 cm²"],["perímetro 16 cm, área 16 cm²","perimeter 16 cm, area 16 cm²"]],"ejercicios":[],"est":["3.MD.7, 3.MD.8","3.6C, 3.7B","Matemática 4º"]},{"id":"angulos35","nivel":"g35","area":"geometria","ico":"📐","titulo":["Geometría: tipos de ángulos","Geometry: types of angles"],"explica":["Un ángulo se forma cuando dos líneas salen del mismo punto, y se mide en grados (°). Agudo: menos de 90°. Recto: exactamente 90°, como la esquina de una hoja. Obtuso: más de 90° y menos de 180°. Llano: 180°, una línea recta.","An angle forms when two lines start from the same point, and it is measured in degrees (°). Acute: less than 90°. Right: exactly 90°, like the corner of a sheet of paper. Obtuse: more than 90° and less than 180°. Straight: 180°, a straight line."],"ejemplos":[["agudo","acute"],["recto","right"],["obtuso","obtuse"],["llano","straight"]],"ejercicios":[],"est":["4.MD.5, 4.G.1","4.6C, 4.7C","Matemática 4º–5º"]},{"id":"expresiones","nivel":"g68","area":"algebra","ico":"🔣","titulo":["Álgebra: expresiones","Algebra: expressions"],"explica":["Una expresión algebraica combina números y variables, como 3x + 2. Evaluar es cambiar la variable por su valor: si x = 4, 3x + 2 = 12 + 2 = 14. Los términos semejantes tienen la misma variable y se suman: 2x + 5x = 7x. La propiedad distributiva multiplica lo de afuera por cada término: 3(x + 4) = 3x + 12.","An algebraic expression combines numbers and variables, like 3x + 2. Evaluating means replacing the variable with its value: if x = 4, 3x + 2 = 12 + 2 = 14. Like terms have the same variable and are added: 2x + 5x = 7x. The distributive property multiplies the outside number by each term: 3(x + 4) = 3x + 12."],"ejemplos":[["3x + 2 = 14","3x + 2 = 14"],["2x + 5x = 7x","2x + 5x = 7x"],["3(x + 4) = 3x + 12","3(x + 4) = 3x + 12"]],"ejercicios":[],"est":["6.EE.2","6.7A","Matemática 6º–7º"]},{"id":"dospasos","nivel":"g68","area":"algebra","ico":"⚖️","titulo":["Álgebra: ecuaciones de dos pasos","Algebra: two-step equations"],"explica":["Para resolver 2x + 3 = 11, deshaz las operaciones en orden contrario. Paso 1: quita lo que se suma o se resta (11 − 3 = 8, queda 2x = 8). Paso 2: divide entre el número que multiplica a la x (8 ÷ 2 = 4). Comprueba: 2 · 4 + 3 = 11.","To solve 2x + 3 = 11, undo the operations in reverse order. Step 1: remove what is added or subtracted (11 − 3 = 8, leaving 2x = 8). Step 2: divide by the number multiplying x (8 ÷ 2 = 4). Check: 2 · 4 + 3 = 11."],"ejemplos":[["2x = 8 → x = 4","2x = 8 → x = 4"],["5x = 25 → x = 5","5x = 25 → x = 5"],["3x = 0 → x = 0","3x = 0 → x = 0"]],"ejercicios":[],"est":["7.EE.4","7.11A","Matemática 7º–8º"]},{"id":"triangulos","nivel":"g68","area":"geometria","ico":"🔺","titulo":["Geometría: ángulos del triángulo","Geometry: triangle angles"],"explica":["Los tres ángulos de cualquier triángulo siempre suman 180°. Para encontrar el que falta, suma los dos que conoces y réstalo de 180. Si los ángulos son 50° y 60°, el tercero es 180 − 110 = 70°.","The three angles of any triangle always add up to 180°. To find the missing one, add the two you know and subtract from 180. If the angles are 50° and 60°, the third is 180 − 110 = 70°."],"ejemplos":[["? = 70°","? = 70°"],["? = 45°","? = 45°"],["? = 60° (equilátero)","? = 60° (equilateral)"]],"ejercicios":[],"est":["7.G.5, 8.G.5","7.11C, 8.8D","Matemática 7º"]},{"id":"areas68","nivel":"g68","area":"geometria","ico":"⭕","titulo":["Geometría: área del triángulo y del círculo","Geometry: area of triangles and circles"],"explica":["Área del triángulo: base × altura ÷ 2. Área del círculo: π × r², donde r es el radio. La circunferencia (el borde del círculo) es 2 × π × r. En estos ejercicios usamos π ≈ 3.14.","Area of a triangle: base × height ÷ 2. Area of a circle: π × r², where r is the radius. The circumference (the edge of the circle) is 2 × π × r. In these exercises we use π ≈ 3.14."],"ejemplos":[["área = 12","area = 12"],["área = 78.5","area = 78.5"],["circunferencia = 31.4","circumference = 31.4"]],"ejercicios":[],"est":["6.G.1, 7.G.4","6.8D, 7.9B","Matemática 7º"]},{"id":"pitagoras","nivel":"g68","area":"geometria","ico":"📐","titulo":["Geometría: teorema de Pitágoras","Geometry: Pythagorean theorem"],"explica":["En un triángulo rectángulo, el lado más largo se llama hipotenusa (c) y está frente al ángulo recto. Los otros dos son los catetos (a y b). Siempre se cumple a² + b² = c². Si a = 3 y b = 4: 9 + 16 = 25, y la raíz de 25 es 5, así que c = 5.","In a right triangle, the longest side is the hypotenuse (c), opposite the right angle. The other two are the legs (a and b). It's always true that a² + b² = c². If a = 3 and b = 4: 9 + 16 = 25, and the square root of 25 is 5, so c = 5."],"ejemplos":[["c = 5","c = 5"],["c = 10","c = 10"],["b = 12","b = 12"]],"ejercicios":[],"est":["8.G.7","8.7C","Matemática 8º"]}]}</script>
<script>
/* ===================== Ethan para Maestros =====================
   Herramientas de IA solo para adultos. La app de los niños (index.html) no usa IA.
   Toda llamada de IA pasa por Firebase AI Logic con inferencia híbrida y App Check. */
const D=JSON.parse(document.getElementById('datos').textContent);
const $=(s,e=document)=>e.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('ethanM_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ethanM_'+k,JSON.stringify(v))}catch(e){}}};
const S={ui:store.get('ui','es'),route:store.get('route','prefer_on_device'),stats:store.get('stats',{dev:0,cloud:0}),tab:'lectura',
  nivel:store.get('nivel','g12'),leccion:store.get('leccion',''),idioma:store.get('idioma','es'),pais:store.get('pais','US'),apoyo:store.get('apoyo','estandar')};
function save(){['ui','route','stats','nivel','leccion','idioma','pais','apoyo'].forEach(k=>store.set(k,S[k]))}
const I=(es,en)=>S.ui==='en'?en:es;
const pick=p=>Array.isArray(p)?(S.ui==='en'?p[1]:p[0]):p;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GRADOS={pk:['PreK (4–5 años)','PreK (ages 4–5)'],g12:['1.º–2.º grado','grades 1–2'],g35:['3.º–5.º grado','grades 3–5'],g68:['6.º–8.º grado','grades 6–8']};

/* ============ IA híbrida (Firebase AI Logic) ============ */
const AI={ready:false,error:null,models:{},deviceStatus:'unknown',downloading:false,progress:0};
const MODES={prefer_on_device:'PREFER_ON_DEVICE',only_on_device:'ONLY_ON_DEVICE',only_in_cloud:'ONLY_IN_CLOUD'};
function initAI(){
  if(window.__MOCK_AI){AI.ready=true;AI.deviceStatus='available';return}
  if(!window.FB){AI.error='Firebase SDK missing';return}
  try{
    const app=FB.initializeApp(FIREBASE_CONFIG);
    if(APPCHECK_DEBUG_TOKEN)self.FIREBASE_APPCHECK_DEBUG_TOKEN=APPCHECK_DEBUG_TOKEN;
    const provider=RECAPTCHA_ENTERPRISE_SITE_KEY?new FB.ReCaptchaEnterpriseProvider(RECAPTCHA_ENTERPRISE_SITE_KEY):new FB.CustomProvider({getToken:async()=>{throw new Error('No App Check provider')}});
    FB.initializeAppCheck(app,{provider,isTokenAutoRefreshEnabled:true});
    AI.ai=FB.getAI(app,{backend:new FB.GoogleAIBackend()});
    AI.ready=true;
  }catch(e){AI.error=String(e&&e.message||e)}
}
const LANGS={expectedInputs:[{type:'text',languages:['en','es']}],expectedOutputs:[{type:'text',languages:['en','es']}]};
function getModel(feature,schema,route){
  const key=feature+'|'+route;if(AI.models[key])return AI.models[key];
  return AI.models[key]=FB.getGenerativeModel(AI.ai,{mode:FB.InferenceMode[MODES[route]],
    onDeviceParams:{createOptions:LANGS,promptOptions:{responseConstraint:schema}},
    inCloudParams:{model:CLOUD_MODEL,generationConfig:{responseMimeType:'application/json',temperature:0.5}}});
}
async function checkDevice(){
  if(window.__MOCK_AI)return;
  try{if(!('LanguageModel' in self)){AI.deviceStatus='unavailable';return}AI.deviceStatus=await LanguageModel.availability(LANGS)}catch(e){AI.deviceStatus='unavailable'}
}
function prepareDevice(){ // se llama con un toque del usuario
  if(window.__MOCK_AI||!AI.ready||AI.downloading||['available','unavailable'].includes(AI.deviceStatus))return;
  try{const m=getModel('preparar',{type:'object',properties:{ok:{type:'string'}}},'prefer_on_device');AI.downloading=true;pintarEstado();
    Promise.resolve(m.initializeDeviceModel(p=>{AI.progress=Math.round((p&&p.loaded!=null?p.loaded:p)*100);pintarEstado()})).then(checkDevice).finally(()=>{AI.downloading=false;pintarEstado()})}catch(e){AI.downloading=false}
}
function parseJSON(t){t=String(t||'').trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)t=t.slice(a,b+1);return JSON.parse(t)}
async function ask(feature,prompt,schema,route){
  route=route||S.route;const t0=performance.now();let data,src;
  if(window.__MOCK_AI){const r=await window.__MOCK_AI(feature,prompt,route);data=r.data;src=r.source}
  else{
    if(!AI.ready)throw new Error(AI.error||'not ready');
    const intento=(r,ms)=>Promise.race([getModel(feature,schema,r).generateContent(prompt),new Promise((_,rej)=>setTimeout(()=>{const e=new Error(I('La IA tardó demasiado. Revisa la conexión e intenta otra vez.','The AI took too long. Check your connection and try again.'));e.tarde=true;rej(e)},ms))]);
    const ocupado=e=>/\b(429|500|503)\b|high demand|overloaded|unavailable/i.test(String(e&&e.message||e));
    const nube=async()=>{ // si la nube está saturada, espera un poco y lo intenta otra vez (hasta 3 veces)
      for(let i=0;;i++){try{return await intento('only_in_cloud',45000)}
        catch(e){if(i>=2||!ocupado(e))throw e;await new Promise(r=>setTimeout(r,4000*(i+1)))}}};
    let res;
    if(route==='only_in_cloud')res=await nube();
    else{
      try{res=await intento(route,120000)}
      catch(e){ // Gemini Nano puede tardar en una computadora lenta: en modo híbrido se pasa a la nube
        if(route!=='prefer_on_device')throw e;
        console.warn('Ethan: en el aparato no se pudo, se usa la nube:',e);
        res=await nube()}}
    data=parseJSON(res.response.text());src=res.response.inferenceSource==='on_device'?'device':'cloud';
  }
  S.stats[src==='device'?'dev':'cloud']++;save();
  return {data,source:src,ms:Math.round(performance.now()-t0)};
}
const badge=r=>r.source==='device'?`<span class="badge dev">🔒 ${I('En este aparato: el texto no salió de aquí','On this device: the text never left it')} · ${r.ms} ms</span>`:`<span class="badge nube">☁️ ${I('Nube de Gemini','Gemini cloud')} · ${r.ms} ms</span>`;

/* ============ Privacidad: limpiar datos personales antes de enviar ============ */
function limpiar(t){return String(t)
  .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[correo]')
  .replace(/(\+?\d[\d\s().-]{7,}\d)/g,'[teléfono]')
  .replace(/https?:\/\/\S+/g,'[enlace]')
  .replace(/\b(me llamo|mi nombre es|soy|my name is|i am|i'm)\s+([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)/gi,(m,a)=>a+' [nombre]')}

/* ============ Instrucciones comunes para la IA ============ */
const DIF={simplificado:'Differentiation: SIMPLIFIED. Use short sentences, very common words, and concrete examples; keep texts about 60% of the usual length; questions should be literal and use only 2 answer options when options are requested (still return them in the same JSON fields).',estandar:'Differentiation: STANDARD, on grade level.',avanzado:'Differentiation: ADVANCED. Use richer vocabulary and slightly longer texts; include inference, comparison and "explain why" questions that extend toward the next grade.'};
const SEGURIDAD='Audience: children. Content must be age-appropriate, kind, factually accurate, free of violence, romance, brand names, real private people, and personal data. Do not ask for personal information.';
const REGLAS_ES='Spanish rules: every exclamation starts with ¡ and ends with !, every question starts with ¿ and ends with ?; use correct accents (está, también, aquí); use estar for location and temporary states (la escuela está cerca) and ser for identity and traits; capital letter at the start of every sentence. Write natural Spanish, not a translation from English.';
const seg=()=>SEGURIDAD+' '+DIF[S.apoyo]+(S.idioma==='es'?' '+REGLAS_ES:'')+' Re-read your answer and fix any grammar or spelling mistake before returning it.';
function contexto(){const l=D.lecciones.find(x=>x.id===S.leccion)||{};const p=D.paises.find(x=>x.k===S.pais)||D.paises[0];
  return {l,grado:GRADOS[S.nivel][1],idioma:S.idioma==='es'?'Spanish':'English',pais:p.n[1],est:l.est?`Common Core/NGSS: ${l.est[0]}; Texas TEKS: ${l.est[1]}; Chile: ${l.est[2]}`:''}}

const SCH={
 lectura:{type:'object',properties:{titulo:{type:'string'},texto:{type:'string'},vocabulario:{type:'array',items:{type:'object',properties:{palabra:{type:'string'},significado:{type:'string'}},required:['palabra','significado']}},preguntas:{type:'array',items:{type:'object',properties:{pregunta:{type:'string'},opciones:{type:'array',items:{type:'string'}},respuesta:{type:'integer'}},required:['pregunta','opciones','respuesta']}},nota:{type:'string'}},required:['titulo','texto','preguntas']},
 explicar:{type:'object',properties:{explicacion:{type:'string'},ejemplos:{type:'array',items:{type:'string'}},comparacion:{type:'string'},error_comun:{type:'string'},comprobar:{type:'array',items:{type:'object',properties:{pregunta:{type:'string'},respuesta:{type:'string'}},required:['pregunta','respuesta']}}},required:['explicacion','ejemplos']},
 retro:{type:'object',properties:{fortalezas:{type:'array',items:{type:'string'}},siguientes_pasos:{type:'array',items:{type:'string'}},version_corregida:{type:'string'},nivel:{type:'integer'},mensaje_al_estudiante:{type:'string'}},required:['fortalezas','siguientes_pasos','version_corregida']},
 preguntas:{type:'object',properties:{preguntas:{type:'array',items:{type:'object',properties:{pregunta:{type:'string'},opciones:{type:'array',items:{type:'string'}},respuesta:{type:'integer'},explicacion:{type:'string'}},required:['pregunta','opciones','respuesta']}}},required:['preguntas']}
};
const PROMPTS={
 lectura:(c,tema)=>`You are an experienced bilingual elementary and middle school teacher. ${seg()}
Write a short original reading passage in ${c.idioma} for ${c.grado}${tema?` about this topic chosen by the teacher: "${tema}" (it may have a typo; use the intended word). The whole passage must be about that topic`:''}. The passage must also practice the lesson "${c.l.titulo&&c.l.titulo[1]}" with several clear examples of it. Use places or names typical of ${c.pais} when natural.
Length: ${S.nivel==='pk'?'40-60':S.nivel==='g12'?'70-110':S.nivel==='g35'?'130-180':'180-240'} words. Then write 4 multiple-choice comprehension questions (3 options each, one correct; mix literal and inference), 4 vocabulary words taken exactly from the passage (each word must appear in the passage) with child-friendly meanings, and a one-sentence note for the teacher naming the skill practiced${c.est?` (standards: ${c.est})`:''}.
Write everything in ${c.idioma}. Return JSON: {"titulo":"","texto":"","vocabulario":[{"palabra":"","significado":""}],"preguntas":[{"pregunta":"","opciones":["","",""],"respuesta":0}],"nota":""}. "respuesta" is the index (0-2) of the correct option.`,
 explicar:(c,tema)=>`You are an experienced bilingual teacher. ${seg()}
A student in ${c.grado} did not understand this lesson: "${c.l.titulo&&c.l.titulo[1]}". The current explanation is: "${c.l.explica&&c.l.explica[1]}".${tema?` Extra context from the teacher: ${tema}.`:''}
Explain it a different way in ${c.idioma}, in simple words for that age, using an everyday comparison. Give 3 short new examples, one common mistake to watch for, and 2 quick check questions with answers.
Return JSON: {"explicacion":"","ejemplos":["","",""],"comparacion":"","error_comun":"","comprobar":[{"pregunta":"","respuesta":""}]}.`,
 retro:(c,texto)=>`You are a kind, encouraging bilingual writing teacher. ${seg()}
Here is a short anonymous text written by a student in ${c.grado}, in ${c.idioma}:
"""${texto}"""
Give feedback in ${c.idioma} at that grade level: 2 specific strengths, 2 clear next steps (capital letters, punctuation, spelling, order of ideas, connectors), a corrected version that keeps the student's own words and ideas, a level from 1 (beginning) to 4 (meets grade expectations), and a warm 1-2 sentence message to the student. Never mention the student's identity.
Return JSON: {"fortalezas":["",""],"siguientes_pasos":["",""],"version_corregida":"","nivel":3,"mensaje_al_estudiante":""}.`,
 preguntas:(c,tema)=>`You are an experienced bilingual teacher writing practice questions. ${seg()}
Write 5 original multiple-choice questions in ${c.idioma} for ${c.grado} that practice the lesson "${c.l.titulo&&c.l.titulo[1]}"${c.est?` (standards: ${c.est})`:''}${tema?`, with this context: ${tema}`:''}. Each has 3 options with exactly one correct answer and a one-sentence explanation. Double-check every answer is correct.
Return JSON: {"preguntas":[{"pregunta":"","opciones":["","",""],"respuesta":0,"explicacion":""}]}. "respuesta" is the index (0-2) of the correct option.`
};

/* ============ Respaldo sin IA: el contenido que Ethan ya trae ============ */
function respaldo(){const c=contexto(),l=c.l;if(!l.id)return '';
  const k=S.idioma==='en'?1:0;
  return `<div class="card respaldo"><h3>📘 ${I('Sin IA: material de Ethan para esta lección','No AI: Ethan\'s built-in material for this lesson')}</h3>
   <p>${esc(l.explica[k])}</p><ul>${l.ejemplos.map(e=>`<li>${esc(e[k])}</li>`).join('')}</ul>
   ${l.ejercicios.length?`<ol>${l.ejercicios.map(e=>{const o=e.o.map(x=>Array.isArray(x)?x[k]:x);return `<li>${esc(e.q[k])}<br><small>${o.map((x,i)=>i===e.a?`<b>✔ ${esc(x)}</b>`:esc(x)).join(' · ')}</small></li>`}).join('')}</ol>`:''}</div>`}

/* ============ Pantallas ============ */
const TABS=[['lectura','📖',['Lectura nivelada','Leveled reading']],['explicar','💡',['Explicar de otra forma','Re-explain a lesson']],['retro','✍️',['Retroalimentación de escritura','Writing feedback']],['preguntas','❓',['Preguntas de práctica','Practice questions']],['privacidad','🔒',['Privacidad y estadísticas','Privacy and stats']]];
function render(){
  document.documentElement.lang=S.ui;
  $('#app').innerHTML=`
  <header><div class="logo">🦉 <b>Ethan</b> <span>${I('para Maestros','for Teachers')}</span></div>
   <div class="toggle"><button data-ui="es" class="${S.ui==='es'?'on':''}">ES</button><button data-ui="en" class="${S.ui==='en'?'on':''}">EN</button></div></header>
  <main>
   <div class="aviso">👩‍🏫 ${I('Herramientas con IA <b>solo para adultos</b>. Los niños usan la app Ethan, que no tiene IA. Revisa todo lo que genere la IA antes de usarlo en clase.','AI tools <b>for adults only</b>. Children use the Ethan app, which has no AI. Review everything the AI generates before using it in class.')}</div>
   <div id="estado" class="estado"></div>
   <nav class="tabs">${TABS.map(([k,ic,n])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${ic} ${pick(n)}</button>`).join('')}</nav>
   <section id="panel"></section>
  </main>
  <footer>${I('Ethan · Aprende y Juega · creado por Rosa Laura Torres. Las sugerencias de la IA pueden tener errores: el maestro decide.','Ethan · Learn and Play · created by Rosa Laura Torres. AI suggestions can contain mistakes: the teacher decides.')}</footer>`;
  pintarEstado();pintarPanel();
}
function pintarEstado(){const e=$('#estado');if(!e)return;
  const dev=AI.deviceStatus==='available'?I('✅ IA del aparato lista (Gemini Nano)','✅ On-device AI ready (Gemini Nano)'):AI.downloading?I(`⏳ Preparando la IA del aparato… ${AI.progress||0}%`,`⏳ Preparing on-device AI… ${AI.progress||0}%`):AI.deviceStatus==='unavailable'?I('Este aparato no tiene IA local; se usará la nube.','This device has no local AI; the cloud will be used.'):I('La IA del aparato se puede preparar (Chrome de computadora).','On-device AI can be prepared (desktop Chrome).');
  e.innerHTML=`<div>${AI.error?`⚠️ ${I('La IA no está conectada. Puedes usar el material de Ethan sin IA.','AI is not connected. You can still use Ethan\'s built-in material.')}`:dev}</div>
   <label>${I('Modo de IA','AI mode')}: <select id="modo"><option value="prefer_on_device">${I('Híbrido (recomendado)','Hybrid (recommended)')}</option><option value="only_on_device">${I('Solo en este aparato','Device only')}</option><option value="only_in_cloud">${I('Solo nube','Cloud only')}</option></select></label>
   ${['available','unavailable'].includes(AI.deviceStatus)||AI.error?'':`<button class="sec" id="prep">⬇️ ${I('Preparar IA del aparato','Prepare on-device AI')}</button>`}`;
  $('#modo').value=S.route;$('#modo').onchange=ev=>{S.route=ev.target.value;save()};
  if($('#prep'))$('#prep').onclick=prepareDevice;
}
function selectores(conTema,etiqueta){
  const lecs=D.lecciones.filter(l=>l.nivel===S.nivel);if(!lecs.find(l=>l.id===S.leccion))S.leccion=lecs[0].id;
  const l=lecs.find(x=>x.id===S.leccion);
  return `<div class="grid">
   <label>${I('Nivel','Level')}<select id="nivel">${D.niveles.map(n=>`<option value="${n.id}" ${n.id===S.nivel?'selected':''}>${n.ico} ${pick(n.nombre)}</option>`).join('')}</select></label>
   <label>${I('Lección de Ethan','Ethan lesson')}<select id="leccion">${lecs.map(x=>`<option value="${x.id}" ${x.id===S.leccion?'selected':''}>${x.ico} ${esc(pick(x.titulo))}</option>`).join('')}</select></label>
   <label>${I('Idioma del material','Material language')}<select id="idioma"><option value="es" ${S.idioma==='es'?'selected':''}>Español</option><option value="en" ${S.idioma==='en'?'selected':''}>English</option></select></label>
   <label>${I('Diferenciación','Differentiation')}<select id="apoyo"><option value="simplificado" ${S.apoyo==='simplificado'?'selected':''}>🌱 ${I('Simplificado','Simplified')}</option><option value="estandar" ${S.apoyo==='estandar'?'selected':''}>⭐ ${I('Estándar','Standard')}</option><option value="avanzado" ${S.apoyo==='avanzado'?'selected':''}>🚀 ${I('Avanzado','Advanced')}</option></select></label>
   <label>${I('País (para nombres y lugares)','Country (for names and places)')}<select id="pais">${D.paises.map(p=>`<option value="${p.k}" ${p.k===S.pais?'selected':''}>${p.f} ${pick(p.n)}</option>`).join('')}</select></label>
  </div>
  <p class="est">📚 ${l&&l.est?`EE. UU.: ${esc(l.est[0])} · Texas: ${esc(l.est[1])} · Chile: ${esc(l.est[2])}`:''}</p>
  ${conTema?`<label class="full">${etiqueta}<input id="tema" maxlength="160" placeholder="${I('Opcional. Ej.: los animales del desierto','Optional. E.g., desert animals')}"></label>`:''}`;
}
function enlazarSelectores(){
  [['nivel','nivel'],['leccion','leccion'],['idioma','idioma'],['pais','pais'],['apoyo','apoyo']].forEach(([id,k])=>{const s=$('#'+id);if(s)s.onchange=()=>{S[k]=s.value;save();pintarPanel()}});
}
function pintarPanel(){const p=$('#panel');
  if(S.tab==='privacidad'){const tot=S.stats.dev+S.stats.cloud||1;
    p.innerHTML=`<div class="card"><h2>🔒 ${I('Privacidad','Privacy')}</h2><ul>
     <li>${I('Esta página es para maestros y padres. La app de los niños no tiene IA ni se conecta a internet.','This page is for teachers and parents. The children\'s app has no AI and never connects to the internet.')}</li>
     <li>${I('En modo híbrido, la IA trabaja primero dentro de tu computadora (Gemini Nano en Chrome). Solo si no se puede, usa la nube de Gemini.','In hybrid mode, the AI runs on your computer first (Gemini Nano in Chrome). Only if that isn\'t possible does it use the Gemini cloud.')}</li>
     <li>${I('La retroalimentación de escritura usa solo el aparato cuando está disponible. Antes de enviar, la página borra correos, teléfonos, enlaces y nombres después de «me llamo».','Writing feedback uses the device only when available. Before sending, the page removes emails, phone numbers, links and names after «my name is».')}</li>
     <li>${I('No hay cuentas. Esta página no guarda textos de estudiantes; solo tus ajustes y el conteo de abajo, en este navegador.','No accounts. This page does not save student texts; only your settings and the count below, in this browser.')}</li></ul>
     <h3>${I('¿Dónde trabajó la IA?','Where did the AI run?')}</h3>
     <div class="barra"><span style="width:${Math.round(S.stats.dev/tot*100)}%" class="dev"></span></div>
     <p>🔒 ${I('En el aparato','On device')}: <b>${S.stats.dev}</b> · ☁️ ${I('Nube','Cloud')}: <b>${S.stats.cloud}</b></p></div>`;return}
  const t={lectura:[I('Crea una lectura corta al nivel del grado, con vocabulario y preguntas de comprensión.','Create a short grade-level reading with vocabulary and comprehension questions.'),true,I('Tema (opcional)','Topic (optional)')],
    explicar:[I('Si un niño no entendió una lección de Ethan, la IA la explica de otra manera, con ejemplos nuevos.','If a child didn\'t understand an Ethan lesson, the AI explains it another way, with new examples.'),true,I('¿Qué no entendió? (opcional)','What was confusing? (optional)')],
    preguntas:[I('Crea 5 preguntas nuevas de opción múltiple para la lección, con respuesta y explicación.','Create 5 new multiple-choice questions for the lesson, with answers and explanations.'),true,I('Contexto (opcional)','Context (optional)')],
    retro:[I('Pega un texto corto de un estudiante. No escribas su nombre ni datos personales.','Paste a short student text. Do not include the student\'s name or personal data.'),false,'']}[S.tab];
  p.innerHTML=`<div class="card"><p class="sub">${t[0]}</p>${selectores(t[1],t[2])}
   ${S.tab==='retro'?`<label class="full">${I('Texto del estudiante','Student text')}<textarea id="texto" rows="6" maxlength="1500" placeholder="${I('Ej.: primero fuimos al parque despues jugamos futbol','E.g., first we went to the park then we play soccer')}"></textarea></label>`:''}
   <div class="fila"><button id="generar">✨ ${I('Generar','Generate')}</button><button class="sec" id="sinIA">📘 ${I('Ver material sin IA','See material without AI')}</button></div></div>
   <div id="resultado"></div>`;
  enlazarSelectores();
  $('#sinIA').onclick=()=>{$('#resultado').innerHTML=respaldo()};
  $('#generar').onclick=generar;
}
async function generar(){
  const out=$('#resultado'),btn=$('#generar');const c=contexto();let prompt,route=S.route;
  if(S.tab==='retro'){
    const raw=($('#texto').value||'').trim();if(raw.length<10){out.innerHTML=`<div class="aviso">${I('Escribe o pega un texto de al menos una oración.','Type or paste at least one sentence.')}</div>`;return}
    const limpio=limpiar(raw);
    if(S.route!=='only_in_cloud'&&AI.deviceStatus==='available')route='only_on_device';
    else if(!confirm(I('Este aparato no tiene IA local, así que el texto irá a la nube de Gemini. Ya se quitaron correos, teléfonos y nombres. ¿Continuar?','This device has no local AI, so the text will go to the Gemini cloud. Emails, phones and names were removed. Continue?')))return;
    prompt=PROMPTS.retro(c,limpio);
  } else prompt=PROMPTS[S.tab](c,limpiar(($('#tema')&&$('#tema').value)||'').slice(0,160));
  if(S.route==='only_on_device'||route==='only_on_device'){await checkDevice();if(AI.deviceStatus!=='available'&&!window.__MOCK_AI){out.innerHTML=`<div class="aviso">${I('«Solo en este aparato» necesita Chrome de computadora con Gemini Nano. Cambia a «Híbrido» o usa el material sin IA.','«Device only» needs desktop Chrome with Gemini Nano. Switch to «Hybrid» or use the material without AI.')}</div>`+respaldo();return}}
  if(!navigator.onLine&&AI.deviceStatus!=='available'&&!window.__MOCK_AI){out.innerHTML=`<div class="aviso">📴 ${I('No hay internet y este aparato no tiene IA local. Aquí está el material de Ethan sin IA.','No internet and this device has no local AI. Here is Ethan\'s material without AI.')}</div>`+respaldo();return}
  btn.disabled=true;out.innerHTML=`<div class="card cargando">⏳ ${I('La IA está trabajando… La primera vez puede tardar hasta 2 minutos.','The AI is working… The first time can take up to 2 minutes.')}</div>`;
  try{const r=await ask(S.tab,prompt,SCH[S.tab],route);const notas=revisar(S.tab,r.data);out.innerHTML=mostrar(S.tab,r.data,r,notas)}
  catch(e){out.innerHTML=`<div class="aviso">⚠️ ${I('No se pudo usar la IA','Could not use the AI')}: ${esc(e&&e.message||e)}</div>`+respaldo()}
  finally{btn.disabled=false;enlazarResultado()}
}
function opciones(q){const ops=(q.opciones||[]).map((o,i)=>i===q.respuesta?`<b>✔ ${esc(o)}</b>`:esc(o));return `<small>${ops.join(' · ')}</small>`}
/* ============ Revisión automática de lo que escribió la IA ============ */
const sinAcento=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function arreglarES(t,n){ // ¡! ¿?, mayúscula al inicio de oración, espacios dobles
  if(typeof t!=='string')return t;let s=t.replace(/[ \t]{2,}/g,' ');
  s=s.replace(/(^|[.!?…]\s+|\n\s*)([^.!?…\n]*?)([!?])/g,(m,pre,cuerpo,fin)=>{
    const ab=fin==='!'?'¡':'¿';if(cuerpo.includes(ab)||!/[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(cuerpo))return m;
    const i=cuerpo.search(/[A-Za-zÁÉÍÓÚÑáéíóúñ0-9"«]/);n.signos++;return pre+cuerpo.slice(0,i)+ab+cuerpo.slice(i)+fin});
  const oracion=/\s/.test(s.trim())&&/[.!?…]["»]?$/.test(s.trim()); // solo textos con oraciones, no palabras sueltas ni opciones cortas
  s=s.replace(oracion?/(^|[.!?…]\s+)([¡¿«"]?)([a-záéíóúñ])/g:/([.!?…]\s+)([¡¿«"]?)([a-záéíóúñ])/g,(m,pre,sig,l)=>{n.may++;return pre+sig+l.toUpperCase()});
  return s}
function recorrer(o,f){if(typeof o==='string')return f(o);if(Array.isArray(o))return o.map(x=>recorrer(x,f));
  if(o&&typeof o==='object'){for(const k in o)if(k!=='respuesta'&&k!=='nivel')o[k]=recorrer(o[k],f);return o}return o}
function revisar(tab,d){const notas=[];if(!d||typeof d!=='object')return notas;
  if(S.idioma==='es'){const n={signos:0,may:0};recorrer(d,t=>arreglarES(t,n));
    if(n.signos)notas.push(I(`Agregué ${n.signos} signo(s) de apertura ¡ o ¿.`,`Added ${n.signos} opening ¡ or ¿ mark(s).`));
    if(n.may)notas.push(I(`Puse ${n.may} mayúscula(s) al inicio de oración.`,`Capitalized ${n.may} sentence start(s).`))}
  if(tab==='lectura'&&Array.isArray(d.vocabulario)){const txt=sinAcento(d.texto||'');const quitar=[];
    d.vocabulario=d.vocabulario.filter(v=>{const w=sinAcento(v.palabra||'').trim().replace(/^(el|la|los|las|un|una|the|a|an) /,'');
      const raiz=w.replace(/(es|s)$/,'');const ok=w&&(txt.includes(w)||(raiz.length>3&&txt.includes(raiz)));if(!ok)quitar.push(v.palabra);return ok});
    if(quitar.length)notas.push(I(`Quité del vocabulario palabras que no salen en la lectura: ${quitar.join(', ')}.`,`Removed vocabulary words that are not in the reading: ${quitar.join(', ')}.`))}
  return notas}
function mostrar(tab,d,r,notas){
  const rev=notas&&notas.length?`<p class="nota">🔎 ${I('Revisión automática','Automatic check')}: ${notas.map(esc).join(' ')}</p>`:'';
  const pie=rev+`<div class="fila no-print"><button class="sec" data-copiar>📋 ${I('Copiar','Copy')}</button><button class="sec" data-imprimir>🖨️ ${I('Imprimir','Print')}</button></div><p class="revisar">⚠️ ${I('Revisa el contenido antes de usarlo con estudiantes.','Review the content before using it with students.')}</p>`;
  if(tab==='lectura')return `<div class="card salida">${badge(r)}<h2>${esc(d.titulo)}</h2><p class="texto">${esc(d.texto)}</p>
    ${d.vocabulario&&d.vocabulario.length?`<h3>${I('Vocabulario','Vocabulary')}</h3><ul>${d.vocabulario.map(v=>`<li><b>${esc(v.palabra)}</b>: ${esc(v.significado)}</li>`).join('')}</ul>`:''}
    <h3>${I('Preguntas','Questions')}</h3><ol>${(d.preguntas||[]).map(q=>`<li>${esc(q.pregunta)}<br>${opciones(q)}</li>`).join('')}</ol>${d.nota?`<p class="nota">👩‍🏫 ${esc(d.nota)}</p>`:''}${pie}</div>`;
  if(tab==='explicar')return `<div class="card salida">${badge(r)}<h2>💡 ${I('Otra forma de explicarlo','Another way to explain it')}</h2><p class="texto">${esc(d.explicacion)}</p>
    ${d.comparacion?`<p>🔁 ${esc(d.comparacion)}</p>`:''}<h3>${I('Ejemplos','Examples')}</h3><ul>${(d.ejemplos||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${d.error_comun?`<p>⚠️ <b>${I('Error común','Common mistake')}:</b> ${esc(d.error_comun)}</p>`:''}${d.comprobar&&d.comprobar.length?`<h3>${I('Para comprobar','Quick check')}</h3><ol>${d.comprobar.map(q=>`<li>${esc(q.pregunta)} <small>→ ${esc(q.respuesta)}</small></li>`).join('')}</ol>`:''}${pie}</div>`;
  if(tab==='retro')return `<div class="card salida">${badge(r)}<h2>✍️ ${I('Retroalimentación','Feedback')}${d.nivel?` · ${I('nivel','level')} ${esc(d.nivel)}/4`:''}</h2>
    <h3>💪 ${I('Fortalezas','Strengths')}</h3><ul>${(d.fortalezas||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h3>➡️ ${I('Siguientes pasos','Next steps')}</h3><ul>${(d.siguientes_pasos||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h3>✅ ${I('Versión corregida','Corrected version')}</h3><p class="texto">${esc(d.version_corregida)}</p>${d.mensaje_al_estudiante?`<p class="nota">💬 ${esc(d.mensaje_al_estudiante)}</p>`:''}${pie}</div>`;
  return `<div class="card salida">${badge(r)}<h2>❓ ${I('Preguntas de práctica','Practice questions')}</h2><ol>${(d.preguntas||[]).map(q=>`<li>${esc(q.pregunta)}<br>${opciones(q)}${q.explicacion?`<br><small>💡 ${esc(q.explicacion)}</small>`:''}</li>`).join('')}</ol>${pie}</div>`;
}
function enlazarResultado(){
  const c=document.querySelector('[data-copiar]');if(c)c.onclick=()=>{const t=$('.salida').innerText.replace(/📋.*$/s,'');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{c.textContent='✔ '+I('Copiado','Copied')}).catch(()=>{c.textContent=I('Selecciona y copia','Select and copy')})};
  const p=document.querySelector('[data-imprimir]');if(p)p.onclick=()=>window.print();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ui){S.ui=b.dataset.ui;save();render()}
  if(b.dataset.tab){S.tab=b.dataset.tab;render()}
});
initAI();render();checkDevice().then(pintarEstado);

</script>
